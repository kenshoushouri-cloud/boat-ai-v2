name: Opponent replay gap diagnostic candidate-v4

on:
  pull_request:
    paths:
      - '.github/workflows/research-opponent-gap-candidate-v4-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-hobby-fullhistory-candidate-v4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install psycopg[binary]
      - run: npm install --global @railway/cli
      - name: Read-only September Opponent coverage
        run: |
          set -euo pipefail
          railway run --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_DB_SERVICE}" bash -lc '
            test -n "${DATABASE_PUBLIC_URL:-}";
            export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=60000 -c max_parallel_workers_per_gather=0";
            export DATABASE_URL="$DATABASE_PUBLIC_URL";
            python - <<"PY"
import json, os
import psycopg
from psycopg.rows import dict_row

with psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row, autocommit=False) as conn:
    with conn.cursor() as cur:
        cur.execute("set transaction read only")
        cur.execute("""
          with races as (
            select race_id,race_date
            from v2_races
            where race_date between date '2026-09-01' and date '2026-09-30'
          ), opp as (
            select race_id,model_version
            from v2_opponent_pressure_shadow_v2
            where race_date between date '2026-09-01' and date '2026-09-30'
          )
          select r.race_date,
                 count(*) races,
                 count(o.race_id) any_opponent,
                 count(*) filter(where o.model_version=102) historical_102,
                 count(*) filter(where o.model_version=2) production_v2,
                 count(*) filter(where o.race_id is null) no_opponent
          from races r left join opp o using(race_id)
          group by r.race_date
          order by r.race_date
        """)
        rows=[dict(x) for x in cur.fetchall()]
        cur.execute("""
          select model_version,count(*) rows
          from v2_opponent_pressure_shadow_v2
          where race_date between date '2026-09-01' and date '2026-09-30'
          group by model_version order by model_version
        """)
        versions=[dict(x) for x in cur.fetchall()]
    conn.rollback()

totals={
  'races':sum(int(x['races']) for x in rows),
  'any_opponent':sum(int(x['any_opponent']) for x in rows),
  'historical_102':sum(int(x['historical_102']) for x in rows),
  'production_v2':sum(int(x['production_v2']) for x in rows),
  'no_opponent':sum(int(x['no_opponent']) for x in rows),
}
print('OPP_GAP_VERSIONS='+json.dumps(versions,sort_keys=True))
print('OPP_GAP_TOTALS='+json.dumps(totals,sort_keys=True))
print('OPP_GAP_DAYS='+json.dumps(rows,default=str,sort_keys=True))
print('OPP_GAP_RESULT=PASS_READ_ONLY')
PY
          ' 2>&1 | tee opponent-gap.txt
          grep -q '^OPP_GAP_RESULT=PASS_READ_ONLY$' opponent-gap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: opponent-gap-candidate-v4-${{ github.run_id }}
          path: opponent-gap.txt
          retention-days: 14
