name: Opponent provenance gap candidate-v4 read-only

on:
  pull_request:
    paths:
      - 'research/opponent_readiness_provenance_pg.py'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-hobby-fullhistory-candidate-v4'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Verify read-only diagnostic
        run: |
          set -euo pipefail
          grep -q 'set transaction read only' research/opponent_readiness_provenance_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('research/opponent_readiness_provenance_pg.py').read_text(encoding='utf-8').lower()
          for token in ('insert into','update v2_','delete from','v2_results','v2_result_entries','v2_odds'):
              assert token not in p, token
          PY
      - name: Measure September true Opponent gap
        run: |
          set -euo pipefail
          railway run --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_DB_SERVICE}" bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=60000 -c max_parallel_workers_per_gather=0"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/opponent_readiness_provenance_pg.py --start-date 2026-09-01 --end-date 2026-09-30 --output opponent-gap.json' 2>&1 | tee opponent-gap.txt
          grep -q '^OPP_PROVENANCE_RESULT=PASS_READ_ONLY$' opponent-gap.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: opponent-provenance-gap-${{ github.run_id }}
          path: |
            opponent-gap.txt
            opponent-gap.json
          retention-days: 14
          if-no-files-found: warn
