name: V21 official odds fix tests

on:
  pull_request:
    paths:
      - 'official_odds3t_parser.py'
      - 'v21_realtime_collector_pg_safe.py'
      - 'v25_final_realtime_pipeline_pg.py'
      - 'run_learning_all_realtime_pg.py'
      - 'tests/test_v21_official_odds_fix.py'
      - '.github/workflows/v21-official-odds-fix-tests.yml'

permissions:
  contents: read

jobs:
  offline-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DATABASE_URL: ''
      RAILWAY_TOKEN: ''
      LINE_CHANNEL_ACCESS_TOKEN: ''
      LINE_TO: ''
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile changed production paths
        run: >-
          python -m py_compile
          official_odds3t_parser.py
          v21_realtime_collector_pg_safe.py
          v25_final_realtime_pipeline_pg.py
          run_learning_all_realtime_pg.py
          tests/test_v21_official_odds_fix.py
      - name: Run focused offline regressions
        run: python -m unittest tests.test_v21_official_odds_fix -v
