name: Candidate Discovery Market Early2030 ROI

on:
  pull_request:
    paths:
      - '.github/scripts/candidate_discovery_market_early2030_roi_pg.py'
      - '.github/workflows/candidate-discovery-market-early2030-roi.yml'
      - '.github/scripts/candidate_discovery_market_corroboration_roi_pg.py'
      - '.github/scripts/candidate_discovery_v1_pg.py'
      - '.github/scripts/candidate_discovery_v2_formation_pg.py'
      - '.github/scripts/candidate_discovery_k_multibet_probe.py'
      - 'research/candidate_discovery_bettype_contract.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=180000
  CANDIDATE_MARKET_START: '2026-08-14'
  CANDIDATE_MARKET_END: '2026-09-12'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate read-only inherited-window contract
        run: |
          python -m py_compile .github/scripts/candidate_discovery_market_early2030_roi_pg.py
          python -m py_compile .github/scripts/candidate_discovery_market_corroboration_roi_pg.py
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/scripts/candidate_discovery_market_early2030_roi_pg.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in text
          assert 'v2_results' not in text
          assert 'early_min_lo = 20.0' in text and 'early_min_hi = 30.0' in text
          assert 'pre-existing bao early window' in text
          assert 'negative control' in text
          assert 'promotion_allowed' in text
          for token in (
              'delete from ', 'insert into ', 'update v2_', 'alter table ',
              'drop table ', 'truncate ', 'vacuum ', 'create table '
          ):
              assert token not in text, token
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run established early-window ROI negative control
        run: |
          python -u .github/scripts/candidate_discovery_market_early2030_roi_pg.py | tee candidate-discovery-market-early2030-roi.txt
          grep -q '^CANDIDATE_MARKET_EARLY2030_WINDOW=20.0_30.0_minutes_predeadline_existing_bao_contract$' candidate-discovery-market-early2030-roi.txt
          grep -q '^CANDIDATE_MARKET_EARLY2030_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0$' candidate-discovery-market-early2030-roi.txt
          grep -q '^CANDIDATE_MARKET_EARLY2030_PROMOTION=BLOCK_NEGATIVE_CONTROL_ONLY$' candidate-discovery-market-early2030-roi.txt
          grep -q '^CANDIDATE_MARKET_EARLY2030_RESULT=PASS_READ_ONLY$' candidate-discovery-market-early2030-roi.txt

      - name: Upload early-window ROI control artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-market-early2030-roi-${{ github.run_id }}
          path: |
            candidate-discovery-market-early2030-roi.json
            candidate-discovery-market-early2030-roi.txt
          retention-days: 30
          if-no-files-found: error
