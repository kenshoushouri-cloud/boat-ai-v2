name: Research fresh restore schema preflight production read-only

on:
  pull_request:
    paths:
      - 'research_fresh_restore_schema_preflight_pg.py'
      - '.github/workflows/research-fresh-restore-schema-preflight-production-readonly.yml'
      - 'docs/V4_ARCHIVE_DURABILITY_AND_FRESH_RESTORE_REHEARSAL_20260916.md'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readonly-preflight:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000 -c timezone=UTC
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install read-only audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -q 'psycopg[binary]'
          npm install -g @railway/cli >/dev/null 2>&1
      - name: Resolve Production public database URL without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          railway variable list \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=None
          if isinstance(data,dict):
              value=data.get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'),dict):
                  value=data['variables'].get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'),list):
                  for item in data['variables']:
                      if isinstance(item,dict) and item.get('name')=='DATABASE_PUBLIC_URL':
                          value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL unavailable')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
          rm -f railway-vars.json
      - name: Run catalog-only fresh restore preflight
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile research_fresh_restore_schema_preflight_pg.py
          python -u research_fresh_restore_schema_preflight_pg.py > fresh-restore-preflight.txt
          grep -E '^(FRESH_RESTORE_SCHEMA_PREFLIGHT=|DATABASE |TABLE |NO_RETENTION_HINT_TABLES |PREFLIGHT_NOTE=|FRESH_RESTORE_SCHEMA_PREFLIGHT_RESULT=)' fresh-restore-preflight.txt > fresh-restore-preflight-sanitized.txt
          grep -q '^FRESH_RESTORE_SCHEMA_PREFLIGHT=READ_ONLY$' fresh-restore-preflight-sanitized.txt
          grep -q '^FRESH_RESTORE_SCHEMA_PREFLIGHT_RESULT=PASS_READ_ONLY$' fresh-restore-preflight-sanitized.txt
          cat fresh-restore-preflight-sanitized.txt
          {
            echo '## Fresh restore schema/footprint preflight — Production read-only'
            echo
            echo '```text'
            cat fresh-restore-preflight-sanitized.txt
            echo '```'
            echo
            echo 'Catalog/schema metadata only. No row copy, write, retention decision, archive upload, or Railway config change.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json fresh-restore-preflight.txt fresh-restore-preflight-sanitized.txt
