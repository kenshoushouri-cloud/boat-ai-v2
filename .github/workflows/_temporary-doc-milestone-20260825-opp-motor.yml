name: Temporary docs milestone updater 2026-08-25 opp motor

on:
  pull_request:
    paths:
      - '.github/scripts/_temporary_append_milestone_20260825_opp_motor.py'
      - '.github/workflows/_temporary-doc-milestone-20260825-opp-motor.yml'

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append permanent milestone
        run: python .github/scripts/_temporary_append_milestone_20260825_opp_motor.py
      - name: Commit updated docs
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_HANDOFF.md docs/PROJECT_HISTORY.md
          if git diff --cached --quiet; then
            echo 'DOC_MILESTONE_COMMIT=no_changes'
          else
            git commit -m 'Docs: record Opponent Pressure and motor V12 milestone'
            git push origin HEAD:${{ github.head_ref }}
            echo 'DOC_MILESTONE_COMMIT=pushed'
          fi
