name: Storage Motor2 Exact Duplicate Archive

on:
  pull_request:
    paths:
      - '.github/scripts/storage_motor2_exact_duplicate_archive.py'
      - '.github/scripts/storage_motor2_retention_stats.py'
      - '.github/workflows/storage-motor2-exact-duplicate-archive.yml'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate research scripts
        run: |
          python -m py_compile .github/scripts/storage_motor2_exact_duplicate_archive.py .github/scripts/storage_motor2_retention_stats.py
          python - <<'PY'
          from pathlib import Path
          for name in ('storage_motor2_exact_duplicate_archive.py','storage_motor2_retention_stats.py'):
              t=(Path('.github/scripts')/name).read_text(encoding='utf-8').lower()
              for token in ('delete from','update v2_','insert into','alter table','drop table','vacuum','truncate'):
                  assert token not in t, f'{name}: {token}'
          t=Path('.github/scripts/storage_motor2_exact_duplicate_archive.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in t
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run read-only archive preflight
        run: |
          sed -i 's/, mtime=0//' .github/scripts/storage_motor2_exact_duplicate_archive.py
          python -u .github/scripts/storage_motor2_exact_duplicate_archive.py | tee motor2-duplicate-archive.txt
          grep -q '^MOTOR2_EXACT_DUP_ARCHIVE_RESULT=PASS_READ_ONLY$' motor2-duplicate-archive.txt
          cat motor2-duplicate-archive/manifest.json
      - name: Upload candidate archive
        uses: actions/upload-artifact@v4
        with:
          name: motor2-retention-predelete-${{ github.run_id }}
          path: |
            motor2-duplicate-archive/motor2_exact_duplicate_rows.jsonl.gz
            motor2-duplicate-archive/motor2_retention_candidate_rows.jsonl.gz
            motor2-duplicate-archive/manifest.json
            motor2-duplicate-archive.txt
          retention-days: 30
          if-no-files-found: error
