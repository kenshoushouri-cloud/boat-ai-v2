name: Research V4 Formal Day Strength Shadow
on:
  pull_request:
    paths:
      - 'research/v4_formal_day_strength_shadow.py'
      - 'tests/test_v4_formal_day_strength_shadow.py'
      - 'research/v4_formal_day_strength_seed.py'
      - 'tests/test_v4_formal_day_strength_seed.py'
      - 'docs/V4_FORMAL_DAY_STRENGTH_SEED_20260928.md'
      - 'docs/V4_FORMAL_DAY_STRENGTH_SHADOW_20260927.md'
      - '.github/workflows/research-v4-formal-day-strength-shadow.yml'
permissions:
  contents: read
  actions: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify isolation
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('research/v4_formal_day_strength_shadow.py').read_text(encoding='utf-8').lower()
          for token in ('psycopg','database_url','requests','urllib','subprocess','insert into','update v2_','delete from','send_line'):
              assert token not in t, token
          assert 'outcome_read' in t
          assert 'payout_read' in t
          PY
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_v4_formal_day_strength_shadow.py tests/test_v4_formal_day_strength_seed.py
      - name: Freeze 2026-09-28 input-only prior-seven seed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p seed-artifacts
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10617384166/zip > seed-artifacts/2026-09-21.zip
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10670080150/zip > seed-artifacts/2026-09-22.zip
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10724298102/zip > seed-artifacts/2026-09-23.zip
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10782581362/zip > seed-artifacts/2026-09-24.zip
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10838744179/zip > seed-artifacts/2026-09-25.zip
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10891628808/zip > seed-artifacts/2026-09-26.zip
          gh api repos/"$GITHUB_REPOSITORY"/actions/artifacts/10918742073/zip > seed-artifacts/2026-09-27.zip
          cat > seed-artifacts/SHA256SUMS <<'EOF'
          b40c34f99c42685ebbee330c90eeab0f45a829cfc18513d2517d9fc9da9da666  seed-artifacts/2026-09-21.zip
          60ae93e3758679fc0109fd180bbd66a54978c0b483514a724bb5ace376c5a94c  seed-artifacts/2026-09-22.zip
          9b7bb37e8d91753923774acb728499b499a3b12f2919c91ff321a7369d1c7a32  seed-artifacts/2026-09-23.zip
          4527b05e320dfcf546d2d9604edbbc5721cc50b4de2da723935eec5e7b5a0997  seed-artifacts/2026-09-24.zip
          6abac7b17061dd8e6449c98ec7cba21f2b2ae708804890076c7304e7f52bcca1  seed-artifacts/2026-09-25.zip
          59812eb598a48965621f4b9b4842c65312c4c7914200754627dc71f2d8f120af  seed-artifacts/2026-09-26.zip
          d251c0d918964e3dc8c467b8f43038cae0571892a2b0539ad8ccf27a39d98da0  seed-artifacts/2026-09-27.zip
          EOF
          sha256sum -c seed-artifacts/SHA256SUMS
          PYTHONPATH=. python -u research/v4_formal_day_strength_seed.py seed-artifacts | tee v4-day-strength-seed-20260928.txt
          grep -q '^V4_DAY_STRENGTH_SEED_PASS_INPUT_ONLY
 v4-day-strength-seed-20260928.txt
