name: Railway 5GB candidate ENOSPC diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v3"
  SOURCE_SERVICE: "postgres-recovery"

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-candidate-enospc-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli

      - name: Run read-only PostgreSQL size diagnostics
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          cat > diagnostic.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          \pset fieldsep '|'
          SET default_transaction_read_only = on;

          SELECT 'QUERYABLE|' || current_database();

          SELECT
            'RELFILENODE|' ||
            COALESCE(n.nspname,'') || '|' ||
            COALESCE(c.relname,'') || '|' ||
            COALESCE(c.relkind::text,'')
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE c.relfilenode IN (71015, 125670)
          ORDER BY c.relfilenode;

          SELECT 'DB_BYTES|' || pg_database_size(current_database());

          SELECT 'WAL_BYTES|' || COALESCE(sum(size),0) FROM pg_ls_waldir();


          SELECT 'SETTING|min_wal_size|' || current_setting('min_wal_size');
          SELECT 'SETTING|max_wal_size|' || current_setting('max_wal_size');
          SELECT 'SETTING|wal_keep_size|' || current_setting('wal_keep_size');
          SELECT 'SETTING|max_slot_wal_keep_size|' || current_setting('max_slot_wal_keep_size');
          SELECT 'SETTING|archive_mode|' || current_setting('archive_mode');
          SELECT 'SETTING|wal_level|' || current_setting('wal_level');
          SELECT 'REPLICATION_SLOTS|' || count(*) FROM pg_replication_slots;
          SELECT 'ACTIVE_REPLICATION_SLOTS|' || count(*) FILTER (WHERE active) FROM pg_replication_slots;
          SELECT 'MAX_SLOT_RETAINED_BYTES|' ||
                 COALESCE(max(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)),0)::bigint
          FROM pg_replication_slots
          WHERE restart_lsn IS NOT NULL;

          SELECT 'PUBLIC_TOTAL_BYTES|' || COALESCE(sum(pg_total_relation_size(c.oid)),0)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','m');

          SELECT 'PUBLIC_HEAP_BYTES|' || COALESCE(sum(pg_relation_size(c.oid)),0)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','m');

          SELECT 'PUBLIC_INDEX_BYTES|' || COALESCE(sum(pg_indexes_size(c.oid)),0)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','m');

          SELECT
            'TOP|' ||
            n.nspname || '|' ||
            c.relname || '|' ||
            c.relkind::text || '|' ||
            pg_total_relation_size(c.oid) || '|' ||
            pg_relation_size(c.oid) || '|' ||
            COALESCE(pg_indexes_size(c.oid),0)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public'
            AND c.relkind IN ('r','m')
          ORDER BY pg_total_relation_size(c.oid) DESC
          LIMIT 10;
          SQL

          railway connect "$TARGET_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < diagnostic.sql > diagnostic.out

          grep -E '^(QUERYABLE|RELFILENODE|DB_BYTES|WAL_BYTES|SETTING|REPLICATION_SLOTS|ACTIVE_REPLICATION_SLOTS|MAX_SLOT_RETAINED_BYTES|PUBLIC_TOTAL_BYTES|PUBLIC_HEAP_BYTES|PUBLIC_INDEX_BYTES|TOP)\|' diagnostic.out > diagnostic.sanitized
          test -s diagnostic.sanitized

          cat > source-size.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          \pset fieldsep '|'
          SET default_transaction_read_only = on;
          SELECT 'SOURCE_DB_BYTES|' || pg_database_size(current_database());
          SELECT 'SOURCE_WAL_BYTES|' || COALESCE(sum(size),0) FROM pg_ls_waldir();

          SELECT 'SOURCE_SETTING|min_wal_size|' || current_setting('min_wal_size');
          SELECT 'SOURCE_SETTING|max_wal_size|' || current_setting('max_wal_size');
          SELECT 'SOURCE_SETTING|wal_keep_size|' || current_setting('wal_keep_size');
          SELECT 'SOURCE_SETTING|max_slot_wal_keep_size|' || current_setting('max_slot_wal_keep_size');
          SELECT 'SOURCE_SETTING|archive_mode|' || current_setting('archive_mode');
          SELECT 'SOURCE_SETTING|wal_level|' || current_setting('wal_level');
          SELECT 'SOURCE_REPLICATION_SLOTS|' || count(*) FROM pg_replication_slots;
          SELECT 'SOURCE_ACTIVE_REPLICATION_SLOTS|' || count(*) FILTER (WHERE active) FROM pg_replication_slots;
          SELECT 'SOURCE_MAX_SLOT_RETAINED_BYTES|' ||
                 COALESCE(max(pg_wal_lsn_diff(pg_current_wal_lsn(), restart_lsn)),0)::bigint
          FROM pg_replication_slots
          WHERE restart_lsn IS NOT NULL;
          SELECT 'SOURCE_PUBLIC_TOTAL_BYTES|' || COALESCE(sum(pg_total_relation_size(c.oid)),0)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','m');
          SELECT 'SOURCE_PUBLIC_HEAP_BYTES|' || COALESCE(sum(pg_relation_size(c.oid)),0)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','m');
          SELECT 'SOURCE_PUBLIC_INDEX_BYTES|' || COALESCE(sum(pg_indexes_size(c.oid)),0)
          FROM pg_class c JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname = 'public' AND c.relkind IN ('r','m');
          SQL

          railway connect "$SOURCE_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < source-size.sql > source-size.out
          grep -E '^(SOURCE_(DB_BYTES|WAL_BYTES|PUBLIC_TOTAL_BYTES|PUBLIC_HEAP_BYTES|PUBLIC_INDEX_BYTES|REPLICATION_SLOTS|ACTIVE_REPLICATION_SLOTS|MAX_SLOT_RETAINED_BYTES)|SOURCE_SETTING)\|' source-size.out > source-size.sanitized
          test -s source-size.sanitized

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## 5GB candidate ENOSPC diagnostic'
            echo
            if [ -s diagnostic.sanitized ]; then
              echo 'Read-only query completed.'
              echo
              echo '```text'
              cat diagnostic.sanitized
              echo
              cat source-size.sanitized
              echo '```'
            else
              echo 'Diagnostic did not produce a sanitized result.'
            fi
            echo
            echo 'No restore, delete, resize, VACUUM, REINDEX, cutover, plan change, or Variable change was requested.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md