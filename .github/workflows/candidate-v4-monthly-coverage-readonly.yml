name: Candidate v4 monthly coverage audit

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Run candidate-v4 monthly coverage read-only
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=120000"; python - <<"PY"
import os
import psycopg
from psycopg.rows import dict_row

conn=psycopg.connect(os.environ["DATABASE_URL"], row_factory=dict_row, autocommit=True)
with conn.cursor() as cur:
    cur.execute("set transaction read only")
    cur.execute("""
      with m as (
        select to_char(r.race_date, 'YYYY-MM') month,
               count(distinct r.race_id)::int races,
               count(distinct e.race_id) filter (where e.n=6)::int entries6,
               count(distinct rs.race_id)::int results,
               count(distinct re.race_id) filter (where re.n=6)::int result_entries6,
               count(distinct o.race_id) filter (where o.n=120)::int odds120
        from v2_races r
        left join (select race_id,count(distinct lane) n from v2_race_entries group by race_id) e on e.race_id=r.race_id
        left join v2_results rs on rs.race_id=r.race_id
        left join (select race_id,count(distinct lane) n from v2_result_entries group by race_id) re on re.race_id=r.race_id
        left join (select race_id,count(distinct ticket) filter (where odds is not null and odds>0) n from v2_odds_trifecta group by race_id) o on o.race_id=r.race_id
        where r.race_date >= date '2025-07-01'
        group by 1
      )
      select * from m order by month
    """)
    print("MONTH|RACES|ENTRIES6|RESULTS|RESULT_ENTRIES6|ODDS120")
    for x in cur.fetchall():
        print(f"{x['month']}|{x['races']}|{x['entries6']}|{x['results']}|{x['result_entries6']}|{x['odds120']}")
print("CANDIDATE_V4_MONTHLY_COVERAGE=PASS_READ_ONLY")
conn.close()
PY' | tee candidate-v4-monthly-coverage.txt
          grep -q '^CANDIDATE_V4_MONTHLY_COVERAGE=PASS_READ_ONLY$' candidate-v4-monthly-coverage.txt
