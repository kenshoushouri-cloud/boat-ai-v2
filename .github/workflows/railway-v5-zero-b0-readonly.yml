name: Railway V5 zero-base B0 readonly

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  b0:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway v5-zero-b0-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Run B0 against candidate-v4 read only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=120000"; export START_DATE=2025-07-01; export END_DATE=2026-10-05; python -u research/v5_zero_base_b0_pg.py' \
            | tee b0.out

          grep '^V5_B0_RESULT=' b0.out > b0.sanitized
          test -s b0.sanitized

      - name: Post result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## V5 zero-base B0 — read only'
            echo
            if [ -s b0.sanitized ]; then
              echo '```text'
              cat b0.sanitized
              echo '```'
            else
              echo 'FAILED: no V5_B0_RESULT produced.'
            fi
            echo
            echo 'candidate-v4 read-only evaluation only. No DB writes, Production model, LINE, purchase, stake, plan, or volume changes.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
