name: Railway candidate-v4 result entries catch-up 2026-10-06

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  RAILWAY_BRIDGE_ISSUE: "581"

jobs:
  catchup:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway candidate-v4-result-entries-catchup-20261006 CONFIRM'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Run fixed-date result entry catch-up
        id: catchup
        shell: bash
        run: |
          set +e
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -c '
              set -e
              test -n "${DATABASE_PUBLIC_URL:-}"
              export DATABASE_URL="$DATABASE_PUBLIC_URL"
              export TARGET_DATE="2026-10-06"
              export CONFIRM_K_DB_WRITE="YES"
              exec python -u save_k_day_results_pg.py
            ' > result-entries-output.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized summary
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.catchup.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw = Path("result-entries-output.txt").read_text(encoding="utf-8", errors="replace") if Path("result-entries-output.txt").exists() else ""
          prefixes = (
              "✅ save_k_day_results_pg.py",
              "TARGET_DATE=",
              "K_GET ",
              "=== PREWRITE AUDIT ===",
              "venue_sections=",
              "incomplete6=",
              "existing_v2_results=",
              "v2_results supplement fields=",
              "POSTWRITE ",
              "=== WRITE SUMMARY ===",
              "v2_result_entries_upsert=",
              "v2_results_updated=",
              "RESULT=",
          )
          keep = [line[:700] for line in raw.splitlines() if line.startswith(prefixes)]
          code = os.environ.get("EXIT_CODE", "?")
          out = [
              "## candidate-v4 result entries catch-up 2026-10-06",
              "",
              "- database: postgres-hobby-fullhistory-candidate-v4",
              "- fixed date: 2026-10-06 only",
              "- source: official K file",
              "- transaction audit enabled",
              "- v2_results existing values preserved via coalesce",
              "- no Production model / LINE / BUY / stake / plan / volume change",
              "",
              "```text",
              *(keep[-120:] if keep else ["(no allowlisted summary lines returned)"]),
              "```",
              "",
              f"Process exit code: {code}",
              "",
              "**CANDIDATE_V4_RESULT_ENTRIES_CATCHUP_PASS**" if code == "0" else "**CANDIDATE_V4_RESULT_ENTRIES_CATCHUP_FAILED**",
          ]
          Path("result-entries-summary.md").write_text("\n".join(out) + "\n", encoding="utf-8")
          PY

      - name: Clean raw output
        if: always()
        run: rm -f result-entries-output.txt

      - name: Post sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${RAILWAY_BRIDGE_ISSUE}" --repo "$GITHUB_REPOSITORY" --body-file result-entries-summary.md

      - name: Fail when catch-up failed
        if: steps.catchup.outputs.exit_code != '0'
        run: exit 1
