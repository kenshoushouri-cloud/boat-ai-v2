name: Research S03 M2 Forward Checkpoint Manual

on:
  workflow_dispatch:
    inputs:
      end_date:
        description: 'JST end date YYYY-MM-DD; blank = current JST date'
        required: false
        type: string

permissions:
  contents: read

jobs:
  checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      S03_FORWARD_START: '2026-09-13'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Resolve checkpoint end date
        id: end
        shell: bash
        run: |
          set -euo pipefail
          requested='${{ inputs.end_date }}'
          if [ -n "$requested" ]; then
            END_DATE="$requested"
          else
            END_DATE="$(TZ=Asia/Tokyo date +%F)"
          fi
          python - <<'PY' "$END_DATE"
          import sys
          from datetime import date
          date.fromisoformat(sys.argv[1])
          PY
          echo "end_date=$END_DATE" >> "$GITHUB_OUTPUT"
          echo "S03_FORWARD_END=$END_DATE" >> "$GITHUB_ENV"
      - name: Verify read-only contract
        run: |
          set -euo pipefail
          grep -q 'set transaction read only' research/s03_m2_common_economics_pg.py
          grep -q 'S03_M2_COMMON_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0' research/s03_m2_common_economics_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-s03-m2-forward-checkpoint-manual.yml').read_text(encoding='utf-8').lower()
          assert 'workflow_dispatch:' in w
          assert ''.join(('railway',' variable',' list')) not in w
          assert 'railway run' in w
          PY
      - run: npm install --global @railway/cli
      - name: Run frozen S03 M2 checkpoint
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/s03_m2_common_economics_pg.py' \
            2>&1 | tee s03-m2-forward-checkpoint.txt
          grep -q '^S03_M2_COMMON_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0$' s03-m2-forward-checkpoint.txt
          grep -Eq '^S03_M2_COMMON_RESULT=PASS_(EXACT_FROZEN_SUBSET|READ_ONLY_CHECKPOINT)$' s03-m2-forward-checkpoint.txt
      - name: Write checkpoint summary
        if: always()
        run: |
          {
            echo '## S03_M2 Forward checkpoint'
            echo
            echo "- end_date: ${{ steps.end.outputs.end_date }}"
            echo '- exact frozen Motor2-positive rule'
            echo '- strict stored pre-deadline timing'
            echo '- invalid_result remains void / zero investment'
            echo '- no retune / DB write / LINE / BUY / Production change'
            echo
            grep -E '^S03_M2_COMMON_(INPUT|COVERAGE|OVERALL|RISK|HALVES|BOOTSTRAP|PERIOD|REMAINING_TO_100|RESULT)=' s03-m2-forward-checkpoint.txt || true
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s03-m2-forward-manual-${{ github.run_id }}
          path: s03-m2-forward-checkpoint.txt
          retention-days: 90
          if-no-files-found: warn
