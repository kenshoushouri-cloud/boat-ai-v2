name: Recent Form archive write verified

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  SOURCE_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  ARCHIVE_SERVICE: "postgres-history-archive"
  RAILWAY_BRIDGE_ISSUE: "42"

concurrency:
  group: recent-form-archive-write-verified
  cancel-in-progress: false

jobs:
  archive:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway recent-form-archive-write CONFIRM'
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install minimal dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "psycopg[binary]>=3.2,<4"
          npm install --global @railway/cli

      - name: Write guarded private-network archive transfer
        shell: bash
        run: |
          cat > /tmp/recent_form_private_archive.py <<'PY'
          import json
          import os
          import shlex
          import psycopg
          from psycopg import sql

          source = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          archive = os.environ.get("ARCHIVE_DATABASE_URL")
          if not source:
              raise RuntimeError("source database URL unavailable")
          if not archive:
              raise RuntimeError("archive database URL unavailable")

          out = {
              "source_write": 0,
              "source_cleanup": 0,
              "cutover": 0,
              "railway_resource_created": 0,
              "railway_ai_agent_used": 0,
          }

          with psycopg.connect(source, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY")
                  cur.execute("SET LOCAL statement_timeout='900s'")
                  cur.execute("SET LOCAL work_mem='8MB'")
                  cur.execute("SET LOCAL max_parallel_workers_per_gather=0")
                  cur.execute("SET LOCAL temp_file_limit='96MB'")

                  cur.execute("""
                    select column_name, udt_name
                    from information_schema.columns
                    where table_schema='public'
                      and table_name='v2_race_entries'
                      and column_name in ('race_id','lane','recent_form')
                    order by column_name
                  """)
                  types = {str(a): str(b) for a,b in cur.fetchall()}
                  expected_types = {"race_id":"text","lane":"int4","recent_form":"jsonb"}
                  if types != expected_types:
                      raise RuntimeError("unexpected_source_types")

                  cur.execute("""
                    select
                      count(*)::bigint,
                      count(*) filter (where race_id is null or lane is null)::bigint,
                      coalesce(sum(pg_column_size(recent_form)),0)::bigint,
                      coalesce(sum(
                        coalesce(pg_column_size(race_id),0)
                        + coalesce(pg_column_size(lane),0)
                        + coalesce(pg_column_size(recent_form),0)
                      ),0)::bigint
                    from public.v2_race_entries
                    where recent_form is not null
                  """)
                  rows, null_keys, payload_bytes, logical_bytes = cur.fetchone()

                  cur.execute("""
                    select coalesce(sum(n-1),0)::bigint
                    from (
                      select count(*)::bigint n
                      from public.v2_race_entries
                      where recent_form is not null
                      group by race_id,lane
                      having count(*) > 1
                    ) d
                  """)
                  dup_rows = int(cur.fetchone()[0] or 0)

                  cur.execute("""
                    with x as (
                      select race_id,lane,
                             md5(jsonb_build_array(race_id,lane,recent_form)::text) row_md5
                      from public.v2_race_entries
                      where recent_form is not null
                    )
                    select count(*)::bigint,
                           md5(string_agg(row_md5,'' order by race_id,lane))
                    from x
                  """)
                  checksum_rows, payload_md5 = cur.fetchone()

                  rows = int(rows)
                  null_keys = int(null_keys)
                  checksum_rows = int(checksum_rows)
                  if rows <= 0 or null_keys != 0 or dup_rows != 0:
                      raise RuntimeError("source_identity_gate_failed")
                  if rows != checksum_rows:
                      raise RuntimeError("source_checksum_row_count_mismatch")

                  create_sql = """
                    BEGIN;
                    CREATE TABLE IF NOT EXISTS public.v2_recent_form_archive (
                      race_id text not null,
                      lane integer not null,
                      recent_form jsonb not null,
                      archived_at timestamptz not null default now(),
                      primary key (race_id,lane)
                    );
                    TRUNCATE public.v2_recent_form_archive;
                  """

                  parity_sql = f"""
                    WITH x AS (
                      SELECT race_id,lane,
                             md5(jsonb_build_array(race_id,lane,recent_form)::text) row_md5
                      FROM public.v2_recent_form_archive
                    ),
                    s AS (
                      SELECT count(*)::bigint AS rows,
                             count(*) FILTER (WHERE race_id IS NULL OR lane IS NULL)::bigint AS null_keys,
                             md5(string_agg(row_md5,'' ORDER BY race_id,lane)) AS payload_md5
                      FROM x
                    ),
                    d AS (
                      SELECT coalesce(sum(n-1),0)::bigint AS dup_rows
                      FROM (
                        SELECT count(*)::bigint AS n
                        FROM public.v2_recent_form_archive
                        GROUP BY race_id,lane
                        HAVING count(*) > 1
                      ) q
                    )
                    SELECT 1 / CASE WHEN
                      s.rows = {rows}
                      AND s.null_keys = 0
                      AND d.dup_rows = 0
                      AND s.payload_md5 = {sql.Literal(str(payload_md5)).as_string(conn)}
                    THEN 1 ELSE 0 END
                    FROM s CROSS JOIN d;
                  """

                  commands = [
                      "-c " + shlex.quote(create_sql),
                      "-c " + shlex.quote(
                          r"\copy public.v2_recent_form_archive "
                          r"(race_id,lane,recent_form) FROM STDIN WITH (FORMAT BINARY)"
                      ),
                      "-c " + shlex.quote(parity_sql),
                      "-c " + shlex.quote("COMMIT;"),
                  ]
                  program = (
                      "psql " + shlex.quote(archive)
                      + " -X -q -v ON_ERROR_STOP=1 "
                      + " ".join(commands)
                      + " >/dev/null"
                  )

                  copy_stmt = sql.SQL("""
                    COPY (
                      SELECT race_id,lane,recent_form
                      FROM public.v2_race_entries
                      WHERE recent_form IS NOT NULL
                      ORDER BY race_id,lane
                    )
                    TO PROGRAM {}
                    WITH (FORMAT BINARY)
                  """).format(sql.Literal(program))

                  try:
                      cur.execute(copy_stmt)
                  except Exception:
                      print("ARCHIVE_PRIVATE_TRANSFER=FAIL", flush=True)
                      raise SystemExit(2) from None

                  cur.execute("ROLLBACK")

          out.update({
              "source_rows": rows,
              "source_key_null_rows": null_keys,
              "source_duplicate_rows": dup_rows,
              "source_checksum_rows": checksum_rows,
              "source_payload_md5": str(payload_md5),
              "source_payload_bytes": int(payload_bytes),
              "source_archive_logical_bytes": int(logical_bytes),
              "archive_rows": rows,
              "archive_payload_md5": str(payload_md5),
              "archive_key_null_rows": 0,
              "archive_duplicate_rows": 0,
              "parity": "PASS",
              "archive_write": 1,
          })
          print("RECENT_FORM_ARCHIVE_RESULT="+json.dumps(out,sort_keys=True), flush=True)
          PY

      - name: Transfer Recent Form privately and verify before commit
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$ARCHIVE_SERVICE" \
            bash -lc '
              set -euo pipefail
              export ARCHIVE_DATABASE_URL="$DATABASE_URL"
              railway run \
                --project "$RAILWAY_PROJECT_ID" \
                --environment "$RAILWAY_ENVIRONMENT" \
                --service "$SOURCE_SERVICE" \
                python /tmp/recent_form_private_archive.py
            ' | tee archive-result.out

          grep -q '"parity": "PASS"' archive-result.out
          grep -q '"source_write": 0' archive-result.out
          grep -q '"source_cleanup": 0' archive-result.out
          grep -q '"cutover": 0' archive-result.out
          grep -q '"railway_resource_created": 0' archive-result.out

      - name: Post sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path

          result = None
          if Path("archive-result.out").exists():
              m = re.search(
                  r'^RECENT_FORM_ARCHIVE_RESULT=(\{.*\})$',
                  Path("archive-result.out").read_text(errors="replace"),
                  re.M,
              )
              if m:
                  result = json.loads(m.group(1))

          if result and result.get("parity") == "PASS":
              lines = [
                  "## Recent Form archive write + parity",
                  "",
                  "State: **PASS**",
                  f"- source rows: **{result['source_rows']:,}**",
                  f"- archive rows: **{result['archive_rows']:,}**",
                  f"- payload MD5 match: **{result['source_payload_md5'] == result['archive_payload_md5']}**",
                  f"- key null rows: **{result['archive_key_null_rows']}**",
                  f"- duplicate key rows: **{result['archive_duplicate_rows']}**",
                  f"- source payload: **{result['source_payload_bytes']/1_000_000:.1f} MB**",
                  "- transfer path: **Railway private network only**",
                  "",
                  "Source candidate-v4 remained DB-read-only. No source cleanup, cutover, Railway resource creation, volume resize, public proxy, Production/LINE/purchase/model change, or Railway AI/Agent use.",
              ]
          else:
              lines = [
                  "## Recent Form archive write + parity",
                  "",
                  "State: **FAILED / target transaction rolled back where transfer began**",
                  "",
                  "Source cleanup and cutover were not attempted. No public proxy, Railway AI/Agent, or Railway resource creation was used.",
              ]
          Path("archive-summary.md").write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file archive-summary.md

      - name: Cleanup local transient files
        if: always()
        shell: bash
        run: |
          rm -f /tmp/recent_form_private_archive.py archive-result.out archive-summary.md
