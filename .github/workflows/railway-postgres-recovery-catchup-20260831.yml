name: Railway Postgres recovery catch-up 2026-08-31

on:
  pull_request:
    paths:
      - '.github/workflows/railway-postgres-recovery-catchup-20260831.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed recovery gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/railway-postgres-recovery-catchup-20260831.yml')
          content = p.read_text(encoding='utf-8')
          assert "/railway postgres-recovery-catchup-20260831 CONFIRM" in content
          assert "github.actor == github.repository_owner" in content
          assert "github.event.issue.number == 42" in content
          assert 'TARGET_DATE: "2026-08-31"' in content
          trigger = content.split("permissions:", 1)[0]
          assert "schedule:" not in trigger
          assert "workflow_dispatch:" not in trigger
          print("RECOVERY_CATCHUP_VALIDATE=PASS")
          PY

  catchup:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway postgres-recovery-catchup-20260831 CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TARGET_DATE: "2026-08-31"
      WORKERS: "4"
      ODDS_WORKERS: "2"
      SLEEP_SEC: "0.1"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load recovered Postgres public URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = data.get('DATABASE_PUBLIC_URL') if isinstance(data, dict) else None
          if isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run normal daily data prepare catch-up
        id: prepare
        shell: bash
        run: |
          set +e
          python -u run_daily_data_prepare_pg.py > catchup-output.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized recovery summary
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.prepare.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          src = Path('catchup-output.txt')
          raw = src.read_text(encoding='utf-8', errors='replace') if src.exists() else ''
          keep = []
          prefixes = (
              '✅ run_daily_data_prepare_pg.py VERSION',
              'TARGET_DATE=',
              'ODDS_IS_FINAL=',
              'odds_save_mode=',
              '保存レース件数:',
              '保存出走表件数:',
              '保存結果件数:',
              '保存オッズ件数:',
              '成功:',
              '失敗/データなし:',
              'target_date=',
              'audit_now_jst=',
              'total_races=',
              'complete_races=',
              'pending_races=',
              'problem_races=',
              '  partial_odds=',
              '  missing_odds=',
              '  invalid_ticket=',
              '  unexpected=',
          )
          for line in raw.splitlines():
              if line.startswith(prefixes):
                  keep.append(line[:500])
          code = os.environ.get('EXIT_CODE', '?')
          lines = [
              '## Railway Postgres recovery catch-up 2026-08-31',
              '',
              'Normal daily data preparation was run for the fixed recovery date only.',
              'No result collection, model/LINE/N01/N02/Bao/threshold change, volume move, backup operation, or service rename was performed.',
              '',
              '```text',
              *(keep[-120:] if keep else ['(no allowlisted summary lines returned)']),
              '```',
              '',
              f'Process exit code: {code}',
              '',
              '**RECOVERY_CATCHUP_PASS_VERIFY_TODAY_HEALTH**' if code == '0' else '**RECOVERY_CATCHUP_BLOCK_MANUAL_REVIEW_REQUIRED**',
          ]
          Path('catchup-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Clean raw temporary files
        if: always()
        run: rm -f railway-vars.json catchup-output.txt

      - name: Post sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file catchup-summary.md

      - name: Fail when catch-up failed
        if: steps.prepare.outputs.exit_code != '0'
        run: exit 1
