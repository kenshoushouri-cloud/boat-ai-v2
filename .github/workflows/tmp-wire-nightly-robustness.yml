name: Temporary finalize nightly robustness wiring

on:
  push:
    branches:
      - ops/nightly-robustness-reports-20260821

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ops/nightly-robustness-reports-20260821
          fetch-depth: 0

      - name: Bump nightly version
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('run_nightly_results_pg.py')
          text = path.read_text(encoding='utf-8')
          old = 'VERSION = "2026-08-21 nightly-observability-v6"'
          new = 'VERSION = "2026-08-21 nightly-observability-v7-robustness"'
          if old not in text:
              raise SystemExit('version anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile nightly runner
        run: python -m py_compile run_nightly_results_pg.py

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- run_nightly_results_pg.py
          git commit -m "ops: identify nightly robustness stages"
          git push origin HEAD:ops/nightly-robustness-reports-20260821
