name: N02 forward robustness read-only

on:
  pull_request:
    paths:
      - '.github/workflows/n02-forward-robustness-readonly.yml'
      - 'report_n02_forward_robustness_pg.py'
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate N02 report read-only policy
        run: |
          set -euo pipefail
          python -m py_compile report_n02_forward_robustness_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('report_n02_forward_robustness_pg.py').read_text(encoding='utf-8')
          assert 'from db_pg import fetch_all' in p
          assert 'READ_ONLY=1 DB_UPDATE=0 LINE=0 PROD_CHANGE=0 N02_RULE_CHANGE=0' in p
          assert 'execute(' not in p
          assert 'upsert' not in p.lower()
          assert 'send_line' not in p.lower()
          print('N02_FORWARD_ROBUSTNESS_VALIDATE=PASS')
          PY

  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway n02-forward-robustness'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run N02 forward robustness report
        env:
          PYTHONPATH: ${{ github.workspace }}
          N02_FORWARD_START_DATE: '2026-08-18'
          N02_FORWARD_UNIT_YEN: '100'
        run: |
          set -euo pipefail
          python -u report_n02_forward_robustness_pg.py 2>&1 | tee n02-forward-output.txt
      - name: Reply with sanitized report
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## N02 forward robustness read-only'
            echo
            echo '```text'
            grep -E '^(OK report_n02_forward_robustness_pg.py|PERIOD=|READ_ONLY=|raw_evaluated_rows=|=== N02 UNIQUE OVERALL ===|N02: |=== N02 BY ODDS BUCKET ===|3-4: |4-5: |5-6: |=== N02 BY RACE NO ===|R0[7-9]: |R10: |RESULT=)' n02-forward-output.txt 2>/dev/null || echo 'N02_FORWARD_ROBUSTNESS_DIAGNOSTIC=no_report_output'
            echo '```'
            echo
            echo 'Read-only report from v2_candidate_filter_shadow. No DB update, LINE, production setting, N02 rule, or promotion state was changed.'
          } > n02-forward-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file n02-forward-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json n02-forward-output.txt n02-forward-comment.md
