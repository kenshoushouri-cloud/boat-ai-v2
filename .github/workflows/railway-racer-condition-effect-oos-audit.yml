name: Railway racer condition effect OOS audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/racer_condition_effect_oos_audit.py"
      - ".github/workflows/railway-racer-condition-effect-oos-audit.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway racer-condition-effect-oos-audit'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run read-only OOS effect audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/racer_condition_effect_oos_audit.py > effect-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build sanitized summary
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p=Path('effect-output.txt')
          text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          prefixes=('CONDITION_EFFECT_','EFFECT_')
          keep=[line[:800] for line in text.splitlines() if line.startswith(prefixes)]
          lines=['## Racer condition wind/wave OOS effect audit','','**Read-only / aggregate only / no coefficients / no DB writes**','','```text',*keep[:120],'```','',f'Audit exit code: `{os.environ.get("AUDIT_EXIT_CODE","?")}`','','This audit tests sign stability between an earlier training period and later OOS period. It does not change prediction logic, Shadow, database rows, Railway settings, or LINE.']
          Path('effect-summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY
      - name: Remove temporary files
        if: always()
        run: rm -f railway-vars.json railway-vars-error.txt effect-output.txt
      - name: Post result to control issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file effect-summary.md
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
