name: Research S03 M2 Common Economics Parity

on:
  pull_request:
    paths:
      - 'research/forward_economics.py'
      - 'research/s03_m2_common_economics_pg.py'
      - '.github/workflows/research-s03-m2-common-economics.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Verify read-only contract
        run: |
          set -euo pipefail
          grep -q 'set transaction read only' research/s03_m2_common_economics_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-s03-m2-common-economics.yml').read_text(encoding='utf-8').lower()
          assert ''.join(('railway',' variable',' list')) not in w
          PY
      - run: npm install --global @railway/cli
      - name: Run exact S03 M2 common parity
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/s03_m2_common_economics_pg.py' \
            2>&1 | tee s03-m2-common-economics.txt
          grep -q '^S03_M2_COMMON_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0$' s03-m2-common-economics.txt
          grep -q '^S03_M2_COMMON_RESULT=PASS_EXACT_FROZEN_SUBSET$' s03-m2-common-economics.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s03-m2-common-economics-${{ github.run_id }}
          path: s03-m2-common-economics.txt
          retention-days: 90
          if-no-files-found: error
