name: V4 market-residual lane model

on:
  pull_request:
    paths:
      - 'research/v4_market_residual_lane_model_pg.py'
      - 'tests/test_v4_market_residual_lane_model.py'
      - 'docs/V4_MARKET_RESIDUAL_LANE_MODEL_20260923.md'
      - '.github/workflows/v4-market-residual-lane-model.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate residual learner contract
        env:
          PYTHONPATH: .
          V4_RESIDUAL_LANE_BOOTSTRAP_SAMPLES: '200'
        run: |
          set -euo pipefail
          python -m py_compile research/v4_market_residual_lane_model_pg.py tests/test_v4_market_residual_lane_model.py
          pytest -q tests/test_v4_market_residual_lane_model.py
          python - <<'PY'
          from pathlib import Path
          src=Path('research/v4_market_residual_lane_model_pg.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in src
          assert 'heldout_used_for_training' in src
          assert 'hyperparameter_search' in src
          for value in ('insert into','update v2_','delete from','vacuum ','purchase_action=true'):
              assert value not in src, value
          print('V4_RESIDUAL_LANE_VALIDATE=PASS')
          PY

  replay:
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      V4_VALUE_ODDS_CUTOFF_MINUTES: '5'
      V4_VALUE_MAX_LABEL_SPREAD_SECONDS: '60'
      V4_RESIDUAL_LANE_BOOTSTRAP_SAMPLES: '20000'
      V4_RESIDUAL_LANE_BOOTSTRAP_SEED: '20260923'
      V4_RESIDUAL_LANE_OUTPUT_JSON: 'v4-market-residual-lane-model.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require Railway non-enumerating route
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          echo "V4_RESIDUAL_LANE_DB_REPLAY=RAILWAY_RUN_NON_ENUMERATING"
      - name: Install Railway CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway --version
      - name: Run fixed residual learner and held-out audit
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u research/v4_market_residual_lane_model_pg.py' \
            2>&1 | tee v4-market-residual-lane-model.txt
          grep -q '^RESULT=PASS_READ_ONLY_MARKET_RESIDUAL_LANE$' v4-market-residual-lane-model.txt
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-market-residual-lane-model-${{ github.run_id }}
          path: |
            v4-market-residual-lane-model.json
            v4-market-residual-lane-model.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Confirm no variable enumeration
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/v4-market-residual-lane-model.yml').read_text(encoding='utf-8').lower()
          forbidden=(
              ''.join(('railway',' variable',' list')),
              ''.join(('print','env')),
              ''.join(('env',' |')),
          )
          for value in forbidden:
              assert value not in text, value
          assert 'railway run' in text
          print('V4_RESIDUAL_LANE_SECRET_ENUMERATION=0')
          PY
