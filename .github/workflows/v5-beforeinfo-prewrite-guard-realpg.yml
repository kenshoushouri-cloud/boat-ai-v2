name: V5 guarded beforeinfo pre-first-write and real Postgres CI

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  ephemeral-postgres:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/v5 beforeinfo-prewrite-guard-diagnostic-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    services:
      pg:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-local-postgres-only
          POSTGRES_DB: v5_ephemeral_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d v5_ephemeral_ci"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 25
    env:
      V5_CI_EPHEMERAL_PG: "YES"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install isolated PostgreSQL client only
        shell: bash
        run: python -m pip install --no-cache-dir 'psycopg[binary]>=3.2,<4' 'beautifulsoup4>=4.12,<5'
      - name: V5 prewrite gate and both existing end-to-end regression suites
        id: test
        shell: bash
        run: |
          set +e
          : > test-output.txt
          code=0
          for pat in test_v5_beforeinfo_prewrite_gate.py test_v5_official_capture_pipeline.py test_v5_capture_pipeline_postgres.py; do
            python -m unittest discover -s tests -p "$pat" -v >> test-output.txt 2>&1 || code=1
          done
          if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Summarize minimal evidence
        id: report
        if: always()
        env:
          PASSED: ${{ steps.test.outputs.passed }}
        shell: bash
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw=Path("test-output.txt").read_text(encoding="utf-8",errors="replace") if Path("test-output.txt").exists() else ""
          keep=[s[:260] for s in raw.splitlines() if s.startswith(("test_","Ran ","OK","FAILED","ERROR","FAIL","Traceback","AssertionError","ImportError","TypeError","ValueError","psycopg.errors."))]
          passed=(os.environ.get("PASSED")=="true" and all("Ran "+str(n)+" tests" in raw for n in (23,20,9)) and raw.count("\nOK\n") == 3)
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("verified="+("true" if passed else "false")+"\n")
          lines=[
            "## V5 beforeinfo pre-first-write six-active-lane and real PostgreSQL regression",
            "",
            "- GitHub Actions temporary postgres:16 only, isolated localhost database v5_ephemeral_ci",
            "- Synthetic structured official-style beforeinfo HTML and verified-attestation fixtures ONLY, no real HTTP/Railway/Production V4/LINE/stake/BUY",
            "- Fail CLOSED on incomplete six-boats, cutoff/window, unverified racelist before any insert; retain prior full-pipeline mock+real-Pg regressions; claimed racelist attestation is not independently authentic official source proof",
            "",
            "~~~text", *keep[:33], "---- LAST ----", *keep[-28:], "~~~", "",
            "V5_BEFOREINFO_PREWRITE_GUARD_REALPG_PASS" if passed else "V5_BEFOREINFO_PREWRITE_GUARD_REALPG_FAILED"
          ]
          Path("summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Report verified result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: gh issue comment 581 --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Fail on tests or verification
        if: steps.report.outputs.verified != 'true'
        run: exit 1
