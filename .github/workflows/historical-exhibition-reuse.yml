name: Historical exhibition realtime reuse

on:
  pull_request:
    paths:
      - "research/historical_exhibition_reuse_pg.py"
      - "tests/test_historical_exhibition_reuse_pg.py"
      - ".github/workflows/historical-exhibition-reuse.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: .
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<3.4" pytest
      - run: |
          python -m py_compile research/historical_exhibition_reuse_pg.py
          pytest -q tests/test_historical_exhibition_reuse_pg.py
      - name: Static safety
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/historical_exhibition_reuse_pg.py").read_text(encoding="utf-8").lower()
          assert "requests" not in p
          assert "v2_results" not in p
          assert "v2_odds" not in p
          assert "historical" in p
          assert "learning_all" in p and "final_ab" in p
          print("HIST_REUSE_STATIC_SAFETY=PASS")
          PY

  run:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/railway historical-exhibition-reuse-plan ') ||
        startsWith(github.event.comment.body, '/railway historical-exhibition-reuse ')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<3.4"
      - run: npm install --global @railway/cli
      - name: Parse command
        id: cmd
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os,re
          from datetime import date
          body=os.environ["BODY"].strip()
          plan=re.fullmatch(r"/railway historical-exhibition-reuse-plan (\d{4}-\d{2}-\d{2}) (\d{4}-\d{2}-\d{2})",body)
          apply=re.fullmatch(r"/railway historical-exhibition-reuse (\d{4}-\d{2}-\d{2}) (\d{4}-\d{2}-\d{2}) CONFIRM",body)
          m=plan or apply
          if not m: raise SystemExit("invalid command")
          a=date.fromisoformat(m.group(1)); b=date.fromisoformat(m.group(2))
          if b<a or (b-a).days>31: raise SystemExit("range must be 1..32 days")
          if a<date(2025,7,1): raise SystemExit("before formal backtest period")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write("start="+a.isoformat()+"\n")
              f.write("end="+b.isoformat()+"\n")
              f.write("apply="+("1" if apply else "0")+"\n")
          PY
      - name: Run reuse
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          START_DATE: ${{ steps.cmd.outputs.start }}
          END_DATE: ${{ steps.cmd.outputs.end }}
          APPLY: ${{ steps.cmd.outputs.apply }}
        run: |
          set -euo pipefail
          extra=""
          if [ "$APPLY" = "1" ]; then
            extra="--apply"
          fi
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export CONFIRM_HISTORICAL_EXHIBITION_REUSE="'"$([ "$APPLY" = "1" ] && echo YES || echo NO)"'"; exec python -u research/historical_exhibition_reuse_pg.py --start-date "'"$START_DATE"'" --end-date "'"$END_DATE"'" '"$extra" \
            | tee reuse.txt
          grep -q '^HIST_REUSE_RESULT=PASS$' reuse.txt
      - name: Post compact result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Historical exhibition realtime reuse"
            echo
            if [ -f reuse.txt ]; then
              grep -E '^(HIST_REUSE_RANGE=|HIST_REUSE_BEFORE=|HIST_REUSE_TOUCHED=|HIST_REUSE_AFTER=|HIST_REUSE_WRITE_ENABLED=|HIST_REUSE_HTTP=|HIST_REUSE_RESULT=)' reuse.txt || true
            fi
            echo
            echo "candidate-v4 only; complete single-label source only; conflicts fail closed; no HTTP."
          } > reply.txt
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file reply.txt
