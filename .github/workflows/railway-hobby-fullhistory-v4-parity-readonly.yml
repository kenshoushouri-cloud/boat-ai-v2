name: Railway 5GB full-history v4 exact parity read-only

on:
  issue_comment:
    types: [created]

permissions:
  actions: read
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  KEY_SERVICE: "archive-restore-key-20261001"
  KEY_VARIABLE: "ARCHIVE_CMS_PRIVATE_KEY_B64_PARITY_36812386066"
  REFERENCE_RUN_ID: "36812386066"
  REFERENCE_ARTIFACT: "boat-ai-pre-hobby-restorable-20261001-v3-parity-36812386066"

jobs:
  parity:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-fullhistory-v4-exact-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: paritytest
          POSTGRES_DB: parity_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parity_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.4"
          npm install --global @railway/cli

      - name: Download live-confirmed fixed reference artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REFERENCE_ARTIFACT }}
          path: fixed-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REFERENCE_RUN_ID }}

      - name: Decrypt fixed reference without exposing key
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          test -s "fixed-artifact/$REFERENCE_ARTIFACT.dump.cms"
          test -s fixed-artifact/archive-public-v3.pem
          test -s fixed-artifact/parity-manifest-v3.txt

          cat > /tmp/materialize-key.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${KEY_VARIABLE:?}"
          : "${!KEY_VARIABLE:?}"
          umask 077
          printf '%s' "${!KEY_VARIABLE}" | base64 -d > fixed-private.pem
          test -s fixed-private.pem
          SH
          chmod 700 /tmp/materialize-key.sh

          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$KEY_SERVICE" \
            env KEY_VARIABLE="$KEY_VARIABLE" bash /tmp/materialize-key.sh

          openssl cms -decrypt -binary -inform DER \
            -in "fixed-artifact/$REFERENCE_ARTIFACT.dump.cms" \
            -recip fixed-artifact/archive-public-v3.pem \
            -inkey fixed-private.pem \
            -out fixed-reference.dump

          rm -f fixed-private.pem /tmp/materialize-key.sh

          expected_dump_sha="$(awk -F= '$1=="PLAIN_DUMP_SHA256"{print $2}' fixed-artifact/parity-manifest-v3.txt | tail -1 | tr -d '[:space:]')"
          actual_dump_sha="$(sha256sum fixed-reference.dump | awk '{print $1}')"
          test -n "$expected_dump_sha"
          test "$actual_dump_sha" = "$expected_dump_sha"

      - name: Restore fixed reference into ephemeral PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            --network host \
            -e PGPASSWORD=paritytest \
            -v "$PWD:/work" \
            postgres:18 \
            pg_restore \
              --no-owner \
              --no-acl \
              --exit-on-error \
              --jobs=2 \
              --dbname="postgresql://postgres:paritytest@127.0.0.1:5432/parity_restore" \
              /work/fixed-reference.dump

      - name: Write exact evidence capture helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/capture-one.py <<'PY'
          import os
          import runpy
          import sys
          from pathlib import Path

          import psycopg

          root = Path(sys.argv[1])
          root.mkdir(parents=True, exist_ok=True)
          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          capture = contract["capture"]

          url = os.environ.get("LOCAL_DATABASE_URL") or os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          with psycopg.connect(url) as conn:
              conn.execute("SET default_transaction_read_only = on")
              metadata_counts, db_bytes, evidence_sha = capture(conn, root)

          print("CAPTURE_EVIDENCE_SHA256=" + evidence_sha)
          print("CAPTURE_DB_BYTES=" + str(db_bytes))
          for key in sorted(metadata_counts):
              print("CAPTURE_COUNT_" + key.upper().replace("-", "_") + "=" + str(metadata_counts[key]))
          PY

      - name: Capture fixed reference evidence
        shell: bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:paritytest@127.0.0.1:5432/parity_restore
        run: |
          set -euo pipefail
          python3 /tmp/capture-one.py reference > reference.capture
          grep -E '^CAPTURE_' reference.capture > reference.capture.sanitized
          test -s reference/candidate-table-counts.tsv
          test -s reference/candidate-indexes.tsv

      - name: Capture candidate v4 evidence read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$TARGET_SERVICE" \
            python3 /tmp/capture-one.py candidate > candidate.capture

          grep -E '^CAPTURE_' candidate.capture > candidate.capture.sanitized
          test -s candidate/candidate-table-counts.tsv
          test -s candidate/candidate-indexes.tsv

      - name: Compare exact fixed reference to candidate
        id: parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > exact-diff.sanitized
          import hashlib
          import runpy
          from pathlib import Path

          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          kinds = contract["KINDS"]
          expected = contract["EXPECTED"]
          expected_sha = contract["EXPECTED_EVIDENCE_SHA"]
          limit_bytes = int(contract["LIMIT_BYTES"])

          def digest(root):
              h = hashlib.sha256()
              for kind in kinds:
                  h.update((Path(root) / f"candidate-{kind}.tsv").read_bytes())
              return h.hexdigest()

          def lines(root, kind):
              p = Path(root) / f"candidate-{kind}.tsv"
              return p.read_text(encoding="utf-8").splitlines()

          ref_sha = digest("reference")
          cand_sha = digest("candidate")

          cap = {}
          for line in Path("candidate.capture.sanitized").read_text(encoding="utf-8").splitlines():
              if "=" in line:
                  k, v = line.split("=", 1)
                  cap[k] = v

          candidate_db_bytes = int(cap["CAPTURE_DB_BYTES"])
          headroom = limit_bytes - candidate_db_bytes

          print("REFERENCE_GITHUB_SHA=" + Path(".git/HEAD").read_text(encoding="utf-8").strip())
          print("FIXED_REFERENCE_EVIDENCE_SHA256=" + ref_sha)
          print("CONTRACT_EXPECTED_EVIDENCE_SHA256=" + expected_sha)
          print("CANDIDATE_EVIDENCE_SHA256=" + cand_sha)
          print("REFERENCE_MATCHES_CONTRACT=" + ("true" if ref_sha == expected_sha else "false"))
          print("CANDIDATE_MATCHES_REFERENCE=" + ("true" if cand_sha == ref_sha else "false"))
          print("CANDIDATE_DB_BYTES=" + str(candidate_db_bytes))
          print("CANDIDATE_HEADROOM_BYTES=" + str(headroom))
          print("UNDER_5GB=" + ("true" if candidate_db_bytes < limit_bytes else "false"))

          mismatch_kinds = []
          for kind in kinds:
              ref = lines("reference", kind)
              cand = lines("candidate", kind)
              if ref != cand:
                  mismatch_kinds.append(kind)
                  ref_set = set(ref)
                  cand_set = set(cand)
                  ref_only = sorted(ref_set - cand_set)
                  cand_only = sorted(cand_set - ref_set)
                  print(f"MISMATCH_KIND={kind}|REFERENCE_ROWS={len(ref)}|CANDIDATE_ROWS={len(cand)}|REFERENCE_ONLY={len(ref_only)}|CANDIDATE_ONLY={len(cand_only)}")
                  for row in ref_only[:3]:
                      print("REFERENCE_ONLY|" + kind + "|" + row)
                  for row in cand_only[:3]:
                      print("CANDIDATE_ONLY|" + kind + "|" + row)

          print("MISMATCH_KINDS=" + (",".join(mismatch_kinds) if mismatch_kinds else "NONE"))

          counts_ok = True
          count_map = {
              "PUBLIC_TABLES": "tables",
              "PUBLIC_COLUMNS": "columns",
              "PUBLIC_CONSTRAINTS": "constraints",
              "PUBLIC_INDEXES": "indexes",
              "PUBLIC_SEQUENCES": "sequences",
              "PUBLIC_VIEWS": "views",
              "PUBLIC_TRIGGERS": "triggers",
              "PUBLIC_POLICIES": "policies",
              "EXTENSIONS": "extensions",
          }
          for key, kind in count_map.items():
              actual = len(lines("candidate", kind))
              want = int(expected[key])
              print(f"{key}={actual}")
              if actual != want:
                  counts_ok = False

          ok = (
              ref_sha == expected_sha
              and cand_sha == ref_sha
              and not mismatch_kinds
              and counts_ok
              and candidate_db_bytes < limit_bytes
          )
          print("CANDIDATE_EXACT_PARITY=" + ("PASS" if ok else "FAIL"))
          print("SOURCE_WRITE=0")
          print("CANDIDATE_WRITE=0")
          print("CUTOVER=0")
          print("DELETE=0")
          print("RESIZE=0")
          print("PLAN_CHANGE=0")
          print("PURCHASE_ACTION=false")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Build sanitized success
        if: success()
        shell: bash
        run: |
          {
            echo '## 5GB full-history candidate v4 exact parity'
            echo
            echo 'PASS: candidate-v4 exactly matches the live-confirmed fixed restore/parity artifact.'
            echo
            echo '```text'
            cat exact-diff.sanitized
            echo '```'
            echo
            echo 'Reference restore existed only in the GitHub Actions ephemeral PostgreSQL 18 service.'
            echo 'No Production/candidate rows or schema were changed.'
          } > summary.md

      - name: Build sanitized failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## 5GB full-history candidate v4 exact parity'
            echo
            echo 'FAIL: exact parity against the fixed restore/parity artifact was not established.'
            if [ -s exact-diff.sanitized ]; then
              echo
              echo '```text'
              cat exact-diff.sanitized
              echo '```'
            fi
            echo
            echo 'No Production/candidate mutation, cutover, delete, resize, plan change, or purchase action was requested.'
          } > summary.md

      - name: Cleanup private/plaintext material
        if: always()
        shell: bash
        run: |
          rm -f fixed-private.pem fixed-reference.dump /tmp/materialize-key.sh /tmp/capture-one.py

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
