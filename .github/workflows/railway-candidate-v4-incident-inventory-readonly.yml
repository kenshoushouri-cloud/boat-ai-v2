name: Candidate-v4 incident inventory read-only

on:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "581"

jobs:
  inspect:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway incident-inventory-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install 'psycopg[binary]'
          npm install --global @railway/cli

      - name: Run read-only inventory
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-hobby-fullhistory-candidate-v4 \
            --environment production \
            bash -c 'set -e; test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export INCIDENT_START_DATE=2025-07-01; export INCIDENT_END_DATE=2026-10-05; exec python -u research/race_incident_inventory_pg.py' \
            > incident-inventory.txt

          {
            echo "## Candidate-v4 incident inventory"
            echo
            echo "- range: 2025-07-01..2026-10-05"
            echo "- database transaction: READ ONLY"
            echo "- no model / LINE / BUY / stake / plan / volume change"
            echo
            echo '```text'
            cat incident-inventory.txt
            echo '```'
          } > railway-result-summary.md

      - name: Post result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f railway-result-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file railway-result-summary.md
          fi

  preflight_result_entries:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway result-entries-backfill-preflight'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install 'psycopg[binary]'
          npm install --global @railway/cli

      - name: Run read-only preflight
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-hobby-fullhistory-candidate-v4 \
            --environment production \
            bash -c 'set -e; test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export K_START_DATE=2026-08-01; export K_END_DATE=2026-10-05; exec python -u research/result_entries_backfill_preflight_pg.py' \
            > preflight.txt

          {
            echo "## Candidate-v4 result-entry backfill preflight"
            echo
            echo "- range: 2026-08-01..2026-10-05"
            echo "- database transaction: READ ONLY"
            echo "- no model / LINE / BUY / stake / plan / volume change"
            echo
            echo '```text'
            cat preflight.txt
            echo '```'
          } > railway-result-summary.md

      - name: Post result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f railway-result-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file railway-result-summary.md
          fi

  k_result_gap_audit_20260821:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway k-result-gap-audit-20260821'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Run read-only gap audit
        shell: bash
        run: |
          set -euo pipefail
          railway run \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-hobby-fullhistory-candidate-v4 \
            --environment production \
            bash -c 'set -e; test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export TARGET_DATE=2026-08-21; exec python -u research/k_result_gap_audit_pg.py' \
            > gap-audit.txt

          {
            echo "## Candidate-v4 K result gap audit 2026-08-21"
            echo
            echo "- database transaction: READ ONLY"
            echo "- no model / LINE / BUY / stake / plan / volume change"
            echo
            echo '```text'
            cat gap-audit.txt
            echo '```'
          } > railway-result-summary.md

      - name: Post result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f railway-result-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file railway-result-summary.md
          fi

