name: Historical official beforeinfo backfill

on:
  pull_request:
    paths:
      - "research/historical_beforeinfo_backfill_pg.py"
      - "tests/test_historical_beforeinfo_backfill_pg.py"
      - ".github/workflows/historical-beforeinfo-backfill.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyyaml
      - name: Validate workflow and safety contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path(".github/workflows/historical-beforeinfo-backfill.yml")
          parsed=yaml.safe_load(p.read_text(encoding="utf-8"))
          assert isinstance(parsed, dict) and "jobs" in parsed
          assert {"validate","live-read-only-plan","backfill"} <= set(parsed["jobs"])
          text=p.read_text(encoding="utf-8")
          assert "postgres-hobby-fullhistory-candidate-v4" in text
          assert "".join(("postgres-","recovery")) not in text
          assert "historical-exhibition-time-backfill" in text
          assert "historical-exhibition-time-backfill-fast" in text
          assert "HIST_FAST_RETRY_TRANSIENT_DB" in text
          assert "--allow-official-terminal" in text
          assert "--exclude-race-id-file" in text
          assert "--mode exhibition-time-only --plan-only" in text
          assert text.count("\n  backfill:") == 1
          print("PASS workflow YAML")
          PY
          pytest -q tests/test_historical_beforeinfo_backfill_pg.py tests/test_historical_beforeinfo_parser_v3.py
          python -m py_compile research/historical_beforeinfo_backfill_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/historical_beforeinfo_backfill_pg.py").read_text(encoding="utf-8").lower()
          assert "boatrace_official_archived_beforeinfo_predeadline_assumed_v1" in p
          assert "confirm_historical_beforeinfo_db_write" in p
          assert '_official_url("beforeinfo"' in p
          assert "v2_results" not in p
          assert "v2_odds" not in p
          assert "result_odds_payout_read" in p
          assert "mode_exhibition_time_only" in p
          assert "exhibition-time-only" in p
          assert "historical_beforeinfo_parser_v3" in p
          assert "fail_parse_quality" in p
          print("PASS historical beforeinfo safety")
          PY

  live-read-only-plan:
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Candidate-v4 July plan-only check — no HTTP and no write
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; unset CONFIRM_HISTORICAL_BEFOREINFO_DB_WRITE; exec python -u research/historical_beforeinfo_backfill_pg.py --start-date 2026-07-01 --end-date 2026-07-31 --mode exhibition-time-only --plan-only --output historical-beforeinfo-dry-run.json' \
            | tee historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_WRITE_ENABLED=0$' historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_MODE=exhibition-time-only$' historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_PLAN_ONLY=1$' historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_RESULT=PASS$' historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_RESULT_ODDS_PAYOUT_READ=0$' historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_PARSE_QUALITY=NOT_APPLICABLE_PLAN_ONLY$' historical-beforeinfo-dry-run.txt
          grep -q '^HIST_BEFOREINFO_HISTORICAL_PARSER=2026-08-22 historical-beforeinfo-parser-v3$' historical-beforeinfo-dry-run.txt
          python - <<'PY'
          import json
          x=json.load(open("historical-beforeinfo-dry-run.json",encoding="utf-8"))
          assert x["mode"]=="exhibition-time-only"
          assert x["plan_only"] is True
          assert x["write_enabled"] is False
          assert x["parse_quality_status"]=="NOT_APPLICABLE_PLAN_ONLY"
          assert x["historical_parser_version"]=="2026-08-22 historical-beforeinfo-parser-v3"
          assert x["totals"]["target_missing_races"]==0, x["totals"]
          assert "http_requests" not in x["totals"]
          assert x["totals"]["plan_only_no_http"]==0
          print("PASS July terminal-skip target=0 / HTTP=0 / DB_WRITE=0")
          PY

  backfill:
    concurrency:
      group: ${{ github.event_name == 'issue_comment' && (startsWith(github.event.comment.body, '/railway historical-beforeinfo-backfill ') || startsWith(github.event.comment.body, '/railway historical-exhibition-time-backfill ') || startsWith(github.event.comment.body, '/railway historical-exhibition-time-backfill-fast ')) && 'historical-beforeinfo-write' || format('historical-beforeinfo-backfill-noncommand-{0}', github.run_id) }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      (
        startsWith(github.event.comment.body, '/railway historical-beforeinfo-backfill ') ||
        startsWith(github.event.comment.body, '/railway historical-exhibition-time-backfill ') ||
        startsWith(github.event.comment.body, '/railway historical-exhibition-time-backfill-fast ')
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Parse range and mode
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import date
          p=os.environ["COMMENT_BODY"].strip().split()
          allowed={
              "historical-beforeinfo-backfill",
              "historical-exhibition-time-backfill",
              "historical-exhibition-time-backfill-fast",
          }
          if not p or len(p) < 4 or p[1] not in allowed:
              raise SystemExit("invalid command")
          fast=p[1]=="historical-exhibition-time-backfill-fast"
          if fast and len(p)!=4:
              raise SystemExit("fast mode takes only start/end date")
          if not fast and len(p) not in {4,5}:
              raise SystemExit("invalid command")
          if len(p)==5 and p[1]!="historical-exhibition-time-backfill":
              raise SystemExit("max-races is exhibition-time-only")
          max_races=48 if fast else (int(p[4]) if len(p)==5 else 0)
          if max_races < 0 or max_races > 48:
              raise SystemExit("max-races must be 0..48")
          a=date.fromisoformat(p[2]); b=date.fromisoformat(p[3])
          if b<a:
              raise SystemExit("end before start")
          if fast and a!=b:
              raise SystemExit("fast mode requires a single date")
          if (b-a).days+1>31:
              raise SystemExit("maximum batch is 31 days")
          if a<date(2025,7,1):
              raise SystemExit("approved historical start is 2025-07-01")
          mode=(
              "exhibition-time-only"
              if p[1] in {
                  "historical-exhibition-time-backfill",
                  "historical-exhibition-time-backfill-fast",
              }
              else "generic"
          )
          print("HIST_START_DATE="+p[2])
          print("HIST_END_DATE="+p[3])
          print("HIST_MODE="+mode)
          print("HIST_MAX_RACES="+str(max_races))
          print("HIST_FAST_MODE="+("1" if fast else "0"))
          print("HIST_FAST_BLOCKS="+("4" if fast else "1"))
          PY

      - name: Fill historical snapshots
        env:
          CONFIRM_HISTORICAL_BEFOREINFO_DB_WRITE: "YES"
          HIST_BEFOREINFO_SLEEP_SEC: "0.50"
        run: |
          set -euo pipefail
          : > historical-beforeinfo-backfill.txt

          if [ "${HIST_FAST_MODE}" = "1" ]; then
            : > historical-beforeinfo-fast-exclude.txt
            for block in $(seq 1 "${HIST_FAST_BLOCKS}"); do
              block_txt="historical-beforeinfo-backfill-block-${block}.txt"
              block_json="historical-beforeinfo-backfill-block-${block}.json"

              attempt=1
              while :; do
                set +e
                railway run \
                  --project "${RAILWAY_PROJECT_ID}" \
                  --environment "${RAILWAY_ENVIRONMENT}" \
                  --service "${RAILWAY_DB_SERVICE}" \
                  bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; export CONFIRM_HISTORICAL_BEFOREINFO_DB_WRITE="YES"; export HIST_BEFOREINFO_SLEEP_SEC="0.50"; exec python -u research/historical_beforeinfo_backfill_pg.py --start-date "${HIST_START_DATE}" --end-date "${HIST_END_DATE}" --mode "${HIST_MODE}" --max-races 48 --exclude-race-id-file historical-beforeinfo-fast-exclude.txt --allow-official-terminal' \
                  2>&1 | tee "${block_txt}"
                rc=${PIPESTATUS[0]}
                set -e

                if [ "${rc}" -eq 0 ]; then
                  break
                fi

                if [ "${attempt}" -lt 2 ] && grep -Eq 'psycopg\.OperationalError|server closed the connection unexpectedly|connection is lost|could not connect to server|SSL connection has been closed unexpectedly' "${block_txt}"; then
                  echo "HIST_FAST_RETRY_TRANSIENT_DB=block:${block} attempt:${attempt} rc:${rc}" | tee -a historical-beforeinfo-backfill.txt
                  attempt=$((attempt+1))
                  sleep 5
                  continue
                fi

                cat "${block_txt}" >> historical-beforeinfo-backfill.txt
                exit "${rc}"
              done

              cat "${block_txt}" >> historical-beforeinfo-backfill.txt
              cp historical-beforeinfo-backfill-manifest.json "${block_json}"

              grep -q '^HIST_BEFOREINFO_RESULT=PASS$' "${block_txt}"
              grep -q "^HIST_BEFOREINFO_MODE=${HIST_MODE}$" "${block_txt}"
              grep -q '^HIST_BEFOREINFO_RESULT_ODDS_PAYOUT_READ=0$' "${block_txt}"
              grep -q '^HIST_BEFOREINFO_LINE=0 BUY=0 PROD_MODEL_CHANGE=0$' "${block_txt}"

              python - "${block_json}" "${block}" <<'PY' | tee -a historical-beforeinfo-backfill.txt
          import json
          import sys
          from pathlib import Path

          payload=json.loads(Path(sys.argv[1]).read_text(encoding="utf-8"))
          block=int(sys.argv[2])
          totals=payload.get("totals") or {}
          bad_keys=(
              "fetch_failed",
              "official_no_data",
              "exhibition_parser_failure_races",
              "exhibition_quality_rejected_races",
          )
          bad={
              k:int(totals.get(k,0) or 0)
              for k in bad_keys
              if int(totals.get(k,0) or 0)>0
          }
          available=int(totals.get("available_target_missing_races",0) or 0)
          target=int(totals.get("target_missing_races",0) or 0)
          complete=int(totals.get("exhibition_complete_races",0) or 0)
          print(
              f"HIST_FAST_BLOCK=block:{block} available:{available} "
              f"target:{target} complete:{complete} anomalies:{sum(bad.values())}"
          )
          candidates=sorted(set(
              (payload.get("days") or [{}])[0].get("official_partial_race_ids", [])
              + (payload.get("days") or [{}])[0].get("official_absent_race_ids", [])
          ))
          if candidates:
              with Path("historical-beforeinfo-fast-exclude.txt").open(
                  "a", encoding="utf-8"
              ) as fh:
                  for race_id in candidates:
                      fh.write(str(race_id)+"\n")
              print("HIST_FAST_TERMINAL_CANDIDATES="+json.dumps(candidates))
          if bad:
              print("HIST_FAST_STOP_ANOMALY="+json.dumps(bad,sort_keys=True))
              raise SystemExit(3)
          if target == 0 or available <= target:
              Path("historical-beforeinfo-fast-stop").write_text(
                  "drained\n", encoding="utf-8"
              )
          PY

              if [ -f historical-beforeinfo-fast-stop ]; then
                break
              fi
            done
          else
            railway run \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT}" \
              --service "${RAILWAY_DB_SERVICE}" \
              bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; export CONFIRM_HISTORICAL_BEFOREINFO_DB_WRITE="YES"; export HIST_BEFOREINFO_SLEEP_SEC="0.50"; exec python -u research/historical_beforeinfo_backfill_pg.py --start-date "${HIST_START_DATE}" --end-date "${HIST_END_DATE}" --mode "${HIST_MODE}" --max-races "${HIST_MAX_RACES}"' \
              | tee historical-beforeinfo-backfill.txt

            grep -q '^HIST_BEFOREINFO_RESULT=PASS$' historical-beforeinfo-backfill.txt
            grep -q "^HIST_BEFOREINFO_MODE=${HIST_MODE}$" historical-beforeinfo-backfill.txt
            grep -q '^HIST_BEFOREINFO_RESULT_ODDS_PAYOUT_READ=0$' historical-beforeinfo-backfill.txt
            grep -q '^HIST_BEFOREINFO_LINE=0 BUY=0 PROD_MODEL_CHANGE=0$' historical-beforeinfo-backfill.txt
          fi

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-beforeinfo-backfill-${{ github.run_id }}
          path: |
            historical-beforeinfo-backfill.txt
            historical-beforeinfo-backfill-manifest.json
            historical-beforeinfo-backfill-block-*.txt
            historical-beforeinfo-backfill-block-*.json
            historical-beforeinfo-fast-exclude.txt
          retention-days: 90
          if-no-files-found: error

      - name: Comment sanitized summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Historical beforeinfo backfill: ${HIST_START_DATE} .. ${HIST_END_DATE} mode=${HIST_MODE}"
            echo
            if [ -f historical-beforeinfo-backfill.txt ]; then
              grep -E '^(HIST_BEFOREINFO_DAY=|HIST_BEFOREINFO_TOTALS=|HIST_BEFOREINFO_PARSE_QUALITY=|HIST_BEFOREINFO_RESULT=|HIST_FAST_BLOCK=|HIST_FAST_STOP_ANOMALY=|HIST_FAST_TERMINAL_CANDIDATES=|HIST_FAST_RETRY_TRANSIENT_DB=)' historical-beforeinfo-backfill.txt || true
            fi
            echo
            echo "Official archived beforeinfo; historical/predeadline-assumed; missing-only; no result/odds/payout read."
          } > reply.txt
          gh issue comment 42 --repo "${GITHUB_REPOSITORY}" --body-file reply.txt
