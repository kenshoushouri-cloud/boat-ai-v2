name: Temporary automatic window odds refresh

on:
  pull_request:
    paths:
      - '.github/workflows/window-refresh-auto.yml'
      - '.github/scripts/window_refresh_plan.py'
      - 'run_window_refresh_pg.py'
      - 'run_odds_window_pg.py'
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type CONFIRM to run the temporary live base-odds refresh'
        required: true
        default: ''
        type: string
  schedule:
    - cron: '3-53/10 22,23,0-14 23-25 8 *'

permissions:
  contents: read

concurrency:
  group: window-refresh-auto
  cancel-in-progress: false

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate temporary auto-refresh safety
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile run_window_refresh_pg.py run_odds_window_pg.py .github/scripts/window_refresh_plan.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/window-refresh-auto.yml').read_text(encoding='utf-8')
          assert "3-53/10 22,23,0-14 23-25 8 *" in p
          assert "2026-08-24" in p and "2026-08-25" in p
          assert "github.event.inputs.confirm" in p
          assert "CONFIRM" in p
          assert "WINDOW_REFRESH_EXECUTE: '1'" in p
          assert "WINDOW_REFRESH_MIN_MINUTES_BEFORE_DEADLINE: '10'" in p
          assert "WINDOW_REFRESH_MAX_MINUTES_BEFORE_DEADLINE: '60'" in p
          assert "WINDOW_WORKERS: '2'" in p
          assert "WINDOW_ODDS_RETRIES: '1'" in p
          assert 'run_window_refresh_pg.py' in p
          assert '.github/scripts/window_refresh_plan.py' in p
          refresh=p.split('\n  refresh:\n',1)[1]
          for forbidden in ('run_pre_window_pg.py','run_pre_window_deduped_pg.py','v23_line_notifier_batch_pg.py','run_final_pg.py'):
              assert forbidden not in refresh
          assert 'cancel-in-progress: false' in p
          print('WINDOW_REFRESH_AUTO_VALIDATE=PASS')
          PY

  refresh:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    env:
      WINDOW_REFRESH_EXECUTE: '1'
      WINDOW_REFRESH_MIN_MINUTES_BEFORE_DEADLINE: '10'
      WINDOW_REFRESH_MAX_MINUTES_BEFORE_DEADLINE: '60'
      WINDOW_WORKERS: '2'
      WINDOW_ODDS_RETRIES: '1'
      WINDOW_ODDS_RETRY_WAIT_SEC: '10'
    steps:
      - name: Gate temporary JST collection period
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          jst_date="$(TZ=Asia/Tokyo date +%F)"
          jst_hour="$(TZ=Asia/Tokyo date +%H)"

          if [[ "$jst_date" != '2026-08-24' && "$jst_date" != '2026-08-25' ]]; then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "WINDOW_REFRESH_AUTO_GATE=inactive_date jst_date:${jst_date}"
            exit 0
          fi
          if (( 10#$jst_hour < 7 || 10#$jst_hour > 23 )); then
            echo 'run=false' >> "$GITHUB_OUTPUT"
            echo "WINDOW_REFRESH_AUTO_GATE=inactive_hour jst_date:${jst_date} jst_hour:${jst_hour}"
            exit 0
          fi

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            if [[ "${{ github.event.inputs.confirm }}" != 'CONFIRM' ]]; then
              echo 'run=false' >> "$GITHUB_OUTPUT"
              echo 'WINDOW_REFRESH_AUTO_GATE=manual_blocked_missing_confirm'
              exit 0
            fi
            echo 'run=true' >> "$GITHUB_OUTPUT"
            echo "WINDOW_REFRESH_AUTO_GATE=manual_confirmed jst_date:${jst_date} jst_hour:${jst_hour}"
            exit 0
          fi

          echo 'run=true' >> "$GITHUB_OUTPUT"
          echo "WINDOW_REFRESH_AUTO_GATE=scheduled_active jst_date:${jst_date} jst_hour:${jst_hour}"
      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'
      - uses: actions/setup-python@v5
        if: steps.gate.outputs.run == 'true'
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        if: steps.gate.outputs.run == 'true'
        with:
          node-version: '22'
      - name: Install dependencies
        if: steps.gate.outputs.run == 'true'
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load masked public database URL
        if: steps.gate.outputs.run == 'true'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Refresh incomplete base odds only
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -u run_window_refresh_pg.py
      - name: Verify remaining base-odds gaps read-only
        if: steps.gate.outputs.run == 'true'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -u .github/scripts/window_refresh_plan.py
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json
