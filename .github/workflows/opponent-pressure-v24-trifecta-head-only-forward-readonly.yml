name: Opponent pressure head-only trifecta Forward over v24 read-only

on:
  pull_request:
    paths:
      - '.github/scripts/opponent_pressure_v24_trifecta_head_only_forward.py'
      - '.github/workflows/opponent-pressure-v24-trifecta-head-only-forward-readonly.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/railway opponent-pressure-v24-head-forward')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only script
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/opponent_pressure_v24_trifecta_head_only_forward.py
          python - <<'PY'
          from pathlib import Path
          low=Path('.github/scripts/opponent_pressure_v24_trifecta_head_only_forward.py').read_text(encoding='utf-8').lower()
          assert 'opp_v24_head_tri_mode=read_only' in low
          assert 'unit_pressure_coef = 1.0' in low
          assert 'head_only_trifecta' in low
          assert 'pressure_changes_first_place_only_second_third_conditionals_stay_v24' in low
          assert 'first_lane' in low and 'second_lane' in low and 'third_lane' in low
          assert 'v2_opponent_pressure_shadow_v2' in low and 'v2_results' in low
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line'):
              assert token not in low, token
          print('OPP_V24_HEAD_TRI_VALIDATE=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Resolve JST end date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone,timedelta
          target=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'OPP_V24_HEAD_TRI_END={target}\n')
          print(f'OPP_V24_HEAD_TRI_TARGET={target}')
          PY
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run head-only trifecta Forward audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/opponent_pressure_v24_trifecta_head_only_forward.py > opp-v24-head-tri.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized results
        if: always()
        run: grep '^OPP_V24_HEAD_TRI_' opp-v24-head-tri.txt 2>/dev/null || true
      - name: Reply to bridge command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Opponent Pressure v24 head-only Forward report'
            echo
            echo '```text'
            grep '^OPP_V24_HEAD_TRI_' opp-v24-head-tri.txt 2>/dev/null || echo 'OPP_V24_HEAD_TRI_DIAGNOSTIC=no_output'
            echo '```'
            echo
            echo 'Read-only fixed head-only Forward evaluation. Coefficient remains 1.0; second/third conditionals remain current v24. No DB write, Production/LINE, Railway setting, threshold, coefficient, or promotion change.'
          } > opp-v24-head-tri-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file opp-v24-head-tri-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json opp-v24-head-tri.txt opp-v24-head-tri-comment.md
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
