name: Opponent pressure Forward stratified read-only

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/opponent_pressure_forward_stratified.py'
      - '.github/workflows/opponent-pressure-forward-stratified-readonly.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/railway opponent-pressure-forward-stratified')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only script
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/opponent_pressure_forward_stratified.py
          python - <<'PY'
          from pathlib import Path
          low=Path('.github/scripts/opponent_pressure_forward_stratified.py').read_text(encoding='utf-8').lower()
          assert 'opp_pressure_strat_mode=read_only' in low
          assert 'v2_opponent_pressure_shadow_v2' in low
          assert 'v2_results' in low and 'v2_races' in low
          assert 'r01_04' in low and 'r05_08' in low and 'r09_12' in low
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line'):
              assert token not in low, token
          print('OPP_PRESSURE_STRAT_VALIDATE=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Resolve JST end date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone,timedelta
          target=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'OPP_PRESSURE_STRAT_END={target}\n')
          print(f'OPP_PRESSURE_STRAT_TARGET={target}')
          PY
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run stratified Forward audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/opponent_pressure_forward_stratified.py > opponent-pressure-stratified.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized results
        if: always()
        run: grep '^OPP_PRESSURE_STRAT_' opponent-pressure-stratified.txt 2>/dev/null || true
      - name: Reply to bridge command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Opponent pressure stratified Forward report'
            echo
            echo '```text'
            grep '^OPP_PRESSURE_STRAT_' opponent-pressure-stratified.txt 2>/dev/null || echo 'OPP_PRESSURE_STRAT_DIAGNOSTIC=no_output'
            echo '```'
            echo
            echo 'Read-only fixed-strata Forward stability audit. No threshold search, DB write, Production/LINE, Railway setting, coefficient, or promotion change.'
          } > opponent-pressure-stratified-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file opponent-pressure-stratified-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json opponent-pressure-stratified.txt opponent-pressure-stratified-comment.md
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
