name: Railway 5GB candidate index layout diagnostic

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v3"

jobs:
  diagnose:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-candidate-index-layout-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli

      - name: Inspect candidate index layout read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          cat > diagnostic.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          \pset fieldsep '|'
          SET default_transaction_read_only = on;

          SELECT 'DB_BYTES|' || pg_database_size(current_database());
          SELECT 'WAL_BYTES|' || COALESCE(sum(size),0) FROM pg_ls_waldir();

          SELECT
            'IDX|' ||
            idx.relname || '|' ||
            tbl.relname || '|' ||
            pg_relation_size(idx.oid) || '|' ||
            COALESCE(con.conname,'') || '|' ||
            COALESCE(con.contype::text,'') || '|' ||
            pg_get_indexdef(idx.oid)
          FROM pg_class idx
          JOIN pg_index pi ON pi.indexrelid = idx.oid
          JOIN pg_class tbl ON tbl.oid = pi.indrelid
          JOIN pg_namespace n ON n.oid = tbl.relnamespace
          LEFT JOIN pg_constraint con ON con.conindid = idx.oid
          WHERE n.nspname = 'public'
            AND idx.relkind = 'i'
          ORDER BY pg_relation_size(idx.oid) DESC, idx.relname
          LIMIT 20;

          SELECT
            'ODDS_IDX|' ||
            idx.relname || '|' ||
            pg_relation_size(idx.oid) || '|' ||
            COALESCE(con.conname,'') || '|' ||
            COALESCE(con.contype::text,'') || '|' ||
            pg_get_indexdef(idx.oid)
          FROM pg_class idx
          JOIN pg_index pi ON pi.indexrelid = idx.oid
          JOIN pg_class tbl ON tbl.oid = pi.indrelid
          JOIN pg_namespace n ON n.oid = tbl.relnamespace
          LEFT JOIN pg_constraint con ON con.conindid = idx.oid
          WHERE n.nspname = 'public'
            AND tbl.relname = 'v2_odds_trifecta'
            AND idx.relkind = 'i'
          ORDER BY pg_relation_size(idx.oid) DESC, idx.relname;
          SQL

          railway connect "$TARGET_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < diagnostic.sql > diagnostic.out

          grep -E '^(DB_BYTES|WAL_BYTES|IDX|ODDS_IDX)\|' diagnostic.out > diagnostic.sanitized
          test -s diagnostic.sanitized

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## 5GB candidate index layout diagnostic'
            echo
            if [ -s diagnostic.sanitized ]; then
              echo 'Read-only candidate metadata query completed.'
              echo
              echo '```text'
              cat diagnostic.sanitized
              echo '```'
            else
              echo 'Diagnostic did not produce a sanitized result.'
            fi
            echo
            echo 'Candidate-v3 only. No index/table/row/config/volume/plan/cutover mutation was requested.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md

  current-parity:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-fullhistory-v3-current-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
      SOURCE_SERVICE: "postgres-recovery"

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.4"
          npm install --global @railway/cli

      - name: Write consistent read-only capture helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/current-parity-capture.py <<'PY'
          import os
          import runpy
          import sys
          from pathlib import Path

          import psycopg

          root = Path(sys.argv[1])
          root.mkdir(parents=True, exist_ok=True)
          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          capture = contract["capture"]

          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          conn = psycopg.connect(url, autocommit=True)
          try:
              conn.execute("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY")
              metadata_counts, db_bytes, evidence_sha = capture(conn, root)
              conn.execute("ROLLBACK")
          finally:
              conn.close()

          print("CAPTURE_EVIDENCE_SHA256=" + evidence_sha)
          print("CAPTURE_DB_BYTES=" + str(db_bytes))
          for key in sorted(metadata_counts):
              print("CAPTURE_COUNT_" + key.upper().replace("-", "_") + "=" + str(metadata_counts[key]))
          PY

      - name: Capture source before read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$SOURCE_SERVICE" \
            python3 /tmp/current-parity-capture.py source-before > source-before.capture
          grep '^CAPTURE_' source-before.capture > source-before.capture.sanitized
          test -s source-before/candidate-table-counts.tsv

      - name: Capture candidate v3 read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$TARGET_SERVICE" \
            python3 /tmp/current-parity-capture.py candidate > candidate.capture
          grep '^CAPTURE_' candidate.capture > candidate.capture.sanitized
          test -s candidate/candidate-table-counts.tsv

      - name: Capture source after read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service "$SOURCE_SERVICE" \
            python3 /tmp/current-parity-capture.py source-after > source-after.capture
          grep '^CAPTURE_' source-after.capture > source-after.capture.sanitized
          test -s source-after/candidate-table-counts.tsv

      - name: Compare exact current parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > current-parity.sanitized
          import hashlib
          import runpy
          from pathlib import Path

          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          kinds = contract["KINDS"]
          limit_bytes = int(contract["LIMIT_BYTES"])

          def rows(root, kind):
              return (Path(root) / f"candidate-{kind}.tsv").read_text(encoding="utf-8").splitlines()

          def digest(root):
              h = hashlib.sha256()
              for kind in kinds:
                  h.update((Path(root) / f"candidate-{kind}.tsv").read_bytes())
              return h.hexdigest()

          def cap(path, key):
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if line.startswith(key + "="):
                      return line.split("=", 1)[1]
              raise RuntimeError(f"missing {key}")

          before_sha = digest("source-before")
          cand_sha = digest("candidate")
          after_sha = digest("source-after")
          cand_bytes = int(cap("candidate.capture.sanitized", "CAPTURE_DB_BYTES"))
          before_bytes = int(cap("source-before.capture.sanitized", "CAPTURE_DB_BYTES"))
          after_bytes = int(cap("source-after.capture.sanitized", "CAPTURE_DB_BYTES"))
          headroom = limit_bytes - cand_bytes

          source_stable = before_sha == after_sha
          match_before = cand_sha == before_sha
          match_after = cand_sha == after_sha

          print(f"SOURCE_BEFORE_EVIDENCE_SHA256={before_sha}")
          print(f"CANDIDATE_EVIDENCE_SHA256={cand_sha}")
          print(f"SOURCE_AFTER_EVIDENCE_SHA256={after_sha}")
          print("SOURCE_STABLE_DURING_AUDIT=" + ("true" if source_stable else "false"))
          print("CANDIDATE_MATCHES_SOURCE_BEFORE=" + ("true" if match_before else "false"))
          print("CANDIDATE_MATCHES_SOURCE_AFTER=" + ("true" if match_after else "false"))
          print(f"SOURCE_BEFORE_DB_BYTES={before_bytes}")
          print(f"SOURCE_AFTER_DB_BYTES={after_bytes}")
          print(f"CANDIDATE_DB_BYTES={cand_bytes}")
          print(f"CANDIDATE_HEADROOM_BYTES={headroom}")
          print("UNDER_5GB=" + ("true" if cand_bytes < limit_bytes else "false"))

          mismatch_kinds = []
          for kind in kinds:
              before = rows("source-before", kind)
              cand = rows("candidate", kind)
              after = rows("source-after", kind)
              if before != cand or after != cand or before != after:
                  mismatch_kinds.append(kind)
                  bset, cset, aset = set(before), set(cand), set(after)
                  print(
                      f"MISMATCH_KIND={kind}|"
                      f"SOURCE_BEFORE_ROWS={len(before)}|CANDIDATE_ROWS={len(cand)}|SOURCE_AFTER_ROWS={len(after)}|"
                      f"BEFORE_ONLY_VS_CAND={len(bset-cset)}|CAND_ONLY_VS_BEFORE={len(cset-bset)}|"
                      f"AFTER_ONLY_VS_CAND={len(aset-cset)}|CAND_ONLY_VS_AFTER={len(cset-aset)}"
                  )
                  if kind == "table-counts":
                      by_name = {}
                      for label, dataset in (("SOURCE_BEFORE", before), ("CANDIDATE", cand), ("SOURCE_AFTER", after)):
                          for row in dataset:
                              parts = row.split("\t")
                              if len(parts) >= 2:
                                  by_name.setdefault(parts[0], {})[label] = parts[1]
                      for name in sorted(by_name):
                          vals = by_name[name]
                          if len(vals) != 3 or len(set(vals.values())) > 1:
                              print(
                                  "TABLE_COUNT_DIFF|" + name
                                  + "|SOURCE_BEFORE=" + vals.get("SOURCE_BEFORE", "MISSING")
                                  + "|CANDIDATE=" + vals.get("CANDIDATE", "MISSING")
                                  + "|SOURCE_AFTER=" + vals.get("SOURCE_AFTER", "MISSING")
                              )
                  else:
                      for row in sorted(bset - cset)[:3]:
                          print("SOURCE_BEFORE_ONLY|" + kind + "|" + row)
                      for row in sorted(cset - bset)[:3]:
                          print("CANDIDATE_ONLY|" + kind + "|" + row)

          print("MISMATCH_KINDS=" + (",".join(mismatch_kinds) if mismatch_kinds else "NONE"))
          ok = source_stable and match_before and match_after and not mismatch_kinds and cand_bytes < limit_bytes
          print("CURRENT_EXACT_PARITY=" + ("PASS" if ok else "FAIL"))
          print("SOURCE_WRITE=0")
          print("CANDIDATE_WRITE=0")
          print("CUTOVER=0")
          print("DELETE=0")
          print("RESIZE=0")
          print("PLAN_CHANGE=0")
          print("PURCHASE_ACTION=false")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Post sanitized current parity result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## 5GB full-history candidate v3 current exact parity'
            echo
            if [ -s current-parity.sanitized ]; then
              if grep -qx 'CURRENT_EXACT_PARITY=PASS' current-parity.sanitized; then
                echo 'PASS: candidate-v3 exactly matches a stable current postgres-recovery reference.'
              else
                echo 'FAIL: current exact parity was not established.'
              fi
              echo
              echo '~~~text'
              cat current-parity.sanitized
              echo '~~~'
            else
              echo 'FAIL: read-only parity audit did not produce sanitized comparison output.'
            fi
            echo
            echo 'Read-only verification only. No source/candidate mutation, cutover, delete, resize, plan change, or purchase action was requested.'
          } > current-parity-summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file current-parity-summary.md

  delta-key-layout:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-fullhistory-v3-delta-key-layout'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SOURCE_SERVICE: "postgres-recovery"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli

      - name: Inspect delta-table keys read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          cat > delta-key-layout.sql <<'SQL'
          \pset tuples_only on
          \pset format unaligned
          \pset fieldsep '|'
          SET default_transaction_read_only = on;
          SET statement_timeout = '120s';

          SELECT
            'CONSTRAINT|' ||
            cls.relname || '|' ||
            con.conname || '|' ||
            con.contype::text || '|' ||
            pg_get_constraintdef(con.oid, true)
          FROM pg_constraint con
          JOIN pg_class cls ON cls.oid = con.conrelid
          JOIN pg_namespace n ON n.oid = cls.relnamespace
          WHERE n.nspname = 'public'
            AND cls.relname IN (
              'v2_candidate_filter_shadow',
              'v2_exhibition_shadow_decisions',
              'v2_odds_trifecta',
              'v2_realtime_entry_snapshots',
              'v2_realtime_exhibition_snapshots',
              'v2_realtime_odds_snapshots',
              'v2_realtime_race_condition_snapshots',
              'v2_realtime_racer_condition_snapshots',
              'v2_realtime_weather_snapshots',
              'v2_v24_motor2_forward_shadow'
            )
            AND con.contype IN ('p','u')
          ORDER BY cls.relname, con.contype, con.conname;

          SELECT
            'UNIQUE_INDEX|' ||
            tbl.relname || '|' ||
            idx.relname || '|' ||
            pg_get_indexdef(idx.oid)
          FROM pg_index pi
          JOIN pg_class idx ON idx.oid = pi.indexrelid
          JOIN pg_class tbl ON tbl.oid = pi.indrelid
          JOIN pg_namespace n ON n.oid = tbl.relnamespace
          WHERE n.nspname = 'public'
            AND tbl.relname IN (
              'v2_candidate_filter_shadow',
              'v2_exhibition_shadow_decisions',
              'v2_odds_trifecta',
              'v2_realtime_entry_snapshots',
              'v2_realtime_exhibition_snapshots',
              'v2_realtime_odds_snapshots',
              'v2_realtime_race_condition_snapshots',
              'v2_realtime_racer_condition_snapshots',
              'v2_realtime_weather_snapshots',
              'v2_v24_motor2_forward_shadow'
            )
            AND pi.indisunique
          ORDER BY tbl.relname, idx.relname;

          SELECT
            'TEMPORAL_COLUMN|' ||
            table_name || '|' ||
            ordinal_position || '|' ||
            column_name || '|' ||
            data_type
          FROM information_schema.columns
          WHERE table_schema = 'public'
            AND table_name IN (
              'v2_candidate_filter_shadow',
              'v2_exhibition_shadow_decisions',
              'v2_odds_trifecta',
              'v2_realtime_entry_snapshots',
              'v2_realtime_exhibition_snapshots',
              'v2_realtime_odds_snapshots',
              'v2_realtime_race_condition_snapshots',
              'v2_realtime_racer_condition_snapshots',
              'v2_realtime_weather_snapshots',
              'v2_v24_motor2_forward_shadow'
            )
            AND data_type IN ('date','timestamp without time zone','timestamp with time zone')
          ORDER BY table_name, ordinal_position;
          SQL

          railway connect "$SOURCE_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < delta-key-layout.sql > delta-key-layout.out

          grep -E '^(CONSTRAINT|UNIQUE_INDEX|TEMPORAL_COLUMN)\|' delta-key-layout.out > delta-key-layout.sanitized
          test -s delta-key-layout.sanitized

      - name: Post sanitized key layout
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Full-history v3 delta key layout'
            echo
            if [ -s delta-key-layout.sanitized ]; then
              echo 'Read-only source catalog query completed.'
              echo
              echo '~~~text'
              cat delta-key-layout.sanitized
              echo '~~~'
            else
              echo 'Diagnostic did not produce sanitized output.'
            fi
            echo
            echo 'SOURCE_WRITE=0 / CANDIDATE_WRITE=0 / CUTOVER=0 / DELETE=0 / RESIZE=0 / PLAN_CHANGE=0.'
          } > delta-key-layout-summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file delta-key-layout-summary.md

  delta-date-diagnostic:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-fullhistory-v3-delta-date-diagnostic'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SOURCE_SERVICE: "postgres-recovery"
      PARITY_DATE: "2026-10-01"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli

      - name: Build read-only date-count SQL
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          tables = [
              "v2_candidate_filter_shadow",
              "v2_exhibition_shadow_decisions",
              "v2_odds_trifecta",
              "v2_realtime_entry_snapshots",
              "v2_realtime_exhibition_snapshots",
              "v2_realtime_odds_snapshots",
              "v2_realtime_race_condition_snapshots",
              "v2_realtime_racer_condition_snapshots",
              "v2_realtime_weather_snapshots",
              "v2_v24_motor2_forward_shadow",
          ]
          date = "2026-10-01"
          lines = [
              r"\pset tuples_only on",
              r"\pset format unaligned",
              "SET default_transaction_read_only = on;",
              "SET statement_timeout = '120s';",
          ]
          for table in tables:
              lines.append(
                  "SELECT 'DATECOUNT|" + table + "|' || "
                  "count(*) FILTER (WHERE race_date < DATE '" + date + "') || '|' || "
                  "count(*) FILTER (WHERE race_date = DATE '" + date + "') || '|' || "
                  "count(*) FILTER (WHERE race_date > DATE '" + date + "') || '|' || "
                  "COALESCE(max(race_date)::text,'') "
                  "FROM public." + table + ";"
              )
          Path("delta-date.sql").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY

      - name: Capture source date counts read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway connect "$SOURCE_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < delta-date.sql > source-date.out
          grep '^DATECOUNT|' source-date.out > source-date.sanitized
          test "$(wc -l < source-date.sanitized)" -eq 10

      - name: Capture candidate date counts read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway connect "$TARGET_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < delta-date.sql > candidate-date.out
          grep '^DATECOUNT|' candidate-date.out > candidate-date.sanitized
          test "$(wc -l < candidate-date.sanitized)" -eq 10

      - name: Compare date buckets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > delta-date-result.sanitized
          from pathlib import Path

          def load(path):
              out = {}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  parts = line.split("|")
                  if len(parts) != 6 or parts[0] != "DATECOUNT":
                      continue
                  out[parts[1]] = {
                      "past": int(parts[2]),
                      "today": int(parts[3]),
                      "future": int(parts[4]),
                      "max_date": parts[5],
                  }
              return out

          src = load("source-date.sanitized")
          cand = load("candidate-date.sanitized")
          names = sorted(src)

          past_equal = True
          future_equal = True
          today_nonnegative = True
          today_delta_sum = 0

          for name in names:
              s = src[name]
              c = cand[name]
              if s["past"] != c["past"]:
                  past_equal = False
              if s["future"] != c["future"]:
                  future_equal = False
              delta = s["today"] - c["today"]
              if delta < 0:
                  today_nonnegative = False
              today_delta_sum += delta
              print(
                  "DATE_DIFF|" + name
                  + "|PAST_SOURCE=" + str(s["past"])
                  + "|PAST_CANDIDATE=" + str(c["past"])
                  + "|TODAY_SOURCE=" + str(s["today"])
                  + "|TODAY_CANDIDATE=" + str(c["today"])
                  + "|TODAY_DELTA=" + str(delta)
                  + "|FUTURE_SOURCE=" + str(s["future"])
                  + "|FUTURE_CANDIDATE=" + str(c["future"])
                  + "|SOURCE_MAX_DATE=" + s["max_date"]
                  + "|CANDIDATE_MAX_DATE=" + c["max_date"]
              )

          print("PAST_EQUAL_ALL=" + ("true" if past_equal else "false"))
          print("FUTURE_EQUAL_ALL=" + ("true" if future_equal else "false"))
          print("TODAY_SOURCE_NOT_BEHIND_ALL=" + ("true" if today_nonnegative else "false"))
          print("TODAY_DELTA_SUM=" + str(today_delta_sum))
          safe = past_equal and future_equal and today_nonnegative
          print("DELTA_IS_DATE_LOCALIZED=" + ("true" if safe else "false"))
          print("SOURCE_WRITE=0")
          print("CANDIDATE_WRITE=0")
          print("DELETE=0")
          print("CUTOVER=0")
          PY

      - name: Post sanitized date diagnostic
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Full-history v3 date-localized delta diagnostic'
            echo
            if [ -s delta-date-result.sanitized ]; then
              echo 'Read-only source/candidate date-bucket comparison completed.'
              echo
              echo '~~~text'
              cat delta-date-result.sanitized
              echo '~~~'
            else
              echo 'Diagnostic did not produce sanitized comparison output.'
            fi
            echo
            echo 'No source/candidate mutation, delete, cutover, resize, or plan change was requested.'
          } > delta-date-summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file delta-date-summary.md

