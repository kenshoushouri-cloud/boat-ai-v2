name: Historical point-in-time inventory

on:
  pull_request:
    paths:
      - "research/historical_point_in_time_inventory_pg.py"
      - "tests/test_historical_point_in_time_inventory_pg.py"
      - ".github/workflows/historical-point-in-time-inventory.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  safety:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pytest
      - run: pytest -q tests/test_historical_point_in_time_inventory_pg.py

  live-read-only-inventory:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
      RAILWAY_ENVIRONMENT: "production"
      RAILWAY_DB_SERVICE: "postgres-recovery"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Run read-only inventory
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; exec python -u research/historical_point_in_time_inventory_pg.py --start-date 2025-07-01 --end-date 2026-09-29' \
            2>&1 | tee historical-point-in-time-inventory.json
      - name: Assert inventory contract
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          lines=[x.strip() for x in Path("historical-point-in-time-inventory.json").read_text(encoding="utf-8").splitlines() if x.strip()]
          p=json.loads(lines[-1])
          assert p["contract"]=="HISTORICAL_POINT_IN_TIME_INVENTORY_V1"
          assert p["ground_truth_rule"]=="strictly_available_before_target_race_deadline"
          assert p["target_race_outcome_as_feature_allowed"] is False
          assert p["current_value_substitution_allowed"] is False
          assert p["database_write"] is False
          assert p["odds_read"] is False
          assert p["production_change"] is False
          assert p["purchase_action"] is False
          print(json.dumps(p, ensure_ascii=False, sort_keys=True))
          PY
