name: Official B-file parity probe

on:
  pull_request:
    paths:
      - "research/official_bfile_parity_probe.py"
      - ".github/workflows/official-bfile-parity-probe.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-recovery"

jobs:
  probe:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: python -m pip install 'boatrace-lzh==0.1.0'
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: npm install --global @railway/cli
      - name: Static safety
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/official_bfile_parity_probe.py").read_text(encoding="utf-8").lower()
          assert "set transaction read only" in p
          assert "performance" not in p
          assert "insert into" not in p
          assert "update v2_" not in p
          assert "delete from" not in p
          print("PASS B-file probe safety")
          PY
      - name: Run one-day official B-file parity probe
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/official_bfile_parity_probe.py --date 2025-07-01' \
            | tee official-bfile-parity-probe.txt
          grep -q '^OFFICIAL_BFILE_PARITY_RESULT=PASS_READ_ONLY$' official-bfile-parity-probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: official-bfile-parity-probe-${{ github.run_id }}
          path: |
            official-bfile-parity-probe.json
            official-bfile-parity-probe.txt
          retention-days: 30
          if-no-files-found: error
