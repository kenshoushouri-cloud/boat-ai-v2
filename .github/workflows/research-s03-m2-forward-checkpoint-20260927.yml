name: Research S03 M2 Frozen Checkpoint 20260927

on:
  pull_request:
    paths:
      - '.github/scripts/value_s03_m2_forward_frozen_pg.py'
      - '.github/workflows/research-s03-m2-forward-checkpoint-20260927.yml'
      - 'docs/S03_M2_FORWARD_CHECKPOINT_20260927.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      VALUE_S03_M2_FORWARD_END: '2026-09-27'
      VALUE_S03_M2_FORWARD_OUTPUT: 'value-s03-m2-forward-checkpoint-20260927.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify read-only frozen contract
        run: |
          set -euo pipefail
          grep -q 'CONTRACT = "S03_M2_POSITIVE_V1"' .github/scripts/value_s03_m2_forward_frozen_pg.py
          grep -q 'set transaction read only' .github/scripts/value_s03_m2_forward_frozen_pg.py
          grep -q 'VALUE_S03_M2_FORWARD_PROMOTION_ALLOWED=0' .github/scripts/value_s03_m2_forward_frozen_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-s03-m2-forward-checkpoint-20260927.yml').read_text(encoding='utf-8').lower()
          forbidden=(
              ''.join(('railway',' variable',' list')),
              ''.join(('print','env')),
              ''.join(('env',' |')),
          )
          for x in forbidden:
              assert x not in w, x
          assert 'railway run' in w
          PY
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Run frozen S03 M2 read-only checkpoint
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u .github/scripts/value_s03_m2_forward_frozen_pg.py' \
            2>&1 | tee value-s03-m2-forward-checkpoint-20260927.txt
          grep -q '^VALUE_S03_M2_FORWARD_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0$' value-s03-m2-forward-checkpoint-20260927.txt
          grep -q '^VALUE_S03_M2_FORWARD_PROMOTION_ALLOWED=0$' value-s03-m2-forward-checkpoint-20260927.txt
          grep -q '^VALUE_S03_M2_FORWARD_RESULT=PASS_READ_ONLY$' value-s03-m2-forward-checkpoint-20260927.txt
      - name: Upload immutable checkpoint evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s03-m2-forward-checkpoint-20260927-${{ github.run_id }}
          path: |
            value-s03-m2-forward-checkpoint-20260927.json
            value-s03-m2-forward-checkpoint-20260927.txt
          retention-days: 90
          if-no-files-found: error
