name: Railway V5 B14C motor prior top3 readonly

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "581"
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  motor-prior-top3:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway v5-zero-b14c-motor-prior-top3-run'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Run motor prior top3 against candidate-v4 read only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=120000"; export PYTHONPATH=.; export END_DATE=2026-10-05; python -u research/v5_zero_base_b14c_motor_prior_top3_official_pg.py' \
            | tee out.txt
          grep '^V5_B14C_MOTOR_PRIOR_TOP3_RESULT=' out.txt > result.txt
          test -s result.txt
      - name: Post result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## V5 B14C motor prior top3 — read only'
            echo
            if [ -s result.txt ]; then
              echo '```text'
              cat result.txt
              echo '```'
            else
              echo 'FAILED: no V5_B14C_MOTOR_PRIOR_TOP3_RESULT produced.'
            fi
            echo
            echo 'Official-generation-start verified 5-venue subset only; prior-day actual motor top3 history with Laplace smoothing. No race-card motor rate, DB writes, Production model, LINE, purchase, stake, plan, or volume changes.'
          } > summary.md
          jq -Rs '{body:.}' summary.md > summary.json
          gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$RAILWAY_BRIDGE_ISSUE/comments" --input summary.json > /dev/null
