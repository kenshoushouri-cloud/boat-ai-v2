name: Storage Retention Contract

on:
  pull_request:
    paths:
      - 'research/storage_retention_contract.py'
      - 'research/learning_odds_only_contract.py'
      - 'tests/test_storage_retention_contract.py'
      - 'tests/test_learning_all_redundancy_contract.py'
      - 'tests/test_learning_odds_only_contract.py'
      - 'run_final_pg.py'
      - 'v25_final_realtime_pipeline_pg.py'
      - 'v22_realtime_decision_engine_pg.py'
      - 'run_v22_targeted_pg.py'
      - 'v22_exhibition_shadow_pg.py'
      - 'v23_line_notifier_batch_pg.py'
      - 'run_nightly_results_pg.py'
      - 'run_learning_all_realtime_pg.py'
      - '.github/scripts/storage_retention_readonly_inventory.py'
      - 'docs/STORAGE_RETENTION_RESEARCH_20260912.md'
      - 'docs/LEARNING_ALL_REDUNDANCY_REVIEW_20260912.md'
      - 'docs/LEARNING_ODDS_ONLY_DESIGN_20260912.md'
      - '.github/workflows/storage-retention-contract.yml'

permissions:
  contents: read

jobs:
  pure-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate isolation and run tests
        run: |
          python -m py_compile research/storage_retention_contract.py research/learning_odds_only_contract.py .github/scripts/storage_retention_readonly_inventory.py tests/test_learning_all_redundancy_contract.py tests/test_learning_odds_only_contract.py
          python - <<'PY'
          import ast
          from pathlib import Path

          pure = Path('research/storage_retention_contract.py').read_text(encoding='utf-8').lower()
          for token in ('psycopg', 'database_url', 'insert into', 'update ', 'delete from', 'alter table', 'drop table', 'send_line'):
              assert token not in pure, token

          odds_path = Path('research/learning_odds_only_contract.py')
          odds_source = odds_path.read_text(encoding='utf-8')
          tree = ast.parse(odds_source, filename=str(odds_path))
          forbidden_roots = {'db_pg', 'requests', 'psycopg', 'subprocess'}
          imported = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imported.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imported.add(node.module.split('.')[0])
          assert not (imported & forbidden_roots), imported & forbidden_roots
          lowered = odds_source.lower()
          for token in ('database_url', 'line_channel_access_token', 'send_line'):
              assert token not in lowered, token

          audit = Path('.github/scripts/storage_retention_readonly_inventory.py').read_text(encoding='utf-8').lower()
          assert 'from db_pg import fetch_all' in audit
          for token in ('execute(', 'upsert', 'insert into', 'update ', 'delete from', 'alter table', 'drop table', 'create table', 'send_line'):
              assert token not in audit, token
          print('STORAGE_RETENTION_ISOLATION=PASS')
          print('LEARNING_ODDS_ONLY_DESIGN_ISOLATION=PASS')
          PY
          pytest -q tests/test_storage_retention_contract.py tests/test_learning_all_redundancy_contract.py tests/test_learning_odds_only_contract.py
