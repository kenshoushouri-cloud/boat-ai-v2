name: Railway Postgres restored parity expansion

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_BRIDGE_ISSUE: "42"
  KEY_SERVICE: "archive-restore-key-20261001"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate"
  ARCHIVE_PREFIX: "boat-ai-pre-hobby-restorable-20261001-v3-parity"

concurrency:
  group: railway-postgres-restored-parity-expansion
  cancel-in-progress: false

jobs:
  parity:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway postgres-restored-parity-expand CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: paritytest
          POSTGRES_DB: parity_restore
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d parity_restore"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.4"
          railway variable set --help >/dev/null
          railway run --help >/dev/null

      - name: Create run-scoped archive key escrow
        id: key
        shell: bash
        run: |
          set -euo pipefail
          umask 077

          key_var="ARCHIVE_CMS_PRIVATE_KEY_B64_PARITY_${GITHUB_RUN_ID}"

          openssl req -x509 -newkey rsa:4096 -sha256 -days 3650 -nodes             -keyout archive-private-v3.pem             -out archive-public-v3.pem             -subj "/CN=boat-ai-hobby-parity-${GITHUB_RUN_ID}"

          test -s archive-private-v3.pem
          test -s archive-public-v3.pem

          private_b64="$(base64 -w0 archive-private-v3.pem)"
          test -n "$private_b64"

          railway variable set "$key_var=$private_b64"             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service "$KEY_SERVICE"             >/tmp/key-set.out 2>/tmp/key-set.err

          unset private_b64
          rm -f /tmp/key-set.out /tmp/key-set.err archive-private-v3.pem
          test ! -e archive-private-v3.pem

          cert_sha="$(sha256sum archive-public-v3.pem | awk '{print $1}')"
          echo "key_var=$key_var" >> "$GITHUB_OUTPUT"
          echo "cert_sha=$cert_sha" >> "$GITHUB_OUTPUT"

      - name: Build consistent-snapshot evidence collector
        shell: bash
        run: |
          set -euo pipefail
          cat > parity_capture.py <<'PY'
          import csv
          import os
          import subprocess
          import sys

          import psycopg
          from psycopg import sql

          QUERIES = {
              "tables": """
                  SELECT c.relname,
                         c.relkind::text,
                         c.relpersistence::text,
                         c.relreplident::text,
                         c.relrowsecurity::text,
                         c.relforcerowsecurity::text
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relkind IN ('r','p')
                  ORDER BY c.relname
              """,
              "columns": """
                  SELECT table_name,
                         ordinal_position::text,
                         column_name,
                         data_type,
                         udt_schema,
                         udt_name,
                         is_nullable,
                         COALESCE(column_default, ''),
                         COALESCE(character_maximum_length::text, ''),
                         COALESCE(numeric_precision::text, ''),
                         COALESCE(numeric_scale::text, ''),
                         COALESCE(collation_schema, ''),
                         COALESCE(collation_name, ''),
                         is_identity,
                         COALESCE(identity_generation, ''),
                         is_generated,
                         COALESCE(generation_expression, '')
                  FROM information_schema.columns
                  WHERE table_schema = 'public'
                  ORDER BY table_name, ordinal_position
              """,
              "constraints": """
                  SELECT c.conrelid::regclass::text,
                         c.conname,
                         c.contype::text,
                         pg_get_constraintdef(c.oid, true)
                  FROM pg_constraint c
                  JOIN pg_namespace n ON n.oid = c.connamespace
                  WHERE n.nspname = 'public'
                    AND c.conrelid <> 0
                  ORDER BY c.conrelid::regclass::text, c.conname
              """,
              "indexes": """
                  SELECT tablename, indexname, indexdef
                  FROM pg_indexes
                  WHERE schemaname = 'public'
                  ORDER BY tablename, indexname
              """,
              "sequences": """
                  SELECT sequencename,
                         data_type,
                         start_value::text,
                         min_value::text,
                         max_value::text,
                         increment_by::text,
                         cycle::text,
                         cache_size::text
                  FROM pg_sequences
                  WHERE schemaname = 'public'
                  ORDER BY sequencename
              """,
              "views": """
                  SELECT c.relname,
                         c.relkind::text,
                         pg_get_viewdef(c.oid, true)
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relkind IN ('v','m')
                  ORDER BY c.relname
              """,
              "triggers": """
                  SELECT c.relname,
                         t.tgname,
                         pg_get_triggerdef(t.oid, true)
                  FROM pg_trigger t
                  JOIN pg_class c ON c.oid = t.tgrelid
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND NOT t.tgisinternal
                  ORDER BY c.relname, t.tgname
              """,
              "policies": """
                  SELECT tablename,
                         policyname,
                         permissive,
                         roles::text,
                         cmd,
                         COALESCE(qual, ''),
                         COALESCE(with_check, '')
                  FROM pg_policies
                  WHERE schemaname = 'public'
                  ORDER BY tablename, policyname
              """,
              "extensions": """
                  SELECT extname, extversion
                  FROM pg_extension
                  ORDER BY extname
              """,
          }

          def write_tsv(path, rows):
              with open(path, "w", encoding="utf-8", newline="") as f:
                  writer = csv.writer(f, delimiter="\t", lineterminator="\n")
                  for row in rows:
                      writer.writerow(["" if value is None else str(value) for value in row])

          def capture(conn, prefix):
              tables = conn.execute("""
                  SELECT c.relname
                  FROM pg_class c
                  JOIN pg_namespace n ON n.oid = c.relnamespace
                  WHERE n.nspname = 'public'
                    AND c.relkind IN ('r','p')
                  ORDER BY c.relname
              """).fetchall()

              counts = []
              for (table_name,) in tables:
                  query = sql.SQL("SELECT count(*) FROM {}.{}").format(
                      sql.Identifier("public"),
                      sql.Identifier(table_name),
                  )
                  counts.append((table_name, conn.execute(query).fetchone()[0]))
              write_tsv(f"{prefix}-table-counts.tsv", counts)

              for name, query in QUERIES.items():
                  write_tsv(f"{prefix}-{name}.tsv", conn.execute(query).fetchall())

          mode = sys.argv[1]

          if mode == "source":
              url = os.environ["DATABASE_PUBLIC_URL"]

              keeper = psycopg.connect(url)
              keeper.autocommit = True
              keeper.execute("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY")
              snapshot = keeper.execute("SELECT pg_export_snapshot()").fetchone()[0]

              env = os.environ.copy()
              env["PG_SNAPSHOT"] = snapshot

              subprocess.run(
                  [
                      "docker", "run", "--rm",
                      "-e", "DATABASE_PUBLIC_URL",
                      "-e", "PG_SNAPSHOT",
                      "-e", "PGOPTIONS=-c default_transaction_read_only=on",
                      "-v", f"{os.getcwd()}:/work",
                      "postgres:18",
                      "bash", "-lc",
                      'pg_dump "$DATABASE_PUBLIC_URL" --format=custom --no-owner --no-acl --snapshot="$PG_SNAPSHOT" --file=/work/full-source.dump'
                  ],
                  env=env,
                  check=True,
              )

              evidence = psycopg.connect(url)
              evidence.autocommit = True
              evidence.execute("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY")
              evidence.execute(
                  sql.SQL("SET TRANSACTION SNAPSHOT {}").format(sql.Literal(snapshot))
              )
              capture(evidence, "source")
              evidence.execute("COMMIT")
              evidence.close()

              keeper.execute("ROLLBACK")
              keeper.close()

          elif mode == "restored":
              url = os.environ["LOCAL_DATABASE_URL"]
              conn = psycopg.connect(url)
              capture(conn, "restored")
              conn.close()

          elif mode == "candidate":
              url = os.environ["DATABASE_PUBLIC_URL"]
              conn = psycopg.connect(url)
              conn.execute("SET default_transaction_read_only = on")
              capture(conn, "candidate")
              db_bytes = conn.execute("SELECT pg_database_size(current_database())").fetchone()[0]
              with open("candidate-db-bytes.txt", "w", encoding="utf-8") as f:
                  f.write(str(db_bytes) + "\n")
              conn.close()

          else:
              raise SystemExit("unknown mode")
          PY

      - name: Capture Production dump and evidence from one read-only snapshot
        shell: bash
        run: |
          set -euo pipefail

          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service postgres-recovery             python3 parity_capture.py source

          test -s full-source.dump
          test -s source-table-counts.tsv
          test -s source-columns.tsv

      - name: Validate and encrypt snapshot archive
        id: archive
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm -v "$PWD:/work" postgres:18             pg_restore --list /work/full-source.dump > restore-list.txt

          test -s restore-list.txt

          archive_name="${ARCHIVE_PREFIX}-${GITHUB_RUN_ID}"
          dump_bytes="$(stat -c %s full-source.dump)"
          dump_sha="$(sha256sum full-source.dump | awk '{print $1}')"
          list_entries="$(grep -c '^[0-9]' restore-list.txt || true)"

          openssl cms -encrypt -binary -aes256             -in full-source.dump             -outform DER             -out "$archive_name.dump.cms"             archive-public-v3.pem

          test -s "$archive_name.dump.cms"

          encrypted_bytes="$(stat -c %s "$archive_name.dump.cms")"
          encrypted_sha="$(sha256sum "$archive_name.dump.cms" | awk '{print $1}')"

          echo "archive_name=$archive_name" >> "$GITHUB_OUTPUT"
          echo "dump_bytes=$dump_bytes" >> "$GITHUB_OUTPUT"
          echo "dump_sha=$dump_sha" >> "$GITHUB_OUTPUT"
          echo "list_entries=$list_entries" >> "$GITHUB_OUTPUT"
          echo "encrypted_bytes=$encrypted_bytes" >> "$GITHUB_OUTPUT"
          echo "encrypted_sha=$encrypted_sha" >> "$GITHUB_OUTPUT"

      - name: Decrypt only through run-scoped Railway key escrow
        id: decrypt
        shell: bash
        run: |
          set -euo pipefail

          cat > decrypt-v3.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          key_var="$1"
          archive_name="$2"
          : "${!key_var:?}"
          umask 077
          printf '%s' "${!key_var}" | base64 -d > escrow-private.pem
          openssl cms -decrypt -binary -inform DER             -in "$archive_name.dump.cms"             -recip archive-public-v3.pem             -inkey escrow-private.pem             -out restored.dump
          rm -f escrow-private.pem
          SH

          chmod 700 decrypt-v3.sh

          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service "$KEY_SERVICE"             bash ./decrypt-v3.sh               "${{ steps.key.outputs.key_var }}"               "${{ steps.archive.outputs.archive_name }}"

          test -s restored.dump

          restored_sha="$(sha256sum restored.dump | awk '{print $1}')"
          test "$restored_sha" = "${{ steps.archive.outputs.dump_sha }}"
          echo "restored_sha=$restored_sha" >> "$GITHUB_OUTPUT"

      - name: Restore into isolated PostgreSQL 18
        shell: bash
        run: |
          set -euo pipefail

          docker run --rm             --network host             -e PGPASSWORD=paritytest             -v "$PWD:/work"             postgres:18             pg_restore               --no-owner               --no-acl               --exit-on-error               --jobs=2               --dbname="postgresql://postgres:paritytest@127.0.0.1:5432/parity_restore"               /work/restored.dump

      - name: Capture restored evidence
        shell: bash
        env:
          LOCAL_DATABASE_URL: postgresql://postgres:paritytest@127.0.0.1:5432/parity_restore
        run: |
          set -euo pipefail
          python3 parity_capture.py restored
          test -s restored-table-counts.tsv
          test -s restored-columns.tsv

      - name: Require exact parity
        id: parity
        shell: bash
        run: |
          set -euo pipefail

          kinds=(
            table-counts
            tables
            columns
            constraints
            indexes
            sequences
            views
            triggers
            policies
            extensions
          )

          for kind in "${kinds[@]}"; do
            diff -u "source-$kind.tsv" "restored-$kind.tsv"
          done

          table_count="$(wc -l < source-table-counts.tsv | tr -d ' ')"
          column_count="$(wc -l < source-columns.tsv | tr -d ' ')"
          constraint_count="$(wc -l < source-constraints.tsv | tr -d ' ')"
          index_count="$(wc -l < source-indexes.tsv | tr -d ' ')"
          sequence_count="$(wc -l < source-sequences.tsv | tr -d ' ')"
          view_count="$(wc -l < source-views.tsv | tr -d ' ')"
          trigger_count="$(wc -l < source-triggers.tsv | tr -d ' ')"
          policy_count="$(wc -l < source-policies.tsv | tr -d ' ')"
          extension_count="$(wc -l < source-extensions.tsv | tr -d ' ')"

          source_evidence_sha="$(
            cat               source-table-counts.tsv               source-tables.tsv               source-columns.tsv               source-constraints.tsv               source-indexes.tsv               source-sequences.tsv               source-views.tsv               source-triggers.tsv               source-policies.tsv               source-extensions.tsv |
            sha256sum | awk '{print $1}'
          )"

          restored_evidence_sha="$(
            cat               restored-table-counts.tsv               restored-tables.tsv               restored-columns.tsv               restored-constraints.tsv               restored-indexes.tsv               restored-sequences.tsv               restored-views.tsv               restored-triggers.tsv               restored-policies.tsv               restored-extensions.tsv |
            sha256sum | awk '{print $1}'
          )"

          test "$source_evidence_sha" = "$restored_evidence_sha"

          restored_db_bytes="$(
            docker run --rm               --network host               -e PGPASSWORD=paritytest               postgres:18               psql "postgresql://postgres:paritytest@127.0.0.1:5432/parity_restore"                 -At -v ON_ERROR_STOP=1                 -c "SELECT pg_database_size(current_database());"
          )"

          echo "table_count=$table_count" >> "$GITHUB_OUTPUT"
          echo "column_count=$column_count" >> "$GITHUB_OUTPUT"
          echo "constraint_count=$constraint_count" >> "$GITHUB_OUTPUT"
          echo "index_count=$index_count" >> "$GITHUB_OUTPUT"
          echo "sequence_count=$sequence_count" >> "$GITHUB_OUTPUT"
          echo "view_count=$view_count" >> "$GITHUB_OUTPUT"
          echo "trigger_count=$trigger_count" >> "$GITHUB_OUTPUT"
          echo "policy_count=$policy_count" >> "$GITHUB_OUTPUT"
          echo "extension_count=$extension_count" >> "$GITHUB_OUTPUT"
          echo "source_evidence_sha=$source_evidence_sha" >> "$GITHUB_OUTPUT"
          echo "restored_evidence_sha=$restored_evidence_sha" >> "$GITHUB_OUTPUT"
          echo "restored_db_bytes=$restored_db_bytes" >> "$GITHUB_OUTPUT"

      - name: Restore exact-parity snapshot into isolated 5GB Hobby candidate
        shell: bash
        run: |
          set -euo pipefail

          cat > restore-candidate.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          : "${DATABASE_PUBLIC_URL:?}"
          export TARGET_DATABASE_URL="$DATABASE_PUBLIC_URL"

          docker run --rm \
            -e TARGET_DATABASE_URL \
            -v "$PWD:/work" \
            postgres:18 \
            bash -lc 'pg_restore --clean --if-exists --no-owner --no-acl --exit-on-error --jobs=2 --dbname="$TARGET_DATABASE_URL" /work/restored.dump'
          SH

          chmod 700 restore-candidate.sh

          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$TARGET_SERVICE" \
            bash ./restore-candidate.sh

      - name: Capture 5GB candidate evidence read-only
        shell: bash
        run: |
          set -euo pipefail

          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$TARGET_SERVICE" \
            python3 parity_capture.py candidate

          test -s candidate-table-counts.tsv
          test -s candidate-columns.tsv
          test -s candidate-db-bytes.txt

      - name: Require exact 5GB candidate parity
        id: candidate
        shell: bash
        run: |
          set -euo pipefail

          kinds=(
            table-counts
            tables
            columns
            constraints
            indexes
            sequences
            views
            triggers
            policies
            extensions
          )

          for kind in "${kinds[@]}"; do
            diff -u "source-$kind.tsv" "candidate-$kind.tsv"
          done

          candidate_evidence_sha="$(
            cat \
              candidate-table-counts.tsv \
              candidate-tables.tsv \
              candidate-columns.tsv \
              candidate-constraints.tsv \
              candidate-indexes.tsv \
              candidate-sequences.tsv \
              candidate-views.tsv \
              candidate-triggers.tsv \
              candidate-policies.tsv \
              candidate-extensions.tsv |
            sha256sum | awk '{print $1}'
          )"

          test "$candidate_evidence_sha" = "${{ steps.parity.outputs.source_evidence_sha }}"

          table_count="$(wc -l < candidate-table-counts.tsv | tr -d ' ')"
          column_count="$(wc -l < candidate-columns.tsv | tr -d ' ')"
          constraint_count="$(wc -l < candidate-constraints.tsv | tr -d ' ')"
          index_count="$(wc -l < candidate-indexes.tsv | tr -d ' ')"
          sequence_count="$(wc -l < candidate-sequences.tsv | tr -d ' ')"
          view_count="$(wc -l < candidate-views.tsv | tr -d ' ')"
          trigger_count="$(wc -l < candidate-triggers.tsv | tr -d ' ')"
          policy_count="$(wc -l < candidate-policies.tsv | tr -d ' ')"
          extension_count="$(wc -l < candidate-extensions.tsv | tr -d ' ')"

          test "$table_count" = "${{ steps.parity.outputs.table_count }}"
          test "$column_count" = "${{ steps.parity.outputs.column_count }}"
          test "$constraint_count" = "${{ steps.parity.outputs.constraint_count }}"
          test "$index_count" = "${{ steps.parity.outputs.index_count }}"
          test "$sequence_count" = "${{ steps.parity.outputs.sequence_count }}"
          test "$view_count" = "${{ steps.parity.outputs.view_count }}"
          test "$trigger_count" = "${{ steps.parity.outputs.trigger_count }}"
          test "$policy_count" = "${{ steps.parity.outputs.policy_count }}"
          test "$extension_count" = "${{ steps.parity.outputs.extension_count }}"

          candidate_db_bytes="$(tr -d '[:space:]' < candidate-db-bytes.txt)"
          test "$candidate_db_bytes" -lt 5000000000
          candidate_headroom_bytes="$((5000000000 - candidate_db_bytes))"

          echo "candidate_evidence_sha=$candidate_evidence_sha" >> "$GITHUB_OUTPUT"
          echo "candidate_db_bytes=$candidate_db_bytes" >> "$GITHUB_OUTPUT"
          echo "candidate_headroom_bytes=$candidate_headroom_bytes" >> "$GITHUB_OUTPUT"

      - name: Build non-secret parity manifest
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo "ARCHIVE_NAME=${{ steps.archive.outputs.archive_name }}"
            echo "KEY_VARIABLE_NAME=${{ steps.key.outputs.key_var }}"
            echo "PLAIN_DUMP_BYTES=${{ steps.archive.outputs.dump_bytes }}"
            echo "PLAIN_DUMP_SHA256=${{ steps.archive.outputs.dump_sha }}"
            echo "RESTORED_DUMP_SHA256=${{ steps.decrypt.outputs.restored_sha }}"
            echo "RESTORE_LIST_ENTRIES=${{ steps.archive.outputs.list_entries }}"
            echo "ENCRYPTED_BYTES=${{ steps.archive.outputs.encrypted_bytes }}"
            echo "ENCRYPTED_SHA256=${{ steps.archive.outputs.encrypted_sha }}"
            echo "CERT_SHA256=${{ steps.key.outputs.cert_sha }}"
            echo "RESTORED_DB_BYTES=${{ steps.parity.outputs.restored_db_bytes }}"
            echo "PUBLIC_TABLES=${{ steps.parity.outputs.table_count }}"
            echo "PUBLIC_COLUMNS=${{ steps.parity.outputs.column_count }}"
            echo "PUBLIC_CONSTRAINTS=${{ steps.parity.outputs.constraint_count }}"
            echo "PUBLIC_INDEXES=${{ steps.parity.outputs.index_count }}"
            echo "PUBLIC_SEQUENCES=${{ steps.parity.outputs.sequence_count }}"
            echo "PUBLIC_VIEWS=${{ steps.parity.outputs.view_count }}"
            echo "PUBLIC_TRIGGERS=${{ steps.parity.outputs.trigger_count }}"
            echo "PUBLIC_POLICIES=${{ steps.parity.outputs.policy_count }}"
            echo "EXTENSIONS=${{ steps.parity.outputs.extension_count }}"
            echo "SOURCE_EVIDENCE_SHA256=${{ steps.parity.outputs.source_evidence_sha }}"
            echo "RESTORED_EVIDENCE_SHA256=${{ steps.parity.outputs.restored_evidence_sha }}"
            echo "CANDIDATE_SERVICE=$TARGET_SERVICE"
            echo "CANDIDATE_EVIDENCE_SHA256=${{ steps.candidate.outputs.candidate_evidence_sha }}"
            echo "CANDIDATE_DB_BYTES=${{ steps.candidate.outputs.candidate_db_bytes }}"
            echo "CANDIDATE_HEADROOM_VS_5GB_BYTES=${{ steps.candidate.outputs.candidate_headroom_bytes }}"
            echo "CANDIDATE_VOLUME_LIMIT_BYTES=5000000000"
            echo "CANDIDATE_PARITY=PASS"
            echo "SOURCE_WRITE=0"
            echo "CONSISTENT_SOURCE_SNAPSHOT=1"
            echo "RESTORE_TARGET=GITHUB_ACTIONS_LOCAL_POSTGRES18_AND_RAILWAY_5GB_CANDIDATE"
            echo "CUTOVER=0"
            echo "PLAN_CHANGE=0"
            echo "PRIVATE_KEY_UPLOADED=0"
            echo "PLAINTEXT_DUMP_UPLOADED=0"
          } > parity-manifest-v3.txt

      - name: Upload restore-verified parity archive
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.archive.outputs.archive_name }}
          path: |
            ${{ steps.archive.outputs.archive_name }}.dump.cms
            archive-public-v3.pem
            parity-manifest-v3.txt
          retention-days: 90
          if-no-files-found: error

      - name: Build sanitized success summary
        if: success()
        shell: bash
        run: |
          set -euo pipefail

          {
            echo '## Restored parity expansion v3'
            echo
            echo '✅ PASS: exact parity verified against the same read-only Production snapshot used for the dump.'
            echo
            echo "Artifact: ${{ steps.archive.outputs.archive_name }}"
            echo "Key variable name: ${{ steps.key.outputs.key_var }}"
            echo "Plain dump bytes: ${{ steps.archive.outputs.dump_bytes }}"
            echo "Dump SHA-256: ${{ steps.archive.outputs.dump_sha }}"
            echo "Restored dump SHA-256: ${{ steps.decrypt.outputs.restored_sha }}"
            echo "Restore-list entries: ${{ steps.archive.outputs.list_entries }}"
            echo "Restored DB bytes: ${{ steps.parity.outputs.restored_db_bytes }}"
            echo "Public tables: ${{ steps.parity.outputs.table_count }}"
            echo "Columns: ${{ steps.parity.outputs.column_count }}"
            echo "Constraints: ${{ steps.parity.outputs.constraint_count }}"
            echo "Indexes: ${{ steps.parity.outputs.index_count }}"
            echo "Sequences: ${{ steps.parity.outputs.sequence_count }}"
            echo "Views: ${{ steps.parity.outputs.view_count }}"
            echo "Triggers: ${{ steps.parity.outputs.trigger_count }}"
            echo "Policies: ${{ steps.parity.outputs.policy_count }}"
            echo "Extensions: ${{ steps.parity.outputs.extension_count }}"
            echo "Evidence SHA-256 source/restored: ${{ steps.parity.outputs.source_evidence_sha }}"
            echo "5GB candidate service: $TARGET_SERVICE"
            echo "5GB candidate evidence SHA-256: ${{ steps.candidate.outputs.candidate_evidence_sha }}"
            echo "5GB candidate DB bytes: ${{ steps.candidate.outputs.candidate_db_bytes }}"
            echo "5GB candidate headroom bytes: ${{ steps.candidate.outputs.candidate_headroom_bytes }}"
            echo
            echo 'Exact equality passed for every public table row count plus table metadata, columns, constraints, indexes, sequences, views, triggers, policies, and extensions.'
            echo 'The same exact-parity snapshot was restored into the isolated 5GB Railway candidate and matched the source evidence fingerprint.'
            echo
            echo 'SOURCE_WRITE=0 / Production rows and schema unchanged / CUTOVER=0 / PLAN_CHANGE=0.'
            echo 'The decryption key is run-scoped, so later archive creation cannot overwrite this artifact key.'
            echo 'No plaintext dump or private key was uploaded.'
          } > parity-summary.md

      - name: Build sanitized failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Restored parity expansion v3'
            echo
            echo '❌ FAIL: exact restored parity was not established.'
            echo
            echo 'No Production delete, row/schema mutation, cutover, volume cleanup, or plan change was requested.'
            echo 'Do not proceed to historical deletion, cutover, volume cleanup, or Pro -> Hobby downgrade.'
          } > parity-summary.md

      - name: Cleanup plaintext and private material
        if: always()
        shell: bash
        run: |
          rm -f             archive-private-v3.pem             escrow-private.pem             full-source.dump             restored.dump             restore-list.txt             decrypt-v3.sh             restore-candidate.sh             parity_capture.py             source-*.tsv             restored-*.tsv             candidate-*.tsv             candidate-db-bytes.txt

      - name: Post sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file parity-summary.md
