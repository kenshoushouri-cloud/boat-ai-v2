name: Research Result-Day Readiness Audit

on:
  pull_request:
    paths:
      - 'research/result_day_terminal_readiness_pg.py'
      - 'tests/test_result_day_terminal_readiness.py'
      - 'docs/RESULT_DAY_TERMINAL_READINESS_20260927.md'
      - '.github/workflows/research-result-day-readiness-audit.yml'
      - '.github/workflows/research-forward-combined-checkpoint-manual.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt pytest
      - run: PYTHONPATH=. pytest -q tests/test_result_day_terminal_readiness.py
      - name: Verify read-only isolation
        run: |
          set -euo pipefail
          grep -q 'set transaction read only' research/result_day_terminal_readiness_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-result-day-readiness-audit.yml').read_text(encoding='utf-8').lower()
          assert ''.join(('railway',' variable',' list')) not in w
          PY
      - run: npm install --global @railway/cli
      - name: Verify known completed 2026-09-26 is terminal
        env:
          TARGET_DATE: '2026-09-26'
        run: |
          set -euo pipefail
          railway run --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u research/result_day_terminal_readiness_pg.py' \
            2>&1 | tee result-day-readiness.txt
          grep -q '^RESULT_DAY_READINESS_RESULT=READY$' result-day-readiness.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: result-day-readiness-${{ github.run_id }}
          path: result-day-readiness.txt
          retention-days: 90
          if-no-files-found: warn
