name: Railway candidate v4 final delta sync

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_BRIDGE_ISSUE: "42"
  SOURCE_SERVICE: "postgres-recovery"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  SYNC_DATE: "2026-10-01"

jobs:
  final-delta-sync:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-v4-final-delta-sync CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.4"
          npm install --global @railway/cli

      - name: Write atomic delta sync helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/final_delta_sync.py <<'PY'
          import csv
          import hashlib
          import json
          import os
          import sys
          from pathlib import Path

          import psycopg
          from psycopg import sql

          DATE = os.environ["SYNC_DATE"]
          LIMIT = 5_000_000_000
          ROOT = Path("delta-sync")
          ROOT.mkdir(exist_ok=True)

          TABLES = [
              "v2_candidate_filter_shadow",
              "v2_exhibition_shadow_decisions",
              "v2_line_notifications",
              "v2_odds_trifecta",
              "v2_realtime_decisions",
              "v2_realtime_entry_snapshots",
              "v2_realtime_exhibition_snapshots",
              "v2_realtime_odds_snapshots",
              "v2_realtime_race_condition_snapshots",
              "v2_realtime_racer_condition_snapshots",
              "v2_realtime_weather_snapshots",
              "v2_v24_motor2_forward_shadow",
          ]

          def db_url():
              value = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
              if not value:
                  raise RuntimeError("database_url_unavailable")
              return value

          def public_counts(conn):
              names = [r[0] for r in conn.execute("""
                  SELECT tablename FROM pg_tables
                  WHERE schemaname='public'
                  ORDER BY tablename
              """).fetchall()]
              out = {}
              for name in names:
                  q = sql.SQL("SELECT count(*) FROM public.{}").format(sql.Identifier(name))
                  out[name] = int(conn.execute(q).fetchone()[0])
              return out

          def columns(conn, table):
              return [r[0] for r in conn.execute("""
                  SELECT column_name
                  FROM information_schema.columns
                  WHERE table_schema='public' AND table_name=%s
                  ORDER BY ordinal_position
              """, (table,)).fetchall()]

          def sha256(path):
              h = hashlib.sha256()
              with open(path, "rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          def source_capture():
              conn = psycopg.connect(db_url(), autocommit=True)
              try:
                  conn.execute("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY")
                  counts = public_counts(conn)
                  if len(counts) != 39:
                      raise RuntimeError(f"unexpected_public_table_count_{len(counts)}")

                  manifest = {
                      "sync_date": DATE,
                      "all_counts": counts,
                      "tables": {},
                  }

                  for table in TABLES:
                      cols = columns(conn, table)
                      if not cols or "race_id" not in cols:
                          raise RuntimeError(f"invalid_table_contract_{table}")
                      path = ROOT / f"{table}.csv"
                      order = sql.SQL("x.id") if "id" in cols else sql.SQL("x.race_id")
                      query = sql.SQL("""
                          COPY (
                            SELECT x.*
                            FROM public.{table} x
                            JOIN public.v2_races r ON r.race_id=x.race_id
                            WHERE r.race_date=%s
                            ORDER BY {order}
                          ) TO STDOUT WITH (FORMAT CSV, NULL '\\N')
                      """).format(table=sql.Identifier(table), order=order)
                      with path.open("wb") as f:
                          with conn.cursor().copy(query, (DATE,)) as cp:
                              for data in cp:
                                  f.write(data)
                      row_count = int(conn.execute(
                          sql.SQL("""
                            SELECT count(*)
                            FROM public.{table} x
                            JOIN public.v2_races r ON r.race_id=x.race_id
                            WHERE r.race_date=%s
                          """).format(table=sql.Identifier(table)),
                          (DATE,),
                      ).fetchone()[0])
                      manifest["tables"][table] = {
                          "columns": cols,
                          "rows": row_count,
                          "sha256": sha256(path),
                          "bytes": path.stat().st_size,
                      }

                  (ROOT / "manifest.json").write_text(
                      json.dumps(manifest, sort_keys=True, separators=(",", ":")),
                      encoding="utf-8",
                  )
                  conn.execute("ROLLBACK")
                  print("SOURCE_CAPTURE=PASS")
                  print("SOURCE_PUBLIC_TABLES=39")
                  print("SOURCE_TARGET_ROWS=" + str(sum(v["rows"] for v in manifest["tables"].values())))
              finally:
                  conn.close()

          def apply_target():
              manifest = json.loads((ROOT / "manifest.json").read_text(encoding="utf-8"))
              if manifest["sync_date"] != DATE:
                  raise RuntimeError("manifest_date_mismatch")

              conn = psycopg.connect(db_url(), autocommit=False)
              try:
                  conn.execute("SET statement_timeout = '20min'")
                  conn.execute("SET lock_timeout = '30s'")

                  before = public_counts(conn)
                  if set(before) != set(manifest["all_counts"]):
                      raise RuntimeError("public_table_set_mismatch")

                  for name, expected in manifest["all_counts"].items():
                      if name not in TABLES and before[name] != expected:
                          raise RuntimeError(f"non_target_count_mismatch_{name}")

                  before_target = {t: before[t] for t in TABLES}

                  for table in TABLES:
                      meta = manifest["tables"][table]
                      cols = columns(conn, table)
                      if cols != meta["columns"]:
                          raise RuntimeError(f"column_contract_mismatch_{table}")
                      path = ROOT / f"{table}.csv"
                      if sha256(path) != meta["sha256"]:
                          raise RuntimeError(f"source_file_sha_mismatch_{table}")

                      delete_q = sql.SQL("""
                          DELETE FROM public.{table} x
                          USING public.v2_races r
                          WHERE r.race_id=x.race_id
                            AND r.race_date=%s
                      """).format(table=sql.Identifier(table))
                      conn.execute(delete_q, (DATE,))

                      copy_q = sql.SQL("COPY public.{table} ({cols}) FROM STDIN WITH (FORMAT CSV, NULL '\\N')").format(
                          table=sql.Identifier(table),
                          cols=sql.SQL(",").join(map(sql.Identifier, cols)),
                      )
                      with path.open("rb") as f:
                          with conn.cursor().copy(copy_q) as cp:
                              while True:
                                  chunk = f.read(1024 * 1024)
                                  if not chunk:
                                      break
                                  cp.write(chunk)

                      for col in cols:
                          seq = conn.execute(
                              "SELECT pg_get_serial_sequence(%s,%s)",
                              (f"public.{table}", col),
                          ).fetchone()[0]
                          if seq:
                              maxv = conn.execute(
                                  sql.SQL("SELECT max({}) FROM public.{}").format(
                                      sql.Identifier(col), sql.Identifier(table)
                                  )
                              ).fetchone()[0]
                              if maxv is not None:
                                  conn.execute("SELECT setval(%s::regclass,%s,true)", (seq, int(maxv)))

                  after = public_counts(conn)
                  mismatches = {
                      name: (manifest["all_counts"][name], after[name])
                      for name in manifest["all_counts"]
                      if after[name] != manifest["all_counts"][name]
                  }
                  if mismatches:
                      raise RuntimeError("post_sync_count_mismatch_" + ",".join(sorted(mismatches)))

                  idx = conn.execute("""
                      SELECT i.indisvalid, i.indisready
                      FROM pg_index i
                      WHERE i.indexrelid=to_regclass('public.ux_v2_odds_trifecta_race_ticket')
                  """).fetchone()
                  if idx != (True, True):
                      raise RuntimeError("required_odds_index_not_valid_ready")

                  db_bytes = int(conn.execute("SELECT pg_database_size(current_database())").fetchone()[0])
                  if db_bytes >= LIMIT:
                      raise RuntimeError("candidate_exceeds_5gb_before_commit")

                  conn.commit()
                  print("FINAL_DELTA_SYNC=PASS")
                  print("SYNC_DATE=" + DATE)
                  print("PUBLIC_TABLE_COUNTS_EQUAL=39/39")
                  print("REQUIRED_ODDS_INDEX_VALID_READY=true")
                  print("CANDIDATE_DB_BYTES=" + str(db_bytes))
                  print("CANDIDATE_HEADROOM_BYTES=" + str(LIMIT - db_bytes))
                  for table in TABLES:
                      print(
                          "SYNCED|" + table
                          + "|BEFORE_TOTAL=" + str(before_target[table])
                          + "|SOURCE_TOTAL=" + str(manifest["all_counts"][table])
                          + "|DATE_ROWS=" + str(manifest["tables"][table]["rows"])
                      )
                  print("SOURCE_WRITE=0")
                  print("CUTOVER=0")
                  print("WRITER_RETARGET=0")
                  print("PLAN_CHANGE=0")
              except Exception:
                  conn.rollback()
                  raise
              finally:
                  conn.close()

          mode = sys.argv[1]
          if mode == "source":
              source_capture()
          elif mode == "target":
              apply_target()
          else:
              raise SystemExit("mode must be source or target")
          PY

      - name: Capture frozen source delta read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service "$SOURCE_SERVICE"             python3 /tmp/final_delta_sync.py source > source.sanitized
          grep -E '^(SOURCE_CAPTURE|SOURCE_PUBLIC_TABLES|SOURCE_TARGET_ROWS)=' source.sanitized
          test -s delta-sync/manifest.json

      - name: Apply atomic delta to candidate v4
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service "$TARGET_SERVICE"             python3 /tmp/final_delta_sync.py target > target.sanitized
          grep -q '^FINAL_DELTA_SYNC=PASS$' target.sanitized
          grep -q '^PUBLIC_TABLE_COUNTS_EQUAL=39/39$' target.sanitized
          grep -q '^REQUIRED_ODDS_INDEX_VALID_READY=true$' target.sanitized

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Candidate v4 final delta sync'
            echo
            if [ -s target.sanitized ] && grep -q '^FINAL_DELTA_SYNC=PASS$' target.sanitized; then
              echo 'PASS: frozen-source 2026-10-01 delta was atomically synchronized into candidate-v4.'
              echo
              echo '~~~text'
              cat source.sanitized
              cat target.sanitized
              echo '~~~'
              echo
              echo 'Candidate mutation was transaction-guarded; source remained read-only.'
            else
              echo 'FAIL: final delta sync was not established. Candidate transaction was rolled back if the apply step failed.'
            fi
            echo
            echo 'No cutover, writer retarget, source mutation, delete outside the candidate transaction, volume resize/delete, or plan change was requested.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md

  production-candidate-v4-date-sync-plan:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway production-candidate-v4-date-sync-plan ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATE_SYNC_SOURCE_SERVICE: "Postgres-EKp2"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse target date
        id: target
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from datetime import date
          body=os.environ["BODY"].strip()
          m=re.fullmatch(r"/railway production-candidate-v4-date-sync-plan (\d{4}-\d{2}-\d{2})", body)
          if not m:
              raise SystemExit("invalid_command")
          d=date.fromisoformat(m.group(1))
          if d < date(2025,7,1):
              raise SystemExit("before_formal_backtest_period")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("date="+d.isoformat()+"\n")
          PY

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli

      - name: Build strict read-only probe
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          sql=f"""\\pset tuples_only on
\\pset format unaligned
SET default_transaction_read_only = on;
SET statement_timeout = '120s';
SELECT 'RACES|' || count(*)::text
  FROM public.v2_races
 WHERE race_date=DATE '{d}';
SELECT 'EX_ROWS|' || count(*)::text
  FROM public.v2_realtime_exhibition_snapshots e
  JOIN public.v2_races r USING(race_id)
 WHERE r.race_date=DATE '{d}'
   AND e.snapshot_label IN ('learning_all','final_ab');
WITH base AS (
  SELECT race_id FROM public.v2_races WHERE race_date=DATE '{d}'
), per AS (
  SELECT e.race_id,e.snapshot_label,
         count(distinct e.lane) FILTER (
           WHERE e.exhibition_time IS NOT NULL
             AND e.exhibition_time_rank IS NOT NULL
             AND e.exhibition_time_diff IS NOT NULL
         ) AS complete_lanes
    FROM public.v2_realtime_exhibition_snapshots e
    JOIN base b USING(race_id)
   WHERE e.snapshot_label IN ('learning_all','final_ab')
   GROUP BY e.race_id,e.snapshot_label
), agg AS (
  SELECT b.race_id,
         max((p.snapshot_label='learning_all' AND p.complete_lanes=6)::int) AS learning6,
         max((p.snapshot_label='final_ab' AND p.complete_lanes=6)::int) AS final6
    FROM base b
    LEFT JOIN per p USING(race_id)
   GROUP BY b.race_id
)
SELECT 'EX_COMPLETE|learning_all|' || coalesce(sum(learning6),0)::text FROM agg;
WITH base AS (
  SELECT race_id FROM public.v2_races WHERE race_date=DATE '{d}'
), per AS (
  SELECT e.race_id,e.snapshot_label,
         count(distinct e.lane) FILTER (
           WHERE e.exhibition_time IS NOT NULL
             AND e.exhibition_time_rank IS NOT NULL
             AND e.exhibition_time_diff IS NOT NULL
         ) AS complete_lanes
    FROM public.v2_realtime_exhibition_snapshots e
    JOIN base b USING(race_id)
   WHERE e.snapshot_label IN ('learning_all','final_ab')
   GROUP BY e.race_id,e.snapshot_label
), agg AS (
  SELECT b.race_id,
         max((p.snapshot_label='learning_all' AND p.complete_lanes=6)::int) AS learning6,
         max((p.snapshot_label='final_ab' AND p.complete_lanes=6)::int) AS final6
    FROM base b
    LEFT JOIN per p USING(race_id)
   GROUP BY b.race_id
)
SELECT 'EX_COMPLETE|final_ab|' || coalesce(sum(final6),0)::text FROM agg;
WITH base AS (
  SELECT race_id FROM public.v2_races WHERE race_date=DATE '{d}'
), per AS (
  SELECT e.race_id,e.snapshot_label,
         count(distinct e.lane) FILTER (
           WHERE e.exhibition_time IS NOT NULL
             AND e.exhibition_time_rank IS NOT NULL
             AND e.exhibition_time_diff IS NOT NULL
         ) AS complete_lanes
    FROM public.v2_realtime_exhibition_snapshots e
    JOIN base b USING(race_id)
   WHERE e.snapshot_label IN ('learning_all','final_ab')
   GROUP BY e.race_id,e.snapshot_label
), agg AS (
  SELECT b.race_id,
         max((p.snapshot_label='learning_all' AND p.complete_lanes=6)::int) AS learning6,
         max((p.snapshot_label='final_ab' AND p.complete_lanes=6)::int) AS final6
    FROM base b
    LEFT JOIN per p USING(race_id)
   GROUP BY b.race_id
)
SELECT 'EX_COMPLETE|daily_union|' ||
       count(*) FILTER (WHERE learning6=1 OR final6=1)::text
  FROM agg;
SELECT 'SCHEMA|v2_races|' ||
       md5(string_agg(column_name || ':' || udt_name || ':' || is_nullable,
                      ',' ORDER BY ordinal_position))
  FROM information_schema.columns
 WHERE table_schema='public' AND table_name='v2_races';
SELECT 'SCHEMA|v2_realtime_exhibition_snapshots|' ||
       md5(string_agg(column_name || ':' || udt_name || ':' || is_nullable,
                      ',' ORDER BY ordinal_position))
  FROM information_schema.columns
 WHERE table_schema='public' AND table_name='v2_realtime_exhibition_snapshots';
"""
          Path("date-sync-plan.sql").write_text(sql,encoding="utf-8")
          PY

      - name: Capture Production source read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway connect "$DATE_SYNC_SOURCE_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh < date-sync-plan.sql > source.raw
          grep -E '^(RACES|EX_ROWS|EX_COMPLETE|SCHEMA)\\|' source.raw > source.clean
          test "$(wc -l < source.clean)" -eq 7

      - name: Capture candidate-v4 read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway connect "$TARGET_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh < date-sync-plan.sql > target.raw
          grep -E '^(RACES|EX_ROWS|EX_COMPLETE|SCHEMA)\\|' target.raw > target.clean
          test "$(wc -l < target.clean)" -eq 7

      - name: Compare and fail closed
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          python3 - <<'PY' > plan.sanitized
          import os
          from pathlib import Path

          def load(path):
              out={}
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  p=line.split("|")
                  if p[0]=="RACES": out["races"]=int(p[1])
                  elif p[0]=="EX_ROWS": out["ex_rows"]=int(p[1])
                  elif p[0]=="EX_COMPLETE": out["complete_"+p[1]]=int(p[2])
                  elif p[0]=="SCHEMA": out["schema_"+p[1]]=p[2]
              return out

          s=load("source.clean"); t=load("target.clean")
          schema_ok=(
              s.get("schema_v2_races")==t.get("schema_v2_races")
              and s.get("schema_v2_realtime_exhibition_snapshots")
                  ==t.get("schema_v2_realtime_exhibition_snapshots")
          )
          source_has_date=s.get("races",0)>0
          target_missing_date=t.get("races",0)==0
          print("DATE_SYNC_PLAN_DATE="+os.environ["TARGET_DATE"])
          print("DATE_SYNC_SOURCE_SERVICE=Postgres-EKp2")
          print("SOURCE_RACES="+str(s.get("races",0)))
          print("SOURCE_EX_ROWS="+str(s.get("ex_rows",0)))
          print("SOURCE_LEARNING_COMPLETE="+str(s.get("complete_learning_all",0)))
          print("SOURCE_FINAL_COMPLETE="+str(s.get("complete_final_ab",0)))
          print("SOURCE_DAILY_UNION_COMPLETE="+str(s.get("complete_daily_union",0)))
          print("TARGET_RACES="+str(t.get("races",0)))
          print("TARGET_EX_ROWS="+str(t.get("ex_rows",0)))
          print("SCHEMA_MATCH="+("true" if schema_ok else "false"))
          print("SOURCE_HAS_DATE="+("true" if source_has_date else "false"))
          print("TARGET_DATE_EMPTY="+("true" if target_missing_date else "false"))
          print("HTTP_REQUESTS=0")
          print("SOURCE_WRITE=0")
          print("CANDIDATE_WRITE=0")
          print("RESULT_ODDS_PAYOUT_READ=0")
          print("PROD_MODEL_CHANGE=0")
          print("LINE=0 BUY=0")
          ready=schema_ok and source_has_date and target_missing_date
          print("DATE_SYNC_PLAN_RESULT="+("READY" if ready else "BLOCKED"))
          PY

      - name: Post compact plan
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Production → candidate-v4 date sync plan'
            echo
            if [ -s plan.sanitized ]; then
              echo '~~~text'
              cat plan.sanitized
              echo '~~~'
            else
              echo 'Plan did not produce sanitized output.'
            fi
            echo
            echo 'Read-only only. No HTTP, result/odds/payout reads, or database writes.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
