name: Racer course partial parser simulation read-only

on:
  pull_request:
    paths:
      - 'collect_racer_course_stats_pg.py'
      - 'collect_racer_course_top3_forward_shadow_pg.py'
      - 'research_racer_course_partial_parser_simulation_pg.py'
      - '.github/workflows/racer-course-partial-parser-simulation-readonly.yml'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  simulate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only simulation
        run: |
          set -euo pipefail
          python -m py_compile collect_racer_course_stats_pg.py research_racer_course_partial_parser_simulation_pg.py
          python - <<'PY'
          from pathlib import Path
          p = Path('research_racer_course_partial_parser_simulation_pg.py').read_text(encoding='utf-8').lower()
          forbidden = ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line')
          for token in forbidden:
              assert token not in p, token
          assert 'not_prediction_eligible' in p
          assert 'no_change_block_manual_review_only' in p
          print('RACER_COURSE_PARTIAL_SIM_VALIDATE=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run read-only current-page structural simulation
        run: |
          set -euo pipefail
          python -u research_racer_course_partial_parser_simulation_pg.py > sim.txt 2>&1
      - name: Print sanitized result
        if: always()
        run: grep '^RACER_COURSE_PARTIAL_SIM_' sim.txt 2>/dev/null || true
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json sim.txt
