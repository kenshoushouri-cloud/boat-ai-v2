name: V4 unused-entry inventory one-shot read-only audit
on:
  pull_request:
    paths:
      - 'research/.v4-unused-entry-inventory-run-once-20260927'
permissions:
  contents: read
jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/v4-unused-entry-inventory-20260927' &&\n      github.event.pull_request.head.sha == 'd26ccaf5a936e6708db96d477dc02c7ad7972117'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEDICATED_DATABASE_URL: ${{ secrets.V4_BACKTEST_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      V4_UNUSED_ENTRY_OUTPUT_JSON: 'v4-unused-entry-inventory.json'
      PGOPTIONS: '-c default_transaction_read_only=on'
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact one-shot trigger
        run: test "$(cat research/.v4-unused-entry-inventory-run-once-20260927)" = "RUN_ONCE_20260927_V4_UNUSED_ENTRY_INVENTORY"
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Select read-only route
        run: |
          if [ -n "${DEDICATED_DATABASE_URL:-}" ]; then
            echo "V4_UNUSED_ENTRY_DB_AUDIT=DEDICATED_DATABASE_SECRET"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "V4_UNUSED_ENTRY_DB_AUDIT=RAILWAY_RUN_NON_ENUMERATING"
          else
            exit 1
          fi
      - name: Install Railway CLI
        if: env.DEDICATED_DATABASE_URL == '' && env.RAILWAY_TOKEN != ''
        run: npm install --global @railway/cli
      - name: Run via dedicated read-only connection
        if: env.DEDICATED_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.V4_BACKTEST_DATABASE_URL }}
        run: |
          python -u research/v4_unused_entry_inventory_pg.py 2>&1 | tee v4-unused-entry-inventory.txt
          grep -q '^RESULT=PASS_READ_ONLY$' v4-unused-entry-inventory.txt
      - name: Run via Railway non-enumerating env injection
        if: env.DEDICATED_DATABASE_URL == '' && env.RAILWAY_TOKEN != ''
        run: |
          railway run --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_DB_SERVICE}"             bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; exec python -u research/v4_unused_entry_inventory_pg.py'             2>&1 | tee v4-unused-entry-inventory.txt
          grep -q '^RESULT=PASS_READ_ONLY$' v4-unused-entry-inventory.txt
      - name: Hash result
        if: success()
        run: |
          test -s v4-unused-entry-inventory.json
          sha256sum v4-unused-entry-inventory.json | tee v4-unused-entry-inventory.sha256
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-unused-entry-inventory-${{ github.run_id }}
          path: |
            v4-unused-entry-inventory.json
            v4-unused-entry-inventory.txt
            v4-unused-entry-inventory.sha256
          retention-days: 90
          if-no-files-found: warn
      - name: Confirm safety
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/v4-unused-entry-inventory-one-shot.yml').read_text(encoding='utf-8').lower()
          code=Path('research/v4_unused_entry_inventory_pg.py').read_text(encoding='utf-8').lower()
          for token in ('railway'+' variable'+' list','print'+'env','env'+' |','railway-vars'+'.json'):
              assert token not in wf, token
          for token in ('v2_'+'results','v2_'+'result_entries','v2_'+'odds','v2_'+'payout','send_'+'line'):
              assert token not in code, token
          print('V4_UNUSED_ENTRY_SECRET_ENUMERATION=0')
          print('V4_UNUSED_ENTRY_OUTCOME_READ=0')
          PY
