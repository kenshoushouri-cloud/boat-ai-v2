name: Candidate Discovery V4 official availability parser

on:
  pull_request:
    paths:
      - 'research/candidate_discovery_v4_official_availability_parser.py'
      - 'tests/test_candidate_discovery_v4_official_availability_parser.py'
      - 'docs/V4_OFFICIAL_AVAILABILITY_PARSER_CONTRACT_20260921.md'
      - '.github/workflows/candidate-discovery-v4-availability-parser.yml'

permissions:
  contents: read

jobs:
  pure-parser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Compile and test block-only parser
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile research/candidate_discovery_v4_official_availability_parser.py tests/test_candidate_discovery_v4_official_availability_parser.py
          pytest -q tests/test_candidate_discovery_v4_official_availability_parser.py
