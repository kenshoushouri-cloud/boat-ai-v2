name: Candidate Discovery V4 official availability parser

on:
  pull_request:
    paths:
      - 'research/candidate_discovery_v4_official_availability_parser.py'
      - 'tests/test_candidate_discovery_v4_official_availability_parser.py'
      - 'docs/V4_OFFICIAL_AVAILABILITY_PARSER_CONTRACT_20260921.md'
      - 'research/candidate_discovery_v4_official_active_parser.py'
      - 'tests/test_candidate_discovery_v4_official_active_parser.py'
      - 'docs/V4_OFFICIAL_ACTIVE_AVAILABILITY_PARSER_CONTRACT_20260921.md'
      - 'research/candidate_discovery_v4_pre_freeze_availability_capture.py'
      - 'tests/test_candidate_discovery_v4_pre_freeze_availability_capture.py'
      - 'docs/V4_PRE_FREEZE_AVAILABILITY_RAW_CAPTURE_CONTRACT_20260922.md'
      - 'research/candidate_discovery_v4_availability_snapshot_binder.py'
      - 'tests/test_candidate_discovery_v4_availability_snapshot_binder.py'
      - 'docs/V4_AVAILABILITY_SNAPSHOT_BINDER_CONTRACT_20260922.md'
      - '.github/workflows/candidate-discovery-v4-availability-parser.yml'

permissions:
  contents: read

jobs:
  pure-parser-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Compile and test official availability parsers
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile \
            research/candidate_discovery_v4_official_availability_parser.py \
            tests/test_candidate_discovery_v4_official_availability_parser.py \
            research/candidate_discovery_v4_official_active_parser.py \
            tests/test_candidate_discovery_v4_official_active_parser.py \
            research/candidate_discovery_v4_pre_freeze_availability_capture.py \
            tests/test_candidate_discovery_v4_pre_freeze_availability_capture.py \
            research/candidate_discovery_v4_availability_snapshot_binder.py \
            tests/test_candidate_discovery_v4_availability_snapshot_binder.py
          pytest -q \
            tests/test_candidate_discovery_v4_official_availability_parser.py \
            tests/test_candidate_discovery_v4_official_active_parser.py \
            tests/test_candidate_discovery_v4_pre_freeze_availability_capture.py \
            tests/test_candidate_discovery_v4_availability_snapshot_binder.py
