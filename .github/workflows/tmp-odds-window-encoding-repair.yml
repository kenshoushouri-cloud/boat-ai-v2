name: Temporary odds window encoding repair

on:
  push:
    branches:
      - ops/odds-window-log-cleanup-20260821
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  repair:
    if: github.head_ref == 'ops/odds-window-log-cleanup-20260821' || github.ref_name == 'ops/odds-window-log-cleanup-20260821'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: ops/odds-window-log-cleanup-20260821
          fetch-depth: 0

      - name: Repair display-only mojibake structurally
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('run_odds_window_pg.py')
          lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
          out = []
          i = 0
          after_skip_full = False

          while i < len(lines):
              line = lines[i]
              stripped = line.strip()

              # Complete the ticket-snapshot docstring as one clean block.
              if '6艇=120、5艇=60、4艇=24通りを許可するが、' in line:
                  out.append(line)
                  out.append('    件数だけではなく、有効艇集合の全順列と完全一致した場合のみ\n')
                  i += 1
                  while i < len(lines) and 'complete=True' not in lines[i]:
                      i += 1
                  continue

              # Complete the ThreadPoolExecutor explanation as one clean line.
              if stripped.startswith('ThreadPoolExecutor') and 'Future' in line:
                  out.append('    ThreadPoolExecutor自体では実行中Futureを安全に強制終了できないため、\n')
                  i += 1
                  while i < len(lines) and not lines[i].strip().startswith('実HTTPタイムアウト'):
                      i += 1
                  continue

              # Replace the whole Motor2 explanatory comment block.
              if stripped == '# Motor2 Forward Shadow target scope export':
                  out.extend([
                      line,
                      '    # ------------------------------------------------------------\n',
                      '    # STEP1で選択したこのwindowの全race_idを、\n',
                      '    # run_window_pipeline_pg.py のSTEP1.5へ同一processの環境変数で渡す。\n',
                      '    # skip_full_oddsで今回HTTP取得を省略したRも、既に完全オッズがDBにあるため\n',
                      '    # Shadow対象からは外さない。\n',
                  ])
                  i += 1
                  while i < len(lines) and not lines[i].strip().startswith('window_race_ids = ['):
                      i += 1
                  continue

              if 'skip_full_odds=1' in line:
                  after_skip_full = True

              # Replace only the nested no-races display block after skip_full_odds.
              if after_skip_full and stripped == 'if not races:':
                  out.extend([
                      '        if not races:\n',
                      '            print(\n',
                      '                "全対象レースで期待される三連単の全組み合わせが揃っています。",\n',
                      '                flush=True,\n',
                      '            )\n',
                      '            return\n',
                  ])
                  i += 1
                  while i < len(lines) and lines[i].strip() != 'return':
                      i += 1
                  if i < len(lines):
                      i += 1
                  after_skip_full = False
                  continue

              # Replace the entire retry-complete print block.
              if stripped == 'if not pending:':
                  out.extend([
                      '        if not pending:\n',
                      '            print(\n',
                      '                f"retry_check={retry_no}: "\n',
                      '                "全レース期待組み合わせ完了",\n',
                      '                flush=True,\n',
                      '            )\n',
                      '            break\n',
                  ])
                  i += 1
                  while i < len(lines) and lines[i].strip() != 'break':
                      i += 1
                  if i < len(lines):
                      i += 1
                  continue

              out.append(line)
              i += 1

          path.write_text(''.join(out), encoding='utf-8')
          PY

      - name: Compile odds window
        run: python -m py_compile run_odds_window_pg.py

      - name: Commit repaired file
        run: |
          if git diff --quiet -- run_odds_window_pg.py; then
            echo "No changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- run_odds_window_pg.py
          git commit -m "ops: finish odds window log cleanup"
          git push origin HEAD:ops/odds-window-log-cleanup-20260821
