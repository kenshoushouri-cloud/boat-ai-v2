name: V4 Forward economics gate

on:
  pull_request:
    paths:
      - 'research/v4_forward_economics_gate.py'
      - 'tests/test_v4_forward_economics_gate.py'
      - 'docs/V4_FORWARD_ECONOMICS_GATE_20260921.md'
      - '.github/workflows/v4-forward-economics-gate.yml'

permissions:
  contents: read

jobs:
  pure-economics:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Compile and test descriptive economics gate
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile research/v4_forward_economics_gate.py tests/test_v4_forward_economics_gate.py
          pytest -q tests/test_v4_forward_economics_gate.py
