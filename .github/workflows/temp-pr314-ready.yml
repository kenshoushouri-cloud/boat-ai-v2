name: Temporary PR 314 ready bridge

on:
  pull_request:
    types: [synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  ready:
    if: >-
      github.event.pull_request.number == 314 &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Mark PR 314 ready
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr ready 314 --repo "$GITHUB_REPOSITORY"
