name: V4 F-count companion adapter validation

on:
  pull_request:
    paths:
      - 'research/v4_fcount_companion_adapter.py'
      - 'tests/test_v4_fcount_companion_adapter.py'
      - 'docs/V4_FCOUNT_COMPANION_ADAPTER_20260927.md'
      - '.github/workflows/v4-fcount-companion-adapter-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    env:
      PYTHONPATH: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: python -m py_compile research/v4_fcount_companion_adapter.py
      - run: pytest -q tests/test_v4_fcount_companion_contract.py tests/test_v4_fcount_companion_adapter.py
      - name: Validate no I/O or persistence
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('research/v4_fcount_companion_adapter.py').read_text(encoding='utf-8').lower()
          for token in (
              'import psycopg','import requests','import urllib','open(',
              'path(','write_text','write_bytes','send_'+'line',
              'insert into','update v2_','delete from','create table','railway'
          ):
              assert token not in t,token
          assert 'v2_race_entries' in t
          assert 'race_id,lane,f_count' in t
          print('V4_FCOUNT_COMPANION_ADAPTER_PURE=PASS')
          PY
