name: Exhibition ST health candidate-v4 read-only

on:
  pull_request:
    paths:
      - ".github/workflows/research-exhibition-st-health-candidate-v4.yml"

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Static safety check
        run: |
          set -euo pipefail
          python -m py_compile report_exhibition_st_forward_health_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("report_exhibition_st_forward_health_pg.py").read_text(encoding="utf-8").lower()
          assert "block_manual_review_only" in p
          assert "v2_exhibition_st_forward_shadow" in p
          assert "v2_results" in p
          for token in ("insert into","update v2_","delete from","send_line","v2_odds"):
              assert token not in p, token
          w=Path(".github/workflows/research-exhibition-st-health-candidate-v4.yml").read_text(encoding="utf-8").lower()
          assert "postgres-hobby-fullhistory-candidate-v4" in w
          assert "".join(("railway"," variable"," list")) not in w
          assert "".join(("list","_variables")) not in w
          assert "".join(("schedule", ":")) not in w
          print("EXH_ST_CANDIDATE_V4_STATIC=PASS")
          PY

      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Run latest frozen Exhibition ST health read-only
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c max_parallel_workers_per_gather=0"; exec python -u report_exhibition_st_forward_health_pg.py' \
            2>&1 | tee exhibition-st-health.txt
          grep -q '^EXH_ST_FORWARD_HEALTH_RESULT=PASS_READ_ONLY$' exhibition-st-health.txt

      - name: Upload compact evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: exhibition-st-health-candidate-v4-${{ github.run_id }}
          path: exhibition-st-health.txt
          retention-days: 14
          if-no-files-found: warn
