name: V5.1 Recent Form blind VAL OOS

on:
  pull_request:
    paths:
      - "research/v51_recent_form_blind_val_oos_pg.py"
      - "tests/test_v51_recent_form_blind_val_oos_pg.py"
      - ".github/workflows/research-v51-recent-form-blind-val-oos.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  TRAIN_RUN_ID: "37188106418"
  TRAIN_ARTIFACT_NAME: "v51-recent-form-train-fit-37188106418"

jobs:
  evaluate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Static blind-evaluation safety
        run: |
          set -euo pipefail
          pytest -q tests/test_v51_recent_form_blind_val_oos_pg.py
          python -m py_compile research/v51_recent_form_blind_val_oos_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path(".github/workflows/research-v51-recent-form-blind-val-oos.yml").read_text(encoding="utf-8").lower()
          assert "postgres-hobby-fullhistory-candidate-v4" in w
          assert "".join(("railway"," variable"," list")) not in w
          assert "".join(("list","_variables")) not in w
          assert "".join(("schedule", ":")) not in w
          print("V51_RF_BLIND_STATIC=PASS")
          PY

      - name: Download frozen TRAIN artifact
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.TRAIN_ARTIFACT_NAME }}
          path: train-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.TRAIN_RUN_ID }}

      - name: Verify frozen TRAIN coefficient
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          p=Path("train-artifact/v51-recent-form-train-fit.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["candidate_id"]=="V51_RECENT_FORM_LAST5_TOP3_V1"
          assert x["chosen"]["coefficient"]==0.3
          assert x["freeze_sha256"]=="7b53c68c22ef351b85293205395938c12705ca87f03b50be9d87f196a95c3c9c"
          assert x["validation_read"] is False
          assert x["oos_read"] is False
          print("V51_RF_BLIND_TRAIN_ARTIFACT=PASS")
          PY

      - run: npm install --global @railway/cli

      - name: Blind evaluate VALIDATION and OOS
        env:
          V51_RF_TRAIN_ARTIFACT: train-artifact/v51-recent-form-train-fit.json
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c max_parallel_workers_per_gather=0"; export PYTHONPATH=.; exec python -u research/v51_recent_form_blind_val_oos_pg.py' \
            2>&1 | tee v51-recent-form-blind-val-oos.txt
          grep -q '^V51_RF_BLIND_COEFFICIENT=+0.30$' v51-recent-form-blind-val-oos.txt
          grep -q '^V51_RF_BLIND_COEFFICIENT_SEARCH=0 RETUNE=0$' v51-recent-form-blind-val-oos.txt
          grep -q '^V51_RF_BLIND_VALIDATION_PREOUTCOME_POPULATION=28178$' v51-recent-form-blind-val-oos.txt
          grep -q '^V51_RF_BLIND_OOS_PREOUTCOME_POPULATION=14492$' v51-recent-form-blind-val-oos.txt
          grep -q '^V51_RF_BLIND_OUTCOME_READ_BEFORE_POPULATION_FREEZE=0$' v51-recent-form-blind-val-oos.txt
          grep -q '^V51_RF_BLIND_RESULT=PASS_EVALUATION_COMPLETED$' v51-recent-form-blind-val-oos.txt

      - uses: actions/upload-artifact@v4
        with:
          name: v51-recent-form-blind-val-oos-${{ github.run_id }}
          path: |
            v51-recent-form-blind-val-oos.json
            v51-recent-form-blind-val-oos.txt
          retention-days: 14
          if-no-files-found: error
