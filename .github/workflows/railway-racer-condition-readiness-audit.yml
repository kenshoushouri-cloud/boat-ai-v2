name: Railway racer condition readiness audit

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/racer_condition_profile_audit.py"
      - ".github/workflows/railway-racer-condition-readiness-audit.yml"
  push:
    branches: [main]
    paths:
      - ".github/scripts/racer_condition_profile_audit.py"
      - ".github/workflows/railway-racer-condition-readiness-audit.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway racer-condition-readiness-audit'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load public database URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = data.get('DATABASE_PUBLIC_URL') if isinstance(data, dict) else None
          if isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run read-only readiness audit
        id: audit
        shell: bash
        run: |
          set +e
          python -u .github/scripts/racer_condition_profile_audit.py > condition-audit-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized summary
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          p = Path('condition-audit-output.txt')
          text = p.read_text(encoding='utf-8', errors='replace') if p.exists() else ''
          prefixes = (
              'CONDITION_AUDIT_', 'SCHEMA_', 'WEATHER_', 'EXHIBITION_',
              'PARTICIPANT_', 'DISTINCT_', 'DENSITY_', 'CONDITION_DENSITY_',
              'RESULT_', 'TILT_POLICY=',
          )
          keep = [line[:700] for line in text.splitlines() if line.startswith(prefixes)]
          lines = [
              '## Racer condition feature readiness audit', '',
              '**Read-only / no correction coefficients / no DB writes**', '',
              '```text', *keep[:180], '```', '',
              f'Audit exit code: `{os.environ.get("AUDIT_EXIT_CODE", "?")}`', '',
              'This audit only measures historical coverage, joinability and sample density. It does not modify prediction logic, Shadow logic, database rows, Railway settings or LINE behavior.',
          ]
          Path('condition-audit-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Remove temporary files
        if: always()
        run: rm -f railway-vars.json railway-vars-error.txt condition-audit-output.txt

      - name: Post result to control issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file condition-audit-summary.md

      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
