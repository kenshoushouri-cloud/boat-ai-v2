name: Odds evidence PostgreSQL smoke

on:
  pull_request:
    paths:
      - 'audit_odds_evidence_20260908_pg.py'
      - 'odds_evidence_privilege_guard.py'
      - 'odds_evidence_role_provisioning.py'
      - 'tests/postgres_odds_evidence_smoke.py'
      - 'tests/postgres_odds_evidence_provisioning_smoke.py'
      - '.github/workflows/odds-evidence-postgres-smoke.yml'

permissions:
  contents: read

jobs:
  disposable-postgres:
    if: >-
      github.event.pull_request.head.repo.full_name == 'kenshoushouri-cloud/boat-ai-v2' &&
      github.event.pull_request.head.ref == 'research/odds-evidence-20260908'
    runs-on: ubuntu-latest
    timeout-minutes: 8
    strategy:
      fail-fast: false
      matrix:
        postgres: ['14', '15', '16', '17', '18']
    services:
      postgres:
        image: postgres:${{ matrix.postgres }}
        env:
          POSTGRES_DB: audit_sandbox
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: disposable-ci-only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d audit_sandbox"
          --health-interval 2s
          --health-timeout 2s
          --health-retries 15
    env:
      DATABASE_URL: ''
      RAILWAY_TOKEN: ''
      AUDIT_DATABASE_URL: ''
      AUDIT_DB_HOST: ''
      AUDIT_DB_PORT: ''
      AUDIT_DB_NAME: ''
      AUDIT_SQL_SMOKE: DISPOSABLE_LOCAL_ONLY
      AUDIT_SQL_SMOKE_HOST: 127.0.0.1
      AUDIT_SQL_SMOKE_DATABASE: audit_sandbox
      AUDIT_SQL_SMOKE_ADMIN_PASSWORD: disposable-ci-only
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install pinned database client
        run: python -m pip install 'psycopg[binary]==3.2.6'
      - name: Compile real PostgreSQL smoke tests
        run: python -m py_compile audit_odds_evidence_20260908_pg.py odds_evidence_privilege_guard.py odds_evidence_role_provisioning.py tests/postgres_odds_evidence_smoke.py tests/postgres_odds_evidence_provisioning_smoke.py
      - name: Run disposable PostgreSQL checks
        run: python -m unittest discover -s tests -p 'postgres_odds_evidence*_smoke.py' -v
