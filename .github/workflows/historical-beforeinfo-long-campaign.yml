name: Historical beforeinfo long campaign

on:
  pull_request:
    paths:
      - ".github/workflows/historical-beforeinfo-long-campaign.yml"
      - "research/historical_beforeinfo_backfill_pg.py"
      - "tests/test_historical_beforeinfo_backfill_pg.py"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

concurrency:
  group: ${{ github.event_name == 'issue_comment' && github.event.comment.body == '/railway historical-beforeinfo-campaign-drain' && 'historical-beforeinfo-long-campaign' || github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/railway historical-beforeinfo-campaign ') && 'historical-beforeinfo-write' || format('historical-beforeinfo-long-other-{0}', github.run_id) }}
  cancel-in-progress: false

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-recovery"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest pyyaml
      - name: Validate long-campaign safety
        run: |
          set -euo pipefail
          pytest -q tests/test_historical_beforeinfo_backfill_pg.py
          python -m py_compile research/historical_beforeinfo_backfill_pg.py
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path(".github/workflows/historical-beforeinfo-long-campaign.yml")
          y=yaml.safe_load(p.read_text(encoding="utf-8"))
          assert isinstance(y, dict) and "jobs" in y
          text=p.read_text(encoding="utf-8")
          assert "MAX_RANGE_DAYS=500" in text
          assert "SEGMENT_DAYS=14" in text
          assert "CHUNK_DAYS=7" in text
          assert "max-parallel: 1" in text
          assert "HIST_BEFOREINFO_SLEEP_SEC=\"0.50\"" in text
          assert "'historical-beforeinfo-write'" in text
          assert "'historical-beforeinfo-long-campaign'" in text
          assert "github.event.comment.body == '/railway historical-beforeinfo-campaign-drain'" in text
          assert "startsWith(github.event.comment.body, '/railway historical-beforeinfo-campaign ')" in text
          assert "historical-beforeinfo-long-other-{0}" in text
          source=Path("research/historical_beforeinfo_backfill_pg.py").read_text(encoding="utf-8").lower()
          assert "historical_label_fill_missing_only" in source
          assert "v2_results" not in source
          assert "v2_odds" not in source
          assert "coalesce(v2_realtime_weather_snapshots.temperature_c,excluded.temperature_c)" in source
          print("PASS historical beforeinfo long-campaign safety")
          PY

  plan:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway historical-beforeinfo-campaign ')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      segments: ${{ steps.plan.outputs.segments }}
      start_date: ${{ steps.plan.outputs.start_date }}
      end_date: ${{ steps.plan.outputs.end_date }}
    steps:
      - name: Parse full range and build <=14-day segments
        id: plan
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from datetime import date, timedelta

          MAX_RANGE_DAYS=500
          SEGMENT_DAYS=14

          p=os.environ["COMMENT_BODY"].strip().split()
          if len(p) != 4 or p[1] != "historical-beforeinfo-campaign":
              raise SystemExit("command: /railway historical-beforeinfo-campaign YYYY-MM-DD YYYY-MM-DD")
          a=date.fromisoformat(p[2]); b=date.fromisoformat(p[3])
          if b < a:
              raise SystemExit("end before start")
          if a < date(2025,7,1):
              raise SystemExit("approved historical start is 2025-07-01")
          days=(b-a).days+1
          if days > MAX_RANGE_DAYS:
              raise SystemExit(f"maximum campaign is {MAX_RANGE_DAYS} days")

          segments=[]
          cur=a
          idx=1
          while cur <= b:
              end=min(cur+timedelta(days=SEGMENT_DAYS-1), b)
              segments.append({
                  "index": idx,
                  "start": cur.isoformat(),
                  "end": end.isoformat(),
              })
              idx += 1
              cur=end+timedelta(days=1)

          print("segments="+json.dumps(segments,separators=(",",":")))
          print("start_date="+a.isoformat())
          print("end_date="+b.isoformat())
          PY

  backfill:
    needs: plan
    if: needs.plan.result == 'success'
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        segment: ${{ fromJSON(needs.plan.outputs.segments) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Build <=7-day runtime chunks
        env:
          SEGMENT_START: ${{ matrix.segment.start }}
          SEGMENT_END: ${{ matrix.segment.end }}
        run: |
          set -euo pipefail
          python - <<'PY' > beforeinfo-chunks.txt
          import os
          from datetime import date, timedelta
          CHUNK_DAYS=7
          a=date.fromisoformat(os.environ["SEGMENT_START"])
          b=date.fromisoformat(os.environ["SEGMENT_END"])
          cur=a
          while cur <= b:
              end=min(cur+timedelta(days=CHUNK_DAYS-1), b)
              print(cur.isoformat(), end.isoformat())
              cur=end+timedelta(days=1)
          PY
          cat beforeinfo-chunks.txt

      - name: Fill official archived beforeinfo in chunks
        env:
          HIST_BEFOREINFO_SLEEP_SEC: "0.50"
        run: |
          set -euo pipefail
          : > historical-beforeinfo-campaign.txt
          while read -r chunk_start chunk_end; do
            echo "HIST_BEFOREINFO_CAMPAIGN_CHUNK=${chunk_start}..${chunk_end}" | tee -a historical-beforeinfo-campaign.txt
            manifest="historical-beforeinfo-${chunk_start}-${chunk_end}.json"
            railway run \
              --project "${RAILWAY_PROJECT_ID}" \
              --environment "${RAILWAY_ENVIRONMENT}" \
              --service "${RAILWAY_DB_SERVICE}" \
              bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; export CONFIRM_HISTORICAL_BEFOREINFO_DB_WRITE="YES"; export HIST_BEFOREINFO_SLEEP_SEC="0.50"; exec python -u research/historical_beforeinfo_backfill_pg.py --start-date "$1" --end-date "$2" --output "$3"' bash "${chunk_start}" "${chunk_end}" "${manifest}" \
              2>&1 | tee -a historical-beforeinfo-campaign.txt
          done < beforeinfo-chunks.txt

          expected=$(wc -l < beforeinfo-chunks.txt)
          test "$(grep -c '^HIST_BEFOREINFO_RESULT=PASS$' historical-beforeinfo-campaign.txt)" -eq "$expected"
          test "$(grep -c '^HIST_BEFOREINFO_RESULT_ODDS_PAYOUT_READ=0$' historical-beforeinfo-campaign.txt)" -eq "$expected"
          test "$(grep -c '^HIST_BEFOREINFO_LINE=0 BUY=0 PROD_MODEL_CHANGE=0$' historical-beforeinfo-campaign.txt)" -eq "$expected"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: historical-beforeinfo-campaign-s${{ matrix.segment.index }}-${{ github.run_id }}
          path: |
            beforeinfo-chunks.txt
            historical-beforeinfo-campaign.txt
            historical-beforeinfo-*.json
          retention-days: 90
          if-no-files-found: warn

      - name: Comment sanitized segment summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SEGMENT_INDEX: ${{ matrix.segment.index }}
          SEGMENT_START: ${{ matrix.segment.start }}
          SEGMENT_END: ${{ matrix.segment.end }}
        run: |
          {
            echo "Historical beforeinfo campaign segment ${SEGMENT_INDEX}: ${SEGMENT_START} .. ${SEGMENT_END}"
            echo
            if [ -f historical-beforeinfo-campaign.txt ]; then
              grep -E '^(HIST_BEFOREINFO_CAMPAIGN_CHUNK=|HIST_BEFOREINFO_TOTALS=|HIST_BEFOREINFO_RESULT=)' historical-beforeinfo-campaign.txt || true
            fi
            echo
            echo "Official archived beforeinfo; historical/predeadline-assumed; missing-only; no result/odds/payout read."
          } > reply.txt
          gh issue comment 42 --repo "${GITHUB_REPOSITORY}" --body-file reply.txt
