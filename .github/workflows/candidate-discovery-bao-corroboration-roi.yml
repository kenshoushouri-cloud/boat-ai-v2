name: Candidate Discovery Bao Corroboration ROI

on:
  pull_request:
    paths:
      - '.github/scripts/candidate_discovery_bao_corroboration_roi_pg.py'
      - '.github/workflows/candidate-discovery-bao-corroboration-roi.yml'
      - '.github/scripts/candidate_discovery_v1_pg.py'
      - '.github/scripts/candidate_discovery_v2_formation_pg.py'
      - '.github/scripts/candidate_discovery_k_multibet_probe.py'
      - 'research/candidate_discovery_bettype_contract.py'
      - 'research/candidate_discovery_late_bao_contract.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=180000

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate read-only proxy contract
        run: |
          python -m py_compile .github/scripts/candidate_discovery_bao_corroboration_roi_pg.py
          python -m py_compile research/candidate_discovery_late_bao_contract.py
          python -m py_compile research/candidate_discovery_bettype_contract.py
          python tests/test_candidate_discovery_late_bao_contract.py
          python tests/test_candidate_discovery_bettype_contract.py
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/scripts/candidate_discovery_bao_corroboration_roi_pg.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in text
          assert 'v2_results' not in text
          assert 'unit_yen = 100' in text
          assert 'race_cap = 6' in text
          assert 'promotion_allowed' in text
          assert 'proxy_only' in text
          assert 'bao_top1_agree' in text and 'bao_top2_support' in text
          for token in (
              'delete from ', 'insert into ', 'update v2_', 'alter table ',
              'drop table ', 'truncate ', 'vacuum ', 'create table '
          ):
              assert token not in text, token
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run Bao corroboration ROI proxy audit
        run: |
          python -u .github/scripts/candidate_discovery_bao_corroboration_roi_pg.py | tee candidate-discovery-bao-corroboration-roi.txt
          grep -q '^CANDIDATE_BAO_ROI_PROXY=V2_MOTOR2_FACTOR_TOP6_NOT_V4_PRODUCTION_BACKTEST$' candidate-discovery-bao-corroboration-roi.txt
          grep -q '^CANDIDATE_BAO_ROI_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0$' candidate-discovery-bao-corroboration-roi.txt
          grep -q '^CANDIDATE_BAO_ROI_PROMOTION=BLOCK_PROXY_ONLY$' candidate-discovery-bao-corroboration-roi.txt
          grep -q '^CANDIDATE_BAO_ROI_RESULT=PASS_READ_ONLY$' candidate-discovery-bao-corroboration-roi.txt

      - name: Upload Bao ROI proxy artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-bao-corroboration-roi-${{ github.run_id }}
          path: |
            candidate-discovery-bao-corroboration-roi.json
            candidate-discovery-bao-corroboration-roi.txt
          retention-days: 30
          if-no-files-found: error
