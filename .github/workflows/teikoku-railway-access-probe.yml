name: Teikoku Railway historical motor access probe

on:
  pull_request:
    paths:
      - "research/teikoku_motor_history_probe.py"
      - "tests/test_teikoku_motor_history_probe.py"
      - ".github/workflows/teikoku-railway-access-probe.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_RUN_SERVICE: "postgres-recovery"
  TEIKOKU_KNOWN_URL: "https://boatrace-db.net/stadium/mdetail/pid/24/mno/60/"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: |
          pytest -q tests/test_teikoku_motor_history_probe.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/teikoku_motor_history_probe.py").read_text(encoding="utf-8").lower()
          assert "min_access_interval_sec = 3.0" in p
          assert "known_motor_url_re" in p
          assert '"db_write": false' in p
          assert '"future_rows_used": false' in p
          assert '"aggregate_values_used_as_historical_snapshot": false' in p
          assert "insert into" not in p
          assert "update v2_" not in p
          assert "delete from" not in p
          print("PASS Teikoku Railway probe safety")
          PY

  probe:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway teikoku-motor-probe ')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Parse cutoff
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import date
          p=os.environ["COMMENT_BODY"].strip().split()
          if len(p) != 3 or p[1] != "teikoku-motor-probe":
              raise SystemExit("command: /railway teikoku-motor-probe YYYY-MM-DD")
          date.fromisoformat(p[2])
          print("TEIKOKU_CUTOFF="+p[2])
          PY
      - name: Probe fixed known page from Railway network
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_RUN_SERVICE}" \
            bash -lc 'export PYTHONPATH=.; exec python -u research/teikoku_motor_history_probe.py --url "https://boatrace-db.net/stadium/mdetail/pid/24/mno/60/" --cutoff-date "${TEIKOKU_CUTOFF}"' \
            | tee teikoku-railway-probe.txt
          grep -q '^TEIKOKU_MOTOR_PROBE_RESULT=PASS_PRIOR_ONLY_STRUCTURE$' teikoku-railway-probe.txt
      - uses: actions/upload-artifact@v4
        with:
          name: teikoku-railway-motor-probe-${{ github.run_id }}
          path: |
            teikoku-motor-history-probe.json
            teikoku-railway-probe.txt
          retention-days: 30
          if-no-files-found: error
      - name: Comment sanitized summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "艇国 motor prior-only Railway probe"
            if [ -f teikoku-railway-probe.txt ]; then
              grep -E '^(TEIKOKU_MOTOR_PROBE=|TEIKOKU_MOTOR_PROBE_RESULT=)' teikoku-railway-probe.txt || true
            fi
            echo
            echo "Read-only; known URL only; >=3s access contract; no DB persistence."
          } > reply.txt
          gh issue comment 42 --repo "${GITHUB_REPOSITORY}" --body-file reply.txt
