name: Research V4 Fallback Timing Margin
on:
  pull_request:
    paths:
      - 'research/v4_fallback_timing_margin.py'
      - 'tests/test_v4_fallback_timing_margin.py'
      - 'research/v4_fallback_0820_activation_manifest.py'
      - 'tests/test_v4_fallback_0820_activation_manifest.py'
      - 'docs/V4_FALLBACK_0820_ACTIVATION_MANIFEST_20260927.md'
      - 'docs/V4_FALLBACK_TIMING_MARGIN_20260927.md'
      - '.github/workflows/research-v4-fallback-timing-margin.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Verify pure no-mutation design
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('research/v4_fallback_timing_margin.py').read_text(encoding='utf-8').lower()
          for token in ('requests','urllib','subprocess','psycopg','database_url','set_variables','update_service','mcp__railway','gh api'):
              assert token not in t, token
          PY
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_v4_fallback_timing_margin.py tests/test_v4_fallback_0820_activation_manifest.py
