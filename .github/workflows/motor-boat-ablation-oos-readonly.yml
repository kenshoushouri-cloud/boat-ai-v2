name: Motor boat probability ablation OOS read-only report

on:
  pull_request:
    paths:
      - '.github/workflows/motor-boat-ablation-oos-readonly.yml'
      - 'backtest_prob_motor_boat_ablation_pg.py'
  workflow_dispatch:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only fixed ablation
        run: |
          set -euo pipefail
          python -m py_compile backtest_prob_motor_boat_ablation_pg.py
          python - <<'PY'
          from pathlib import Path
          s=Path('backtest_prob_motor_boat_ablation_pg.py').read_text(encoding='utf-8')
          w=Path('.github/workflows/motor-boat-ablation-oos-readonly.yml').read_text(encoding='utf-8')
          assert 'from db_pg import fetch_all' in s
          assert 'MODES = ("BASE", "MOTOR", "BOAT", "BOTH")' in s
          assert 'fixed_ablation_no_coefficient_tuning_read_only' in s
          assert 'motor_place2_rate' in s and 'boat_place2_rate' in s
          assert 'execute(' not in s
          assert 'upsert' not in s.lower()
          assert 'send_line' not in s.lower()
          assert 'postgres-hobby-fullhistory-candidate-v4' in w
          assert 'default_transaction_read_only=on' in w
          assert 'railway ' + 'variable list' not in w
          assert 'list_' + 'variables' not in w
          print('MOTOR_BOAT_ABLATION_VALIDATE=PASS')
          PY

  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' && github.event.issue.number == 42 && github.actor == github.repository_owner && github.event.comment.body == '/railway motor-boat-ablation-oos')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Run fixed ablation against candidate-v4 read-only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; export ABLATION_START_DATE="2026-07-01"; export ABLATION_END_DATE="2026-08-15"; exec python -u backtest_prob_motor_boat_ablation_pg.py' \
            2>&1 | tee ablation-output.txt
          grep -q '^POLICY=fixed_ablation_no_coefficient_tuning_read_only$' ablation-output.txt
          grep -q '^RESULT=PASS_READ_ONLY$' ablation-output.txt
      - name: Reply with sanitized report
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Motor/boat probability ablation OOS read-only report'
            echo
            echo '~~~text'
            grep -E '^(✅ backtest_prob_motor_boat_ablation_pg.py|PERIOD=|POLICY=|COVERAGE=|=== OVERALL ===|BASE:|MOTOR:|BOAT:|BOTH:|DELTA_|=== MONTHLY ===|2026-07\||2026-08\||INTERPRETATION=|RESULT=)' ablation-output.txt 2>/dev/null || echo 'MOTOR_BOAT_ABLATION_DIAGNOSTIC=no_report_output'
            echo '~~~'
            echo
            echo 'candidate-v4 read-only fixed ablation only. No coefficient tuning, DB update, LINE, Production decision, Railway setting, rule/threshold change, Bao promotion, or PR #169 state change.'
          } > ablation-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file ablation-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f ablation-output.txt ablation-comment.md
