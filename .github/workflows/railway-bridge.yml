name: Railway bridge

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Railway bridge operation
        required: true
        default: status
        type: choice
        options:
          - status
          - inventory
          - config
          - vars-keys
          - vars-safe
          - logs
          - apply-watchpaths
          - redeploy
          - help
      service:
        description: Railway service for service-scoped operations
        required: false
        type: string
      confirmation:
        description: APPLY_WATCH_PATHS or REDEPLOY when required
        required: false
        type: string
  issue_comment:
    types:
      - created
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-bridge.yml

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  railway-bridge:
    if: >-
      github.event_name != 'issue_comment' ||
      (
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        (
          github.event.comment.body == '/railway status' ||
          github.event.comment.body == '/railway inventory' ||
          github.event.comment.body == '/railway config' ||
          github.event.comment.body == '/railway help' ||
          github.event.comment.body == '/railway apply-watchpaths CONFIRM' ||
          github.event.comment.body == '/railway postgres-recovery-stage2 CONFIRM' ||
          startsWith(github.event.comment.body, '/railway vars ') ||
          startsWith(github.event.comment.body, '/railway vars-safe ') ||
          startsWith(github.event.comment.body, '/railway logs ') ||
          startsWith(github.event.comment.body, '/railway redeploy ')
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Resolve operation
        id: op
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
          DISPATCH_SERVICE: ${{ inputs.service }}
          DISPATCH_CONFIRMATION: ${{ inputs.confirmation }}
        run: |
          set -euo pipefail

          op="status"
          service=""
          confirmed="0"

          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            op="${DISPATCH_OPERATION:-status}"
            service="${DISPATCH_SERVICE:-}"
            if [ "$op" = "apply-watchpaths" ] && [ "${DISPATCH_CONFIRMATION:-}" = "APPLY_WATCH_PATHS" ]; then
              confirmed="1"
            elif [ "$op" = "redeploy" ] && [ "${DISPATCH_CONFIRMATION:-}" = "REDEPLOY" ]; then
              confirmed="1"
            fi
          elif [ "$EVENT_NAME" = "issue_comment" ]; then
            case "$COMMENT_BODY" in
              "/railway status") op="status" ;;
              "/railway inventory") op="inventory" ;;
              "/railway config") op="config" ;;
              "/railway help") op="help" ;;
              "/railway apply-watchpaths CONFIRM")
                op="apply-watchpaths"
                confirmed="1"
                ;;
              "/railway postgres-recovery-stage2 CONFIRM")
                op="postgres-recovery-stage2"
                confirmed="1"
                ;;
              "/railway vars-safe "*)
                op="vars-safe"
                service="${COMMENT_BODY#/railway vars-safe }"
                ;;
              "/railway vars "*)
                op="vars-keys"
                service="${COMMENT_BODY#/railway vars }"
                ;;
              "/railway logs "*)
                op="logs"
                service="${COMMENT_BODY#/railway logs }"
                ;;
              "/railway redeploy "*" CONFIRM")
                op="redeploy"
                tmp="${COMMENT_BODY#/railway redeploy }"
                service="${tmp% CONFIRM}"
                confirmed="1"
                ;;
              *) op="status" ;;
            esac
          fi

          case "$op" in
            vars-keys|vars-safe|logs|redeploy)
              case "$service" in
                backtest-analysis|cron-daily-report|cron-data-prepare|cron-final-check|cron-learning-all|cron-monthly-report|cron-nightly-results|cron-racer-course-stats|cron-window-day|cron-window-morning|cron-window-night|historical-backfill|test-beforeinfo-extra|postgres)
                  ;;
                *)
                  echo "Unsupported Railway service."
                  exit 2
                  ;;
              esac
              ;;
            status|inventory|config|apply-watchpaths|postgres-recovery-stage2|help)
              service=""
              ;;
            *)
              echo "Unsupported Railway bridge operation."
              exit 2
              ;;
          esac

          if [ "$op" = "redeploy" ] && [ "$service" = "postgres" ]; then
            echo "Postgres redeploy is not permitted by this bridge."
            exit 2
          fi

          echo "operation=$op" >> "$GITHUB_OUTPUT"
          echo "service=$service" >> "$GITHUB_OUTPUT"
          echo "confirmed=$confirmed" >> "$GITHUB_OUTPUT"
          echo "Railway bridge operation: $op"
          if [ -n "$service" ]; then
            echo "Railway service: $service"
          fi

      - name: Record Railway CLI version
        shell: bash
        run: |
          set -euo pipefail
          railway --version | tee railway-version.txt

      - name: Require Railway token
        if: ${{ steps.op.outputs.operation != 'help' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi

      - name: Set up Python for Postgres recovery Stage 2
        if: ${{ steps.op.outputs.operation == 'postgres-recovery-stage2' }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute guarded Postgres recovery Stage 2
        if: ${{ steps.op.outputs.operation == 'postgres-recovery-stage2' }}
        shell: bash
        env:
          CONFIRMED: ${{ steps.op.outputs.confirmed }}
        run: |
          set -euo pipefail
          if [ "$CONFIRMED" != "1" ]; then
            {
              echo "## Railway Postgres recovery Stage 2"
              echo
              echo "STAGE2_BLOCK_CONFIRMATION_REQUIRED"
              echo
              echo "No Railway mutation was executed."
            } > railway-result-summary.md
            exit 1
          fi

          python -m pip install --disable-pip-version-check psycopg2-binary
          set +e
          python -u .github/scripts/postgres_recovery_stage2.py
          rc=$?
          set -e

          if [ -f stage2-result.md ]; then
            cp stage2-result.md railway-result-summary.md
          else
            {
              echo "## Railway Postgres recovery Stage 2"
              echo
              echo "STAGE2_BLOCK_MANUAL_REVIEW_REQUIRED"
              echo
              echo "No sanitized Stage 2 result file was produced."
            } > railway-result-summary.md
          fi
          rm -f stage2-result.md
          exit "$rc"

      - name: Railway status snapshot
        id: railway_status
        if: ${{ contains(fromJSON('["status","inventory","config"]'), steps.op.outputs.operation) }}
        shell: bash
        run: |
          set -euo pipefail
          if ! railway status --json > railway-status.json 2> railway-status-error.txt; then
            {
              echo "## Railway bridge ${{ steps.op.outputs.operation }}"
              echo
              echo "❌ Railway status query failed."
              echo
              echo "Railway CLI: \`$(cat railway-version.txt)\`"
              echo "Commit: \`${GITHUB_SHA}\`"
              echo
              echo "Secret values and raw stderr are intentionally not posted."
            } > railway-result-summary.md
            exit 1
          fi

      - name: Build safe status or inventory summary
        if: ${{ steps.op.outputs.operation == 'status' || steps.op.outputs.operation == 'inventory' }}
        shell: bash
        env:
          OPERATION: ${{ steps.op.outputs.operation }}
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path("railway-status.json").read_text(encoding="utf-8"))
          operation = os.environ["OPERATION"]
          cli_version = Path("railway-version.txt").read_text(encoding="utf-8").strip()

          lines = [
              f"## Railway bridge {operation}",
              "",
              "✅ Railway Project Token connection succeeded.",
              "",
              f"Railway CLI: `{cli_version}`",
              f"Commit: `{os.environ.get('GITHUB_SHA', '')}`",
          ]

          if operation == "inventory":
              service_names = {}
              for edge in (data.get("services") or {}).get("edges", []):
                  node = edge.get("node") or {}
                  if node.get("id") and node.get("name"):
                      service_names[node["id"]] = node["name"]

              rows = []
              for env_edge in (data.get("environments") or {}).get("edges", []):
                  env_node = env_edge.get("node") or {}
                  env_name = env_node.get("name") or "unknown"
                  for inst_edge in (env_node.get("serviceInstances") or {}).get("edges", []):
                      inst = inst_edge.get("node") or {}
                      sid = inst.get("serviceId")
                      service_name = (
                          service_names.get(sid)
                          or inst.get("serviceName")
                          or inst.get("name")
                          or "unresolved-service"
                      )
                      latest = inst.get("latestDeployment") or {}
                      meta = latest.get("meta") or {}
                      manifest = meta.get("serviceManifest") or {}
                      deploy = manifest.get("deploy") or {}
                      rows.append((
                          env_name,
                          service_name,
                          inst.get("cronSchedule") or deploy.get("cronSchedule") or "-",
                          inst.get("startCommand") or deploy.get("startCommand") or "-",
                          latest.get("status") or "-",
                          meta.get("branch") or "-",
                      ))

              rows.sort(key=lambda row: (row[0], row[1]))
              lines += [
                  "",
                  "Only non-secret operational fields are shown. Railway IDs, URLs and Variable values are not published.",
                  "",
                  f"Services discovered: **{len(rows)}**",
                  "",
                  "| Environment | Service | Cron | Start Command | Latest deployment | Branch |",
                  "|---|---|---|---|---|---|",
              ]

              def cell(value):
                  return str(value).replace("|", "\\|").replace("\n", " ")[:180]

              for row in rows:
                  env_name, service_name, cron, start, status, branch = row
                  lines.append(
                      f"| {cell(env_name)} | {cell(service_name)} | `{cell(cron)}` | "
                      f"`{cell(start)}` | {cell(status)} | {cell(branch)} |"
                  )
          else:
              lines += ["", "No Railway settings were changed by this operation."]

          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Read Railway environment config
        if: ${{ steps.op.outputs.operation == 'config' }}
        shell: bash
        run: |
          set -euo pipefail
          if ! railway environment config --json > railway-config.json 2> railway-config-error.txt; then
            {
              echo "## Railway bridge config"
              echo
              echo "❌ Railway environment config query failed."
              echo
              echo "Raw stderr was not published."
            } > railway-result-summary.md
            exit 1
          fi

      - name: Build safe Railway config summary
        if: ${{ steps.op.outputs.operation == 'config' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          status = json.loads(Path("railway-status.json").read_text(encoding="utf-8"))
          config = json.loads(Path("railway-config.json").read_text(encoding="utf-8"))
          cli_version = Path("railway-version.txt").read_text(encoding="utf-8").strip()

          services = []
          for edge in (status.get("services") or {}).get("edges", []):
              node = edge.get("node") or {}
              if node.get("id") and node.get("name"):
                  services.append((node["id"], node["name"]))

          def candidate_for(obj, sid, name):
              if isinstance(obj, dict):
                  for key in (sid, name):
                      value = obj.get(key)
                      if isinstance(value, dict) and any(
                          k in value for k in ("build", "deploy", "source", "variables")
                      ):
                          return value
                  marker_id = obj.get("serviceId") or obj.get("id")
                  marker_name = obj.get("serviceName") or obj.get("name")
                  if (
                      (marker_id == sid or marker_name == name)
                      and any(k in obj for k in ("build", "deploy", "source", "variables"))
                  ):
                      return obj
                  for value in obj.values():
                      found = candidate_for(value, sid, name)
                      if found is not None:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = candidate_for(value, sid, name)
                      if found is not None:
                          return found
              return None

          def nested(data, *keys):
              current = data
              for key in keys:
                  if not isinstance(current, dict):
                      return None
                  current = current.get(key)
              return current

          rows = []
          for sid, name in sorted(services, key=lambda item: item[1]):
              svc = candidate_for(config, sid, name)
              if svc is None:
                  rows.append((name, "unresolved", "-", "-", "-", "-"))
                  continue
              watch = nested(svc, "build", "watchPatterns")
              watch_text = (
                  "(not set)"
                  if watch is None
                  else json.dumps(watch, ensure_ascii=False, separators=(",", ":"))
              )
              rows.append((
                  name,
                  watch_text,
                  nested(svc, "source", "rootDirectory") or "-",
                  nested(svc, "build", "builder") or "-",
                  nested(svc, "deploy", "startCommand") or "-",
                  nested(svc, "deploy", "cronSchedule") or "-",
              ))

          resolved = sum(1 for row in rows if row[1] != "unresolved")
          lines = [
              "## Railway bridge config",
              "",
              "✅ Railway environment config read succeeded.",
              "",
              f"Railway CLI: `{cli_version}`",
              f"Commit: `{os.environ.get('GITHUB_SHA', '')}`",
              "",
              "Only deployment-relevant non-secret fields are shown. Variables, IDs, URLs and secret-like values are not published.",
              "",
              f"Services resolved: **{resolved}/{len(rows)}**",
              "",
              "| Service | Watch Paths | Root | Builder | Start Command | Cron |",
              "|---|---|---|---|---|---|",
          ]

          def cell(value):
              return str(value).replace("|", "\\|").replace("\n", " ")[:260]

          for name, watch, root, builder, start, cron in rows:
              lines.append(
                  f"| {cell(name)} | `{cell(watch)}` | `{cell(root)}` | "
                  f"{cell(builder)} | `{cell(start)}` | `{cell(cron)}` |"
              )

          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          PY

      - name: Read Railway Variable keys
        if: ${{ steps.op.outputs.operation == 'vars-keys' }}
        shell: bash
        env:
          SERVICE: ${{ steps.op.outputs.service }}
        run: |
          set -euo pipefail
          if ! railway variable list --service "$SERVICE" --environment production --json > railway-vars.json 2> railway-vars-error.txt; then
            {
              echo "## Railway variable keys"
              echo
              echo "Service: \`$SERVICE\`"
              echo
              echo "❌ Variable query failed. Raw stderr was not published."
            } > railway-result-summary.md
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          service = os.environ["SERVICE"]
          data = json.loads(Path("railway-vars.json").read_text(encoding="utf-8"))

          keys = set()
          if isinstance(data, dict):
              keys.update(str(key) for key in data)
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict):
                      key = item.get("name") or item.get("key")
                      if key:
                          keys.add(str(key))

          lines = [
              "## Railway variable keys",
              "",
              f"Service: `{service}`",
              "",
              "Only Variable names are shown. **No Variable values are published.**",
              "",
              f"Keys discovered: **{len(keys)}**",
              "",
              ", ".join(f"`{key}`" for key in sorted(keys)) or "(none)",
          ]
          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          Path("railway-vars.json").unlink(missing_ok=True)
          PY

      - name: Read allowlisted non-secret Variable values
        if: ${{ steps.op.outputs.operation == 'vars-safe' }}
        shell: bash
        env:
          SERVICE: ${{ steps.op.outputs.service }}
        run: |
          set -euo pipefail
          if ! railway variable list --service "$SERVICE" --environment production --json > railway-vars.json 2> railway-vars-error.txt; then
            {
              echo "## Railway safe variable values"
              echo
              echo "Service: \`$SERVICE\`"
              echo
              echo "❌ Variable query failed. Raw stderr was not published."
            } > railway-result-summary.md
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          service = os.environ["SERVICE"]
          data = json.loads(Path("railway-vars.json").read_text(encoding="utf-8"))

          SAFE_KEYS = {
              "CANDIDATE_SHADOW_DISABLED_RULES",
              "CANDIDATE_SHADOW_ENABLED",
              "CANDIDATE_SHADOW_REQUIRE_COMPLETE_ODDS",
              "CANDIDATE_SHADOW_RULES",
              "COLLECT_SCOPE",
              "DO_ODDS",
              "DO_RACES",
              "DO_RESULTS",
              "DRY_RUN",
              "FINAL_DEADLINE_FILTER",
              "FINAL_IGNORE_DAILY_LIMIT",
              "FINAL_WINDOW_AFTER_MIN",
              "FINAL_WINDOW_BEFORE_MIN",
              "LEARNING_ALL_ENABLED",
              "LEARNING_REALTIME_SLEEP_SEC",
              "LEARNING_SNAPSHOT_LABEL",
              "LEARNING_WINDOW_AFTER_MIN",
              "LEARNING_WINDOW_BEFORE_MIN",
              "ODDS_WORKERS",
              "REPAIR_WORKERS",
              "RUN_CANDIDATE_SHADOW_EVAL",
              "RUN_CANDIDATE_SHADOW_REPORT",
              "RUN_EXHIBITION_SHADOW_EVAL",
              "RUN_EXHIBITION_SHADOW_REPORT",
              "RUN_MOTOR2_FINAL_SHADOW",
              "RUN_MOTOR2_FORWARD_EVAL",
              "RUN_MOTOR2_FORWARD_REPORT",
              "RUN_MOTOR2_ROBUSTNESS_REPORT",
              "RUN_N02_FORWARD_REPORT",
              "RUN_N02_ROBUSTNESS_REPORT",
              "RUN_N02_VARIANT_FORWARD_REPORT",
              "RUN_N02_WINDLT4_SHADOW",
              "RUN_SHADOW_COLLECTION_HEALTH",
              "SELECTOR_MODE",
              "SHADOW_EVAL_STRICT",
              "SNAPSHOT_LABEL",
              "TARGET_ID_SCOPE",
              "TEST_MODE",
              "UNIT_YEN",
              "WINDOW_NAME",
              "WINDOW_ODDS_HEARTBEAT_SEC",
              "WINDOW_ODDS_RACE_WARN_SEC",
              "WINDOW_ODDS_RETRIES",
              "WINDOW_ODDS_RETRY_WAIT_SEC",
              "WINDOW_SKIP_FULL_ODDS",
              "WORKERS",
          }

          values = {}
          if isinstance(data, dict):
              values = {str(k): v for k, v in data.items()}
          elif isinstance(data, list):
              for item in data:
                  if not isinstance(item, dict):
                      continue
                  key = item.get("name") or item.get("key")
                  if key:
                      values[str(key)] = item.get("value")

          safe = [(key, values[key]) for key in sorted(SAFE_KEYS) if key in values]

          def clean(value):
              if value is None:
                  return "(null)"
              text = str(value).replace("\r", " ").replace("\n", " ")
              text = text.replace("|", "\\|").replace("`", "'")
              return text[:180]

          lines = [
              "## Railway safe variable values",
              "",
              f"Service: `{service}`",
              "",
              "Only explicitly allowlisted non-secret Variable values are shown.",
              "Secret-bearing keys such as DATABASE_URL, LINE tokens, passwords and credentials are never published.",
              "",
              f"Allowlisted values found: **{len(safe)}**",
              "",
              "| Key | Value |",
              "|---|---|",
          ]
          for key, value in safe:
              lines.append(f"| `{key}` | `{clean(value)}` |")
          if not safe:
              lines.append("| (none) | - |")

          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )
          Path("railway-vars.json").unlink(missing_ok=True)
          PY

      - name: Read and sanitize recent Railway logs
        if: ${{ steps.op.outputs.operation == 'logs' }}
        shell: bash
        env:
          SERVICE: ${{ steps.op.outputs.service }}
        run: |
          set -euo pipefail

          # Fetch Variables only to redact their exact values from logs.
          # This raw file is never published or uploaded.
          if ! railway variable list --service "$SERVICE" --environment production --json > railway-vars-redact.json 2> railway-vars-redact-error.txt; then
            {
              echo "## Railway sanitized logs"
              echo
              echo "Service: \`$SERVICE\`"
              echo
              echo "❌ Refusing to publish logs because the secret-redaction source could not be loaded."
            } > railway-result-summary.md
            exit 1
          fi

          set +e
          railway logs --service "$SERVICE" --environment production --lines 120 --latest > railway-logs-raw.txt 2> railway-logs-error.txt
          rc=$?
          set -e

          if [ "$rc" -ne 0 ]; then
            {
              echo "## Railway sanitized logs"
              echo
              echo "Service: \`$SERVICE\`"
              echo
              echo "❌ Railway log query failed. Raw stderr was not published."
            } > railway-result-summary.md
            rm -f railway-vars-redact.json railway-logs-raw.txt
            exit 1
          fi

          python - <<'PY'
          import json
          import os
          import re
          from pathlib import Path

          service = os.environ["SERVICE"]
          vars_data = json.loads(Path("railway-vars-redact.json").read_text(encoding="utf-8"))
          raw = Path("railway-logs-raw.txt").read_text(encoding="utf-8", errors="replace")

          values = []
          if isinstance(vars_data, dict):
              source_values = vars_data.values()
          elif isinstance(vars_data, list):
              source_values = [
                  item.get("value")
                  for item in vars_data
                  if isinstance(item, dict)
              ]
          else:
              source_values = []

          for value in source_values:
              if isinstance(value, (str, int, float)):
                  text = str(value)
                  if len(text) >= 4:
                      values.append(text)

          # Replace exact Variable values first, longest first.
          for value in sorted(set(values), key=len, reverse=True):
              raw = raw.replace(value, "[REDACTED_VARIABLE]")

          # Defense-in-depth redaction for common secret forms.
          raw = re.sub(
              r"(?i)\b(DATABASE_URL|TOKEN|SECRET|PASSWORD|PASSWD|API_KEY|ACCESS_KEY|AUTHORIZATION|LINE_TO)\b\s*[:=]\s*\S+",
              r"\1=[REDACTED]",
              raw,
          )
          raw = re.sub(
              r"(?i)\bBearer\s+[A-Za-z0-9._~+/=-]+",
              "Bearer [REDACTED]",
              raw,
          )
          raw = re.sub(
              r"\beyJ[A-Za-z0-9_-]{16,}\.[A-Za-z0-9_-]{8,}\.[A-Za-z0-9_-]{8,}\b",
              "[REDACTED_JWT]",
              raw,
          )
          raw = re.sub(
              r"([A-Za-z][A-Za-z0-9+.-]*://)([^@\s/]+)@",
              r"\1[REDACTED_CREDENTIALS]@",
              raw,
          )

          cleaned = []
          for line in raw.splitlines()[-120:]:
              line = line.replace("\x00", "")
              if len(line) > 700:
                  line = line[:700] + "…"
              cleaned.append(line)

          lines = [
              "## Railway sanitized logs",
              "",
              f"Service: `{service}`",
              "",
              "Recent deploy logs, capped at 120 lines. Railway Variable values and common secret forms are redacted before publication.",
              "",
          ]
          if cleaned:
              lines.extend("    " + line for line in cleaned)
          else:
              lines.append("    (no log lines returned)")

          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

          Path("railway-vars-redact.json").unlink(missing_ok=True)
          Path("railway-logs-raw.txt").unlink(missing_ok=True)
          PY

      - name: Apply and verify fixed Watch Paths
        if: ${{ steps.op.outputs.operation == 'apply-watchpaths' }}
        shell: bash
        env:
          CONFIRMED: ${{ steps.op.outputs.confirmed }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMED" != "1" ]; then
            {
              echo "## Railway Watch Paths apply"
              echo
              echo "❌ Confirmation missing. No Railway settings were changed."
              echo
              echo "Issue command must be exactly: \`/railway apply-watchpaths CONFIRM\`"
            } > railway-result-summary.md
            exit 1
          fi

          if ! command -v script >/dev/null 2>&1; then
            {
              echo "## Railway Watch Paths apply"
              echo
              echo "❌ The pseudo-TTY helper \`script\` is unavailable. No settings were changed."
            } > railway-result-summary.md
            exit 1
          fi

          WATCH_PATTERNS='["/*.py","/requirements.txt","/utils/**","/scripts/**","/railway.json","/railway.toml"]'
          export WATCH_PATTERNS

          services=(
            backtest-analysis
            cron-daily-report
            cron-data-prepare
            cron-final-check
            cron-learning-all
            cron-monthly-report
            cron-nightly-results
            cron-racer-course-stats
            cron-window-day
            cron-window-morning
            cron-window-night
            historical-backfill
            test-beforeinfo-extra
          )

          command_failed=()
          for service in "${services[@]}"; do
            export SERVICE="$service"
            set +e
            script -q -e -c \
              'railway environment edit --service-config "$SERVICE" build.watchPatterns "$WATCH_PATTERNS" --message "ops: restrict automatic deploy watch paths" --json' \
              /dev/null > "railway-edit-${service}.txt" 2>&1
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              command_failed+=("$service")
            fi
          done

          # Postcondition is authoritative: read the environment again and verify
          # the exact fixed pattern list for every target service.
          railway status --json > railway-watch-status.json 2> railway-watch-status-error.txt
          railway environment config --json > railway-watch-config.json 2> railway-watch-config-error.txt

          COMMAND_FAILED="$(IFS=,; echo "${command_failed[*]-}")"
          export COMMAND_FAILED

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected = [
              "/*.py",
              "/requirements.txt",
              "/utils/**",
              "/scripts/**",
              "/railway.json",
              "/railway.toml",
          ]
          targets = [
              "backtest-analysis",
              "cron-daily-report",
              "cron-data-prepare",
              "cron-final-check",
              "cron-learning-all",
              "cron-monthly-report",
              "cron-nightly-results",
              "cron-racer-course-stats",
              "cron-window-day",
              "cron-window-morning",
              "cron-window-night",
              "historical-backfill",
              "test-beforeinfo-extra",
          ]

          status = json.loads(Path("railway-watch-status.json").read_text(encoding="utf-8"))
          config = json.loads(Path("railway-watch-config.json").read_text(encoding="utf-8"))

          service_ids = {}
          for edge in (status.get("services") or {}).get("edges", []):
              node = edge.get("node") or {}
              if node.get("id") and node.get("name"):
                  service_ids[node["name"]] = node["id"]

          def candidate_for(obj, sid, name):
              if isinstance(obj, dict):
                  for key in (sid, name):
                      value = obj.get(key)
                      if isinstance(value, dict) and any(
                          k in value for k in ("build", "deploy", "source", "variables")
                      ):
                          return value
                  marker_id = obj.get("serviceId") or obj.get("id")
                  marker_name = obj.get("serviceName") or obj.get("name")
                  if (
                      (marker_id == sid or marker_name == name)
                      and any(k in obj for k in ("build", "deploy", "source", "variables"))
                  ):
                      return obj
                  for value in obj.values():
                      found = candidate_for(value, sid, name)
                      if found is not None:
                          return found
              elif isinstance(obj, list):
                  for value in obj:
                      found = candidate_for(value, sid, name)
                      if found is not None:
                          return found
              return None

          verified = []
          missing = []
          for name in targets:
              sid = service_ids.get(name, "")
              svc = candidate_for(config, sid, name)
              watch = None
              if isinstance(svc, dict):
                  build = svc.get("build")
                  if isinstance(build, dict):
                      watch = build.get("watchPatterns")
              if watch == expected:
                  verified.append(name)
              else:
                  missing.append(name)

          command_failed = [
              item for item in os.environ.get("COMMAND_FAILED", "").split(",") if item
          ]

          lines = [
              "## Railway Watch Paths apply",
              "",
              f"Fixed Watch Paths: `{json.dumps(expected, separators=(',', ':'))}`",
              "",
              f"Target count: **{len(targets)}** (postgres excluded)",
              f"CLI command failures: **{len(command_failed)}**",
              f"Postcondition verified: **{len(verified)}/{len(targets)}**",
              "",
          ]
          if command_failed:
              lines.append("Command failures: " + ", ".join(f"`{x}`" for x in command_failed))
          if missing:
              lines.append("Not verified: " + ", ".join(f"`{x}`" for x in missing))
          if not command_failed and not missing:
              lines += [
                  "✅ All target services now have the exact fixed Watch Paths.",
                  "",
                  "`.github/**`, README/docs, tests and archive-only changes no longer match these deployment triggers.",
              ]
          else:
              lines += [
                  "",
                  "❌ Verification failed. Do not assume Watch Paths are active for unverified services.",
              ]

          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n", encoding="utf-8"
          )

          for path in Path(".").glob("railway-edit-*.txt"):
              path.unlink(missing_ok=True)

          if command_failed or missing:
              raise SystemExit(1)
          PY

      - name: Guarded Railway redeploy
        if: ${{ steps.op.outputs.operation == 'redeploy' }}
        shell: bash
        env:
          SERVICE: ${{ steps.op.outputs.service }}
          CONFIRMED: ${{ steps.op.outputs.confirmed }}
        run: |
          set -euo pipefail

          if [ "$CONFIRMED" != "1" ]; then
            {
              echo "## Railway redeploy"
              echo
              echo "Service: \`$SERVICE\`"
              echo
              echo "❌ Confirmation missing. No redeploy was started."
              echo
              echo "Issue command: \`/railway redeploy $SERVICE CONFIRM\`"
            } > railway-result-summary.md
            exit 1
          fi

          if ! railway redeploy --service "$SERVICE" --yes --json > railway-redeploy.json 2> railway-redeploy-error.txt; then
            {
              echo "## Railway redeploy"
              echo
              echo "Service: \`$SERVICE\`"
              echo
              echo "❌ Redeploy failed. Raw stderr was not published."
            } > railway-result-summary.md
            exit 1
          fi

          {
            echo "## Railway redeploy"
            echo
            echo "Service: \`$SERVICE\`"
            echo
            echo "✅ Railway accepted the guarded redeploy request."
            echo
            echo "No secret values are published."
          } > railway-result-summary.md
          rm -f railway-redeploy.json

      - name: Build help summary
        if: ${{ steps.op.outputs.operation == 'help' }}
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "## Railway bridge help"
            echo
            echo "Read-only:"
            echo '- `/railway status`'
            echo '- `/railway inventory`'
            echo '- `/railway config`'
            echo '- `/railway vars <service>` — Variable names only'
            echo '- `/railway vars-safe <service>` — allowlisted non-secret values only'
            echo '- `/railway logs <service>` — recent logs with Variable-value redaction'
            echo
            echo "Guarded writes:"
            echo '- `/railway apply-watchpaths CONFIRM`'
            echo '- `/railway redeploy <service> CONFIRM`'
            echo
            echo "Destructive operations, arbitrary shell commands and arbitrary secret reads are not supported."
          } > railway-result-summary.md

      - name: Remove raw sensitive files
        if: always()
        shell: bash
        run: |
          rm -f \
            railway-vars.json \
            railway-vars-redact.json \
            railway-logs-raw.txt \
            railway-status.json \
            railway-config.json \
            railway-watch-status.json \
            railway-watch-config.json \
            railway-redeploy.json

      - name: Post Railway result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f railway-result-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file railway-result-summary.md
          fi
