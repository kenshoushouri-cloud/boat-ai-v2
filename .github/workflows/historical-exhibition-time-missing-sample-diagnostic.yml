name: Historical Exhibition Time missing-sample diagnostic

on:
  pull_request:
    paths:
      - ".github/workflows/historical-exhibition-time-missing-sample-diagnostic.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate diagnostic workflow safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path(".github/workflows/historical-exhibition-time-missing-sample-diagnostic.yml")
          text=p.read_text(encoding="utf-8")
          parsed=yaml.safe_load(text)
          assert isinstance(parsed, dict) and "jobs" in parsed
          assert "postgres-hobby-fullhistory-candidate-v4" in text
          assert "default_transaction_read_only" in text
          assert "railway " + "variable list" not in text
          assert "list_" + "variables" not in text
          assert "CONFIRM_HISTORICAL_" + "BEFOREINFO_DB_WRITE" not in text
          assert "/railway historical-exhibition-db-distribution" in text
          assert "/railway historical-exhibition-failure-samples" in text
          assert "v2_" + "results" not in text
          assert "v2_" + "odds" not in text
          print("PASS historical exhibition diagnostics safety")
          PY

  diagnose:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-missing-sample'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Select one July missing race read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          cat > missing.sql <<'SQL'
          \set ON_ERROR_STOP on
          SET default_transaction_read_only = on;
          SET statement_timeout = '30s';
          \pset tuples_only on
          \pset format unaligned
          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          )
          SELECT r.race_id || '|' ||
                 r.race_date::text || '|' ||
                 lpad(coalesce(r.venue_id,r.venue_code)::text,2,'0') || '|' ||
                 r.race_no::text
            FROM v2_races r
            LEFT JOIN ex USING(race_id)
           WHERE r.race_date >= DATE '2026-07-01'
             AND r.race_date <= DATE '2026-07-31'
             AND coalesce(ex.time_count,0) < 6
           ORDER BY r.race_date, r.race_id
           LIMIT 1;
          SQL
          railway connect "$TARGET_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh < missing.sql > missing.out
          line="$(grep -E '^[^|]+\|2026-07-[0-9]{2}\|[0-9]{2}\|[0-9]+$' missing.out | head -n1)"
          test -n "$line"
          IFS='|' read -r race_id race_date venue race_no <<< "$line"
          {
            echo "SAMPLE_RACE_ID=$race_id"
            echo "SAMPLE_RACE_DATE=$race_date"
            echo "SAMPLE_VENUE=$venue"
            echo "SAMPLE_RACE_NO=$race_no"
          } >> "$GITHUB_ENV"

      - name: Inspect official page and parser structure
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os, re
          from pathlib import Path
          import requests
          from bs4 import BeautifulSoup
          import historical_beforeinfo_parser_v3 as hp
          import v21_realtime_collector_pg as rt

          race_id=os.environ["SAMPLE_RACE_ID"]
          date=os.environ["SAMPLE_RACE_DATE"]
          venue=os.environ["SAMPLE_VENUE"].zfill(2)
          race_no=int(os.environ["SAMPLE_RACE_NO"])
          hd=date.replace("-","")
          url=("https://www.boatrace.jp/owpc/pc/race/beforeinfo"
               f"?rno={race_no}&jcd={venue}&hd={hd}")
          s=requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; boat-ai-v2-missing-sample/1.0)"})
          r=s.get(url,timeout=35)
          r.raise_for_status()
          r.encoding=r.apparent_encoding or "utf-8"
          html=r.text
          soup=BeautifulSoup(html,"html.parser")
          text=" ".join(soup.get_text(" ",strip=True).split())
          parsed=hp.parse_exhibition(html)
          realtime=rt.parse_exhibition(html)
          before_start=text.split("スタート展示",1)[0]
          times=re.findall(r"(?<!\d)([67]\.\d{2})(?!\d)", before_start)
          tbodies=soup.select("tbody.is-fs12")
          direct=[]
          for tbody in tbodies[:8]:
              trs=tbody.find_all("tr",recursive=False)
              if not trs:
                  continue
              cells=[" ".join(c.get_text(" ",strip=True).split())[:80]
                     for c in trs[0].find_all(["th","td"],recursive=False)]
              direct.append(cells[:9])
          keys={}
          for key in ("展示タイム","スタート展示","水面気象情報","直前情報"):
              pos=text.find(key)
              keys[key]=(text[max(0,pos-100):pos+260] if pos>=0 else "NOT_FOUND")
          lines=[
              "## Historical Exhibition Time missing-sample diagnostic",
              "",
              f"sample={race_id} date={date} venue={venue} race={race_no}R",
              f"http_status={r.status_code} html_bytes={len(html.encode('utf-8'))}",
              f"looks_no_data={rt._looks_no_data(html)}",
              f"historical_parser_rows={len(parsed)} realtime_parser_rows={len(realtime)}",
              f"tbody_is_fs12={len(tbodies)} candidate_times_before_start={len(times)}",
              f"candidate_times={times[:12]}",
              f"first_direct_rows={direct}",
              "",
              "keyword_context:",
          ]
          for key,val in keys.items():
              lines.append(f"- {key}: {val[:360]}")
          lines += [
              "",
              "Read-only DB selection + one official HTTP GET. No DB write, Railway setting change, Production/LINE/purchase change.",
          ]
          Path("summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Missing-sample diagnostic failed before summary generation. No DB write or Railway setting change was requested."
          fi


  db-distribution:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-db-distribution'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Read July Exhibition Time distribution only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          cat > distribution.sql <<'SQL'
          \set ON_ERROR_STOP on
          SET default_transaction_read_only = on;
          SET statement_timeout = '30s';
          \pset tuples_only on
          \pset format unaligned

          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          ),
          targets AS (
            SELECT r.race_id,
                   coalesce(ex.time_count,0)::int AS time_count
              FROM v2_races r
              LEFT JOIN ex USING(race_id)
             WHERE r.race_date >= DATE '2026-07-01'
               AND r.race_date <= DATE '2026-07-31'
               AND coalesce(ex.time_count,0) < 6
          )
          SELECT 'TARGET_RACES|' || count(*) FROM targets;

          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          ),
          targets AS (
            SELECT r.race_id,
                   coalesce(ex.time_count,0)::int AS time_count
              FROM v2_races r
              LEFT JOIN ex USING(race_id)
             WHERE r.race_date >= DATE '2026-07-01'
               AND r.race_date <= DATE '2026-07-31'
               AND coalesce(ex.time_count,0) < 6
          )
          SELECT 'TIME_COUNT|' || g.n || '|' || count(t.race_id)
            FROM generate_series(0,5) AS g(n)
            LEFT JOIN targets t ON t.time_count=g.n
           GROUP BY g.n
           ORDER BY g.n;

          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          ),
          targets AS (
            SELECT r.race_id,
                   coalesce(ex.time_count,0)::int AS time_count
              FROM v2_races r
              LEFT JOIN ex USING(race_id)
             WHERE r.race_date >= DATE '2026-07-01'
               AND r.race_date <= DATE '2026-07-31'
               AND coalesce(ex.time_count,0) < 6
          ),
          missing AS (
            SELECT t.race_id,
                   lane.n AS missing_lane
              FROM targets t
              CROSS JOIN generate_series(1,6) AS lane(n)
              LEFT JOIN v2_realtime_exhibition_snapshots s
                ON s.race_id=t.race_id
               AND s.snapshot_label='historical'
               AND s.lane=lane.n
               AND s.exhibition_time IS NOT NULL
             WHERE s.race_id IS NULL
          )
          SELECT 'MISSING_LANE|' || lane.n || '|' || count(m.race_id)
            FROM generate_series(1,6) AS lane(n)
            LEFT JOIN missing m ON m.missing_lane=lane.n
           GROUP BY lane.n
           ORDER BY lane.n;

          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          ),
          targets AS (
            SELECT r.race_id,
                   coalesce(ex.time_count,0)::int AS time_count
              FROM v2_races r
              LEFT JOIN ex USING(race_id)
             WHERE r.race_date >= DATE '2026-07-01'
               AND r.race_date <= DATE '2026-07-31'
               AND coalesce(ex.time_count,0) < 6
          ),
          missing AS (
            SELECT t.race_id,
                   lane.n AS missing_lane
              FROM targets t
              CROSS JOIN generate_series(1,6) AS lane(n)
              LEFT JOIN v2_realtime_exhibition_snapshots s
                ON s.race_id=t.race_id
               AND s.snapshot_label='historical'
               AND s.lane=lane.n
               AND s.exhibition_time IS NOT NULL
             WHERE s.race_id IS NULL
          ),
          patterns AS (
            SELECT race_id,
                   string_agg(missing_lane::text, ',' ORDER BY missing_lane) AS lanes
              FROM missing
             GROUP BY race_id
          )
          SELECT 'MISSING_PATTERN|' || lanes || '|' || count(*)
            FROM patterns
           GROUP BY lanes
           ORDER BY count(*) DESC, lanes;

          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          ),
          targets AS (
            SELECT r.race_id,
                   coalesce(ex.time_count,0)::int AS time_count
              FROM v2_races r
              LEFT JOIN ex USING(race_id)
             WHERE r.race_date >= DATE '2026-07-01'
               AND r.race_date <= DATE '2026-07-31'
               AND coalesce(ex.time_count,0) < 6
          ),
          missing AS (
            SELECT t.race_id,
                   count(*) AS missing_count
              FROM targets t
              CROSS JOIN generate_series(1,6) AS lane(n)
              LEFT JOIN v2_realtime_exhibition_snapshots s
                ON s.race_id=t.race_id
               AND s.snapshot_label='historical'
               AND s.lane=lane.n
               AND s.exhibition_time IS NOT NULL
             WHERE s.race_id IS NULL
             GROUP BY t.race_id
          )
          SELECT 'RACES_BY_MISSING_COUNT|' || missing_count || '|' || count(*)
            FROM missing
           GROUP BY missing_count
           ORDER BY missing_count;
          SQL

          railway connect "$TARGET_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh \
            < distribution.sql > distribution.out

          grep -E '^(TARGET_RACES|TIME_COUNT|MISSING_LANE|MISSING_PATTERN|RACES_BY_MISSING_COUNT)\|' \
            distribution.out > distribution.sanitized
          test -s distribution.sanitized

      - name: Post sanitized distribution
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## July Exhibition Time DB distribution'
            echo
            if [ -s distribution.sanitized ]; then
              echo 'Read-only candidate-v4 distribution:'
              echo
              echo '~~~text'
              cat distribution.sanitized
              echo '~~~'
            else
              echo 'Distribution diagnostic did not produce a sanitized result.'
            fi
            echo
            echo 'No HTTP, DB write, Railway setting change, result/odds/payout read, Production/LINE/purchase change.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md


  failure-samples:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-failure-samples'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt

      - name: Diagnose three representative parser-failure pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          import requests
          from bs4 import BeautifulSoup

          import historical_beforeinfo_parser_v3 as hp
          import v21_realtime_collector_pg as rt

          cases = [
              ("2026-07-17", "01", 12),
              ("2026-07-28", "09", 12),
              ("2026-07-29", "09", 1),
          ]

          session = requests.Session()
          session.headers.update({
              "User-Agent": "Mozilla/5.0 (compatible; boat-ai-v2-failure-sample/1.0)"
          })

          lines = [
              "## Exhibition Time parser-failure representative diagnosis",
              "",
              "Read-only official beforeinfo GETs: 3.",
              "",
              "~~~text",
          ]

          diagnoses = {}
          for date_str, venue, race_no in cases:
              hd = date_str.replace("-", "")
              race_id = f"{hd}_{venue}_{race_no:02d}"
              url = (
                  "https://www.boatrace.jp/owpc/pc/race/beforeinfo"
                  f"?rno={race_no}&jcd={venue}&hd={hd}"
              )
              response = session.get(url, timeout=35)
              response.raise_for_status()
              response.encoding = response.apparent_encoding or "utf-8"
              html = response.text

              soup = BeautifulSoup(html, "html.parser")
              text = " ".join(soup.get_text(" ", strip=True).split())
              inspection = hp.inspect_exhibition_time_page(html)

              boat_rows = []
              structured_valid_times = []
              structured_blank_times = []
              for tbody in soup.select("tbody.is-fs12"):
                  trs = tbody.find_all("tr", recursive=False)
                  if not trs:
                      continue
                  cells = [
                      " ".join(cell.get_text(" ", strip=True).split())
                      for cell in trs[0].find_all(["th", "td"], recursive=False)
                  ]
                  lane = None
                  for value in cells[:3]:
                      if re.fullmatch(r"[1-6]", value):
                          lane = int(value)
                          break
                  if lane is None:
                      continue
                  time_cell = cells[4] if len(cells) > 4 else ""
                  boat_rows.append((lane, time_cell))
                  if re.fullmatch(r"[67]\.\d{2}", time_cell):
                      structured_valid_times.append((lane, time_cell))
                  elif time_cell == "":
                      structured_blank_times.append(lane)

              before_start = text.split("スタート展示", 1)[0]
              text_times = re.findall(
                  r"(?<!\d)([67]\.\d{2})(?!\d)",
                  before_start,
              )

              if (
                  len(boat_rows) == 6
                  and len(structured_valid_times) == 0
                  and len(text_times) == 0
              ):
                  diagnosis = "official_exhibition_values_absent"
              elif len(structured_valid_times) > 0 or len(text_times) > 0:
                  diagnosis = "parser_or_markup_mismatch"
              else:
                  diagnosis = "official_or_markup_unknown"

              diagnoses[diagnosis] = diagnoses.get(diagnosis, 0) + 1
              markers = [
                  key for key in ("中止", "欠場", "不成立", "順延")
                  if key in text
              ]
              lines.append(
                  f"{race_id} status={inspection.get('status')} "
                  f"structured_boat_rows={len(boat_rows)} "
                  f"structured_valid_times={len(structured_valid_times)} "
                  f"structured_blank_time_lanes={structured_blank_times} "
                  f"text_times={len(text_times)} "
                  f"looks_no_data={rt._looks_no_data(html)} "
                  f"markers={markers} diagnosis={diagnosis}"
              )

          lines += [
              "~~~",
              "",
              "Summary:",
              *[
                  f"- {key}={value}"
                  for key, value in sorted(diagnoses.items())
              ],
              "- http_requests=3",
              "- db_write=0",
              "",
              "No DB access/write, Railway setting change, result/odds/payout read, Production/LINE/purchase change, or Aug/Sep execution.",
          ]
          Path("failure-samples-summary.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Post sanitized failure-sample diagnosis
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -s failure-samples-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file failure-samples-summary.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Failure-sample diagnostic did not produce a summary. No DB or Railway mutation was requested."
          fi
