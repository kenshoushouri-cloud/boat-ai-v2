name: Railway DB size check

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created
  push:
    branches:
      - main
    paths:
      - .github/workflows/railway-db-size.yml

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"
  PGOPTIONS: -c default_transaction_read_only=on -c temp_file_limit=65536

jobs:
  db-size:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway db-size'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Require Railway token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi

      - name: Load public database URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          railway variable list \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json 2> railway-vars-error.txt

          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break

          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found for postgres-recovery')

          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run read-only database size check
        shell: bash
        run: |
          set -euo pipefail
          python -u pg_db_size_check.py > railway-db-size.txt 2> railway-db-size-error.txt

      - name: Estimate hot-retention footprint read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timedelta, timezone
          from pathlib import Path
          from db_pg import fetch_all, fetch_one

          JST = timezone(timedelta(hours=9))
          today = datetime.now(JST).date()
          hot_windows = (30, 60, 90)
          candidates = [
              'v2_odds_trifecta',
              'v2_realtime_odds_snapshots',
              'v2_v24_motor2_forward_shadow',
              'v2_result_entries',
              'v2_realtime_racer_condition_snapshots',
              'v2_realtime_weather_snapshots',
              'v2_realtime_race_condition_snapshots',
              'v2_race_entries',
              'v2_realtime_exhibition_snapshots',
              'v2_racer_course_stats_snapshots',
              'v2_realtime_entry_snapshots',
              'v2_results',
              'v2_races',
          ]

          def exists(table):
              r=fetch_one("select to_regclass(%s) is not null ok", (f'public.{table}',)) or {}
              return bool(r.get('ok'))

          def cols(table):
              return {str(r['column_name']) for r in fetch_all(
                  "select column_name from information_schema.columns where table_schema='public' and table_name=%s",
                  (table,)
              )}

          rows=[]
          for table in candidates:
              if not exists(table):
                  continue
              cs=cols(table)
              size=int((fetch_one(
                  "select pg_total_relation_size(%s::regclass)::bigint bytes",
                  (f'public.{table}',)
              ) or {}).get('bytes') or 0)
              total=int((fetch_one(f"select count(*)::bigint n from {table}") or {}).get('n') or 0)
              if table == 'v2_races' and 'race_date' in cs:
                  source="v2_races.race_date"
                  def count_hot(cutoff):
                      return int((fetch_one(
                          "select count(*)::bigint n from v2_races where race_date >= %s",
                          (cutoff,)
                      ) or {}).get('n') or 0)
              elif 'race_id' in cs:
                  source="join:v2_races.race_date"
                  def count_hot(cutoff):
                      return int((fetch_one(
                          f"select count(*)::bigint n from {table} t join v2_races r on r.race_id=t.race_id where r.race_date >= %s",
                          (cutoff,)
                      ) or {}).get('n') or 0)
              elif 'race_date' in cs:
                  source=f"{table}.race_date"
                  def count_hot(cutoff):
                      return int((fetch_one(
                          f"select count(*)::bigint n from {table} where race_date >= %s",
                          (cutoff,)
                      ) or {}).get('n') or 0)
              else:
                  continue
              rec={'table':table,'bytes':size,'rows':total,'source':source,'windows':{}}
              for days in hot_windows:
                  cutoff=today-timedelta(days=days)
                  hot=count_hot(cutoff)
                  old=max(0,total-hot)
                  est_old=int(size*(old/total)) if total else 0
                  rec['windows'][days]={'cutoff':str(cutoff),'hot':hot,'old':old,'est_old_bytes':est_old}
              rows.append(rec)

          rows.sort(key=lambda x:x['bytes'], reverse=True)
          def mb(n): return n/1024/1024
          lines=[
              '### Hot-retention planning estimate',
              '',
              '> Read-only planning estimate. Reclaimable MB is proportional to row counts and is not a promise of physical disk shrinkage. No rows were read for result/odds/payout values and no rows/schema/settings were changed.',
              '',
              '| Table | Current MB | Keep 30d / est. archive MB | Keep 60d / est. archive MB | Keep 90d / est. archive MB | Date basis |',
              '|---|---:|---:|---:|---:|---|',
          ]
          for x in rows:
              cells=[]
              for days in hot_windows:
                  w=x['windows'][days]
                  cells.append(f"{w['hot']:,} rows / {mb(w['est_old_bytes']):.0f} MB")
              lines.append(f"| `{x['table']}` | {mb(x['bytes']):.0f} | {cells[0]} | {cells[1]} | {cells[2]} | {x['source']} |")
          for days in hot_windows:
              est=sum(x['windows'][days]['est_old_bytes'] for x in rows)
              lines += ['', f'Estimated archive candidate across listed tables if retaining {days} days hot: **{mb(est):.0f} MB**.']
          Path('railway-db-retention.md').write_text('\n'.join(lines)+'\n', encoding='utf-8')
          PY

      - name: Build safe summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path

          text = Path('railway-db-size.txt').read_text(encoding='utf-8', errors='replace')
          m = re.search(r'^database_size:\s*(.+)$', text, re.MULTILINE)
          db_size = m.group(1).strip() if m else 'unknown'

          rows = []
          in_tables = False
          for line in text.splitlines():
              if line.strip() == '--- table sizes top 30 ---':
                  in_tables = True
                  continue
              if in_tables:
                  if line.startswith('==='):
                      break
                  if ': ' in line:
                      name, size = line.split(': ', 1)
                      if re.fullmatch(r'[A-Za-z0-9_]+', name):
                          rows.append((name, size[:40]))

          lines = [
              '## Railway PostgreSQL size',
              '',
              '✅ Read-only database size check completed.',
              '',
              f'Database size: **{db_size}**',
              '',
              'Railway Hobby database limit reference: **5 GB**.',
              '',
              '### Largest tables',
              '',
              '| Table | Total size |',
              '|---|---:|',
          ]
          for name, size in rows[:15]:
              lines.append(f'| `{name}` | {size} |')
          if not rows:
              lines.append('| (not returned) | - |')

          retention = Path('railway-db-retention.md')
          if retention.exists():
              lines += ['', *retention.read_text(encoding='utf-8').splitlines()]

          lines += [
              '',
              'This operation only executed PostgreSQL size/count reads; no rows, schema, Variables, deployments, or Railway settings were changed.',
          ]

          Path('railway-db-size-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Build failure summary
        if: failure()
        shell: bash
        run: |
          {
            echo '## Railway PostgreSQL size'
            echo
            echo '❌ Read-only database size check failed.'
            echo
            echo 'No database rows, schema, Railway Variables, deployments, or settings were changed.'
            echo 'Raw stderr and secret-bearing values were not published.'
          } > railway-db-size-summary.md

      - name: Remove raw sensitive files
        if: always()
        shell: bash
        run: |
          rm -f \
            railway-vars.json \
            railway-vars-error.txt \
            railway-db-size.txt \
            railway-db-size-error.txt \
            railway-db-retention.md

      - name: Post result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f railway-db-size-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file railway-db-size-summary.md
          fi

  hobby-parity:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-candidate-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
      RAILWAY_ENVIRONMENT: "production"
      HOT_CUTOFF: "2026-08-02"

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install "psycopg[binary]>=3.2,<4"
          npm install --global @railway/cli

      - name: Write read-only parity probe
        shell: bash
        run: |
          cat > /tmp/hobby_parity.py <<'PY'
          import json, os, psycopg
          role=os.environ["AUDIT_ROLE"]
          cutoff=os.environ["HOT_CUTOFF"]
          url=os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          base=["v2_races","v2_race_entries","v2_results","v2_result_entries"]
          hot=[
              "v2_odds_trifecta",
              "v2_realtime_racer_condition_snapshots",
              "v2_realtime_weather_snapshots",
              "v2_realtime_race_condition_snapshots",
              "v2_realtime_exhibition_snapshots",
          ]
          observe=[
              "v2_realtime_odds_snapshots",
              "v2_v24_motor2_forward_shadow",
              "v2_racer_course_stats_snapshots",
              "v2_realtime_entry_snapshots",
              "v2_opponent_pressure_shadow_v2",
          ]
          out={"role":role,"cutoff":cutoff,"database_bytes":0,"base":{},"hot":{},"observe":{}}
          with psycopg.connect(url, autocommit=False) as conn:
              with conn.cursor() as cur:
                  cur.execute("set transaction read only")
                  cur.execute("set local statement_timeout='120s'")
                  cur.execute("select pg_database_size(current_database())")
                  out["database_bytes"]=int(cur.fetchone()[0])
                  for t in base:
                      cur.execute(f"select count(*)::bigint from public.{t}")
                      out["base"][t]=int(cur.fetchone()[0])
                  for t in hot:
                      cur.execute(
                          f"""select count(*)::bigint,
                                     count(*) filter(where r.race_date >= %s::date)::bigint,
                                     count(*) filter(where r.race_date < %s::date)::bigint
                              from public.{t} x
                              join public.v2_races r on r.race_id=x.race_id""",
                          (cutoff,cutoff),
                      )
                      total,hot_n,old_n=cur.fetchone()
                      out["hot"][t]={"total":int(total),"hot":int(hot_n),"old":int(old_n)}
                  for t in observe:
                      cur.execute("select to_regclass(%s)",(f"public.{t}",))
                      if cur.fetchone()[0] is None:
                          continue
                      cur.execute(f"select count(*)::bigint from public.{t}")
                      out["observe"][t]=int(cur.fetchone()[0])
              conn.rollback()
          print("HOBBY_PARITY="+json.dumps(out,sort_keys=True))
          PY

      - name: Read source counts
        shell: bash
        run: |
          set -euo pipefail
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service postgres-recovery bash -lc 'export AUDIT_ROLE=source; exec python /tmp/hobby_parity.py' > source-parity.txt

      - name: Read candidate counts
        shell: bash
        run: |
          set -euo pipefail
          railway run --project "$RAILWAY_PROJECT_ID" --environment "$RAILWAY_ENVIRONMENT" --service postgres-hobby-candidate bash -lc 'export AUDIT_ROLE=target; exec python /tmp/hobby_parity.py' > target-parity.txt

      - name: Build sanitized parity summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json,re
          from pathlib import Path
          def load(path):
              s=Path(path).read_text(encoding="utf-8",errors="replace")
              m=re.search(r"^HOBBY_PARITY=(\{.*\})$",s,re.M)
              if not m:
                  raise SystemExit("sanitized payload missing")
              return json.loads(m.group(1))
          src,tgt=load("source-parity.txt"),load("target-parity.txt")
          base_ok=True
          hot_ok=True
          lines=[
              "## Railway Hobby candidate parity",
              "",
              "READ ONLY; no database rows/schema, Variables, service config, volume, backup, or plan was changed.",
              "",
              f"Cutoff: **{src['cutoff']}**",
              f"Source logical size: **{src['database_bytes']/1024/1024:.0f} MiB**",
              f"Candidate logical size: **{tgt['database_bytes']/1024/1024:.0f} MiB**",
              "",
              "### Full-copy base tables",
              "",
              "| Table | Source | Candidate | Match |",
              "|---|---:|---:|---|",
          ]
          for t,n in src["base"].items():
              m=tgt["base"].get(t)
              ok=(m==n); base_ok=base_ok and ok
              lines.append(f"| `{t}` | {n:,} | {m if m is not None else 0:,} | {'PASS' if ok else 'FAIL'} |")
          lines += ["","### Hot-only tables","","| Table | Source hot | Candidate total | Candidate old | Match |","|---|---:|---:|---:|---|"]
          for t,s in src["hot"].items():
              q=tgt["hot"].get(t,{})
              ok=(q.get("total")==s.get("hot") and q.get("old")==0)
              hot_ok=hot_ok and ok
              lines.append(f"| `{t}` | {s['hot']:,} | {q.get('total',0):,} | {q.get('old',0):,} | {'PASS' if ok else 'FAIL'} |")
          lines += ["","### Other retained tables (observe only)","","| Table | Source | Candidate |","|---|---:|---:|"]
          for t,n in src["observe"].items():
              lines.append(f"| `{t}` | {n:,} | {tgt['observe'].get(t,0):,} |")
          overall=base_ok and hot_ok
          lines += [
              "",
              f"Base parity: **{'PASS' if base_ok else 'FAIL'}**",
              f"Hot parity: **{'PASS' if hot_ok else 'FAIL'}**",
              f"Initial-seed parity: **{'PASS' if overall else 'FAIL'}**",
              "",
              "Count-only audit; this does not authorize Production cutover.",
          ]
          Path("hobby-parity-summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Build parity failure summary
        if: failure()
        shell: bash
        run: |
          if [ ! -f hobby-parity-summary.md ]; then
            printf '%s\n'               '## Railway Hobby candidate parity'               ''               '❌ Read-only parity audit failed before a sanitized comparison was produced.'               ''               'No destructive follow-up was attempted.'               > hobby-parity-summary.md
          fi

      - name: Remove raw parity files
        if: always()
        shell: bash
        run: rm -f source-parity.txt target-parity.txt

      - name: Post parity result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f hobby-parity-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file hobby-parity-summary.md
          fi

