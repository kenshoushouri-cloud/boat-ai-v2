          from pathlib import Path

          payload=None
          for line in Path("archive-dblink.out").read_text(encoding="utf-8",errors="replace").splitlines():
              if line.startswith("ARCHIVE_DBLINK_READONLY="):
                  payload=json.loads(line.split("=",1)[1])
                  break
          if payload is None:
              raise SystemExit("sanitized dblink payload missing")

          passed = (
              payload.get("dblink_installed") is True and
              payload.get("archive_connected") is True and
              payload.get("archive_transaction_read_only") == "on" and
              payload.get("archive_race_condition_rows") == 0 and
              payload.get("archive_race_condition_columns") == 16
          )
          lines=[
              "## Candidate-v4 → history archive private dblink — read only",
              "",
              f"State: **{'PASS' if passed else 'BLOCKED'}**",
              f"- dblink installed: **{payload.get('dblink_installed')}**",
              f"- archive private connection: **{payload.get('archive_connected')}**",
              f"- remote transaction read only: **{payload.get('archive_transaction_read_only')}**",
              f"- archive public table count: **{payload.get('archive_public_table_count')}**",
              f"- archive race-condition rows: **{payload.get('archive_race_condition_rows')}**",
              f"- archive race-condition columns: **{payload.get('archive_race_condition_columns')}**",
              "",
              "Candidate transaction and archive transaction were both READ ONLY and rolled back.",
              "No rows, schema, Variables, volumes, or plans were changed.",
          ]
          Path("archive-dblink-summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          if not passed:
              raise SystemExit("private dblink postcondition failed")
          PY

      - name: Remove raw output
        if: always()
        shell: bash
        run: rm -f archive-dblink.out

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f archive-dblink-summary.md ]; then
            gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file archive-dblink-summary.md
          else
            printf '%s\n'               '## Candidate-v4 → history archive private dblink — read only'               ''               '❌ Private-network probe failed before sanitized PASS output.'               ''               'No migration or delete operation was attempted.'               > archive-dblink-failure.md
            gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file archive-dblink-failure.md
          fi


  race-condition-archive-source-audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway race-condition-archive-source-audit'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "psycopg[binary]"
          npm install --global @railway/cli

      - name: Write source audit
        shell: bash
        run: |
          cat > /tmp/race_condition_archive_source_audit.py <<'PY'
          import json, os
          from datetime import date, timedelta
          import psycopg

          url=os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          cutoff=(date.today()-timedelta(days=90)).isoformat()
          out={"cutoff":cutoff}

          with psycopg.connect(url, autocommit=False) as conn:
              with conn.cursor() as cur:
                  cur.execute("BEGIN READ ONLY")
                  cur.execute("set local statement_timeout='60s'")

                  cur.execute("""
                    select a.attnum, a.attname, pg_catalog.format_type(a.atttypid,a.atttypmod),
                           a.attnotnull, pg_get_expr(d.adbin,d.adrelid)
                    from pg_attribute a
                    left join pg_attrdef d on d.adrelid=a.attrelid and d.adnum=a.attnum
                    where a.attrelid='public.v2_realtime_race_condition_snapshots'::regclass
                      and a.attnum>0 and not a.attisdropped
                    order by a.attnum
                  """)
                  out["columns"]=[
                    {"pos":r[0],"name":r[1],"type":r[2],"not_null":r[3],"default":r[4]}
                    for r in cur.fetchall()
                  ]

                  cur.execute("""
                    select conname, contype, pg_get_constraintdef(oid,true)
                    from pg_constraint
                    where conrelid='public.v2_realtime_race_condition_snapshots'::regclass
                    order by conname
                  """)
                  out["constraints"]=[
                    {"name":r[0],"type":r[1],"def":r[2]} for r in cur.fetchall()
                  ]

                  cur.execute("""
                    select indexname, indexdef
                    from pg_indexes
                    where schemaname='public' and tablename='v2_realtime_race_condition_snapshots'
                    order by indexname
                  """)
                  out["indexes"]=[{"name":r[0],"def":r[1]} for r in cur.fetchall()]

                  cur.execute("""
                    select count(*)::bigint,
                           min(r.race_date)::text,
                           max(r.race_date)::text
                    from v2_realtime_race_condition_snapshots s
                    join v2_races r on r.race_id=s.race_id
                    where r.race_date < %s::date
                  """,(cutoff,))
                  n,mn,mx=cur.fetchone()
                  out["archive_rows"]=int(n)
                  out["archive_min_date"]=mn
                  out["archive_max_date"]=mx

                  cur.execute("""
                    select count(*)::bigint
                    from v2_realtime_race_condition_snapshots
                  """)
                  out["total_rows"]=int(cur.fetchone()[0])

                  cur.execute("""
                    select pg_total_relation_size('public.v2_realtime_race_condition_snapshots'::regclass)::bigint,
                           pg_relation_size('public.v2_realtime_race_condition_snapshots'::regclass)::bigint,
                           pg_indexes_size('public.v2_realtime_race_condition_snapshots'::regclass)::bigint
                  """)
                  total,heap,indexes=cur.fetchone()
                  out["bytes"]={"total":int(total),"heap":int(heap),"indexes":int(indexes)}
              conn.rollback()

          print("RACE_CONDITION_ARCHIVE_SOURCE_AUDIT="+json.dumps(out,sort_keys=True))
          PY

      - name: Run candidate-v4 source audit
        shell: bash
        run: |
          set -euo pipefail
          railway run             --project "268a5b17-0712-440a-884d-27f7fa887a2d"             --environment production             --service postgres-hobby-fullhistory-candidate-v4             python3 /tmp/race_condition_archive_source_audit.py > race-condition-source-audit.out

      - name: Build sanitized result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload=None
          for line in Path("race-condition-source-audit.out").read_text(encoding="utf-8",errors="replace").splitlines():
              if line.startswith("RACE_CONDITION_ARCHIVE_SOURCE_AUDIT="):
                  payload=json.loads(line.split("=",1)[1]); break
          if payload is None:
              raise SystemExit("audit payload missing")

          b=payload["bytes"]
          mb=lambda x: x/1024/1024
          lines=[
            "## Race-condition archive source audit — read only","",
            "State: **PASS**",
            f"- cutoff: **{payload['cutoff']}**",
            f"- total rows: **{payload['total_rows']}**",
            f"- archive candidate rows: **{payload['archive_rows']}**",
            f"- archive date range: **{payload['archive_min_date']} → {payload['archive_max_date']}**",
            f"- relation total: **{mb(b['total']):.1f} MB**",
            f"- heap: **{mb(b['heap']):.1f} MB**",
            f"- indexes: **{mb(b['indexes']):.1f} MB**",
            f"- columns: **{len(payload['columns'])}**",
            f"- constraints: **{len(payload['constraints'])}**",
            f"- indexes defined: **{len(payload['indexes'])}**","",
            "READ ONLY + ROLLBACK. No rows, schema, Variables, volumes, or plans were changed."
          ]
          Path("race-condition-source-audit-summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Remove raw output
        if: always()
        shell: bash
        run: rm -f race-condition-source-audit.out

      - name: Post sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f race-condition-source-audit-summary.md ]; then
            gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file race-condition-source-audit-summary.md
          else
            printf '%s\n' '## Race-condition archive source audit — read only' '' '❌ Audit failed before sanitized output.' > race-condition-source-audit-failure.md
            gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file race-condition-source-audit-failure.md
          fi


  race-condition-archive-create-table:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway race-condition-archive-create-table CONFIRM'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "psycopg[binary]"
          npm install --global @railway/cli

      - name: Write guarded archive table creator
        shell: bash
        run: |
          cat > /tmp/create_race_condition_archive_table.py <<'PY'
          import json
          import os
          import subprocess
          import psycopg
          from psycopg import sql

          PROJECT="268a5b17-0712-440a-884d-27f7fa887a2d"
          ENV="production"
          SOURCE_SERVICE="postgres-hobby-fullhistory-candidate-v4"
          ARCHIVE_SERVICE="postgres-history-archive"
          SOURCE_TABLE="v2_realtime_race_condition_snapshots"
          ARCHIVE_SCHEMA="archive"

          def get_var(service,key):
              code=f'import os; print("VALUE="+os.environ.get("{key}",""))'
              p=subprocess.run(
                  ["railway","run","--project",PROJECT,"--environment",ENV,
                   "--service",service,"python3","-c",code],
                  check=True,text=True,capture_output=True,
              )
              for line in reversed(p.stdout.splitlines()):
                  if line.startswith("VALUE=") and line[6:].strip():
                      return line[6:].strip()
              raise RuntimeError(f"{key} unavailable for {service}")

          source_url=get_var(SOURCE_SERVICE,"DATABASE_PUBLIC_URL")
          archive_url=get_var(ARCHIVE_SERVICE,"DATABASE_URL")

          with psycopg.connect(source_url,autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("SET default_transaction_read_only = off")
                  cur.execute("""
                    select a.attname,
                           pg_catalog.format_type(a.atttypid,a.atttypmod),
                           a.attnotnull
                    from pg_attribute a
                    where a.attrelid=%s::regclass
                      and a.attnum>0 and not a.attisdropped
                    order by a.attnum
                  """,(f"public.{SOURCE_TABLE}",))
                  cols=cur.fetchall()
                  if not cols:
                      raise RuntimeError("source column metadata missing")

                  column_defs=[]
                  for name,typ,notnull in cols:
                      part=sql.SQL("{} {}{}").format(
                          sql.Identifier(name),
                          sql.SQL(typ),
                          sql.SQL(" NOT NULL" if notnull else ""),
                      )
                      column_defs.append(part.as_string(conn))

                  create_schema=sql.SQL("CREATE SCHEMA IF NOT EXISTS {}").format(
                      sql.Identifier(ARCHIVE_SCHEMA)
                  ).as_string(conn)
                  create_table=sql.SQL("CREATE TABLE IF NOT EXISTS {}.{} ({})").format(
                      sql.Identifier(ARCHIVE_SCHEMA),
                      sql.Identifier(SOURCE_TABLE),
                      sql.SQL(", ").join(sql.SQL(x) for x in column_defs),
                  ).as_string(conn)

                  cur.execute("select dblink_connect('archive_mutation', %s)",(archive_url,))
                  connected=True
                  try:
                      cur.execute("select dblink_exec('archive_mutation', 'BEGIN')")
                      cur.execute("select dblink_exec('archive_mutation', %s)",(create_schema,))
                      cur.execute("select dblink_exec('archive_mutation', %s)",(create_table,))

                      verify_sql=f"""
                        select count(*)::bigint
                        from information_schema.columns
                        where table_schema='{ARCHIVE_SCHEMA}'
                          and table_name='{SOURCE_TABLE}'
                      """
                      cur.execute("""
                        select n
                        from dblink('archive_mutation', %s) as t(n bigint)
                      """,(verify_sql,))
                      archive_col_count=int(cur.fetchone()[0])

                      cur.execute("select dblink_exec('archive_mutation', 'COMMIT')")
                  except Exception:
                      try:
                          cur.execute("select dblink_exec('archive_mutation', 'ROLLBACK')")
                      except Exception:
                          pass
                      raise
                  finally:
                      if connected:
                          try:
                              cur.execute("select dblink_disconnect('archive_mutation')")
                          except Exception:
                              pass

          if archive_col_count != len(cols):
              raise RuntimeError(f"archive column-count mismatch: source={len(cols)} archive={archive_col_count}")

          print("ARCHIVE_TABLE_CREATE="+json.dumps({
              "source_columns":len(cols),
              "archive_columns":archive_col_count,
              "archive_schema":ARCHIVE_SCHEMA,
              "archive_table":SOURCE_TABLE,
          },sort_keys=True))
          PY

      - name: Create empty archive receiver table
        shell: bash
        run: |
          set -euo pipefail
          python3 /tmp/create_race_condition_archive_table.py > archive-table-create.out

      - name: Build sanitized result
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path
          payload=None
          for line in Path("archive-table-create.out").read_text(encoding="utf-8",errors="replace").splitlines():
              if line.startswith("ARCHIVE_TABLE_CREATE="):
                  payload=json.loads(line.split("=",1)[1]); break
          if payload is None or payload["source_columns"] != payload["archive_columns"]:
              raise SystemExit("archive table postcondition failed")

          lines=[
              "## Race-condition archive receiver table",
              "",
              "State: **PASS**",
              f"- schema: **{payload['archive_schema']}**",
              f"- table: **{payload['archive_table']}**",
              f"- source columns: **{payload['source_columns']}**",
              f"- archive columns: **{payload['archive_columns']}**",
              "",
              "Archive-only schema mutation. No Production rows were changed or deleted.",
              "No historical rows have been copied yet.",
              "Indexes and foreign keys are intentionally deferred until after copy verification.",
          ]
          Path("archive-table-create-summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Remove raw output
        if: always()
        shell: bash
        run: rm -f archive-table-create.out

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -f archive-table-create-summary.md ]; then
            gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file archive-table-create-summary.md
          else
            printf '%s\n'               '## Race-condition archive receiver table'               ''               '❌ Archive receiver creation did not produce a verified PASS result.'               ''               'No Production delete or row migration was attempted.'               > archive-table-create-failure.md
            gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file archive-table-create-failure.md
          fi


  race-condition-archive-copy-existing-migrator:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway race-condition-archive-copy CONFIRM'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install tooling
        shell: bash
        run: |
          set -euo pipefail
          command -v psql >/dev/null || {
            sudo apt-get update -qq
            sudo apt-get install -y postgresql-client
          }
          npm install --global @railway/cli

      - name: Resolve source and archive connection references
        shell: bash
        run: |
          set -euo pipefail
          source_url="$(
            railway run --project "268a5b17-0712-440a-884d-27f7fa887a2d" --environment production --service postgres-hobby-fullhistory-candidate-v4               python3 -c 'import os; print(os.environ.get("DATABASE_PUBLIC_URL",""))'
          )"
          archive_url="$(
            railway run --project "268a5b17-0712-440a-884d-27f7fa887a2d" --environment production --service postgres-history-archive               python3 -c 'import os; print(os.environ.get("DATABASE_URL",""))'
          )"
          test -n "$source_url"
          test -n "$archive_url"
          {
            echo "SOURCE_DATABASE_URL<<EOF"
            echo "$source_url"
            echo "EOF"
            echo "TARGET_DATABASE_URL<<EOF"
            echo "$archive_url"
            echo "EOF"
          } >> "$GITHUB_ENV"

      - name: Run guarded archive-only copy
        shell: bash
        env:
          MIGRATION_MODE: ARCHIVE_RACE_CONDITION
          ARCHIVE_CUTOFF: "2026-07-05"
          ARCHIVE_EXPECTED_ROWS: "56316"
        run: |
          set -euo pipefail
          set +e
          bash ops/hobby-migrator/run.sh > archive-copy.sanitized 2>&1
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            grep -E '^(psql:|ERROR:|FATAL:|DETAIL:|HINT:|CONTEXT:|ARCHIVE_COPY_)' archive-copy.sanitized               | sed -E 's#postgres(ql)?://[^[:space:]]+#<redacted-db-url>#g'               | tail -80 || true
            exit "$rc"
          fi
          grep -q '^ARCHIVE_COPY_RESULT=PASS$' archive-copy.sanitized
          grep -q '^ARCHIVE_COPY_ROWS=56316$' archive-copy.sanitized
          grep -q '^PRODUCTION_DELETE=0$' archive-copy.sanitized
          grep -q '^VACUUM_OR_REWRITE=0$' archive-copy.sanitized

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f archive-copy.sanitized ] && grep -q '^ARCHIVE_COPY_RESULT=PASS$' archive-copy.sanitized; then
            {
              echo '## Race-condition archive copy'
              echo
              echo 'State: **PASS**'
              echo '- Production source rows: **56,316**'
              echo '- archive rows copied: **56,316**'
              echo '- Production DELETE: **0**'
              echo '- VACUUM / table rewrite: **0**'
              echo
              echo 'Next step is independent copy verification before any Production deletion.'
            } > archive-copy-summary.md
          else
            {
              echo '## Race-condition archive copy'
              echo
              echo 'State: **BLOCKED / FAILED**'
              echo '- No Production deletion or compaction was authorized.'
              echo '- Archive transaction was designed to roll back on copy failure.'
            } > archive-copy-summary.md
          fi
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file archive-copy-summary.md

      - name: Remove transient connection material
        if: always()
        shell: bash
        run: |
          unset SOURCE_DATABASE_URL TARGET_DATABASE_URL || true
          rm -f archive-copy.sanitized archive-copy-summary.md
