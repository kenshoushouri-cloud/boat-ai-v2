                      result["archive_connected"] = True
                      result["archive_transaction_read_only"] = remote_ro
                      result["archive_public_table_count"] = int(public_tables)
                      result["archive_race_condition_rows"] = int(archive_rows)
                      result["archive_race_condition_columns"] = int(archive_columns)
                      cur.execute("select dblink_exec('archive_probe', 'ROLLBACK')")
