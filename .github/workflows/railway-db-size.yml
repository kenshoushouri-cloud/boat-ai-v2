              if line.startswith("WRITE_SESSION_CAPABILITY="):
                  payload=json.loads(line.split("=",1)[1])
                  break
          if payload is None:
              raise SystemExit("probe output missing")

          can_write_session = (
              not payload["pg_is_in_recovery"] and
              payload["default_read_only_after_session_set"] == "off" and
              payload["transaction_read_only_after_session_set"] == "off"
          )

          lines=[
              "## Candidate-v4 write-session capability — no data mutation",
              "",
              f"State: **{'SESSION_WRITE_CAPABLE' if can_write_session else 'SESSION_WRITE_BLOCKED'}**",
              f"- pg_is_in_recovery: **{payload['pg_is_in_recovery']}**",
              f"- default_transaction_read_only before: **{payload['default_read_only_before']}**",
              f"- transaction_read_only before: **{payload['transaction_read_only_before']}**",
              f"- default_transaction_read_only after session SET: **{payload['default_read_only_after_session_set']}**",
              f"- transaction_read_only after session SET: **{payload['transaction_read_only_after_session_set']}**",
              "",
              "Only a session-local SET was performed. No table rows, schema objects, extensions, database settings, Variables, or volumes were changed.",
