        shell: bash
        run: |
          set -euo pipefail
          python -m pip install "psycopg[binary]"
          npm install --global @railway/cli

      - name: Write read-only capability probe
        shell: bash
        run: |
          cat > /tmp/write_session_capability_probe.py <<'PY'
          import json
          import os
          import psycopg

          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          with psycopg.connect(url, autocommit=True) as conn:
              with conn.cursor() as cur:
