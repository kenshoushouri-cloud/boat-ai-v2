                  payload=json.loads(line.split("=",1)[1])
                  break
          if payload is None or not payload.get("after_installed"):
              raise SystemExit("dblink postcondition failed")

          lines=[
              "## Candidate-v4 dblink install",
              "",
              "State: **PASS**",
              f"- installed before: **{payload['before_installed']}**",
              f"- installed after: **{payload['after_installed']}**",
              f"- version: **{payload['version']}**",
              "",
              "Only the PostgreSQL dblink extension was created if it was missing.",
              "No table rows, application data, archive schema, volumes, or plans were changed.",
          ]
          Path("candidate-dblink-install-summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY

      - name: Remove raw output
        if: always()
        shell: bash
        run: rm -f dblink-install.out

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
