        run: |
          set -euo pipefail
          railway run             --project "268a5b17-0712-440a-884d-27f7fa887a2d"             --environment production             --service postgres-hobby-fullhistory-candidate-v4             python3 /tmp/install_dblink.py > dblink-install.out

