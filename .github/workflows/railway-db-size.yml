          import psycopg

          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          with psycopg.connect(url, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                      select extname, extversion
                      from pg_extension
                      where extname='dblink'
                  """)
                  before = cur.fetchone()

                  cur.execute("CREATE EXTENSION IF NOT EXISTS dblink WITH SCHEMA public")

                  cur.execute("""
                      select extname, extversion
                      from pg_extension
                      where extname='dblink'
                  """)
                  after = cur.fetchone()

          print("DBLINK_INSTALL_RESULT=" + json.dumps({
              "before_installed": bool(before),
              "after_installed": bool(after),
              "version": after[1] if after else None,
          }, sort_keys=True))
