                        current_setting('default_transaction_read_only'),
                        current_setting('transaction_read_only')
                  """)
                  recovery, default_ro_before, tx_ro_before = cur.fetchone()

                  cur.execute("SET default_transaction_read_only = off")

                  cur.execute("""
                      select
                        current_setting('default_transaction_read_only'),
                        current_setting('transaction_read_only')
                  """)
                  default_ro_after, tx_ro_after = cur.fetchone()

          print("WRITE_SESSION_CAPABILITY=" + json.dumps({
              "pg_is_in_recovery": bool(recovery),
              "default_read_only_before": default_ro_before,
              "transaction_read_only_before": tx_ro_before,
              "default_read_only_after_session_set": default_ro_after,
              "transaction_read_only_after_session_set": tx_ro_after,
