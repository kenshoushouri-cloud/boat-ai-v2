name: Historical prior-day recent_form backfill

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "research/historical_recent_form_backfill_pg.py"
      - "tests/test_historical_recent_form_backfill_pg.py"
      - ".github/workflows/historical-recent-form-backfill.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate chronology and safety
        run: |
          pytest -q tests/test_historical_recent_form_backfill_pg.py
          python -m py_compile research/historical_recent_form_backfill_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/historical_recent_form_backfill_pg.py").read_text(encoding="utf-8").lower()
          assert "boatrace_official_k_prior_day_recent_form_v1" in p
          assert "r.race_date < %s" in p
          assert "hist_recent_form_same_day_result_used=0" in p
          assert "hist_recent_form_future_result_used=0" in p
          assert "confirm_historical_recent_form_db_write" in p
          assert "fill_missing_only" in p
          assert "v2_odds" not in p
          assert "from v2_results" not in p
          assert "join v2_results" not in p
          assert "trifecta_payout" not in p
          assert "update v2_race_entries" in p
          assert "recent_form=%s" in p
          print("PASS recent_form prior-day safety")
          PY

  live-read-only-dry-run:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Production DB read-only dry run
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; unset CONFIRM_HISTORICAL_RECENT_FORM_DB_WRITE; exec python -u research/historical_recent_form_backfill_pg.py --start-date 2025-07-06 --end-date 2025-07-10 --output historical-recent-form-dry-run.json' \
            | tee historical-recent-form-dry-run.txt
          grep -q '^HIST_RECENT_FORM_SAME_DAY_RESULT_USED=0$' historical-recent-form-dry-run.txt
          grep -q '^HIST_RECENT_FORM_FUTURE_RESULT_USED=0$' historical-recent-form-dry-run.txt
          grep -q '^HIST_RECENT_FORM_WRITE_ENABLED=0$' historical-recent-form-dry-run.txt
          grep -q '^HIST_RECENT_FORM_RESULT=PASS$' historical-recent-form-dry-run.txt

  backfill:
    concurrency:
      group: ${{ github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/railway historical-recent-form-backfill ') && 'historical-production-write' || format('historical-recent-form-noncommand-{0}', github.run_id) }}
      cancel-in-progress: false
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      (startsWith(github.event.comment.body, '/railway historical-recent-form-backfill ') || github.event.comment.body == '/railway historical-recent-form-next')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Parse range
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import date
          body=os.environ["COMMENT_BODY"].strip()
          if body == "/railway historical-recent-form-next":
              start_s,end_s="2025-08-07","2025-08-20"
          else:
              p=body.split()
              if len(p) != 4 or p[1] != "historical-recent-form-backfill":
                  raise SystemExit("command: /railway historical-recent-form-backfill YYYY-MM-DD YYYY-MM-DD")
              start_s,end_s=p[2],p[3]
          a=date.fromisoformat(start_s); b=date.fromisoformat(end_s)
          if b < a:
              raise SystemExit("end before start")
          if (b-a).days + 1 > 500:
              raise SystemExit("maximum recent_form range is 500 days")
          if a < date(2025,7,1):
              raise SystemExit("approved historical start is 2025-07-01")
          print("HIST_START_DATE="+start_s)
          print("HIST_END_DATE="+end_s)
          PY

      - name: Fill prior-day-only recent_form
        env:
          CONFIRM_HISTORICAL_RECENT_FORM_DB_WRITE: "YES"
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; export CONFIRM_HISTORICAL_RECENT_FORM_DB_WRITE="YES"; exec python -u research/historical_recent_form_backfill_pg.py --start-date "${HIST_START_DATE}" --end-date "${HIST_END_DATE}"' \
            | tee historical-recent-form-backfill.txt
          grep -q '^HIST_RECENT_FORM_SAME_DAY_RESULT_USED=0$' historical-recent-form-backfill.txt
          grep -q '^HIST_RECENT_FORM_FUTURE_RESULT_USED=0$' historical-recent-form-backfill.txt
          grep -q '^HIST_RECENT_FORM_RESULT=PASS$' historical-recent-form-backfill.txt

      - uses: actions/upload-artifact@v4
        with:
          name: historical-recent-form-backfill-${{ github.run_id }}
          path: |
            historical-recent-form-backfill.txt
            historical-recent-form-manifest.json
          retention-days: 90
          if-no-files-found: error

      - name: Comment sanitized summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Historical prior-day recent_form backfill: ${HIST_START_DATE} .. ${HIST_END_DATE}"
            echo
            if [ -f historical-recent-form-backfill.txt ]; then
              grep -E '^(HIST_RECENT_FORM_TOTALS=|HIST_RECENT_FORM_RESULT=)' historical-recent-form-backfill.txt || true
            fi
            echo
            echo "Official K prior-day only; same-day/future outcomes excluded; fill-missing-only."
          } > reply.txt
          gh issue comment 42 --repo "${GITHUB_REPOSITORY}" --body-file reply.txt
