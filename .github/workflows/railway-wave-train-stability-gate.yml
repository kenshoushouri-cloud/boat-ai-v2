name: Railway wave train stability gate

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/wave_train_stability_gate_backtest.py"
      - ".github/workflows/railway-wave-train-stability-gate.yml"

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run train-only stability gate OOS backtest
        id: bt
        run: |
          set +e
          python -u .github/scripts/wave_train_stability_gate_backtest.py > wave-gate-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show sanitized result
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('wave-gate-output.txt')
          text=p.read_text(encoding='utf-8',errors='replace') if p.exists() else ''
          for line in text.splitlines():
              if line.startswith('WAVE_GATE_'):
                  print(line[:1200])
          PY
      - name: Remove temporary files
        if: always()
        run: rm -f railway-vars.json railway-vars-error.txt wave-gate-output.txt
      - name: Fail if backtest failed
        if: steps.bt.outputs.exit_code != '0'
        run: exit 1
