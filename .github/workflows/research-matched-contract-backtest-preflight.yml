name: Matched-contract backtest preflight safety

on:
  pull_request:
    paths:
      - 'research/matched_contract_backtest_preflight.py'
      - 'tests/test_matched_contract_backtest_preflight.py'
      - '.github/workflows/research-matched-contract-backtest-preflight.yml'

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  safety:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pure preflight tests
        run: |
          python -m pip install pytest
          pytest -q tests/test_matched_contract_backtest_preflight.py
      - name: Confirm current state fails closed
        run: |
          python -m research.matched_contract_backtest_preflight | tee matched-contract-preflight.txt
          grep -q '^MATCHED_CONTRACT_BACKTEST_PREFLIGHT_RESULT=BLOCKED$' matched-contract-preflight.txt
      - name: Enforce no infrastructure execution path
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('research/matched_contract_backtest_preflight.py').read_text(encoding='utf-8').lower()
          for forbidden in (
              'import psycopg',
              'database_url',
              'subprocess',
              'railway run',
              'railway variable list',
              'list_variables',
              'insert into',
              'update v2_',
              'delete from',
          ):
              assert forbidden not in p, forbidden
          PY
