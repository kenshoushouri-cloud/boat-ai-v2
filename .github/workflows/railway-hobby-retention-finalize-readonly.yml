name: Railway Hobby retention finalization read-only

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_BRIDGE_ISSUE: "42"
  FULL_RESTORE_BYTES: "3615987391"

jobs:
  retention-finalize:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-retention-finalize-readonly'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install "psycopg[binary]>=3.2,<4"
          npm install --global @railway/cli

      - name: Write retention finalization audit
        shell: bash
        run: |
          cat > /tmp/hobby_retention_finalize.py <<'PY'
          import hashlib
          import json
          import os
          from datetime import timedelta
          import psycopg
          from psycopg.rows import dict_row

          HOT_TABLES = [
              "v2_odds_trifecta",
              "v2_realtime_racer_condition_snapshots",
              "v2_realtime_weather_snapshots",
              "v2_realtime_race_condition_snapshots",
              "v2_realtime_exhibition_snapshots",
          ]

          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          out = {
              "contract": "HOBBY_RETENTION_FINALIZATION_READONLY_V1",
              "source_write": 0,
              "production_change": 0,
              "full_restore_bytes": int(os.environ["FULL_RESTORE_BYTES"]),
              "hot_tables": {},
              "growth_tables": [],
          }

          with psycopg.connect(url, row_factory=dict_row, autocommit=False) as conn:
              with conn.cursor() as cur:
                  cur.execute("set transaction read only")
                  cur.execute("set local statement_timeout='180s'")
                  cur.execute("select current_date d, pg_database_size(current_database())::bigint b")
                  row = cur.fetchone()
                  today = row["d"]
                  out["audit_date"] = str(today)
                  out["source_database_bytes"] = int(row["b"])

                  def has_col(table, col):
                      cur.execute(
                          """select exists(
                               select 1
                                 from information_schema.columns
                                where table_schema='public'
                                  and table_name=%s
                                  and column_name=%s
                             ) ok""",
                          (table, col),
                      )
                      return bool(cur.fetchone()["ok"])

                  cur.execute("""
                    select tablename
                      from pg_catalog.pg_tables
                     where schemaname='public'
                     order by tablename
                  """)
                  tables = [r["tablename"] for r in cur.fetchall()]

                  growth = []
                  for table in tables:
                      has_race_id = has_col(table, "race_id")
                      has_race_date = has_col(table, "race_date")
                      cur.execute(
                          "select pg_total_relation_size(%s::regclass)::bigint b",
                          (f"public.{table}",),
                      )
                      rel_bytes = int(cur.fetchone()["b"] or 0)
                      cur.execute(f"select count(*)::bigint n from public.{table}")
                      total = int(cur.fetchone()["n"] or 0)

                      date_mode = None
                      if table == "v2_races" and has_race_date:
                          date_mode = "direct"
                      elif has_race_id:
                          date_mode = "join"
                      elif has_race_date:
                          date_mode = "direct"

                      rec = {
                          "table": table,
                          "bytes": rel_bytes,
                          "rows": total,
                          "date_mode": date_mode,
                          "recent14": 0,
                          "recent30": 0,
                          "est_growth14_bytes": 0,
                      }

                      if date_mode:
                          for days in (14, 30):
                              cutoff = today - timedelta(days=days)
                              if table == "v2_races":
                                  q = "select count(*)::bigint n from public.v2_races where race_date >= %s"
                              elif date_mode == "join":
                                  q = f"""select count(*)::bigint n
                                          from public.{table} t
                                          join public.v2_races r on r.race_id=t.race_id
                                         where r.race_date >= %s"""
                              else:
                                  q = f"select count(*)::bigint n from public.{table} where race_date >= %s"
                              cur.execute(q, (cutoff,))
                              rec[f"recent{days}"] = int(cur.fetchone()["n"] or 0)
                          if total > 0:
                              rec["est_growth14_bytes"] = int(rel_bytes * rec["recent14"] / total)
                      growth.append(rec)

                  out["growth_tables"] = growth
                  out["estimated_next14_growth_bytes"] = sum(x["est_growth14_bytes"] for x in growth)
                  out["projected_full_restore_plus14_bytes"] = (
                      out["full_restore_bytes"] + out["estimated_next14_growth_bytes"]
                  )

                  for table in HOT_TABLES:
                      has_snapshot_label = has_col(table, "snapshot_label")
                      cur.execute(
                          "select pg_total_relation_size(%s::regclass)::bigint b",
                          (f"public.{table}",),
                      )
                      rel_bytes = int(cur.fetchone()["b"] or 0)
                      cur.execute(f"select count(*)::bigint n from public.{table}")
                      total = int(cur.fetchone()["n"] or 0)
                      rec = {"bytes": rel_bytes, "rows": total, "windows": {}}

                      for days in (30, 60, 90):
                          cutoff = today - timedelta(days=days)
                          cur.execute(
                              f"""select count(*)::bigint hot
                                    from public.{table} t
                                    join public.v2_races r on r.race_id=t.race_id
                                   where r.race_date >= %s""",
                              (cutoff,),
                          )
                          hot = int(cur.fetchone()["hot"] or 0)
                          old = max(0, total - hot)
                          est_archive = int(rel_bytes * old / total) if total else 0
                          historical_old = None
                          if has_snapshot_label:
                              cur.execute(
                                  f"""select count(*)::bigint n
                                        from public.{table} t
                                        join public.v2_races r on r.race_id=t.race_id
                                       where r.race_date < %s
                                         and t.snapshot_label='historical'""",
                                  (cutoff,),
                              )
                              historical_old = int(cur.fetchone()["n"] or 0)
                          rec["windows"][str(days)] = {
                              "cutoff": str(cutoff),
                              "hot_rows": hot,
                              "old_rows": old,
                              "historical_old_rows": historical_old,
                              "estimated_archive_bytes": est_archive,
                          }
                      out["hot_tables"][table] = rec

              conn.rollback()

          canonical = json.dumps(out, sort_keys=True, separators=(",", ":")).encode()
          out["evidence_sha256"] = hashlib.sha256(canonical).hexdigest()
          print("RETENTION_FINAL=" + json.dumps(out, sort_keys=True))
          PY

      - name: Run source audit read-only
        shell: bash
        run: |
          set -euo pipefail
          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service postgres-recovery             python /tmp/hobby_retention_finalize.py > retention-final.txt

      - name: Build sanitized finalization summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, re
          from pathlib import Path

          text=Path("retention-final.txt").read_text(encoding="utf-8",errors="replace")
          m=re.search(r"^RETENTION_FINAL=(\{.*\})$",text,re.M)
          if not m:
              raise SystemExit("sanitized payload missing")
          p=json.loads(m.group(1))

          gib=lambda n: n/1024/1024/1024
          mib=lambda n: n/1024/1024
          limit=5_000_000_000
          projected=p["projected_full_restore_plus14_bytes"]
          top=sorted(
              [x for x in p["growth_tables"] if x["est_growth14_bytes"]>0],
              key=lambda x:x["est_growth14_bytes"],
              reverse=True,
          )[:10]

          hist60=0
          hist90=0
          archive60=0
          archive90=0
          for t,r in p["hot_tables"].items():
              w60=r["windows"]["60"]
              w90=r["windows"]["90"]
              archive60 += int(w60["estimated_archive_bytes"])
              archive90 += int(w90["estimated_archive_bytes"])
              if w60["historical_old_rows"] is not None:
                  hist60 += int(w60["historical_old_rows"])
              if w90["historical_old_rows"] is not None:
                  hist90 += int(w90["historical_old_rows"])

          # Policy: preserve full history through historical matched-contract work.
          # Fresh exact-parity restore proves a full compact copy already fits the Hobby volume.
          headroom = limit - projected
          full_copy_safe = headroom > 500_000_000
          policy = "FULL_HISTORY_PINNED" if full_copy_safe else "RETENTION_REQUIRED_BEFORE_HOBBY"

          lines=[
              "## Hobby retention finalization — read only",
              "",
              "No Production rows/schema, Railway Variables, service config, volume, backup, or plan was changed.",
              "",
              f"Audit date: **{p['audit_date']}**",
              f"Source DB current physical/logical database bytes: **{p['source_database_bytes']:,}** ({gib(p['source_database_bytes']):.2f} GiB)",
              f"Fresh exact-parity full restore baseline: **{p['full_restore_bytes']:,}** ({gib(p['full_restore_bytes']):.2f} GiB)",
              f"Estimated next-14-day growth from date-addressable tables: **{p['estimated_next14_growth_bytes']:,}** ({mib(p['estimated_next14_growth_bytes']):.0f} MiB)",
              f"Projected full fresh restore + 14d growth: **{projected:,}** ({gib(projected):.2f} GiB)",
              f"5 GB limit planning headroom after projection: **{headroom:,} bytes** ({mib(headroom):.0f} MiB)",
              "",
              "### Historical-evidence impact of deleting old rows now",
              "",
              f"Estimated bytes removed from the five current hot-only tables at 60d: **{mib(archive60):.0f} MiB**",
              f"Estimated bytes removed at 90d: **{mib(archive90):.0f} MiB**",
              f"Rows labeled historical that would be removed from labeled hot tables at 60d: **{hist60:,}**",
              f"Rows labeled historical that would be removed at 90d: **{hist90:,}**",
              "",
              "The historical matched-contract readiness path explicitly reads historical weather/exhibition evidence back to 2025-07-01. Deleting those rows before that work completes would invalidate the planned research path.",
              "",
              f"### Finalized migration retention mode: **{policy}**",
              "",
          ]
          if full_copy_safe:
              lines += [
                  "- For the Hobby migration candidate, keep the full dataset initially; do not delete historical rows before matched-readiness / matched-contract backtest.",
                  "- Use the compact fresh logical restore as the space-saving mechanism for the cutover candidate; the verified full restore is materially smaller than the bloated Production database.",
                  "- After historical matched-contract work is complete, re-evaluate rolling retention for the five high-volume raw tables. 90d should be evaluated before 60d because it preserves more evidence.",
              ]
          else:
              lines += [
                  "- Full-history copy does not have sufficient planning headroom. Do not cut over yet.",
                  "- A retention/archive design that preserves historical research evidence outside the hot database is required before Hobby.",
              ]

          lines += [
              "",
              "### Largest projected 14-day growth contributors",
              "",
              "| Table | Current size MiB | Recent 14d rows | Est. 14d growth MiB |",
              "|---|---:|---:|---:|",
          ]
          for x in top:
              lines.append(
                  f"| `{x['table']}` | {mib(x['bytes']):.0f} | {x['recent14']:,} | {mib(x['est_growth14_bytes']):.0f} |"
              )
          lines += [
              "",
              f"Evidence SHA-256: `{p['evidence_sha256']}`",
              "",
              "This is a retention decision audit only. It does not authorize cutover, deletion, volume cleanup, or plan downgrade.",
          ]
          Path("retention-summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          Path("retention-evidence.json").write_text(json.dumps(p,indent=2,sort_keys=True)+"\n",encoding="utf-8")
          PY

      - name: Upload non-secret retention evidence
        uses: actions/upload-artifact@v4
        with:
          name: hobby-retention-finalization-${{ github.run_id }}
          path: retention-evidence.json
          retention-days: 90
          if-no-files-found: error

      - name: Build failure summary
        if: failure()
        shell: bash
        run: |
          if [ ! -f retention-summary.md ]; then
            cat > retention-summary.md <<'EOF'
          ## Hobby retention finalization — read only

          ❌ Read-only finalization audit failed.

          No destructive follow-up was attempted.
          EOF
          fi

      - name: Remove raw output
        if: always()
        shell: bash
        run: rm -f retention-final.txt

      - name: Post sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file retention-summary.md
