name: V5.1 Exhibition Time OOS gap diagnosis

on:
  pull_request:
    paths:
      - "research/v51_exhibition_time_oos_gap_diagnosis_pg.py"
      - "tests/test_v51_exhibition_time_oos_gap_diagnosis_pg.py"
      - ".github/workflows/research-v51-exhibition-time-oos-gap.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Static safety
        run: |
          set -euo pipefail
          pytest -q tests/test_v51_exhibition_time_oos_gap_diagnosis_pg.py
          python -m py_compile research/v51_exhibition_time_oos_gap_diagnosis_pg.py
      - run: npm install --global @railway/cli
      - name: Diagnose OOS gap
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c max_parallel_workers_per_gather=0"; export PYTHONPATH=.; exec python -u research/v51_exhibition_time_oos_gap_diagnosis_pg.py' \
            2>&1 | tee v51-exhibition-time-oos-gap-diagnosis.txt
          grep -q '^V51_EX_TIME_OOS_GAP_RESULT_READ=0$' v51-exhibition-time-oos-gap-diagnosis.txt
          grep -q '^V51_EX_TIME_OOS_GAP_DB_WRITE=0$' v51-exhibition-time-oos-gap-diagnosis.txt
          grep -q '^V51_EX_TIME_OOS_GAP_RESULT=PASS_READ_ONLY$' v51-exhibition-time-oos-gap-diagnosis.txt
      - uses: actions/upload-artifact@v4
        with:
          name: v51-exhibition-time-oos-gap-${{ github.run_id }}
          path: |
            v51-exhibition-time-oos-gap-diagnosis.json
            v51-exhibition-time-oos-gap-diagnosis.txt
          retention-days: 14
          if-no-files-found: error
