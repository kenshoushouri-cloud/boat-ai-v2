name: V4 timing-safe profit gate

on:
  pull_request:
    paths:
      - 'research/v4_timing_safe_profit_gate_pg.py'
      - 'tests/test_v4_timing_safe_profit_gate.py'
      - 'docs/V4_TIMING_SAFE_PROFIT_GATE_20260923.md'
      - '.github/workflows/v4-timing-safe-profit-gate.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate profit-gate contracts
        env:
          PYTHONPATH: .
          V4_VALUE_BOOTSTRAP_SAMPLES: '200'
        run: |
          set -euo pipefail
          python -m py_compile research/v4_timing_safe_profit_gate_pg.py tests/test_v4_timing_safe_profit_gate.py
          pytest -q tests/test_v4_timing_safe_profit_gate.py
          python - <<'PY'
          from pathlib import Path
          src=Path('research/v4_timing_safe_profit_gate_pg.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in src
          assert 'threshold_fit_on_test' in src
          assert 'result_after_policy_freeze' in src
          for value in ('insert into','update v2_','delete from','vacuum ','purchase_action=true'):
              assert value not in src, value
          print('V4_VALUE_VALIDATE=PASS')
          PY

  replay:
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    strategy:
      fail-fast: false
      matrix:
        cutoff_minutes: [5, 10]
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      V4_VALUE_TEST_START: '2026-08-25'
      V4_VALUE_TEST_END: '2026-09-22'
      V4_VALUE_ODDS_CUTOFF_MINUTES: '${{ matrix.cutoff_minutes }}'
      V4_VALUE_MAX_LABEL_SPREAD_SECONDS: '60'
      V4_VALUE_BOOTSTRAP_SAMPLES: '20000'
      V4_VALUE_BOOTSTRAP_SEED: '20260923'
      V4_VALUE_OUTPUT_JSON: 'v4-timing-safe-profit-gate-${{ matrix.cutoff_minutes }}m.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require Railway non-enumerating route
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          echo "V4_VALUE_DB_REPLAY=RAILWAY_RUN_NON_ENUMERATING"
      - name: Install Railway CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway --version
      - name: Run timing-safe profit audit
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u research/v4_timing_safe_profit_gate_pg.py' \
            2>&1 | tee "v4-timing-safe-profit-gate-${{ matrix.cutoff_minutes }}m.txt"
          grep -q '^RESULT=PASS_READ_ONLY_TIMING_SAFE_PROFIT_GATE$' "v4-timing-safe-profit-gate-${{ matrix.cutoff_minutes }}m.txt"
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-timing-safe-profit-gate-${{ github.run_id }}-${{ matrix.cutoff_minutes }}m
          path: |
            v4-timing-safe-profit-gate-${{ matrix.cutoff_minutes }}m.json
            v4-timing-safe-profit-gate-${{ matrix.cutoff_minutes }}m.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Confirm no variable enumeration
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/v4-timing-safe-profit-gate.yml').read_text(encoding='utf-8').lower()
          forbidden=(
              ''.join(('railway',' variable',' list')),
              ''.join(('print','env')),
              ''.join(('env',' |')),
          )
          for value in forbidden:
              assert value not in text, value
          assert 'railway run' in text
          print('V4_VALUE_SECRET_ENUMERATION=0')
          PY
