name: Candidate-v4 result entries backfill 2026-09

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  RAILWAY_BRIDGE_ISSUE: "581"

jobs:
  backfill:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway candidate-v4-result-entries-backfill-202609 CONFIRM'
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Backfill September result entries
        id: backfill
        shell: bash
        run: |
          set +e
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -c '
              set -e
              test -n "${DATABASE_PUBLIC_URL:-}"
              export DATABASE_URL="$DATABASE_PUBLIC_URL"
              export CONFIRM_K_DB_WRITE="YES"
              export STOP_ON_ERROR="1"
              export K_START_DATE="2026-09-01"
              export K_END_DATE="2026-09-30"
              exec python -u backfill_k_date_range_pg.py
            ' > result-entries-output.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized summary
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.backfill.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw=Path("result-entries-output.txt").read_text(encoding="utf-8",errors="replace") if Path("result-entries-output.txt").exists() else ""
          prefixes=("RANGE=","DAY START ","DAY PASS ","DAY FAIL ","TARGET_DATE=","K_GET ","incomplete6=","existing_v2_results=","POSTWRITE ","v2_result_entries_upsert=","v2_results_updated=","requested_days=","passed_days=","failed=","RESULT=")
          keep=[line[:700] for line in raw.splitlines() if line.startswith(prefixes)]
          code=os.environ.get("EXIT_CODE","?")
          out=[
            "## candidate-v4 result entries backfill 2026-09",
            "",
            "- target: 2026-09-01..2026-09-30",
            "- official K files",
            "- day-by-day independent transactions; stop on first error",
            "- no Production model / LINE / BUY / stake / plan / volume change",
            "",
            *keep[-500:],
            "",
            f"Process exit code: {code}",
            "",
            "CANDIDATE_V4_SEPTEMBER_RESULT_ENTRIES_BACKFILL_PASS" if code=="0" else "CANDIDATE_V4_SEPTEMBER_RESULT_ENTRIES_BACKFILL_FAILED",
          ]
          Path("summary.md").write_text("\n".join(out)+"\n",encoding="utf-8")
          PY

      - name: Clean raw output
        if: always()
        run: rm -f result-entries-output.txt

      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "${RAILWAY_BRIDGE_ISSUE}" --repo "$GITHUB_REPOSITORY" --body-file summary.md

      - name: Fail when backfill failed
        if: steps.backfill.outputs.exit_code != '0'
        run: exit 1
