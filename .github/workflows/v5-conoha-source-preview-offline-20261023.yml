name: V5 ConoHa real source preview isolated tests
on:
  issue_comment:
    types: [created]
permissions:
  contents: read
  issues: write
jobs:
  offline:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/v5 conoha-source-preview-offline-20261023'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Nine source + seven held Counter / -m smoke tests only
        id: test
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_v5_conoha_research_one_day_sources_readonly.py' -v > output.txt 2>&1
          source_code=$?
          python -m unittest discover -s tests -p 'test_v5_offline_unverified_counter_shape_preview.py' -v >> output.txt 2>&1
          shape_code=$?
          if [ "$source_code" -eq 0 ] && [ "$shape_code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Report
        id: report
        if: always()
        env:
          PASSED: ${{ steps.test.outputs.passed }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw=Path("output.txt").read_text(errors="replace") if Path("output.txt").exists() else ""
          lines=[line[:225] for line in raw.splitlines() if line.startswith(("test_","Ran ","OK","FAILED","FAIL","ERROR","Traceback","AssertionError","ImportError"))]
          passed=(os.environ.get("PASSED")=="true" and "Ran 9 tests" in raw
                  and "Ran 7 tests" in raw and raw.count("\nOK\n")==2)
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:
              f.write("verified="+("true" if passed else "false")+"\n")
          body=[
              "## V5 one-day ConoHa source preview: synthetic offline only",
              "- 16 bounded synthetic tests (9+7), including mocked -m CLI. No ConoHa DB, HTTP, actual trained Counter state, BUY, or deployment.",
              "- Refund/incident remains UNVERIFIED and all fitted/prospective counters remain HOLD.",
              "- Counter totals are unverified SHAPE rehearsals, not fitted state. SQL query and real-data cardinalities are NOT certified by synthetic tests.",
              "",
              "~~~text",*lines[-12:],"~~~","",
              "V5_CONOHA_SOURCE_PREVIEW_OFFLINE_PASS" if passed else "V5_CONOHA_SOURCE_PREVIEW_OFFLINE_FAILED",
          ]
          Path("summary.md").write_text("\n".join(body)+"\n")
          PY
      - name: Comment on test issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 581 --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Fail if not sixteen passed
        if: steps.report.outputs.verified != 'true'
        run: exit 1
