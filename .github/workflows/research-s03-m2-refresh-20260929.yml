name: Research S03 M2 Refresh 2026-09-29

on:
  pull_request:
    paths:
      - '.github/workflows/research-s03-m2-refresh-20260929.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      TARGET_DATE: '2026-09-29'
      S03_FORWARD_START: '2026-09-13'
      S03_FORWARD_END: '2026-09-29'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt

      - name: Verify read-only contracts
        run: |
          set -euo pipefail
          grep -q 'set transaction read only' research/result_day_terminal_readiness_pg.py
          grep -q 'set transaction read only' research/s03_m2_common_economics_pg.py
          grep -q 'S03_M2_COMMON_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0' research/s03_m2_common_economics_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-s03-m2-refresh-20260929.yml').read_text(encoding='utf-8').lower()
          assert 'pull_request:' in w
          assert ''.join(('schedule', ':')) not in w
          assert ''.join(('railway',' variable',' list')) not in w
          assert 'railway run' in w
          PY

      - run: npm install --global @railway/cli

      - name: Require 2026-09-29 terminal result day
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u research/result_day_terminal_readiness_pg.py' \
            2>&1 | tee result-day-readiness.txt
          grep -q '^RESULT_DAY_READINESS_RESULT=READY$' result-day-readiness.txt

      - name: Run frozen S03 M2 checkpoint through 2026-09-29
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/s03_m2_common_economics_pg.py' \
            2>&1 | tee s03-m2-forward-checkpoint.txt
          grep -q '^S03_M2_COMMON_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0$' s03-m2-forward-checkpoint.txt
          grep -q '^S03_M2_COMMON_RESULT=PASS_READ_ONLY_CHECKPOINT$' s03-m2-forward-checkpoint.txt

      - name: Summary
        if: always()
        run: |
          {
            echo '## S03_M2 checkpoint through 2026-09-29'
            echo
            echo '- Production PostgreSQL read-only'
            echo '- frozen S03_M2 rule, no retune'
            echo '- no DB write / LINE / BUY / Production change'
            echo
            grep -E '^RESULT_DAY_READINESS_(SUMMARY|RESULT)=' result-day-readiness.txt || true
            grep -E '^S03_M2_COMMON_(INPUT|COVERAGE|OVERALL|RISK|HALVES|BOOTSTRAP|PERIOD|REMAINING_TO_100|RESULT)=' s03-m2-forward-checkpoint.txt || true
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s03-m2-refresh-20260929-${{ github.run_id }}
          path: |
            result-day-readiness.txt
            s03-m2-forward-checkpoint.txt
          retention-days: 90
          if-no-files-found: error
