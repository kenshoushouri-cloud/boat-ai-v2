name: Railway 5GB full-history v4 current parity read-only

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/railway-hobby-fullhistory-v4-current-parity-readonly.yml
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  SOURCE_SERVICE: "postgres-recovery"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  parity:
    if: >-
      github.event_name == 'push' ||
      (
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway hobby-fullhistory-v4-current-parity'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.4"
          npm install --global @railway/cli

      - name: Write consistent read-only capture helper
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/current-parity-capture.py <<'PY'
          import os
          import runpy
          import sys
          from pathlib import Path

          import psycopg

          root = Path(sys.argv[1])
          root.mkdir(parents=True, exist_ok=True)

          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          capture = contract["capture"]

          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          conn = psycopg.connect(url, autocommit=True)
          try:
              conn.execute("BEGIN ISOLATION LEVEL REPEATABLE READ READ ONLY")
              metadata_counts, db_bytes, evidence_sha = capture(conn, root)
              conn.execute("ROLLBACK")
          finally:
              conn.close()

          print("CAPTURE_EVIDENCE_SHA256=" + evidence_sha)
          print("CAPTURE_DB_BYTES=" + str(db_bytes))
          for key in sorted(metadata_counts):
              print("CAPTURE_COUNT_" + key.upper().replace("-", "_") + "=" + str(metadata_counts[key]))
          PY

      - name: Capture current recovery reference before
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$SOURCE_SERVICE" \
            python3 /tmp/current-parity-capture.py source-before > source-before.capture
          grep '^CAPTURE_' source-before.capture > source-before.capture.sanitized
          test -s source-before/candidate-table-counts.tsv

      - name: Capture candidate v4
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$TARGET_SERVICE" \
            python3 /tmp/current-parity-capture.py candidate > candidate.capture
          grep '^CAPTURE_' candidate.capture > candidate.capture.sanitized
          test -s candidate/candidate-table-counts.tsv

      - name: Capture current recovery reference after
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$SOURCE_SERVICE" \
            python3 /tmp/current-parity-capture.py source-after > source-after.capture
          grep '^CAPTURE_' source-after.capture > source-after.capture.sanitized
          test -s source-after/candidate-table-counts.tsv

      - name: Compare current recovery and candidate exactly
        id: parity
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > current-parity.sanitized
          import hashlib
          import runpy
          from pathlib import Path

          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          kinds = contract["KINDS"]
          limit_bytes = int(contract["LIMIT_BYTES"])

          def lines(root, kind):
              path = Path(root) / f"candidate-{kind}.tsv"
              return path.read_text(encoding="utf-8").splitlines()

          def digest(root):
              h = hashlib.sha256()
              for kind in kinds:
                  h.update((Path(root) / f"candidate-{kind}.tsv").read_bytes())
              return h.hexdigest()

          def capture_value(path, key):
              for line in Path(path).read_text(encoding="utf-8").splitlines():
                  if line.startswith(key + "="):
                      return line.split("=", 1)[1]
              raise KeyError((path, key))

          before_sha = digest("source-before")
          candidate_sha = digest("candidate")
          after_sha = digest("source-after")
          candidate_db_bytes = int(capture_value("candidate.capture.sanitized", "CAPTURE_DB_BYTES"))
          source_before_db_bytes = int(capture_value("source-before.capture.sanitized", "CAPTURE_DB_BYTES"))
          source_after_db_bytes = int(capture_value("source-after.capture.sanitized", "CAPTURE_DB_BYTES"))
          headroom = limit_bytes - candidate_db_bytes

          source_stable = before_sha == after_sha
          candidate_matches_before = candidate_sha == before_sha
          candidate_matches_after = candidate_sha == after_sha

          print("SOURCE_BEFORE_EVIDENCE_SHA256=" + before_sha)
          print("CANDIDATE_EVIDENCE_SHA256=" + candidate_sha)
          print("SOURCE_AFTER_EVIDENCE_SHA256=" + after_sha)
          print("SOURCE_STABLE_DURING_AUDIT=" + ("true" if source_stable else "false"))
          print("CANDIDATE_MATCHES_SOURCE_BEFORE=" + ("true" if candidate_matches_before else "false"))
          print("CANDIDATE_MATCHES_SOURCE_AFTER=" + ("true" if candidate_matches_after else "false"))
          print("SOURCE_BEFORE_DB_BYTES=" + str(source_before_db_bytes))
          print("SOURCE_AFTER_DB_BYTES=" + str(source_after_db_bytes))
          print("CANDIDATE_DB_BYTES=" + str(candidate_db_bytes))
          print("CANDIDATE_HEADROOM_BYTES=" + str(headroom))
          print("UNDER_5GB=" + ("true" if candidate_db_bytes < limit_bytes else "false"))

          mismatch_kinds = []
          for kind in kinds:
              before = lines("source-before", kind)
              cand = lines("candidate", kind)
              after = lines("source-after", kind)
              if before != cand or after != cand or before != after:
                  mismatch_kinds.append(kind)
                  before_set, cand_set, after_set = set(before), set(cand), set(after)
                  print(
                      f"MISMATCH_KIND={kind}|"
                      f"SOURCE_BEFORE_ROWS={len(before)}|CANDIDATE_ROWS={len(cand)}|SOURCE_AFTER_ROWS={len(after)}|"
                      f"BEFORE_ONLY_VS_CAND={len(before_set-cand_set)}|CAND_ONLY_VS_BEFORE={len(cand_set-before_set)}|"
                      f"AFTER_ONLY_VS_CAND={len(after_set-cand_set)}|CAND_ONLY_VS_AFTER={len(cand_set-after_set)}"
                  )
                  if kind == "table-counts":
                      names = {}
                      def ingest(label, rows):
                          for row in rows:
                              parts = row.split("\t")
                              if len(parts) >= 2:
                                  names.setdefault(parts[0], {})[label] = parts[1]
                      ingest("source_before", before)
                      ingest("candidate", cand)
                      ingest("source_after", after)
                      for name in sorted(names):
                          v = names[name]
                          if len(set(v.values())) > 1 or len(v) != 3:
                              print(
                                  "TABLE_COUNT_DIFF|"
                                  + name
                                  + "|SOURCE_BEFORE=" + v.get("source_before", "MISSING")
                                  + "|CANDIDATE=" + v.get("candidate", "MISSING")
                                  + "|SOURCE_AFTER=" + v.get("source_after", "MISSING")
                              )
                  else:
                      for row in sorted(before_set - cand_set)[:3]:
                          print("SOURCE_BEFORE_ONLY|" + kind + "|" + row)
                      for row in sorted(cand_set - before_set)[:3]:
                          print("CANDIDATE_ONLY|" + kind + "|" + row)

          print("MISMATCH_KINDS=" + (",".join(mismatch_kinds) if mismatch_kinds else "NONE"))

          ok = (
              source_stable
              and candidate_matches_before
              and candidate_matches_after
              and not mismatch_kinds
              and candidate_db_bytes < limit_bytes
          )
          print("CURRENT_EXACT_PARITY=" + ("PASS" if ok else "FAIL"))
          print("SOURCE_WRITE=0")
          print("CANDIDATE_WRITE=0")
          print("CUTOVER=0")
          print("DELETE=0")
          print("RESIZE=0")
          print("PLAN_CHANGE=0")
          print("PURCHASE_ACTION=false")
          raise SystemExit(0 if ok else 1)
          PY

      - name: Build sanitized success
        if: success()
        shell: bash
        run: |
          {
            echo '## 5GB full-history candidate v4 current exact parity'
            echo
            echo 'PASS: candidate-v4 exactly matches a stable current postgres-recovery reference.'
            echo
            echo '```text'
            cat current-parity.sanitized
            echo '```'
            echo
            echo 'Read-only verification only. No source/candidate mutation was requested.'
          } > summary.md

      - name: Build sanitized failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## 5GB full-history candidate v4 current exact parity'
            echo
            echo 'FAIL: current exact parity was not established.'
            if [ -s current-parity.sanitized ]; then
              echo
              echo '```text'
              cat current-parity.sanitized
              echo '```'
            fi
            echo
            echo 'Read-only verification only. No source/candidate mutation, cutover, delete, resize, plan change, or purchase action was requested.'
          } > summary.md

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
