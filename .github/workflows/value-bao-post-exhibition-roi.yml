name: Value Bao Post-Exhibition ROI

on:
  pull_request:
    paths:
      - '.github/scripts/value_bao_post_exhibition_market_residual_pg.py'
      - '.github/scripts/value_bao_post_exhibition_roi_pg.py'
      - '.github/scripts/value_s02_timing_safe_expansion_pg.py'
      - '.github/workflows/value-bao-post-exhibition-roi.yml'
      - 'report_candidate_shadow_active_comparison_pg.py'
      - 'report_candidate_filter_shadow_robustness_pg.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000
  ACTIVE_SHADOW_REPORT_DAYS: '30'
  CANDIDATE_SHADOW_REPORT_DAYS: '30'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only research scripts
        run: |
          python -m py_compile .github/scripts/value_bao_post_exhibition_market_residual_pg.py
          python -m py_compile .github/scripts/value_bao_post_exhibition_roi_pg.py
          python -m py_compile .github/scripts/value_s02_timing_safe_expansion_pg.py
          python -m py_compile report_candidate_shadow_active_comparison_pg.py
          python -m py_compile report_candidate_filter_shadow_robustness_pg.py
          python - <<'PY'
          from pathlib import Path
          strict=(
              '.github/scripts/value_bao_post_exhibition_market_residual_pg.py',
              '.github/scripts/value_bao_post_exhibition_roi_pg.py',
              '.github/scripts/value_s02_timing_safe_expansion_pg.py',
          )
          reports=(
              'report_candidate_shadow_active_comparison_pg.py',
              'report_candidate_filter_shadow_robustness_pg.py',
          )
          for path in strict:
              text=Path(path).read_text(encoding='utf-8').lower()
              assert 'set transaction read only' in text
              for token in ('delete from','insert into','alter table','drop table','truncate ','vacuum ','create table'):
                  assert token not in text,(path,token)
          for path in reports:
              text=Path(path).read_text(encoding='utf-8').lower()
              for token in ('delete from','insert into','update v2_','alter table','drop table','truncate ','vacuum ','create table'):
                  assert token not in text,(path,token)
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text())
          value = data.get('DATABASE_PUBLIC_URL') if isinstance(data, dict) else None
          if isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run fixed-contract post-exhibition ROI audit
        run: |
          python -u .github/scripts/value_bao_post_exhibition_roi_pg.py | tee value-bao-post-exhibition-roi.txt
          grep -q '^VALUE_BAO_ROI_RESULT=PASS_READ_ONLY$' value-bao-post-exhibition-roi.txt
      - name: Run active candidate volume comparison
        run: |
          python -u report_candidate_shadow_active_comparison_pg.py | tee candidate-active.txt
          grep -q '^ACTIVE_SHADOW_RESULT=PASS_READ_ONLY$' candidate-active.txt
      - name: Run candidate robustness breakdown
        run: |
          python -u report_candidate_filter_shadow_robustness_pg.py | tee candidate-robustness.txt
          grep -q '^RESULT=PASS$' candidate-robustness.txt
      - name: Run timing-safe S02 boundary expansion audit
        run: |
          python -u .github/scripts/value_s02_timing_safe_expansion_pg.py | tee value-s02-expansion.txt
          grep -q '^VALUE_S02_EXPANSION_RESULT=PASS_READ_ONLY$' value-s02-expansion.txt
      - name: Upload aggregate research artifact
        uses: actions/upload-artifact@v4
        with:
          name: value-candidate-volume-roi-${{ github.run_id }}
          path: |
            value-bao-post-exhibition-roi.json
            value-bao-post-exhibition-roi.txt
            candidate-active.txt
            candidate-robustness.txt
            value-s02-timing-safe-expansion.json
            value-s02-expansion.txt
          retention-days: 30
          if-no-files-found: error
