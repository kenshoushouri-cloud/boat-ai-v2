name: V5 mainline first-write executor offline tests

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  offline:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/v5 first-write-executor-offline-20261010'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Test transactional first-write and readback with mock DB
        id: test
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_v5_official_first_write_executor.py' -v > test-output.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Generate short result
        id: report
        if: always()
        env:
          PASSED: ${{ steps.test.outputs.passed }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw=Path("test-output.txt").read_text(encoding="utf-8",errors="replace") if Path("test-output.txt").exists() else ""
          keep=[s[:260] for s in raw.splitlines() if s.startswith(("test_","Ran ","OK","FAILED","ERROR","FAIL","Traceback","AssertionError","ImportError","TypeError","ValueError"))]
          passed=os.environ.get("PASSED")=="true" and "Ran 21 tests" in raw and "\nOK\n" in raw
          with open(os.environ["GITHUB_OUTPUT"],"a") as out:out.write("verified="+("true" if passed else "false")+"\n")
          lines=[
            "## V5 mainline transactional first-write executor",
            "",
            "- 21 mock transaction tests; no real Railway/DB/HTTP, Production V4, LINE, stake or BUY",
            "- Injected mock DB checks INSERT ON CONFLICT DO NOTHING, same-tx immutable readback, collision rollback. Actual DB deployment and independent Forward provenance remain unverified.",
            "",
            "~~~text",*keep[-33:],"~~~","",
            "V5_MAINLINE_FIRST_WRITE_EXECUTOR_PASS" if passed else "V5_MAINLINE_FIRST_WRITE_EXECUTOR_FAILED"
          ]
          Path("summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 581 --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Reject failing tests
        if: steps.report.outputs.verified != 'true'
        run: exit 1
