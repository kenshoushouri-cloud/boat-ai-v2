name: Official motor start parser probe

on:
  pull_request:
    paths:
      - '.github/scripts/official_motor_start_parser_probe.py'
      - '.github/workflows/official-motor-start-parser-probe.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install probe dependencies
        run: pip install requests beautifulsoup4
      - name: Run official HTTP parser probe
        run: python -u .github/scripts/official_motor_start_parser_probe.py
