name: Parser Celsius regression test

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  test:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/test parser-celsius-regression'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile focused files
        run: |
          python -m py_compile \
            v21_realtime_collector_pg.py \
            backfill_historical_beforeinfo_pg.py \
            tests/test_v21_parser_sanity.py
      - name: Run focused parser tests
        run: PYTHONPATH=. python -m unittest discover -s tests -p 'test_v21_parser_sanity.py'
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if [ "${{ job.status }}" = "success" ]; then
            body='PARSER_CELSIUS_REGRESSION=PASS'
          else
            body='PARSER_CELSIUS_REGRESSION=FAIL'
          fi
          gh issue comment 581 --repo "$GITHUB_REPOSITORY" --body "$body"
