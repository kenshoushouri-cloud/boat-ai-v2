name: Candidate Discovery V4 Prospective Freeze

on:
  pull_request:
    paths:
      - 'research/candidate_discovery_v4_prospective_freeze_pg.py'
      - 'tests/test_candidate_discovery_v4_prospective_freeze.py'
      - '.github/scripts/candidate_discovery_v4_main_feed_pg.py'
      - 'research/candidate_discovery_v4_contract.py'
      - 'research/candidate_discovery_v4_capture_arbiter.py'
      - 'research/candidate_discovery_v4_pre_freeze_availability_capture.py'
      - 'research/candidate_discovery_v4_pre_freeze_availability_capture_pg.py'
      - 'research/candidate_discovery_v4_availability_snapshot_binder.py'
      - 'research/candidate_discovery_v4_availability_guard.py'
      - 'research/candidate_discovery_v4_availability_gate_runtime.py'
      - 'tests/test_candidate_discovery_v4_availability_guard.py'
      - 'tests/test_candidate_discovery_v4_availability_snapshot_binder.py'
      - 'tests/test_candidate_discovery_v4_availability_gate_runtime.py'
      - 'docs/V4_PRE_FREEZE_AVAILABILITY_SHADOW_ACTIVATION_20260922.md'
      - 'docs/V4_AVAILABILITY_GUARD_PRODUCTION_ACTIVATION_20260923.md'
      - '.github/workflows/candidate-discovery-v4-prospective-freeze.yml'
  schedule:
    - cron: '16 23 * * *'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'YYYY-MM-DD current JST Forward date'
        required: true
        type: string

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000
  PYTHONPATH: .

jobs:
  safety:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate prospective freeze wrapper safety
        run: |
          python -m pip install pytest
          python -m py_compile \
            research/candidate_discovery_v4_prospective_freeze_pg.py \
            research/candidate_discovery_v4_capture_arbiter.py \
            research/candidate_discovery_v4_pre_freeze_availability_capture.py \
            research/candidate_discovery_v4_pre_freeze_availability_capture_pg.py \
            research/candidate_discovery_v4_availability_snapshot_binder.py \
            research/candidate_discovery_v4_availability_guard.py \
            research/candidate_discovery_v4_availability_gate_runtime.py
          python tests/test_candidate_discovery_v4_prospective_freeze.py
          pytest -q \
            tests/test_candidate_discovery_v4_availability_guard.py \
            tests/test_candidate_discovery_v4_availability_snapshot_binder.py \
            tests/test_candidate_discovery_v4_availability_gate_runtime.py
          python - <<'PY'
          from pathlib import Path
          workflow=Path('.github/workflows/candidate-discovery-v4-prospective-freeze.yml').read_text(encoding='utf-8')
          assert "cron: '16 23 * * *'" in workflow
          assert "PYTHONPATH: ." in workflow
          assert "github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'" in workflow
          assert 'TZ=Asia/Tokyo date +%F' in workflow
          assert 'canonical_core_payload_sha256' in workflow
          assert 'candidate-discovery-v4-prospective-freeze.json.core.sha256' in workflow
          assert 'candidate-discovery-v4-availability-raw-' in workflow
          assert 'candidate-discovery-v4-availability-guard-' in workflow
          assert 'continue-on-error: true' in workflow
          assert 'CANDIDATE_V4_AVAILABILITY_CAPTURE_RESULT=PASS_PRE_FREEZE_RAW_CAPTURE' in workflow
          assert "grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_PURCHASE_ACTION=false$' candidate-discovery-v4-availability-gate.txt" in workflow
          assert "grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_REPLACEMENT=0$' candidate-discovery-v4-availability-gate.txt" in workflow
          assert "grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_RERANK=0$' candidate-discovery-v4-availability-gate.txt" in workflow
          assert "grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_DECISION=PASS_ACTIVE_CORE$' candidate-discovery-v4-availability-gate.txt" in workflow
          assert "grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_ELIGIBLE=true$' candidate-discovery-v4-availability-gate.txt" in workflow
          assert "steps.availability_gate.outcome == 'success'" in workflow
          assert 'CANDIDATE_V4_AVAILABILITY_GUARD_ENFORCED=1' in workflow
          PY

  freeze:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'schedule'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install read-only dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Resolve freeze target date
        env:
          DISPATCH_TARGET_DATE: ${{ inputs.target_date }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            target_date="$DISPATCH_TARGET_DATE"
          else
            target_date="$(TZ=Asia/Tokyo date +%F)"
          fi
          if [ -z "$target_date" ]; then
            echo 'target date is empty' >&2
            exit 1
          fi
          echo "CANDIDATE_V4_DATE=$target_date" >> "$GITHUB_ENV"
          echo "CANDIDATE_V4_RESOLVED_TARGET_DATE=$target_date"
      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Capture pre-freeze official availability raw
        id: availability_capture
        continue-on-error: true
        env:
          CANDIDATE_V4_AVAILABILITY_OUTPUT_DIR: candidate-discovery-v4-availability-raw
          CANDIDATE_V4_AVAILABILITY_REQUEST_OUTPUT: candidate-discovery-v4-availability-capture-request.json
        run: |
          python -u research/candidate_discovery_v4_pre_freeze_availability_capture_pg.py | tee candidate-discovery-v4-availability-capture.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_CAPTURE_PURCHASE_ACTION=false$' candidate-discovery-v4-availability-capture.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_CAPTURE_RESULT=PASS_PRE_FREEZE_RAW_CAPTURE$' candidate-discovery-v4-availability-capture.txt
      - name: Upload pre-freeze availability raw evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-v4-availability-raw-${{ github.run_id }}
          path: |
            candidate-discovery-v4-availability-raw/
            candidate-discovery-v4-availability-capture-request.json
            candidate-discovery-v4-availability-capture.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Record availability capture outcome
        if: always()
        run: |
          echo "CANDIDATE_V4_AVAILABILITY_CAPTURE_STEP_OUTCOME=${{ steps.availability_capture.outcome }}"

      - name: Run timestamp-proven pre-result V4 freeze
        env:
          CANDIDATE_V4_RAW_OUTPUT: candidate-discovery-v4-main-feed.raw.json
          CANDIDATE_V4_PROSPECTIVE_OUTPUT: candidate-discovery-v4-prospective-freeze.json
        run: |
          python -u research/candidate_discovery_v4_prospective_freeze_pg.py | tee candidate-discovery-v4-prospective-freeze.txt
          grep -q '^CANDIDATE_V4_PROSPECTIVE_EVIDENCE_ELIGIBLE=true$' candidate-discovery-v4-prospective-freeze.txt
          grep -q '^CANDIDATE_V4_PROSPECTIVE_PURCHASE_ACTION=false$' candidate-discovery-v4-prospective-freeze.txt
          grep -q '^CANDIDATE_V4_PROSPECTIVE_PROMOTION_ALLOWED=0$' candidate-discovery-v4-prospective-freeze.txt
          grep -q '^CANDIDATE_V4_PROSPECTIVE_RESULT=PASS_PRE_RESULT_FREEZE$' candidate-discovery-v4-prospective-freeze.txt
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          from research.candidate_discovery_v4_capture_arbiter import canonical_core_payload_sha256
          p=Path('candidate-discovery-v4-prospective-freeze.json')
          data=json.loads(p.read_text(encoding='utf-8'))
          assert data['contract']=='candidate_discovery_v4_main_feed_v1'
          assert data['prospective_evidence_eligible'] is True
          assert data['freeze_provenance']['mode']=='prospective'
          assert data['freeze_provenance']['all_frozen_rows_pre_deadline'] is True
          assert data['freeze_provenance']['prospective_evidence_eligible'] is True
          assert data['purchase_action'] is False
          artifact_digest=hashlib.sha256(p.read_bytes()).hexdigest()
          Path(str(p)+'.sha256').write_text(f'{artifact_digest}  {p.name}\n', encoding='utf-8')
          print('CANDIDATE_V4_PROSPECTIVE_ARTIFACT_SHA256='+artifact_digest)
          core_digest=canonical_core_payload_sha256(data)
          Path(str(p)+'.core.sha256').write_text(f'{core_digest}  {p.name}\n', encoding='utf-8')
          print('CANDIDATE_V4_PROSPECTIVE_CANONICAL_CORE_SHA256='+core_digest)
          PY
      - name: Evaluate pre-freeze availability guard
        id: availability_gate
        continue-on-error: true
        run: |
          python -u research/candidate_discovery_v4_availability_gate_runtime.py \
            --artifact candidate-discovery-v4-prospective-freeze.json \
            --capture-dir candidate-discovery-v4-availability-raw \
            --request candidate-discovery-v4-availability-capture-request.json \
            --snapshot-output candidate-discovery-v4-availability-snapshot.json \
            --result-output candidate-discovery-v4-availability-gate.json \
            | tee candidate-discovery-v4-availability-gate.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_PURCHASE_ACTION=false$' candidate-discovery-v4-availability-gate.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_REPLACEMENT=0$' candidate-discovery-v4-availability-gate.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_RERANK=0$' candidate-discovery-v4-availability-gate.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_DECISION=PASS_ACTIVE_CORE$' candidate-discovery-v4-availability-gate.txt
          grep -q '^CANDIDATE_V4_AVAILABILITY_GATE_ELIGIBLE=true$' candidate-discovery-v4-availability-gate.txt

      - name: Upload availability guard evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-v4-availability-guard-${{ github.run_id }}
          path: |
            candidate-discovery-v4-availability-snapshot.json
            candidate-discovery-v4-availability-gate.json
            candidate-discovery-v4-availability-gate.txt
            candidate-discovery-v4-prospective-freeze.json
            candidate-discovery-v4-prospective-freeze.json.sha256
            candidate-discovery-v4-prospective-freeze.json.core.sha256
            candidate-discovery-v4-prospective-freeze.txt
          retention-days: 90
          if-no-files-found: warn

      - name: Upload immutable prospective freeze
        if: steps.availability_gate.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-v4-prospective-freeze-${{ github.run_id }}
          path: |
            candidate-discovery-v4-prospective-freeze.json
            candidate-discovery-v4-prospective-freeze.json.sha256
            candidate-discovery-v4-prospective-freeze.json.core.sha256
            candidate-discovery-v4-prospective-freeze.txt
          retention-days: 90
          if-no-files-found: error

      - name: Enforce availability guard
        if: always()
        run: |
          echo "CANDIDATE_V4_AVAILABILITY_CAPTURE_OUTCOME=${{ steps.availability_capture.outcome }}"
          echo "CANDIDATE_V4_AVAILABILITY_GATE_OUTCOME=${{ steps.availability_gate.outcome }}"
          if [ "${{ steps.availability_capture.outcome }}" != "success" ]; then
            echo 'pre-freeze availability raw capture did not succeed; formal artifact is blocked' >&2
            exit 1
          fi
          if [ "${{ steps.availability_gate.outcome }}" != "success" ]; then
            echo 'pre-freeze availability guard did not PASS_ACTIVE_CORE; formal artifact is blocked' >&2
            exit 1
          fi
          echo "CANDIDATE_V4_AVAILABILITY_GUARD_ENFORCED=1"
