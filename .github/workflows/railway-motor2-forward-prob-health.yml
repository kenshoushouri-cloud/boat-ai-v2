name: Railway Motor2 Forward probability health

on:
  pull_request:
    paths:
      - '.github/scripts/motor2_forward_prob_health.py'
      - '.github/workflows/railway-motor2-forward-prob-health.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate read-only audit
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/motor2_forward_prob_health.py
          python - <<'PY'
          from pathlib import Path
          low=Path('.github/scripts/motor2_forward_prob_health.py').read_text(encoding='utf-8').lower()
          assert 'motor2_forward_prob_mode=read_only' in low
          assert 'v2_v24_motor2_forward_shadow' in low
          assert 'latest_complete_pre_snapshot_per_race' in low
          assert 'no_threshold_or_coefficient_search' in low
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert','send_line'):
              assert token not in low, token
          print('MOTOR2_FORWARD_PROB_VALIDATE=PASS')
          PY

  report:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway motor2-forward-prob-health'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Resolve JST end date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone,timedelta
          end=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write('MOTOR2_FORWARD_PROB_START=2026-08-20\n')
              fh.write(f'MOTOR2_FORWARD_PROB_END={end}\n')
          print(f'MOTOR2_FORWARD_PROB_TARGET={end}')
          PY
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run Motor2 Forward probability health
        run: |
          set -euo pipefail
          python -u .github/scripts/motor2_forward_prob_health.py 2>&1 | tee motor2-forward-prob.txt
      - name: Reply with sanitized report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Motor2 Forward probability health'
            echo
            echo '```text'
            grep '^MOTOR2_FORWARD_PROB_' motor2-forward-prob.txt 2>/dev/null || echo 'MOTOR2_FORWARD_PROB_DIAGNOSTIC=no_output'
            echo '```'
            echo
            echo 'Read-only existing-Shadow probability-quality report. No DB update, LINE, Production decision, Railway setting, rule/threshold/coefficient, or promotion change.'
          } > motor2-forward-prob-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file motor2-forward-prob-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json motor2-forward-prob.txt motor2-forward-prob-comment.md
