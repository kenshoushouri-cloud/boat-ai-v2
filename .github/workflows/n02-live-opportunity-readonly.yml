name: N02 live opportunity read-only plan

on:
  pull_request:
    paths:
      - '.github/workflows/n02-live-opportunity-readonly.yml'
      - '.github/scripts/n02_live_opportunity_plan.py'
      - 'v24_pre_candidate_notifier_pg.py'
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate N02 live planner read-only policy
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/n02_live_opportunity_plan.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/n02_live_opportunity_plan.py').read_text(encoding='utf-8')
          assert 'os.environ["DRY_RUN"] = "1"' in p
          assert 'os.environ["TEST_MODE"] = "1"' in p
          assert 'N02_LIVE_POLICY=no_ddl_no_db_write_no_line_no_shadow_save_no_prod_change_no_rule_change_no_promotion' in p
          assert 'execute(' not in p
          assert 'upsert' not in p.lower()
          assert 'send_line' not in p.lower()
          assert 'N02_RACE_NOS = {7, 8, 9, 10}' in p
          print('N02_LIVE_READONLY_VALIDATE=PASS')
          PY

  plan:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway n02-live-opportunity-plan'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run N02 live opportunity planner
        env:
          PYTHONPATH: ${{ github.workspace }}
          N02_LIVE_SAMPLE_LIMIT: '10'
        run: |
          set -euo pipefail
          python -u .github/scripts/n02_live_opportunity_plan.py 2>&1 | tee n02-live-output.txt
      - name: Reply with sanitized plan
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## N02 live opportunity read-only plan'
            echo
            echo '```text'
            grep '^N02_LIVE_' n02-live-output.txt 2>/dev/null || echo 'N02_LIVE_DIAGNOSTIC=no_plan_output'
            echo '```'
            echo
            echo 'Current/future opportunity inspection only. No odds, Shadow rows, notifications, LINE, Production decision, Railway setting, rule, model parameter, or promotion state was changed.'
          } > n02-live-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file n02-live-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json n02-live-output.txt n02-live-comment.md
