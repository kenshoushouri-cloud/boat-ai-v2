name: V4 exhibition-time rank one-shot read-only replay

on:
  pull_request:
    paths:
      - 'research/.v4-exhibition-time-rank-run-once-20260927'

permissions:
  contents: read

jobs:
  replay:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'research/v4-exhibition-time-rank-oos-20260927' &&
      github.event.pull_request.head.sha == '6d5986f7889a8bb89cc0d32a95b2b1f50492bc0c'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEDICATED_DATABASE_URL: ${{ secrets.V4_BACKTEST_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      V4_EXHIBITION_TIME_OUTPUT_JSON: 'v4-exhibition-time-rank-oos.json'
      V4_LONG_HELPER_PATH: ${{ github.workspace }}/.v4-long-helper/research/v4_long_history_walkforward_pg.py

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Verify exact one-shot trigger
        run: |
          set -euo pipefail
          test "$(cat research/.v4-exhibition-time-rank-run-once-20260927)" = "RUN_ONCE_20260927_V4_EXHIBITION_TIME_RANK"

      - name: Checkout pinned canonical long-history helper
        uses: actions/checkout@v4
        with:
          ref: ac91c9a2e9570d3af3589e2e98b6529a77c14756
          path: .v4-long-helper
          persist-credentials: false
          sparse-checkout: |
            research/v4_long_history_walkforward_pg.py
            .github/scripts/candidate_discovery_v1_pg.py

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Select read-only execution route
        run: |
          set -euo pipefail
          if [ -n "${DEDICATED_DATABASE_URL:-}" ]; then
            echo "V4_EXHIBITION_TIME_DB_REPLAY=DEDICATED_DATABASE_SECRET"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "V4_EXHIBITION_TIME_DB_REPLAY=RAILWAY_RUN_NON_ENUMERATING"
          else
            echo "V4_EXHIBITION_TIME_DB_REPLAY=BLOCKED_NO_APPROVED_CONNECTION_ROUTE"
            exit 1
          fi

      - name: Install Railway CLI for non-enumerating local env injection
        if: env.DEDICATED_DATABASE_URL == '' && env.RAILWAY_TOKEN != ''
        run: npm install --global @railway/cli

      - name: Run replay via dedicated read-only connection
        if: env.DEDICATED_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.V4_BACKTEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          python -u research/v4_exhibition_time_rank_oos_pg.py 2>&1 | tee v4-exhibition-time-rank-oos.txt
          grep -q '^RESULT=PASS_READ_ONLY$' v4-exhibition-time-rank-oos.txt

      - name: Run replay via Railway local env injection
        if: env.DEDICATED_DATABASE_URL == '' && env.RAILWAY_TOKEN != ''
        run: |
          set -euo pipefail
          railway run             --project "${RAILWAY_PROJECT_ID}"             --environment "${RAILWAY_ENVIRONMENT}"             --service "${RAILWAY_DB_SERVICE}"             bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u research/v4_exhibition_time_rank_oos_pg.py'             2>&1 | tee v4-exhibition-time-rank-oos.txt
          grep -q '^RESULT=PASS_READ_ONLY$' v4-exhibition-time-rank-oos.txt

      - name: Hash immutable result
        if: success()
        run: |
          set -euo pipefail
          test -s v4-exhibition-time-rank-oos.json
          sha256sum v4-exhibition-time-rank-oos.json | tee v4-exhibition-time-rank-oos.sha256

      - name: Upload sanitized research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-exhibition-time-rank-oos-${{ github.run_id }}
          path: |
            v4-exhibition-time-rank-oos.json
            v4-exhibition-time-rank-oos.txt
            v4-exhibition-time-rank-oos.sha256
          retention-days: 90
          if-no-files-found: warn

      - name: Confirm no variable enumeration or collector execution
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/v4-exhibition-time-rank-one-shot.yml').read_text(encoding='utf-8').lower()
          forbidden=('railway'+' variable'+' list','print'+'env','env'+' |','railway-vars'+'.json','collect_'+'exhibition')
          for value in forbidden:
              assert value not in text, value
          assert 'railway run' in text
          print('V4_EXHIBITION_TIME_SECRET_ENUMERATION=0')
          print('V4_EXHIBITION_TIME_COLLECTOR_EXECUTION=0')
          PY
