name: Actual motor probability OOS read-only report

on:
  pull_request:
    paths:
      - '.github/workflows/actual-motor-prob-oos-readonly.yml'
      - 'backtest_prob_actual_motor_shadow_pg.py'
      - 'v24_pre_candidate_notifier_pg.py'
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate actual motor probability report
        run: |
          set -euo pipefail
          python -m py_compile backtest_prob_actual_motor_shadow_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('backtest_prob_actual_motor_shadow_pg.py').read_text(encoding='utf-8')
          assert 'from db_pg import fetch_all' in p
          assert 'only_replace_v24_default_motor2_33_boat2_34_with_actual_entry_rates' in p
          assert 'motor_place2_rate' in p and 'boat_place2_rate' in p
          assert 'no_coefficient_tuning' in p
          assert 'execute(' not in p
          assert 'upsert' not in p.lower()
          assert 'send_line' not in p.lower()
          print('ACTUAL_MOTOR_PROB_OOS_VALIDATE=PASS')
          PY

  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway actual-motor-prob-oos'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run fixed OOS comparison
        env:
          PYTHONPATH: ${{ github.workspace }}
          MOTOR_PROB_START_DATE: '2026-07-01'
          MOTOR_PROB_END_DATE: '2026-08-15'
        run: |
          set -euo pipefail
          python -u backtest_prob_actual_motor_shadow_pg.py 2>&1 | tee actual-motor-prob-output.txt
      - name: Reply with sanitized report
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Actual motor probability OOS read-only report'
            echo
            echo '```text'
            grep -E '^(✅ backtest_prob_actual_motor_shadow_pg.py|PERIOD=|CHANGE_UNDER_TEST=|POLICY=|COVERAGE=|LOGLOSS=|BRIER=|WINNER_RANK=|=== MONTHLY ===|2026-07:|2026-08:|INTERPRETATION=|RESULT=)' actual-motor-prob-output.txt 2>/dev/null || echo 'ACTUAL_MOTOR_PROB_OOS_DIAGNOSTIC=no_report_output'
            echo '```'
            echo
            echo 'Read-only fixed-formula Shadow comparison only. No coefficient search/tuning and no DB update, LINE, Production decision, Railway setting, v24 rule/threshold change, Bao promotion, or PR #169 state change.'
          } > actual-motor-prob-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file actual-motor-prob-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json actual-motor-prob-output.txt actual-motor-prob-comment.md
