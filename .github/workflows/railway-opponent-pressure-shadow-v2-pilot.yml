name: Railway opponent pressure Shadow v2 pilot

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/opponent_pressure_shadow_v2_collector.py'
      - '.github/workflows/railway-opponent-pressure-shadow-v2-pilot.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway opponent-pressure-shadow-v2-pilot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run compact v2 collector
        id: audit
        env:
          OPPONENT_PRESSURE_SHADOW_V2_ENABLED: '1'
          OPPONENT_PRESSURE_SHADOW_V2_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          TARGET_DATE: '2026-08-22'
          WINDOW_NAME: ${{ github.event_name == 'pull_request' && 'ci_dry_run' || 'pilot_v2_20260822' }}
        run: |
          set +e
          python -u .github/scripts/opponent_pressure_shadow_v2_collector.py > v2-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized collector result
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('v2-output.txt').read_text(encoding='utf-8',errors='replace') if Path('v2-output.txt').exists() else ''
          for line in text.splitlines():
              if line.startswith('OPP_PRESSURE_V2_'):
                  print(line[:1000])
          PY
      - name: Compare v2 to v1 pilot
        if: github.event_name == 'issue_comment' && steps.audit.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],row_factory=dict_row) as conn:
            with conn.cursor() as cur:
              cur.execute("""
                with cmp as (
                  select v2.race_id,
                    greatest(
                      coalesce((select max(abs((j->>'base_win')::real-v2.base_win[i])) from generate_subscripts(v2.base_win,1) i cross join lateral (select v1.lane_scores->(i-1) j) z),0),
                      coalesce((select max(abs((j->>'base_top3')::real-v2.base_top3[i])) from generate_subscripts(v2.base_top3,1) i cross join lateral (select v1.lane_scores->(i-1) j) z),0),
                      coalesce((select max(abs((j->>'score_win')::real-v2.score_win[i])) from generate_subscripts(v2.score_win,1) i cross join lateral (select v1.lane_scores->(i-1) j) z),0),
                      coalesce((select max(abs((j->>'score_top3')::real-v2.score_top3[i])) from generate_subscripts(v2.score_top3,1) i cross join lateral (select v1.lane_scores->(i-1) j) z),0)
                    ) max_abs_diff,
                    cardinality(v2.lane_classes)=6 and cardinality(v2.matched_counts)=6 and cardinality(v2.base_win)=6 and cardinality(v2.base_top3)=6 and cardinality(v2.score_win)=6 and cardinality(v2.score_top3)=6 arrays_ok
                  from v2_opponent_pressure_shadow_v2 v2
                  join v2_opponent_pressure_shadow v1 using(race_id)
                  where v2.race_date=date '2026-08-22'
                )
                select count(*)::bigint matched,
                       count(*) filter(where arrays_ok)::bigint arrays_ok,
                       max(max_abs_diff)::float8 max_abs_diff,
                       pg_total_relation_size('v2_opponent_pressure_shadow_v2')::bigint v2_bytes
                from cmp
              """)
              r=cur.fetchone()
              cur.execute("select count(*)::bigint n from v2_opponent_pressure_shadow_v2 where race_date<>date '2026-08-22'")
              non_target=cur.fetchone()['n']
          print(f"OPP_PRESSURE_V2_POST=matched:{r['matched']} arrays_ok:{r['arrays_ok']} non_target:{non_target} max_abs_diff:{r['max_abs_diff']} relation_bytes:{r['v2_bytes']}")
          if r['matched'] != 156 or r['arrays_ok'] != 156 or non_target != 0 or float(r['max_abs_diff'] or 0) > 0.000002:
              raise SystemExit('v2 equivalence postcondition failed')
          print('OPP_PRESSURE_V2_POST_RESULT=PASS')
          PY
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json v2-output.txt
      - name: Fail if collector failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
