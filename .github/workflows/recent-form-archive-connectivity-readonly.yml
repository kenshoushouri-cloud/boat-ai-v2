name: Recent Form archive connectivity read-only

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway recent-form-archive-connectivity-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          npm install --global @railway/cli
          mkdir -p ~/.ssh
          ssh-keygen -q -t ed25519 -N '' -f ~/.ssh/railway_ephemeral
      - name: Probe archive over Railway SSH
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set +e
          railway ssh             --project "268a5b17-0712-440a-884d-27f7fa887a2d"             --environment production             --service postgres-history-archive             -- sh -lc '
              set -eu
              test -n "${DATABASE_URL:-}"
              psql "$DATABASE_URL" -At -v ON_ERROR_STOP=1 <<SQL
              BEGIN READ ONLY;
              SELECT
                ''SSH_ARCHIVE_OK|'' ||
                current_setting(''transaction_read_only'') || ''|'' ||
                CASE WHEN to_regclass(''public.v2_recent_form_archive'') IS NULL THEN ''absent'' ELSE ''present'' END;
              ROLLBACK;
              SQL
            ' > ssh.out 2> ssh.err
          rc=$?
          echo "SSH_RC=$rc" > ssh-status.out
          exit "$rc"
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Recent Form archive SSH connectivity — read only'
            echo
            cat ssh-status.out 2>/dev/null || echo 'SSH_RC=unknown'
            grep '^SSH_ARCHIVE_OK|' ssh.out 2>/dev/null || true
            if [ -s ssh.err ]; then
              echo
              echo 'Error summary:'
              sed -E 's#postgres(ql)?://[^[:space:]]+#<redacted>#g; s#(password=)[^[:space:]]+#\1<redacted>#g' ssh.err | tail -5
            fi
            echo
            echo 'No variable values/list, DB writes, source reads, resource creation, cutover, cleanup, Railway AI/Agent.'
          } > body.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file body.md
