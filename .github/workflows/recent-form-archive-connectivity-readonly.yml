name: Recent Form archive connectivity read-only

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway recent-form-archive-connectivity-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install minimal clients
        run: |
          set -euo pipefail
          python -m pip install "psycopg[binary]>=3.2,<4"
          npm install --global @railway/cli

      - name: Probe source-server private archive connection read-only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/archive_server_probe.py <<'PY'
          import os, shlex
          import psycopg
          from psycopg import sql

          source = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          archive = os.environ.get("ARCHIVE_DATABASE_URL")
          if not source:
              raise RuntimeError("source database URL unavailable")
          if not archive:
              raise RuntimeError("archive database URL was not preserved")

          with psycopg.connect(source, autocommit=True) as conn:
              with conn.cursor() as cur:
                  cur.execute("BEGIN READ ONLY")
                  cur.execute("SET LOCAL statement_timeout='30000ms'")
                  cur.execute("SET LOCAL max_parallel_workers_per_gather=0")
                  check_sql = "select current_setting('transaction_read_only'), current_database()"
                  program = (
                      "psql " + shlex.quote(archive)
                      + " -X -v ON_ERROR_STOP=1 -Atqc "
                      + shlex.quote(check_sql)
                      + " >/dev/null"
                  )
                  cur.execute(
                      sql.SQL("COPY (SELECT 1) TO PROGRAM {}")
                      .format(sql.Literal(program))
                  )
                  cur.execute("ROLLBACK")

          print("SOURCE_SERVER_PROGRAM=PASS")
          print("ARCHIVE_PRIVATE_CONNECTIVITY=PASS")
          print("SOURCE_DB_WRITE=0 ARCHIVE_DB_WRITE=0")
          PY

          railway run \
            --project "268a5b17-0712-440a-884d-27f7fa887a2d" \
            --environment production \
            --service postgres-history-archive \
            bash -lc '
              set -euo pipefail
              export ARCHIVE_DATABASE_URL="$DATABASE_URL"
              railway run \
                --project "268a5b17-0712-440a-884d-27f7fa887a2d" \
                --environment production \
                --service postgres-hobby-fullhistory-candidate-v4 \
                python /tmp/archive_server_probe.py
            ' | tee probe.out

          grep -q '^SOURCE_SERVER_PROGRAM=PASS$' probe.out
          grep -q '^ARCHIVE_PRIVATE_CONNECTIVITY=PASS$' probe.out
          grep -q '^SOURCE_DB_WRITE=0 ARCHIVE_DB_WRITE=0$' probe.out

      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Recent Form archive private connectivity — read only'
            echo
            if [ -s probe.out ] && grep -q '^ARCHIVE_PRIVATE_CONNECTIVITY=PASS$' probe.out; then
              grep -E '^(SOURCE_SERVER_PROGRAM|ARCHIVE_PRIVATE_CONNECTIVITY|SOURCE_DB_WRITE=)' probe.out
            else
              echo 'ARCHIVE_PRIVATE_CONNECTIVITY=FAIL'
            fi
            echo
            echo 'No variable values/list, DB writes, resource creation, public proxy, cutover, cleanup, Railway AI/Agent.'
          } > body.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file body.md
