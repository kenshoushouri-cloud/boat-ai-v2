name: Recent Form archive connectivity read-only

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway recent-form-archive-connectivity-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: |
          python -m pip install "psycopg[binary]>=3.2,<4"
          npm install --global @railway/cli
      - name: Probe archive connection without exposing variables
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          cat > /tmp/probe.py <<'PY'
          import json, os, psycopg
          pub=os.environ.get("DATABASE_PUBLIC_URL")
          priv=os.environ.get("DATABASE_URL")
          out={"public_url_present":bool(pub),"private_url_present":bool(priv)}
          url=pub or priv
          try:
              with psycopg.connect(url, connect_timeout=8, autocommit=False) as conn:
                  with conn.cursor() as cur:
                      cur.execute("begin read only")
                      cur.execute("select current_setting('transaction_read_only'), to_regclass('public.v2_recent_form_archive') is not null")
                      ro,exists=cur.fetchone()
                      out["connected"]=True
                      out["transaction_read_only"]=ro
                      out["archive_table_exists"]=bool(exists)
                      if exists:
                          cur.execute("select count(*)::bigint from public.v2_recent_form_archive")
                          out["archive_rows"]=int(cur.fetchone()[0])
                  conn.rollback()
          except Exception as e:
              out["connected"]=False
              out["error_type"]=type(e).__name__
          print("ARCHIVE_CONNECTIVITY="+json.dumps(out,sort_keys=True))
          PY
          railway run --project "268a5b17-0712-440a-884d-27f7fa887a2d" --environment production --service postgres-history-archive python /tmp/probe.py | tee probe.out
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## Recent Form archive connectivity — read only'
            echo
            if [ -s probe.out ]; then
              grep '^ARCHIVE_CONNECTIVITY=' probe.out || true
            else
              echo 'ARCHIVE_CONNECTIVITY={"connected":false,"probe_output":false}'
            fi
            echo
            echo 'No variable values/list, DB writes, source reads, resource creation, cutover, cleanup, Railway AI/Agent.'
          } > body.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file body.md
