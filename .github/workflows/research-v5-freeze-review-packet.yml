name: Research V5 Freeze Review Packet

on:
  pull_request:
    paths:
      - 'research/v5_freeze_review_packet.py'
      - 'tests/test_v5_freeze_review_packet.py'
      - 'docs/V5_FREEZE_REVIEW_PACKET_20261015.md'
      - '.github/workflows/research-v5-freeze-review-packet.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - name: Verify pure review-only isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('research/v5_freeze_review_packet.py').read_text(encoding='utf-8').lower()
          for token in (
              'psycopg','database_url','railway','requests','urllib','subprocess',
              'insert into','update v2_','delete from','send_line'
          ):
              assert token not in t, token
          assert 'automatic_production_activation_allowed' in t
          assert 'purchase_action' in t
          PY
      - run: PYTHONPATH=. pytest -q tests/test_v5_freeze_review_packet.py
