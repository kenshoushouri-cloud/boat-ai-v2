name: Research realtime archive export matrix production read-only

on:
  pull_request:
    paths:
      - 'research_archive_export_pg.py'
      - '.github/workflows/research-realtime-archive-export-matrix-production-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  july-realtime-archive-export-readback:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=180000 -c temp_file_limit=131072 -c timezone=UTC
      ARCHIVE_START_DATE: '2026-07-01'
      ARCHIVE_END_DATE: '2026-07-31'
      ARCHIVE_LABEL: historical
      ARCHIVE_MIN_AGE_DAYS: '30'
      ARCHIVE_MAX_DAYS: '31'
      ARCHIVE_OUTPUT_DIR: /tmp/boat-realtime-archive-matrix
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only dependencies
        run: |
          python -m pip install --disable-pip-version-check -q psycopg[binary]
          npm install -g @railway/cli >/dev/null 2>&1

      - name: Resolve Production public database URL without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          railway variable list \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), dict):
                  value = data['variables'].get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), list):
                  for item in data['variables']:
                      if isinstance(item, dict) and item.get('name') == 'DATABASE_PUBLIC_URL':
                          value = item.get('value')
                          break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL unavailable')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
          rm -f railway-vars.json

      - name: Export and verify July realtime historical partitions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_OUTPUT_DIR"
          mkdir -p "$ARCHIVE_OUTPUT_DIR"
          : > archive-matrix.txt
          for table in \
            v2_realtime_weather_snapshots \
            v2_realtime_exhibition_snapshots \
            v2_realtime_race_condition_snapshots \
            v2_realtime_racer_condition_snapshots
          do
            export ARCHIVE_TABLE="$table"
            python -u research_archive_export_pg.py > "${table}.log"
            grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' "${table}.log"
          done
          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/boat-realtime-archive-matrix')
          manifests = sorted(root.glob('*.manifest.json'))
          expected = {
              'v2_realtime_weather_snapshots',
              'v2_realtime_exhibition_snapshots',
              'v2_realtime_race_condition_snapshots',
              'v2_realtime_racer_condition_snapshots',
          }
          seen = set()
          lines = []
          total_rows = 0
          total_payload = 0
          total_archive = 0
          for p in manifests:
              m = json.loads(p.read_text(encoding='utf-8'))
              table = str(m.get('table') or '')
              seen.add(table)
              assert m.get('readback_verified') is True
              assert m.get('source_rows_deleted') is False
              assert int(m.get('logical_key_duplicate_count', -1)) == 0
              assert str(m.get('label') or '') == 'historical'
              rows = int(m.get('row_count', -1))
              payload = int(m.get('canonical_payload_bytes', -1))
              archive = int(m.get('archive_file_bytes', -1))
              assert rows >= 0 and payload >= 0 and archive >= 0
              assert len(str(m.get('canonical_payload_sha256') or '')) == 64
              assert len(str(m.get('archive_file_sha256') or '')) == 64
              total_rows += rows
              total_payload += payload
              total_archive += archive
              lines.append(
                  f'REALTIME_ARCHIVE_EXPORT=PASS table={table} rows={rows} '
                  f'payload_bytes={payload} archive_bytes={archive}'
              )
          assert seen == expected, (seen, expected)
          lines.append(
              f'REALTIME_ARCHIVE_EXPORT_TOTAL=PASS tables={len(seen)} rows={total_rows} '
              f'payload_bytes={total_payload} archive_bytes={total_archive}'
          )
          Path('archive-matrix.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat archive-matrix.txt
          grep -q '^REALTIME_ARCHIVE_EXPORT_TOTAL=PASS ' archive-matrix.txt
          {
            echo '## Realtime historical archive export/readback — Production read-only'
            echo
            echo '```text'
            cat archive-matrix.txt
            echo '```'
            echo
            echo 'All files were ephemeral runner files and are removed before job exit. No upload, DB mutation, retention change, or Production config change was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all Production-derived local files
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/boat-realtime-archive-matrix
          rm -f railway-vars.json archive-matrix.txt v2_realtime_*_snapshots.log
