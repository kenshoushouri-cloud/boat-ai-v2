name: Research realtime archive export matrix production read-only

on:
  pull_request:
    paths:
      - 'research_archive_export_pg.py'
      - 'research_final_ab_entry_archive_consumer.py'
      - 'research_final_ab_weather_archive_consumer.py'
      - 'research_final_ab_exhibition_archive_consumer.py'
      - '.github/workflows/research-realtime-archive-export-matrix-production-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  july-realtime-archive-export-readback:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=180000 -c temp_file_limit=131072 -c timezone=UTC
      ARCHIVE_START_DATE: '2026-07-01'
      ARCHIVE_END_DATE: '2026-07-31'
      ARCHIVE_LABEL: historical
      ARCHIVE_MIN_AGE_DAYS: '30'
      ARCHIVE_MAX_DAYS: '31'
      ARCHIVE_OUTPUT_DIR: /tmp/boat-realtime-archive-matrix
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only dependencies
        run: |
          python -m pip install --disable-pip-version-check -q psycopg[binary]
          npm install -g @railway/cli >/dev/null 2>&1

      - name: Resolve Production public database URL without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          railway variable list \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), dict):
                  value = data['variables'].get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), list):
                  for item in data['variables']:
                      if isinstance(item, dict) and item.get('name') == 'DATABASE_PUBLIC_URL':
                          value = item.get('value')
                          break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL unavailable')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
          rm -f railway-vars.json

      - name: Export and verify July realtime archive partitions
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_OUTPUT_DIR"
          mkdir -p "$ARCHIVE_OUTPUT_DIR"
          : > archive-matrix.txt

          # These four tables have a July `historical` partition.
          export ARCHIVE_LABEL=historical
          for table in \
            v2_realtime_weather_snapshots \
            v2_realtime_exhibition_snapshots \
            v2_realtime_race_condition_snapshots \
            v2_realtime_racer_condition_snapshots
          do
            export ARCHIVE_TABLE="$table"
            python -u research_archive_export_pg.py > "${table}_${ARCHIVE_LABEL}.log"
            grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' "${table}_${ARCHIVE_LABEL}.log"
          done

          # Entry snapshots have no `historical` label in Production. July data
          # exists under `final_ab`, so validate the real label rather than an empty partition.
          export ARCHIVE_TABLE=v2_realtime_entry_snapshots
          export ARCHIVE_LABEL=final_ab
          python -u research_archive_export_pg.py > "${ARCHIVE_TABLE}_${ARCHIVE_LABEL}.log"
          grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' "${ARCHIVE_TABLE}_${ARCHIVE_LABEL}.log"

          python - <<'PY'
          import json
          from pathlib import Path
          root = Path('/tmp/boat-realtime-archive-matrix')
          manifests = sorted(root.glob('*.manifest.json'))
          expected_labels = {
              'v2_realtime_weather_snapshots': 'historical',
              'v2_realtime_exhibition_snapshots': 'historical',
              'v2_realtime_entry_snapshots': 'final_ab',
              'v2_realtime_race_condition_snapshots': 'historical',
              'v2_realtime_racer_condition_snapshots': 'historical',
          }
          seen = set()
          lines = []
          total_rows = 0
          total_payload = 0
          total_archive = 0
          for p in manifests:
              m = json.loads(p.read_text(encoding='utf-8'))
              table = str(m.get('table') or '')
              label = str(m.get('label') or '')
              seen.add(table)
              assert table in expected_labels, table
              assert label == expected_labels[table], (table, label, expected_labels[table])
              assert m.get('readback_verified') is True
              assert m.get('source_rows_deleted') is False
              assert int(m.get('logical_key_duplicate_count', -1)) == 0
              rows = int(m.get('row_count', -1))
              payload = int(m.get('canonical_payload_bytes', -1))
              archive = int(m.get('archive_file_bytes', -1))
              assert rows >= 0 and payload >= 0 and archive >= 0
              assert len(str(m.get('canonical_payload_sha256') or '')) == 64
              assert len(str(m.get('archive_file_sha256') or '')) == 64
              total_rows += rows
              total_payload += payload
              total_archive += archive
              lines.append(
                  f'REALTIME_ARCHIVE_EXPORT=PASS table={table} label={label} rows={rows} '
                  f'payload_bytes={payload} archive_bytes={archive}'
              )
          assert seen == set(expected_labels), (seen, set(expected_labels))
          lines.append(
              f'REALTIME_ARCHIVE_EXPORT_TOTAL=PASS tables={len(seen)} rows={total_rows} '
              f'payload_bytes={total_payload} archive_bytes={total_archive}'
          )
          Path('archive-matrix.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY
          cat archive-matrix.txt
          grep -q '^REALTIME_ARCHIVE_EXPORT_TOTAL=PASS ' archive-matrix.txt
          grep -q '^REALTIME_ARCHIVE_EXPORT=PASS table=v2_realtime_entry_snapshots label=final_ab rows=[1-9]' archive-matrix.txt
          {
            echo '## Realtime archive export/readback — Production read-only'
            echo
            echo '```text'
            cat archive-matrix.txt
            echo '```'
            echo
            echo 'All files are ephemeral runner files. No upload, DB mutation, retention change, or Production config change was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Compare final_ab entry analysis online vs archive
        shell: bash
        env:
          ANALYZE_START_DATE: '2026-07-01'
          ANALYZE_END_DATE: '2026-07-31'
          SNAPSHOT_LABEL: final_ab
        run: |
          set -euo pipefail
          manifest="$(find "$ARCHIVE_OUTPUT_DIR" -maxdepth 1 -type f -name 'v2_realtime_entry_snapshots_*_final_ab.manifest.json' -print -quit)"
          test -n "$manifest"
          export FINAL_AB_ENTRY_ARCHIVE_MANIFEST="$manifest"
          python -u research_final_ab_entry_archive_consumer.py > entry-consumer.txt
          grep -q '^FINAL_AB_ENTRY_ARCHIVE_COMPARE=PASS ' entry-consumer.txt
          grep -q '^FINAL_AB_ENTRY_ARCHIVE_RESULT=PASS_READ_ONLY$' entry-consumer.txt
          cat entry-consumer.txt
          {
            echo '## final_ab entry archive consumer equivalence — Production read-only'
            echo
            echo '```text'
            cat entry-consumer.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export and compare final_ab weather analysis online vs archive
        shell: bash
        env:
          ANALYZE_START_DATE: '2026-07-01'
          ANALYZE_END_DATE: '2026-07-31'
          SNAPSHOT_LABEL: final_ab
        run: |
          set -euo pipefail
          weather_dir=/tmp/boat-final-ab-weather-archive
          rm -rf "$weather_dir"
          mkdir -p "$weather_dir"
          export ARCHIVE_OUTPUT_DIR="$weather_dir"
          export ARCHIVE_TABLE=v2_realtime_weather_snapshots
          export ARCHIVE_LABEL=final_ab
          python -u research_archive_export_pg.py > weather-final-ab-export.log
          grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' weather-final-ab-export.log
          manifest="$(find "$weather_dir" -maxdepth 1 -type f -name 'v2_realtime_weather_snapshots_*_final_ab.manifest.json' -print -quit)"
          test -n "$manifest"
          export FINAL_AB_WEATHER_ARCHIVE_MANIFEST="$manifest"
          python -u research_final_ab_weather_archive_consumer.py > weather-consumer.txt
          grep -q '^FINAL_AB_WEATHER_ARCHIVE_COMPARE=PASS ' weather-consumer.txt
          grep -q '^FINAL_AB_WEATHER_ARCHIVE_RESULT=PASS_READ_ONLY$' weather-consumer.txt
          cat weather-consumer.txt
          {
            echo '## final_ab weather archive consumer equivalence — Production read-only'
            echo
            echo '```text'
            cat weather-consumer.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Export and compare final_ab exhibition analysis online vs archive
        shell: bash
        env:
          ANALYZE_START_DATE: '2026-07-01'
          ANALYZE_END_DATE: '2026-07-31'
          SNAPSHOT_LABEL: final_ab
        run: |
          set -euo pipefail
          exhibition_dir=/tmp/boat-final-ab-exhibition-archive
          rm -rf "$exhibition_dir"
          mkdir -p "$exhibition_dir"
          export ARCHIVE_OUTPUT_DIR="$exhibition_dir"
          export ARCHIVE_TABLE=v2_realtime_exhibition_snapshots
          export ARCHIVE_LABEL=final_ab
          python -u research_archive_export_pg.py > exhibition-final-ab-export.log
          grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' exhibition-final-ab-export.log
          manifest="$(find "$exhibition_dir" -maxdepth 1 -type f -name 'v2_realtime_exhibition_snapshots_*_final_ab.manifest.json' -print -quit)"
          test -n "$manifest"
          export FINAL_AB_EXHIBITION_ARCHIVE_MANIFEST="$manifest"
          python -u research_final_ab_exhibition_archive_consumer.py > exhibition-consumer.txt
          grep -q '^FINAL_AB_EXHIBITION_ARCHIVE_COMPARE=PASS ' exhibition-consumer.txt
          grep -q '^FINAL_AB_EXHIBITION_ARCHIVE_RESULT=PASS_READ_ONLY$' exhibition-consumer.txt
          cat exhibition-consumer.txt
          {
            echo '## final_ab exhibition archive consumer equivalence — Production read-only'
            echo
            echo '```text'
            cat exhibition-consumer.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all Production-derived local files
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/boat-realtime-archive-matrix /tmp/boat-final-ab-weather-archive /tmp/boat-final-ab-exhibition-archive
          rm -f railway-vars.json archive-matrix.txt entry-consumer.txt weather-consumer.txt weather-final-ab-export.log exhibition-consumer.txt exhibition-final-ab-export.log v2_realtime_*_snapshots_*.log
