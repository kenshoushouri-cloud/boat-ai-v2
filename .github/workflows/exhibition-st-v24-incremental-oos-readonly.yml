name: Exhibition ST incremental over v24 OOS read-only

on:
  pull_request:
    paths:
      - '.github/scripts/exhibition_st_v24_incremental_oos.py'
      - '.github/workflows/exhibition-st-v24-incremental-oos-readonly.yml'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate fixed read-only audit
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/exhibition_st_v24_incremental_oos.py
          python - <<'PY'
          from pathlib import Path
          low=Path('.github/scripts/exhibition_st_v24_incremental_oos.py').read_text(encoding='utf-8').lower()
          assert 'st_v24_oos_mode=read_only' in low
          assert 'fixed_st_beta = -0.02' in low
          assert 'frozen_from_pr122_first_train_cutoff_2025_12_31' in low
          assert 'current_v24_fixed_motor33_boat34_prob_temp_2.20' in low
          assert 'no_beta_search_no_subgroup_selection_no_writes_no_production_no_line' in low
          assert 'historical_start_timing_rank_ticket_score_exact_pr122_orientation' in low
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line'):
              assert token not in low, token
          print('ST_V24_OOS_VALIDATE=PASS')
          PY

      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run fixed exhibition ST incremental OOS audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/exhibition_st_v24_incremental_oos.py > st-v24-oos.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Print sanitized results
        if: always()
        run: grep '^ST_V24_OOS' st-v24-oos.txt 2>/dev/null || true

      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json st-v24-oos.txt

      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
