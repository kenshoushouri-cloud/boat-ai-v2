name: Historical official B-file bulk backfill

on:
  pull_request:
    paths:
      - "research/historical_entry_bfile_backfill_pg.py"
      - "research/official_bfile_raw_parser.py"
      - "tests/test_historical_entry_bfile_backfill_pg.py"
      - "tests/test_official_bfile_raw_parser.py"
      - ".github/workflows/historical-bfile-entry-backfill.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-recovery"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Validate parser/importer safety
        run: |
          pytest -q \
            tests/test_official_bfile_raw_parser.py \
            tests/test_historical_entry_bfile_backfill_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/historical_entry_bfile_backfill_pg.py").read_text(encoding="utf-8").lower()
          assert "boatrace_official_daily_b_predeadline_by_nature_v1" in p
          assert "confirm_historical_bfile_db_write" in p
          assert "fill_missing_only" in p
          assert "insert into" not in p
          assert "v2_results" not in p
          assert "v2_odds" not in p
          assert "result_odds_payout_read" in p
          print("PASS historical B-file bulk safety")
          PY

  backfill:
    concurrency:
      group: historical-production-write
      cancel-in-progress: false
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway historical-bfile-backfill ')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Parse and validate range
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import date
          p=os.environ["COMMENT_BODY"].strip().split()
          if len(p) != 4 or p[1] != "historical-bfile-backfill":
              raise SystemExit("command: /railway historical-bfile-backfill YYYY-MM-DD YYYY-MM-DD")
          a=date.fromisoformat(p[2]); b=date.fromisoformat(p[3])
          if b < a:
              raise SystemExit("end before start")
          if (b-a).days + 1 > 14:
              raise SystemExit("maximum B-file batch is 14 days")
          if a < date(2025,7,1):
              raise SystemExit("approved historical start is 2025-07-01")
          print("HIST_START_DATE="+p[2])
          print("HIST_END_DATE="+p[3])
          PY

      - name: Coverage before
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/historical_entry_feature_coverage_pg.py --start-date "${HIST_START_DATE}" --end-date "${HIST_END_DATE}"' \
            | tee bfile-coverage-before.txt

      - name: Fill missing fields from official daily B files
        env:
          CONFIRM_HISTORICAL_BFILE_DB_WRITE: "YES"
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; export CONFIRM_HISTORICAL_BFILE_DB_WRITE="${CONFIRM_HISTORICAL_BFILE_DB_WRITE}"; exec python -u research/historical_entry_bfile_backfill_pg.py --start-date "${HIST_START_DATE}" --end-date "${HIST_END_DATE}"' \
            | tee historical-bfile-backfill.txt
          grep -q '^HIST_BFILE_RESULT=PASS$' historical-bfile-backfill.txt
          grep -q '^HIST_BFILE_RESULT_ODDS_PAYOUT_READ=0$' historical-bfile-backfill.txt
          grep -q '^HIST_BFILE_LINE=0 BUY=0 PROD_MODEL_CHANGE=0$' historical-bfile-backfill.txt

      - name: Coverage after
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/historical_entry_feature_coverage_pg.py --start-date "${HIST_START_DATE}" --end-date "${HIST_END_DATE}"' \
            | tee bfile-coverage-after.txt

      - uses: actions/upload-artifact@v4
        with:
          name: historical-bfile-backfill-${{ github.run_id }}
          path: |
            bfile-coverage-before.txt
            historical-bfile-backfill.txt
            historical-bfile-entry-backfill-manifest.json
            bfile-coverage-after.txt
          retention-days: 90
          if-no-files-found: error

      - name: Comment sanitized summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "Historical official B-file backfill: ${HIST_START_DATE} .. ${HIST_END_DATE}"
            echo
            if [ -f historical-bfile-backfill.txt ]; then
              grep -E '^(HIST_BFILE_DAY=|HIST_BFILE_TOTALS=|HIST_BFILE_RESULT=)' historical-bfile-backfill.txt || true
            fi
            echo
            echo "Official BOAT RACE daily B files. Fill-missing-only; no result/odds/payout read; no inserts/overwrites."
          } > reply.txt
          gh issue comment 42 --repo "${GITHUB_REPOSITORY}" --body-file reply.txt
