name: Railway 5GB candidate checkpoint

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v3"

jobs:
  checkpoint:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-candidate-checkpoint CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        shell: bash
        run: |
          set -euo pipefail
          npm install --global @railway/cli

      - name: Checkpoint isolated candidate and measure
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          cat > checkpoint.sql <<'SQL'
          \set ON_ERROR_STOP on
          \pset tuples_only on
          \pset format unaligned
          \pset fieldsep '|'

          SELECT 'BEFORE_DB_BYTES|' || pg_database_size(current_database());
          SELECT 'BEFORE_WAL_BYTES|' || COALESCE(sum(size),0) FROM pg_ls_waldir();
          SELECT 'BEFORE_INDEX_BYTES|' || COALESCE(sum(pg_indexes_size(c.oid)),0)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname='public' AND c.relkind IN ('r','m');

          CHECKPOINT;

          SELECT 'AFTER_DB_BYTES|' || pg_database_size(current_database());
          SELECT 'AFTER_WAL_BYTES|' || COALESCE(sum(size),0) FROM pg_ls_waldir();
          SELECT 'AFTER_INDEX_BYTES|' || COALESCE(sum(pg_indexes_size(c.oid)),0)
          FROM pg_class c
          JOIN pg_namespace n ON n.oid = c.relnamespace
          WHERE n.nspname='public' AND c.relkind IN ('r','m');
          SQL

          railway connect "$TARGET_SERVICE" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --no-ssh < checkpoint.sql > checkpoint.out

          grep -E '^(BEFORE|AFTER)_(DB|WAL|INDEX)_BYTES\|' checkpoint.out > checkpoint.sanitized
          test -s checkpoint.sanitized

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## 5GB candidate checkpoint'
            echo
            if [ -s checkpoint.sanitized ]; then
              echo '✅ Candidate-only CHECKPOINT completed.'
              echo
              cat checkpoint.sanitized
            else
              echo '❌ Candidate checkpoint did not produce a sanitized result.'
            fi
            echo
            echo 'Production was not targeted. No rows/schema were changed, no cutover/resize/plan change was requested.'
          } > summary.md
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
