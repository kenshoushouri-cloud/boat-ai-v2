name: Value S02 Forward Frozen Current

on:
  pull_request:
    paths:
      - '.github/scripts/value_s02_forward_frozen_pg.py'
      - '.github/workflows/value-s02-forward-current.yml'
      - 'docs/VALUE_S02_FORWARD_FREEZE_20260912.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      VALUE_S02_FORWARD_END: '2026-09-23'
      VALUE_S02_FORWARD_OUTPUT: 'value-s02-forward-current.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Require non-enumerating Railway route
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          echo "VALUE_S02_FORWARD_DB_REPLAY=RAILWAY_RUN_NON_ENUMERATING"
      - name: Install Railway CLI
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway --version
      - name: Run frozen S02 Forward audit
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u .github/scripts/value_s02_forward_frozen_pg.py' \
            2>&1 | tee value-s02-forward-current.txt
          grep -q '^VALUE_S02_FORWARD_RESULT=PASS_READ_ONLY$' value-s02-forward-current.txt
          grep -q '^VALUE_S02_FORWARD_PROMOTION_ALLOWED=0$' value-s02-forward-current.txt
      - name: Upload aggregate research evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: value-s02-forward-current-${{ github.run_id }}
          path: |
            value-s02-forward-current.json
            value-s02-forward-current.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Confirm no variable enumeration
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/value-s02-forward-current.yml').read_text(encoding='utf-8').lower()
          forbidden=(
              ''.join(('railway',' variable',' list')),
              ''.join(('print','env')),
              ''.join(('env',' |')),
          )
          for value in forbidden:
              assert value not in text, value
          assert 'railway run' in text
          print('VALUE_S02_FORWARD_SECRET_ENUMERATION=0')
          PY
