name: Candidate Discovery Bet-Type Hit Audit

on:
  pull_request:
    paths:
      - '.github/scripts/candidate_discovery_bettype_hit_audit_pg.py'
      - '.github/scripts/candidate_discovery_bettype_tier_audit_pg.py'
      - '.github/scripts/candidate_discovery_k_multibet_probe.py'
      - '.github/workflows/candidate-discovery-bettype-hit-audit.yml'
      - 'research/candidate_discovery_bettype_contract.py'
      - '.github/scripts/candidate_discovery_v1_pg.py'
      - '.github/scripts/candidate_discovery_v2_formation_pg.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=180000
  CANDIDATE_BETTYPE_START: '2025-07-01'
  CANDIDATE_BETTYPE_END: '2026-09-12'
  CANDIDATE_BETTYPE_RACE_CAPS: '3,6,9,12'
  CANDIDATE_BETTYPE_TIER_START: '2025-07-01'
  CANDIDATE_BETTYPE_TIER_END: '2026-09-12'
  CANDIDATE_K_PROBE_DATE: '2026-08-12'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate read-only contract
        run: |
          python -m py_compile .github/scripts/candidate_discovery_bettype_hit_audit_pg.py
          python -m py_compile .github/scripts/candidate_discovery_bettype_tier_audit_pg.py
          python -m py_compile .github/scripts/candidate_discovery_k_multibet_probe.py
          python -m py_compile research/candidate_discovery_bettype_contract.py
          python tests/test_candidate_discovery_bettype_contract.py
          python - <<'PY'
          from pathlib import Path
          for path in (
              '.github/scripts/candidate_discovery_bettype_hit_audit_pg.py',
              '.github/scripts/candidate_discovery_bettype_tier_audit_pg.py',
          ):
              text=Path(path).read_text(encoding='utf-8').lower()
              assert 'set transaction read only' in text
              assert 'v2_odds_trifecta' not in text
              assert 'trifecta_payout_yen' not in text
              assert 'raw_ev' not in text
              for token in (
                  'delete from ', 'insert into ', 'update v2_', 'alter table ',
                  'drop table ', 'truncate ', 'vacuum ', 'create table '
              ):
                  assert token not in text, (path, token)
          probe=Path('.github/scripts/candidate_discovery_k_multibet_probe.py').read_text(encoding='utf-8').lower()
          for token in ('psycopg','database_url','delete from ','insert into ','update v2_','alter table '):
              assert token not in probe, token
          PY

      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Probe official K archive multi-bet payouts
        run: |
          python -u .github/scripts/candidate_discovery_k_multibet_probe.py | tee candidate-discovery-k-multibet-probe.txt
          grep -q '^CANDIDATE_K_PROBE_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0$' candidate-discovery-k-multibet-probe.txt
          grep -q '^CANDIDATE_K_PROBE_RESULT=PASS_READ_ONLY$' candidate-discovery-k-multibet-probe.txt

      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run bet-type hit-rate audit
        run: |
          python -u .github/scripts/candidate_discovery_bettype_hit_audit_pg.py | tee candidate-discovery-bettype-hit-audit.txt
          grep -q '^CANDIDATE_BETTYPE_ODDS_READ=0 EV_FILTER=0 PAYOUT_READ=0$' candidate-discovery-bettype-hit-audit.txt
          grep -q '^CANDIDATE_BETTYPE_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0$' candidate-discovery-bettype-hit-audit.txt
          grep -q '^CANDIDATE_BETTYPE_PROFITABILITY=NOT_EVALUATED_NO_PAYOUT_DATA$' candidate-discovery-bettype-hit-audit.txt
          grep -q '^CANDIDATE_BETTYPE_RESULT=PASS_READ_ONLY$' candidate-discovery-bettype-hit-audit.txt

      - name: Run A/B/C bet-type tier audit
        run: |
          python -u .github/scripts/candidate_discovery_bettype_tier_audit_pg.py | tee candidate-discovery-bettype-tier-audit.txt
          grep -q '^CANDIDATE_BETTYPE_TIER_ODDS_READ=0 EV_FILTER=0 PAYOUT_READ=0$' candidate-discovery-bettype-tier-audit.txt
          grep -q '^CANDIDATE_BETTYPE_TIER_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0$' candidate-discovery-bettype-tier-audit.txt
          grep -q '^CANDIDATE_BETTYPE_TIER_PROFITABILITY=NOT_EVALUATED_NO_PAYOUT_DATA$' candidate-discovery-bettype-tier-audit.txt
          grep -q '^CANDIDATE_BETTYPE_TIER_RESULT=PASS_READ_ONLY$' candidate-discovery-bettype-tier-audit.txt

      - name: Upload audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-discovery-bettype-hit-${{ github.run_id }}
          path: |
            candidate-discovery-bettype-hit-audit.json
            candidate-discovery-bettype-hit-audit.txt
            candidate-discovery-bettype-tier-audit.json
            candidate-discovery-bettype-tier-audit.txt
            candidate-discovery-k-multibet-probe.json
            candidate-discovery-k-multibet-probe.txt
          retention-days: 30
          if-no-files-found: warn
