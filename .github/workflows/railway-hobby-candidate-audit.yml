name: Railway Hobby candidate parity audit

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  HOT_CUTOFF: "2026-08-02"

jobs:
  audit:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-candidate-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install "psycopg[binary]>=3.2,<4"
          npm install --global @railway/cli

      - name: Write read-only audit script
        shell: bash
        run: |
          cat > /tmp/hobby_candidate_audit.py <<'PY'
          import json
          import os
          import psycopg

          role = os.environ["AUDIT_ROLE"]
          cutoff = os.environ["HOT_CUTOFF"]
          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              raise SystemExit("database URL unavailable")

          base_tables = [
              "v2_races",
              "v2_race_entries",
              "v2_results",
              "v2_result_entries",
          ]
          hot_tables = [
              "v2_odds_trifecta",
              "v2_realtime_racer_condition_snapshots",
              "v2_realtime_weather_snapshots",
              "v2_realtime_race_condition_snapshots",
              "v2_realtime_exhibition_snapshots",
          ]
          observe_tables = [
              "v2_realtime_odds_snapshots",
              "v2_v24_motor2_forward_shadow",
              "v2_racer_course_stats_snapshots",
              "v2_realtime_entry_snapshots",
              "v2_opponent_pressure_shadow_v2",
          ]

          out = {"role": role, "cutoff": cutoff, "database_bytes": 0, "base": {}, "hot": {}, "observe": {}}
          with psycopg.connect(url, autocommit=False) as conn:
              with conn.cursor() as cur:
                  cur.execute("set transaction read only")
                  cur.execute("set local statement_timeout='120s'")
                  cur.execute("select pg_database_size(current_database())")
                  out["database_bytes"] = int(cur.fetchone()[0])

                  for table in base_tables:
                      cur.execute(f"select count(*)::bigint from public.{table}")
                      out["base"][table] = int(cur.fetchone()[0])

                  for table in hot_tables:
                      cur.execute(
                          f"""
                          select
                            count(*)::bigint,
                            count(*) filter (where r.race_date >= %s::date)::bigint,
                            count(*) filter (where r.race_date < %s::date)::bigint
                          from public.{table} t
                          join public.v2_races r on r.race_id=t.race_id
                          """,
                          (cutoff, cutoff),
                      )
                      total, hot, old = cur.fetchone()
                      out["hot"][table] = {"total": int(total), "hot": int(hot), "old": int(old)}

                  for table in observe_tables:
                      cur.execute("select to_regclass(%s)", (f"public.{table}",))
                      if cur.fetchone()[0] is None:
                          continue
                      cur.execute(f"select count(*)::bigint from public.{table}")
                      out["observe"][table] = int(cur.fetchone()[0])
              conn.rollback()

          print("HOBBY_CANDIDATE_AUDIT=" + json.dumps(out, sort_keys=True))
          PY

      - name: Audit source read-only
        shell: bash
        run: |
          set -euo pipefail
          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service postgres-recovery             bash -lc 'export AUDIT_ROLE=source; export HOT_CUTOFF="${HOT_CUTOFF}"; exec python /tmp/hobby_candidate_audit.py'             > source-audit.txt

      - name: Audit candidate read-only
        shell: bash
        run: |
          set -euo pipefail
          railway run             --project "$RAILWAY_PROJECT_ID"             --environment "$RAILWAY_ENVIRONMENT"             --service postgres-hobby-candidate             bash -lc 'export AUDIT_ROLE=target; export HOT_CUTOFF="${HOT_CUTOFF}"; exec python /tmp/hobby_candidate_audit.py'             > target-audit.txt

      - name: Build parity summary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          def load(path):
              text=Path(path).read_text(encoding="utf-8", errors="replace")
              m=re.search(r'^HOBBY_CANDIDATE_AUDIT=(\{.*\})$', text, re.M)
              if not m:
                  raise SystemExit(f"sanitized audit payload missing: {path}")
              return json.loads(m.group(1))

          src=load("source-audit.txt")
          tgt=load("target-audit.txt")
          base_ok=all(tgt["base"].get(k)==v for k,v in src["base"].items())
          hot_ok=True
          hot_rows=[]
          for table,s in src["hot"].items():
              t=tgt["hot"].get(table, {})
              ok=(t.get("total")==s.get("hot") and t.get("old")==0)
              hot_ok = hot_ok and ok
              hot_rows.append((table,s.get("hot"),t.get("total"),t.get("old"),ok))

          mib=lambda n: n/1024/1024
          lines=[
              "## Railway Hobby candidate parity",
              "",
              "READ ONLY; no database rows/schema, Railway Variables, service config, volume, or backups were changed.",
              "",
              f"Cutoff: **{src['cutoff']}**",
              f"Source DB logical size: **{mib(src['database_bytes']):.0f} MiB**",
              f"Candidate DB logical size: **{mib(tgt['database_bytes']):.0f} MiB**",
              "",
              "### Full-copy base tables",
              "",
              "| Table | Source rows | Candidate rows | Match |",
              "|---|---:|---:|---|",
          ]
          for table,n in src["base"].items():
              m=tgt["base"].get(table)
              lines.append(f"| `{table}` | {n:,} | {m if m is not None else '-':,} | {'PASS' if m==n else 'FAIL'} |")
          lines += [
              "",
              "### Hot-only tables",
              "",
              "| Table | Source hot rows | Candidate rows | Candidate old rows | Match |",
              "|---|---:|---:|---:|---|",
          ]
          for table,hot,total,old,ok in hot_rows:
              lines.append(f"| `{table}` | {hot:,} | {total if total is not None else 0:,} | {old if old is not None else 0:,} | {'PASS' if ok else 'FAIL'} |")

          lines += [
              "",
              "### Other retained tables (observed only)",
              "",
              "| Table | Source rows | Candidate rows |",
              "|---|---:|---:|",
          ]
          for table,n in src["observe"].items():
              lines.append(f"| `{table}` | {n:,} | {tgt['observe'].get(table, 0):,} |")

          overall=base_ok and hot_ok
          lines += [
              "",
              f"Base parity: **{'PASS' if base_ok else 'FAIL'}**",
              f"Hot-table parity: **{'PASS' if hot_ok else 'FAIL'}**",
              f"Overall initial-seed parity: **{'PASS' if overall else 'FAIL'}**",
              "",
              "This audit compares counts only; it does not authorize Production cutover.",
          ]
          Path("summary.md").write_text("\n".join(lines)+"\n", encoding="utf-8")
          PY

      - name: Remove raw audit files
        if: always()
        shell: bash
        run: rm -f source-audit.txt target-audit.txt

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "## Railway Hobby candidate parity

❌ Read-only audit failed before a sanitized comparison could be produced.

No destructive follow-up was attempted."
          fi
