name: Historical Course gap candidate-v4 read-only

on:
  pull_request:
    paths:
      - "research/historical_course_gap_diagnostic_pg.py"
      - ".github/workflows/research-historical-course-gap-candidate-v4.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]"
      - name: Static safety
        run: |
          set -euo pipefail
          python -m py_compile research/historical_course_gap_diagnostic_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/historical_course_gap_diagnostic_pg.py").read_text(encoding="utf-8").lower()
          assert "set transaction read only" in p
          for token in ("v2_results","v2_result_entries","v2_odds","insert into","update v2_","delete from"):
              assert token not in p, token
          w=Path(".github/workflows/research-historical-course-gap-candidate-v4.yml").read_text(encoding="utf-8").lower()
          assert "postgres-hobby-fullhistory-candidate-v4" in w
          assert "".join(("railway"," variable"," list")) not in w
          assert "".join(("list","_variables")) not in w
          assert "".join(("schedule", ":")) not in w
          print("COURSE_GAP_STATIC=PASS")
          PY
      - run: npm install --global @railway/cli
      - name: Diagnose Course gap read-only
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c max_parallel_workers_per_gather=0"; export PYTHONPATH=.; exec python -u research/historical_course_gap_diagnostic_pg.py' \
            2>&1 | tee historical-course-gap.txt
          grep -q '^COURSE_GAP_RESULT=PASS_READ_ONLY$' historical-course-gap.txt
      - uses: actions/upload-artifact@v4
        with:
          name: historical-course-gap-${{ github.run_id }}
          path: historical-course-gap.txt
          retention-days: 14
          if-no-files-found: error
