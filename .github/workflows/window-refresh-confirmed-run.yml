name: Confirmed window odds refresh

on:
  pull_request:
    paths:
      - '.github/workflows/window-refresh-confirmed-run.yml'
      - 'run_window_refresh_pg.py'
      - 'run_odds_window_pg.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate confirmed-run safety
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile run_window_refresh_pg.py run_odds_window_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/window-refresh-confirmed-run.yml').read_text(encoding='utf-8')
          assert "github.event.comment.body == '/railway window-refresh-run CONFIRM'" in p
          assert "github.actor == github.repository_owner" in p
          assert "WINDOW_REFRESH_EXECUTE: '1'" in p
          assert 'run_window_refresh_pg.py' in p
          assert 'schedule:' not in p
          for forbidden in ('run_pre_window_pg.py','run_pre_window_deduped_pg.py','v23_line_notifier_batch_pg.py','run_final_pg.py'):
              assert forbidden not in p
          print('WINDOW_REFRESH_CONFIRMED_VALIDATE=PASS')
          PY

  refresh:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway window-refresh-run CONFIRM'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      WINDOW_REFRESH_EXECUTE: '1'
      WINDOW_WORKERS: '2'
      WINDOW_ODDS_RETRIES: '1'
      WINDOW_ODDS_RETRY_WAIT_SEC: '10'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load masked public database URL
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run confirmed base-odds refresh
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -u run_window_refresh_pg.py 2>&1 | tee window-refresh-run-output.txt
      - name: Reply with sanitized result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Confirmed window odds refresh'
            echo
            echo '```text'
            grep -E '^(WINDOW_REFRESH_|=== odds window finished ===|target_races=|fetch_failed_total=|saved_odds_rows_total=|complete_expected=|incomplete=)' window-refresh-run-output.txt 2>/dev/null || echo 'WINDOW_REFRESH_RUN_DIAGNOSTIC=no_prefixed_output'
            echo '```'
            echo
            echo 'Base odds refresh only. No PRE/LINE, FINAL decision, Railway setting, coefficient or promotion change was performed.'
          } > window-refresh-run-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file window-refresh-run-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json window-refresh-run-output.txt window-refresh-run-comment.md
