name: Railway combined condition multi-split OOS

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/combined_condition_multisplit_oos_audit.py"
      - ".github/workflows/railway-combined-condition-multisplit-oos.yml"

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run read-only multi-split audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/combined_condition_multisplit_oos_audit.py > audit-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Show sanitized summary
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('audit-output.txt').read_text(encoding='utf-8',errors='replace')
          keep=[x[:1000] for x in text.splitlines() if x.startswith(('COMBINED_','SPLIT=','COMBO_'))]
          print('\n'.join(keep[:200]))
          PY
      - name: Cleanup
        if: always()
        run: rm -f railway-vars.json railway-vars-error.txt audit-output.txt
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
