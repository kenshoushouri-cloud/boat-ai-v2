name: Update project docs racer course top3 milestone 20260825

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/update_project_docs_racer_course_top3_20260825.py'
      - '.github/workflows/update-project-docs-racer-course-top3-20260825.yml'

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.pull_request.head.ref == 'docs/racer-course-top3-forward-milestone'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: docs/racer-course-top3-forward-milestone
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply idempotent milestone update
        run: python -u .github/scripts/update_project_docs_racer_course_top3_20260825.py
      - name: Commit docs when changed
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/PROJECT_HANDOFF.md docs/PROJECT_HISTORY.md; then
            echo 'DOCS_UPDATE=no_change'
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/PROJECT_HANDOFF.md docs/PROJECT_HISTORY.md
          git commit -m 'docs: record racer course top3 Forward milestone'
          git push origin HEAD:docs/racer-course-top3-forward-milestone
          echo 'DOCS_UPDATE=committed'