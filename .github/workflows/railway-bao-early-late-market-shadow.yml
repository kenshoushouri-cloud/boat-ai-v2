name: Railway Bao early-late market shadow

on:
  pull_request:
    paths:
      - '.github/scripts/bao_early_late_market_shadow.py'
      - '.github/workflows/railway-bao-early-late-market-shadow.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'YYYY-MM-DD; blank uses JST today'
        required: false
        type: string
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax validation
        run: python -m py_compile .github/scripts/bao_early_late_market_shadow.py

  manual-shadow-smoke:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway bao-market-shadow-smoke CONFIRM'
      )
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run isolated early/late market shadow collector
        env:
          TARGET_DATE: ${{ github.event_name == 'workflow_dispatch' && inputs.target_date || '' }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -u .github/scripts/bao_early_late_market_shadow.py 2>&1 | tee bao-shadow-output.txt
      - name: Reply with sanitized smoke diagnostics
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Bao market Shadow smoke'
            echo
            echo 'Sanitized collector diagnostics:'
            echo '```text'
            grep '^BAO_SHADOW_' bao-shadow-output.txt 2>/dev/null || echo 'BAO_SHADOW_DIAGNOSTIC=no_prefixed_output'
            echo '```'
            echo
            echo 'No secret values are included in this reply.'
          } > bao-shadow-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file bao-shadow-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json bao-shadow-output.txt bao-shadow-comment.md
