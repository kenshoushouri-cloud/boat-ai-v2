name: Railway Bao early-late market shadow

on:
  pull_request:
    paths:
      - '.github/scripts/bao_early_late_market_shadow.py'
      - '.github/workflows/railway-bao-early-late-market-shadow.yml'
  workflow_dispatch:
    inputs:
      target_date:
        description: 'YYYY-MM-DD; blank uses JST today'
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Static syntax validation
        run: python -m py_compile .github/scripts/bao_early_late_market_shadow.py

  manual-shadow-smoke:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run isolated early/late market shadow collector
        env:
          TARGET_DATE: ${{ inputs.target_date }}
          PYTHONPATH: ${{ github.workspace }}
        run: python -u .github/scripts/bao_early_late_market_shadow.py
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json
