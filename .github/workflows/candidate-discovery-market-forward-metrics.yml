name: Candidate Discovery Market Forward Metrics

on:
  pull_request:
    paths:
      - 'research/candidate_discovery_market_forward_metrics.py'
      - 'tests/test_candidate_discovery_market_forward_metrics.py'
      - '.github/workflows/candidate-discovery-market-forward-metrics.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate pure Forward metrics contract
        run: |
          python -m py_compile research/candidate_discovery_market_forward_metrics.py
          python -m py_compile tests/test_candidate_discovery_market_forward_metrics.py
          python tests/test_candidate_discovery_market_forward_metrics.py
          python - <<'PY'
          from pathlib import Path
          text=Path('research/candidate_discovery_market_forward_metrics.py').read_text(encoding='utf-8').lower()
          assert 'milestones = (30, 50, 100)' in text
          assert 'bet_type' in text and 'trifecta' in text
          assert 'late_available_baseline' in text
          assert 'market_top2_supported' in text
          assert 'max_losing_race_streak' in text
          assert 'max_drawdown_yen' in text
          assert 'positive_day_rate_pct' in text
          assert 'max_single_hit_share_of_returns_pct' in text
          assert 'promotion_allowed' in text
          for forbidden in (
              'psycopg', 'requests', 'urllib', 'database_url', 'v2_results',
              'parse_multibet_payouts', 'get_k_text(', 'delete from ', 'insert into ',
              'update v2_', 'alter table ', 'truncate ', 'vacuum '
          ):
              assert forbidden not in text, forbidden
          PY
