name: Railway 5GB full-history v3 exact parity read-only

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v3"

jobs:
  parity:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway hobby-fullhistory-v3-exact-parity'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install read-only tooling
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check "psycopg[binary]>=3.2,<3.4"
          npm install --global @railway/cli

      - name: Capture candidate v3 with current exact-evidence contract
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail

          cat > /tmp/v3_exact_parity.py <<'PY'
          import os
          import runpy
          import sys
          import tempfile
          from pathlib import Path

          import psycopg

          contract = runpy.run_path("ops/hobby-fullhistory-candidate-worker/run.py")
          expected = contract["EXPECTED"]
          expected_sha = contract["EXPECTED_EVIDENCE_SHA"]
          limit_bytes = int(contract["LIMIT_BYTES"])
          capture = contract["capture"]

          url = os.environ.get("DATABASE_PUBLIC_URL") or os.environ.get("DATABASE_URL")
          if not url:
              print("CANDIDATE_EXACT_PARITY=FAIL")
              print("FAIL_STAGE=database_url_unavailable")
              raise SystemExit(2)

          root = Path(tempfile.mkdtemp(prefix="v3-exact-parity-"))
          with psycopg.connect(url) as conn:
              conn.execute("SET default_transaction_read_only = on")
              metadata_counts, db_bytes, evidence_sha = capture(conn, root)

          actual = {
              "PUBLIC_TABLES": metadata_counts["tables"],
              "PUBLIC_COLUMNS": metadata_counts["columns"],
              "PUBLIC_CONSTRAINTS": metadata_counts["constraints"],
              "PUBLIC_INDEXES": metadata_counts["indexes"],
              "PUBLIC_SEQUENCES": metadata_counts["sequences"],
              "PUBLIC_VIEWS": metadata_counts["views"],
              "PUBLIC_TRIGGERS": metadata_counts["triggers"],
              "PUBLIC_POLICIES": metadata_counts["policies"],
              "EXTENSIONS": metadata_counts["extensions"],
          }

          mismatches = [key for key, want in expected.items() if actual.get(key) != want]
          sha_ok = evidence_sha == expected_sha
          size_ok = db_bytes < limit_bytes
          headroom = limit_bytes - db_bytes

          print("REFERENCE_GITHUB_SHA=" + os.environ.get("GITHUB_SHA", ""))
          print("CANDIDATE_EVIDENCE_SHA256=" + evidence_sha)
          print("EXPECTED_EVIDENCE_SHA256=" + expected_sha)
          print("CANDIDATE_DB_BYTES=" + str(db_bytes))
          print("CANDIDATE_HEADROOM_BYTES=" + str(headroom))
          for key in (
              "PUBLIC_TABLES", "PUBLIC_COLUMNS", "PUBLIC_CONSTRAINTS",
              "PUBLIC_INDEXES", "PUBLIC_SEQUENCES", "PUBLIC_VIEWS",
              "PUBLIC_TRIGGERS", "PUBLIC_POLICIES", "EXTENSIONS",
          ):
              print(f"{key}={actual[key]}")
          print("COUNT_MISMATCH_KEYS=" + (",".join(mismatches) if mismatches else "NONE"))
          print("EVIDENCE_SHA_MATCH=" + ("true" if sha_ok else "false"))
          print("UNDER_5GB=" + ("true" if size_ok else "false"))

          ok = (not mismatches) and sha_ok and size_ok
          print("CANDIDATE_EXACT_PARITY=" + ("PASS" if ok else "FAIL"))
          print("SOURCE_WRITE=0")
          print("CANDIDATE_WRITE=0")
          print("CUTOVER=0")
          print("DELETE=0")
          print("RESIZE=0")
          print("PLAN_CHANGE=0")
          print("PURCHASE_ACTION=false")
          raise SystemExit(0 if ok else 1)
          PY

          set +e
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$TARGET_SERVICE" \
            python3 /tmp/v3_exact_parity.py > parity.sanitized
          rc=$?
          set -e

          grep -E '^(REFERENCE_GITHUB_SHA|CANDIDATE_EVIDENCE_SHA256|EXPECTED_EVIDENCE_SHA256|CANDIDATE_DB_BYTES|CANDIDATE_HEADROOM_BYTES|PUBLIC_TABLES|PUBLIC_COLUMNS|PUBLIC_CONSTRAINTS|PUBLIC_INDEXES|PUBLIC_SEQUENCES|PUBLIC_VIEWS|PUBLIC_TRIGGERS|PUBLIC_POLICIES|EXTENSIONS|COUNT_MISMATCH_KEYS|EVIDENCE_SHA_MATCH|UNDER_5GB|CANDIDATE_EXACT_PARITY|SOURCE_WRITE|CANDIDATE_WRITE|CUTOVER|DELETE|RESIZE|PLAN_CHANGE|PURCHASE_ACTION)=' parity.sanitized > parity.result || true
          test -s parity.result
          exit "$rc"

      - name: Build sanitized success
        if: success()
        shell: bash
        run: |
          {
            echo '## 5GB full-history candidate v3 exact parity'
            echo
            echo 'PASS: candidate-v3 exactly matches the current restore/parity evidence contract in main.'
            echo
            echo '```text'
            cat parity.result
            echo '```'
            echo
            echo 'Read-only verification only. No Production/candidate rows or schema were changed.'
          } > summary.md

      - name: Build sanitized failure
        if: failure()
        shell: bash
        run: |
          {
            echo '## 5GB full-history candidate v3 exact parity'
            echo
            echo 'FAIL: candidate-v3 does not exactly match the current restore/parity evidence contract, or the read-only audit could not complete.'
            if [ -s parity.result ]; then
              echo
              echo '```text'
              cat parity.result
              echo '```'
            fi
            echo
            echo 'No Production/candidate mutation, cutover, delete, resize, plan change, or purchase action was requested.'
          } > summary.md

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
