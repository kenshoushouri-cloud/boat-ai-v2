name: LINE candidate volume diagnostic

on:
  pull_request:
    paths:
      - "research/line_candidate_volume_diagnostic.py"
      - "tests/test_line_candidate_volume_diagnostic.py"
      - "research/candidate_shadow_volume_pg.py"
      - "tests/test_candidate_shadow_volume_pg.py"
      - ".github/workflows/line-candidate-volume-diagnostic.yml"

permissions:
  contents: read

jobs:
  pure-diagnostic-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run pure diagnostic tests
        run: |
          python3 - <<'PY'
          import runpy

          paths = [
              "tests/test_line_candidate_volume_diagnostic.py",
              "tests/test_candidate_shadow_volume_pg.py",
          ]
          total = 0
          for path in paths:
              ns = runpy.run_path(path)
              tests = [
                  (name, fn)
                  for name, fn in sorted(ns.items())
                  if name.startswith("test_") and callable(fn)
              ]
              assert tests, f"no diagnostic tests discovered in {path}"
              for name, fn in tests:
                  fn()
                  total += 1
                  print(f"PASS {path}::{name}")
          print(f"PASS total={total}")
          PY
