name: Historical gap audit

on:
  pull_request:
    paths:
      - "research/historical_gap_audit_pg.py"
      - ".github/workflows/historical-gap-audit.yml"

permissions:
  contents: read

jobs:
  audit:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
      RAILWAY_ENVIRONMENT: "production"
      RAILWAY_DB_SERVICE: "postgres-recovery"
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Run read-only historical gap audit
        run: |
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PYTHONPATH=.; exec python -u research/historical_gap_audit_pg.py' \
            2>&1 | tee historical-gap-audit.log
          grep -q '^HIST_GAP_AUDIT_RESULT=PASS_READ_ONLY$' historical-gap-audit.log
      - uses: actions/upload-artifact@v4
        with:
          name: historical-gap-audit-202507-202609
          path: historical-gap-audit.log
          retention-days: 90
