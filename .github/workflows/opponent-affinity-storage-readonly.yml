name: Opponent affinity storage read-only

on:
  pull_request:
    paths:
      - ".github/workflows/opponent-affinity-storage-readonly.yml"
      - "research/opponent_affinity_storage_readonly.py"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          set -euo pipefail
          python -m py_compile research/opponent_affinity_storage_readonly.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/opponent_affinity_storage_readonly.py").read_text(encoding="utf-8").lower()
          assert "default_transaction_read_only" in p
          assert "pg_total_relation_size" in p
          assert "insert " not in p and "update " not in p and "delete " not in p
          print("OPPONENT_AFFINITY_STORAGE_VALIDATE=PASS")
          PY

  audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway opponent-affinity-storage-readonly'
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Measure opponent/course derived storage read-only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c statement_timeout=120000"; exec python -u research/opponent_affinity_storage_readonly.py' \
            | tee audit.txt
          grep -q '^DB_READ_ONLY=1 DB_WRITE=0 RESULT_ODDS_PAYOUT_READ=0$' audit.txt
      - name: Comment result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Opponent affinity storage read-only'
            echo
            echo '```text'
            if [ -s audit.txt ]; then
              grep -E '^(REL\||MATCH_|REJECTED_|OPPONENT_|RACER_|DB_READ_ONLY=)' audit.txt || true
            else
              echo 'FAILED: no audit output'
            fi
            echo '```'
            echo
            echo 'Read-only capacity audit only. No DB/Railway/Production/LINE/purchase change.'
          } > body.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file body.md
