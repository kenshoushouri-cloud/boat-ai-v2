name: Course Opponent Combined Forward Readonly

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/scripts/course_opponent_combined_forward.py
      - tests/test_course_opponent_combined_forward.py
      - .github/workflows/course-opponent-combined-forward-readonly.yml

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  fixed-combined-forward:
    if: >-
      github.actor == github.repository_owner &&
      github.head_ref == 'research/course-opponent-combined-forward-20260910'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install minimum dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install 'psycopg[binary]==3.2.6'
          npm install --global @railway/cli

      - name: Run offline contract tests
        shell: bash
        env:
          DATABASE_URL: ""
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/course_opponent_combined_forward.py tests/test_course_opponent_combined_forward.py
          python -m unittest tests.test_course_opponent_combined_forward -v

      - name: Require Railway token
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi

      - name: Load public database URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found for postgres')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run fixed read-only Forward comparison
        shell: bash
        env:
          COURSE_OPP_COMBINED_START: "2026-08-25"
          COURSE_OPP_COMBINED_END: "2026-09-10"
          COURSE_OPP_BOOT_REPS: "5000"
        run: |
          set -euo pipefail
          python -u .github/scripts/course_opponent_combined_forward.py > combined-forward.txt 2> combined-forward-error.txt
          grep '^COURSE_OPP_COMBINED_' combined-forward.txt
          grep -q '^COURSE_OPP_COMBINED_RESULT=PASS_READ_ONLY$' combined-forward.txt

      - name: Remove temporary sensitive files
        if: always()
        shell: bash
        run: |
          rm -f railway-vars.json railway-vars-error.txt combined-forward.txt combined-forward-error.txt
