name: Candidate Discovery Bet-Type Pure Contract

on:
  pull_request:
    paths:
      - 'research/candidate_discovery_bettype_contract.py'
      - 'tests/test_candidate_discovery_bettype_contract.py'
      - '.github/workflows/candidate-discovery-bettype-contract.yml'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate pure bet-type contract
        run: |
          python -m py_compile research/candidate_discovery_bettype_contract.py
          python tests/test_candidate_discovery_bettype_contract.py
          python - <<'PY'
          from pathlib import Path
          low=Path('research/candidate_discovery_bettype_contract.py').read_text(encoding='utf-8').lower()
          for token in ('psycopg','database_url','requests','railway','line_notify','raw_ev','odds_min','odds_max','insert into ','delete from ','update v2_'):
              assert token not in low, token
          assert 'stake_per_ticket_yen = 100' in low
          assert 'fixed_point_counts = (1, 2, 3, 5)' in low
          assert 'coverage_targets = (0.20, 0.35, 0.50)' in low
          PY
