name: V5 strong core exhibition predeadline offline gate tests

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

jobs:
  offline:
    if: >-
      github.event.issue.number == 581 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway v5-strong-core-exhibition-cutoff-offline-test-20261009'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Pure frozen exhibition predeadline gate unit tests
        id: test
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -p 'test_v5_strong_core_exhibition_predeadline_gate.py' -v > test-output.txt 2>&1
          code=$?
          if [ "$code" -eq 0 ]; then echo "passed=true" >> "$GITHUB_OUTPUT"; else echo "passed=false" >> "$GITHUB_OUTPUT"; fi
          exit 0
      - name: Build concise result
        id: report
        if: always()
        env:
          PASSED: ${{ steps.test.outputs.passed }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          raw=Path("test-output.txt").read_text(encoding="utf-8",errors="replace") if Path("test-output.txt").exists() else ""
          keep=[s[:260] for s in raw.splitlines() if s.startswith(("test_","Ran ","OK","FAILED","ERROR","FAIL","Traceback","AssertionError","ImportError","TypeError","ValueError"))]
          passed=os.environ.get("PASSED")=="true" and "Ran 13 tests" in raw and "\nOK\n" in raw
          with open(os.environ["GITHUB_OUTPUT"],"a") as f:f.write("verified="+("true" if passed else "false")+"\n")
          lines=[
              "## V5 strong-core exhibition predeadline evidence guard",
              "",
              "- Pure offline tests only; no DB / Railway / Production / LINE / BUY",
              "- This certifies ONLY an immutable, source-verified exhibition six-lane capture before a supplied decision cutoff. Recent form/entry provenance still pending.",
              "",
              "~~~text",*keep[-30:],"~~~","",
              "V5_STRONG_CORE_EXHIBITION_CUTOFF_PASS" if passed else "V5_STRONG_CORE_EXHIBITION_CUTOFF_FAILED"
          ]
          Path("summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Post report
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment 581 --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Fail on regression
        if: steps.report.outputs.verified != 'true'
        run: exit 1
