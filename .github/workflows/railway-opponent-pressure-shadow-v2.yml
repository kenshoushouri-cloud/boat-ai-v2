name: Railway opponent pressure Shadow v2 compact

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/opponent_pressure_shadow_v2_compact.py'
      - '.github/workflows/railway-opponent-pressure-shadow-v2.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway opponent-pressure-shadow-v2-pilot'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run compact v2 collector
        id: audit
        env:
          OPPONENT_PRESSURE_V2_ENABLED: '1'
          OPPONENT_PRESSURE_V2_DRY_RUN: ${{ github.event_name == 'pull_request' && '1' || '0' }}
          TARGET_DATE: '2026-08-22'
        run: |
          set +e
          python -u .github/scripts/opponent_pressure_shadow_v2_compact.py > pressure-v2-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('pressure-v2-output.txt').read_text(encoding='utf-8',errors='replace') if Path('pressure-v2-output.txt').exists() else ''
          for line in text.splitlines():
              if line.startswith('OPP_PRESSURE_V2_'):
                  print(line[:1000])
          PY
      - name: Verify compact v2 pilot postconditions
        if: github.event_name == 'issue_comment' && steps.audit.outputs.exit_code == '0'
        run: |
          python - <<'PY'
          import os, psycopg
          from psycopg.rows import dict_row
          with psycopg.connect(os.environ['DATABASE_URL'],row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    select count(*) total,
                      count(*) filter(where race_date=date '2026-08-22') target_rows,
                      count(*) filter(where race_date<>date '2026-08-22') non_target_rows,
                      count(*) filter(where cardinality(racer_classes)=6 and cardinality(matched_opponents)=6
                        and cardinality(base_win)=6 and cardinality(base_top3)=6
                        and cardinality(score_win)=6 and cardinality(score_top3)=6
                        and cardinality(adj_win)=6 and cardinality(adj_top3)=6) six_rows,
                      count(*) filter(where model_version=2 and train_end=date '2026-08-21') version_rows,
                      pg_total_relation_size('v2_opponent_pressure_shadow_v2') relation_bytes
                    from v2_opponent_pressure_shadow_v2
                  """)
                  r=cur.fetchone()
          print(f"OPP_PRESSURE_V2_POST=total:{r['total']} target:{r['target_rows']} non_target:{r['non_target_rows']} six:{r['six_rows']} version:{r['version_rows']} bytes:{r['relation_bytes']}")
          if r['target_rows'] != 156 or r['non_target_rows'] != 0 or r['six_rows'] != 156 or r['version_rows'] != 156:
              raise SystemExit('compact v2 pilot postcondition failed')
          print('OPP_PRESSURE_V2_POST_RESULT=PASS')
          PY
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json pressure-v2-output.txt
      - name: Fail if collector failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
