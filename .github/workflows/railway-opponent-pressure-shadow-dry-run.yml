name: Railway opponent pressure Shadow dry-run

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'collect_opponent_pressure_shadow_pg.py'
      - '.github/workflows/railway-opponent-pressure-shadow-dry-run.yml'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run Shadow collector in strict dry-run
        id: audit
        env:
          OPPONENT_PRESSURE_SHADOW_ENABLED: '1'
          OPPONENT_PRESSURE_SHADOW_DRY_RUN: '1'
          TARGET_DATE: '2026-08-22'
          WINDOW_NAME: 'ci_dry_run'
        run: |
          set +e
          python -u collect_opponent_pressure_shadow_pg.py > pressure-shadow-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized results
        if: always()
        run: |
          python - <<'PY'
          from pathlib import Path
          text=Path('pressure-shadow-output.txt').read_text(encoding='utf-8',errors='replace') if Path('pressure-shadow-output.txt').exists() else ''
          for line in text.splitlines():
              if line.startswith('OPP_PRESSURE_SHADOW_'):
                  print(line[:1000])
          PY
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json pressure-shadow-output.txt
      - name: Fail if dry-run audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
