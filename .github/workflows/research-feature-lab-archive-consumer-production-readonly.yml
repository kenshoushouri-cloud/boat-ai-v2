name: Research Feature Lab archive consumer production read-only

on:
  pull_request:
    paths:
      - 'research_feature_lab_archive_consumer.py'
      - 'research_archive_export_pg.py'
      - 'research_archive_readthrough.py'
      - '.github/workflows/research-feature-lab-archive-consumer-production-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  july-feature-lab-archive-equivalence:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=240000 -c temp_file_limit=131072 -c timezone=UTC
      ARCHIVE_TABLE: v2_odds_trifecta
      ARCHIVE_START_DATE: '2026-07-01'
      ARCHIVE_END_DATE: '2026-07-31'
      ARCHIVE_MIN_AGE_DAYS: '30'
      ARCHIVE_MAX_DAYS: '31'
      ARCHIVE_OUTPUT_DIR: /tmp/boat-feature-lab-archive
      FEATURE_LAB_START_DATE: '2026-07-01'
      FEATURE_LAB_END_DATE: '2026-07-31'
      FEATURE_LAB_SAVE: '0'
      SNAPSHOT_LABEL: final_ab
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only dependencies
        run: |
          python -m pip install --disable-pip-version-check -q psycopg[binary] beautifulsoup4 requests
          npm install -g @railway/cli >/dev/null 2>&1

      - name: Resolve Production public database URL without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          railway variable list \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), dict):
                  value = data['variables'].get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), list):
                  for item in data['variables']:
                      if isinstance(item, dict) and item.get('name') == 'DATABASE_PUBLIC_URL':
                          value = item.get('value')
                          break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL unavailable')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
          rm -f railway-vars.json

      - name: Export July base odds to ephemeral storage
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_OUTPUT_DIR"
          mkdir -p "$ARCHIVE_OUTPUT_DIR"
          python -u research_archive_export_pg.py > archive-export.log
          grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' archive-export.log
          manifest="$(find "$ARCHIVE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print -quit)"
          test -n "$manifest"
          echo "FEATURE_LAB_BASE_ODDS_ARCHIVE_MANIFEST=$manifest" >> "$GITHUB_ENV"

      - name: Compare Feature Lab online vs verified archive odds
        shell: bash
        run: |
          set -euo pipefail
          python -u research_feature_lab_archive_consumer.py > feature-lab-archive.txt
          grep -E '^(FEATURE_LAB_ARCHIVE_COMPARE=|FEATURE_LAB_ARCHIVE_CONFIG |FEATURE_LAB_ARCHIVE_RESULT=)' feature-lab-archive.txt > feature-lab-archive-sanitized.txt
          grep -q '^FEATURE_LAB_ARCHIVE_RESULT=PASS_READ_ONLY$' feature-lab-archive-sanitized.txt
          cat feature-lab-archive-sanitized.txt
          {
            echo '## Feature Lab base-odds archive equivalence — Production read-only'
            echo
            echo '```text'
            cat feature-lab-archive-sanitized.txt
            echo '```'
            echo
            echo 'Archive files were ephemeral and removed before job exit. No DB mutation, result save, upload, retention change, or Production config change was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all Production-derived local files
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/boat-feature-lab-archive
          rm -f railway-vars.json archive-export.log feature-lab-archive.txt feature-lab-archive-sanitized.txt
