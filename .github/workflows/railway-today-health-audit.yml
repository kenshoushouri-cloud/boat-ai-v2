name: Railway today operational health

on:
  pull_request:
    paths:
      - '.github/workflows/railway-today-health-audit.yml'
      - '.github/scripts/today_operational_health.py'
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway today-health'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Validate read-only audit syntax
        run: python -m py_compile .github/scripts/today_operational_health.py

      - name: Install dependencies
        if: github.event_name != 'pull_request'
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load public database URL without publishing it
        if: github.event_name != 'pull_request'
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          selected=""
          for candidate in postgres postgres-recovery; do
            if ! railway variable list --service "$candidate" --environment production --json > railway-vars.json 2>/dev/null; then
              continue
            fi
            if CANDIDATE="$candidate" python - <<'PY'
          import json, os
          from pathlib import Path

          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value')
                      break
          if not value:
              raise SystemExit(1)
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
              fh.write(f'DB_SERVICE_NAME={os.environ["CANDIDATE"]}\n')
          PY
            then
              selected="$candidate"
              break
            fi
          done
          test -n "$selected"
          echo "TODAY_HEALTH_DB_SERVICE=$selected"

      - name: Run today operational health audit
        if: github.event_name != 'pull_request'
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          set -euo pipefail
          python -u .github/scripts/today_operational_health.py 2>&1 | tee today-health-output.txt

      - name: Reply with sanitized diagnostics
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          {
            echo '## Railway today operational health'
            echo
            echo '```text'
            grep '^TODAY_HEALTH_' today-health-output.txt 2>/dev/null || echo 'TODAY_HEALTH_DIAGNOSTIC=no_prefixed_output'
            echo '```'
            echo
            echo 'Read-only DB coverage audit. No writes, Production decision changes, or LINE changes.'
          } > today-health-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file today-health-comment.md

      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json today-health-output.txt today-health-comment.md
