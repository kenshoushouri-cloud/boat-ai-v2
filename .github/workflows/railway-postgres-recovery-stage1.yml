name: Railway Postgres recovery Stage 1

on:
  pull_request:
    paths:
      - '.github/workflows/railway-postgres-recovery-stage1.yml'
      - '.github/scripts/postgres_recovery_stage1.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Stage 1 safety gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/postgres_recovery_stage1.py
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/railway-postgres-recovery-stage1.yml').read_text(encoding='utf-8')
          script = Path('.github/scripts/postgres_recovery_stage1.py').read_text(encoding='utf-8')

          exact = "/railway postgres-recovery-stage1 CONFIRM"
          assert exact in workflow
          assert "github.actor == github.repository_owner" in workflow
          assert "github.event.issue.number == 42" in workflow
          trigger_header = workflow.split("permissions:", 1)[0]
          assert "schedule:" not in trigger_header
          assert "workflow_dispatch:" not in trigger_header

          assert 'STAGING_SERVICE = "postgres-recovery"' in script
          assert 'TARGET_SERVICE = "postgres"' in script
          assert 'EXPECTED_IMAGE = "ghcr.io/railwayapp-templates/postgres-ssl:18"' in script
          assert 'PROTECTIVE_BACKUP_NAME = "Pre-Recovery-Stage1 Backup"' in script
          assert "serviceCreate" in script
          assert "volumeInstanceUpdate" in script
          assert "serviceInstanceUpdate" in script
          assert "serviceInstanceRedeploy" in script
          assert "tcpProxyCreate" in script
          assert "tcpProxyDelete" in script
          assert "volumeInstanceBackupCreate" in script

          # Stage 1 must stay isolated. Promotion/rename and Production consumer
          # variable writes are forbidden in this script.
          assert "serviceUpdate(" not in script
          assert "variableUpsert(" not in script
          assert "variableCollectionUpsert(" not in script
          assert "serviceDelete(" not in script
          assert "volumeDelete(" not in script
          assert "volumeInstanceBackupRestore(" not in script
          assert "volumeInstancePITRRestore(" not in script

          print("POSTGRES_RECOVERY_STAGE1_VALIDATE=PASS")
          PY

  recover:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway postgres-recovery-stage1 CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Postgres client dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check psycopg2-binary

      - name: Require Railway token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"

      - name: Execute isolated Postgres recovery Stage 1
        id: recovery
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -u .github/scripts/postgres_recovery_stage1.py

      - name: Post sanitized Stage 1 result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f stage1-result.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file stage1-result.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "## Railway Postgres recovery Stage 1\n\nSTAGE1_BLOCK_MANUAL_REVIEW_REQUIRED\n\nNo sanitized result file was produced. Do not issue Stage 2 promotion."
          fi

      - name: Fail workflow when Stage 1 failed
        if: steps.recovery.outcome != 'success'
        shell: bash
        run: exit 1
