name: Research Forward Combined Checkpoint Safety

on:
  pull_request:
    paths:
      - 'research/forward_combined_checkpoint.py'
      - 'tests/test_forward_combined_checkpoint.py'
      - 'docs/FORWARD_COMBINED_MANUAL_CHECKPOINT_20260927.md'
      - '.github/workflows/research-forward-combined-checkpoint-manual.yml'
      - '.github/workflows/research-forward-combined-checkpoint-safety.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_forward_combined_checkpoint.py
      - name: Verify manual-only contract
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/workflows/research-forward-combined-checkpoint-manual.yml')
          w=p.read_text(encoding='utf-8').lower()
          assert 'workflow_dispatch:' in w
          assert 'schedule:' not in w
          assert 'railway run' in w
          assert ''.join(('railway',' variable',' list')) not in w
          assert 'v4_formal_artifact_inventory.py' in w
          assert 'v4_formal_artifact_settlement_pg.py' in w
          assert 's03_m2_common_economics_pg.py' in w
          PY
