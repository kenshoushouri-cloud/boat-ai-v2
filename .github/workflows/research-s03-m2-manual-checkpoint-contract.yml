name: Research S03 M2 Manual Checkpoint Contract

on:
  pull_request:
    paths:
      - 'research/s03_m2_common_economics_pg.py'
      - 'tests/test_s03_m2_manual_checkpoint.py'
      - '.github/workflows/research-s03-m2-forward-checkpoint-manual.yml'
      - '.github/workflows/research-s03-m2-manual-checkpoint-contract.yml'
      - 'docs/S03_M2_MANUAL_CHECKPOINT_20260927.md'

permissions:
  contents: read

jobs:
  contract:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pytest
      - run: PYTHONPATH=. pytest -q tests/test_s03_m2_manual_checkpoint.py
