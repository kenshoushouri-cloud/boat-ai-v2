name: V4 position-conditional blend read-only

on:
  pull_request:
    paths:
      - 'research/v4_position_conditional_blend_walkforward_pg.py'
      - 'tests/test_v4_position_conditional_blend_walkforward.py'
      - 'docs/V4_POSITION_CONDITIONAL_BLEND_20260923.md'
      - '.github/workflows/v4-position-conditional-blend-readonly.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pytest
      - name: Validate conservative blend contracts
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile research/v4_position_conditional_blend_walkforward_pg.py tests/test_v4_position_conditional_blend_walkforward.py
          pytest -q tests/test_v4_position_conditional_blend_walkforward.py
          python - <<'PY'
          from pathlib import Path
          src=Path('research/v4_position_conditional_blend_walkforward_pg.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in src
          assert 'alpha_choice_uses_prior_unseen_blocks_only' in src
          assert 'first_place_marginal_preserved' in src
          for value in ('insert into','update v2_','delete from','vacuum ','purchase_action=true'):
              assert value not in src, value
          print('V4_POSBLEND_VALIDATE=PASS')
          PY

  replay:
    needs: validate
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      PYTHONPATH: ${{ github.workspace }}
      DEDICATED_DATABASE_URL: ${{ secrets.V4_BACKTEST_DATABASE_URL }}
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      V4_POSBLEND_START_DATE: '2025-07-01'
      V4_POSBLEND_END_DATE: '2026-09-22'
      V4_POSBLEND_BLOCKS: '10'
      V4_POSBLEND_BOOTSTRAP_SAMPLES: '20000'
      V4_POSBLEND_BOOTSTRAP_SEED: '20260923'
      V4_POSBLEND_OUTPUT_JSON: 'v4-position-conditional-blend-walkforward.json'
      V4_POSCOND_EPOCHS_PER_BLOCK: '12'
      V4_POSCOND_BASE_LR: '0.035'
      V4_POSCOND_L2: '0.0005'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Select read-only connection route
        run: |
          set -euo pipefail
          if [ -n "${DEDICATED_DATABASE_URL:-}" ]; then
            echo "V4_POSBLEND_DB_REPLAY=DEDICATED_DATABASE_SECRET"
          elif [ -n "${RAILWAY_TOKEN:-}" ]; then
            echo "V4_POSBLEND_DB_REPLAY=RAILWAY_RUN_NON_ENUMERATING"
          else
            echo "V4_POSBLEND_DB_REPLAY=BLOCKED_NO_APPROVED_CONNECTION_ROUTE"
            exit 1
          fi
      - name: Install Railway CLI
        if: env.DEDICATED_DATABASE_URL == '' && env.RAILWAY_TOKEN != ''
        run: |
          set -euo pipefail
          npm install --global @railway/cli
          railway --version
      - name: Run with dedicated read-only connection
        if: env.DEDICATED_DATABASE_URL != ''
        env:
          DATABASE_URL: ${{ secrets.V4_BACKTEST_DATABASE_URL }}
        run: |
          set -euo pipefail
          python -u research/v4_position_conditional_blend_walkforward_pg.py 2>&1 | tee v4-position-conditional-blend-walkforward.txt
          grep -q '^RESULT=PASS_READ_ONLY_POSITION_CONDITIONAL_BLEND$' v4-position-conditional-blend-walkforward.txt
      - name: Run via Railway local env injection
        if: env.DEDICATED_DATABASE_URL == '' && env.RAILWAY_TOKEN != ''
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u research/v4_position_conditional_blend_walkforward_pg.py' \
            2>&1 | tee v4-position-conditional-blend-walkforward.txt
          grep -q '^RESULT=PASS_READ_ONLY_POSITION_CONDITIONAL_BLEND$' v4-position-conditional-blend-walkforward.txt
      - name: Upload sanitized evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v4-position-conditional-blend-${{ github.run_id }}
          path: |
            v4-position-conditional-blend-walkforward.json
            v4-position-conditional-blend-walkforward.txt
          retention-days: 90
          if-no-files-found: warn
      - name: Confirm no variable-enumeration surface
        if: always()
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/workflows/v4-position-conditional-blend-readonly.yml').read_text(encoding='utf-8').lower()
          forbidden=(
              ''.join(('railway',' variable',' list')),
              ''.join(('print','env')),
              ''.join(('env',' |')),
          )
          for value in forbidden:
              assert value not in text, value
          assert 'railway run' in text
          print('V4_POSBLEND_SECRET_ENUMERATION=0')
          PY
