name: Value Candidate Shadow Tests

on:
  pull_request:
    paths:
      - "research_value_candidate_shadow.py"
      - "tests/test_research_value_candidate_shadow.py"
      - "docs/VALUE_CANDIDATE_SHADOW_20260912.md"
      - ".github/workflows/value-candidate-shadow-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Run focused research tests
        run: python -m pytest -q tests/test_research_value_candidate_shadow.py
