name: Storage Learning Completed Retention Readonly

on:
  pull_request:
    paths:
      - '.github/scripts/storage_learning_completed_retention_readonly.py'
      - '.github/workflows/storage-learning-completed-retention-readonly.yml'

permissions:
  contents: read

concurrency:
  group: storage-production-readonly-audit-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c temp_file_limit=65536
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only isolation
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/storage_learning_completed_retention_readonly.py
          python - <<'PY'
          from pathlib import Path
          text=Path('.github/scripts/storage_learning_completed_retention_readonly.py').read_text(encoding='utf-8').lower()
          assert 'from db_pg import fetch_all' in text
          for token in ('execute(', 'upsert', 'insert into', 'update ', 'delete from', 'alter table', 'drop table', 'create table', 'send_line'):
              assert token not in text, token
          print('STORAGE_LEARNING_COMPLETED_ISOLATION=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run completed learning retention inventory
        run: |
          set -euo pipefail
          python -u .github/scripts/storage_learning_completed_retention_readonly.py | tee storage-learning-completed.txt
          grep -q '^STORAGE_LEARNING_COMPLETED_RESULT=PASS_READ_ONLY$' storage-learning-completed.txt
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json storage-learning-completed.txt
