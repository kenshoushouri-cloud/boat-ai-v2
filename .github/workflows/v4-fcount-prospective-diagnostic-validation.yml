name: V4 F-count prospective diagnostic contract
on:
  pull_request:
    paths:
      - 'research/v4_fcount_prospective_diagnostic_contract.py'
      - 'tests/test_v4_fcount_prospective_diagnostic_contract.py'
      - 'docs/V4_FCOUNT_PROSPECTIVE_DIAGNOSTIC_20260927.md'
      - '.github/workflows/v4-fcount-prospective-diagnostic-validation.yml'
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m py_compile research/v4_fcount_prospective_diagnostic_contract.py
      - run: pytest -q tests/test_v4_fcount_prospective_diagnostic_contract.py
      - name: Validate isolation
        run: |
          python - <<'PY'
          from pathlib import Path
          t=Path('research/v4_fcount_prospective_diagnostic_contract.py').read_text(encoding='utf-8').lower()
          for x in ('psycopg','requests','urllib','send_'+'line','insert into','update v2_','delete from','create table','railway'):
              assert x not in t,x
          assert 'production_promotion_allowed' in t
          assert 'purchase_action' in t
          print('V4_FCOUNT_PURE_CONTRACT=PASS')
          PY
