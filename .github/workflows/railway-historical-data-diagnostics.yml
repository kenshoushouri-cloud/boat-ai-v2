name: Railway historical data diagnostics

on:
  workflow_dispatch:
    inputs:
      operation:
        description: Read-only diagnostic
        required: true
        default: monthly
        type: choice
        options:
          - monthly
          - probe
          - probe_v3
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  diagnose:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        (
          github.event.comment.body == '/railway monthly-audit' ||
          github.event.comment.body == '/railway historical-probe' ||
          github.event.comment.body == '/railway historical-probe-v3'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Resolve operation
        id: op
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
          DISPATCH_OPERATION: ${{ inputs.operation }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            op="${DISPATCH_OPERATION:-monthly}"
          elif [ "$COMMENT_BODY" = "/railway historical-probe-v3" ]; then
            op="probe_v3"
          elif [ "$COMMENT_BODY" = "/railway historical-probe" ]; then
            op="probe"
          else
            op="monthly"
          fi
          case "$op" in monthly|probe|probe_v3) ;; *) exit 2 ;; esac
          echo "operation=$op" >> "$GITHUB_OUTPUT"

      - name: Load public database URL without publishing it
        if: ${{ steps.op.outputs.operation != 'probe_v3' }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (
                      item.get('name') == 'DATABASE_PUBLIC_URL'
                      or item.get('key') == 'DATABASE_PUBLIC_URL'
                  ):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Monthly completeness matrix
        if: ${{ steps.op.outputs.operation == 'monthly' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import os
          from pathlib import Path

          import psycopg
          from psycopg.rows import dict_row

          START = '2025-07-01'
          END = '2026-08-23'
          RID_START = '20250701'
          RID_END = '20260823'

          conn = psycopg.connect(
              os.environ['DATABASE_URL'],
              row_factory=dict_row,
              autocommit=True,
          )
          with conn.cursor() as cur:
              cur.execute("set statement_timeout = '120s'")

          def q(sql, params=()):
              with conn.cursor() as cur:
                  cur.execute(sql, params)
                  return cur.fetchall()

          schema_rows = q("""
              select table_name, column_name, udt_name
              from information_schema.columns
              where table_schema='public'
          """)
          columns = {}
          udt = {}
          for row in schema_rows:
              table = str(row['table_name'])
              col = str(row['column_name'])
              columns.setdefault(table, set()).add(col)
              udt[(table, col)] = str(row['udt_name'])

          def has(table, *cols):
              return table in columns and all(c in columns[table] for c in cols)

          skipped = []

          def try_rows(label, sql, params=()):
              try:
                  return q(sql, params)
              except Exception as exc:
                  skipped.append(f"{label}: {type(exc).__name__}")
                  return []

          months = {}
          if not has('v2_races', 'race_date'):
              raise SystemExit('v2_races.race_date is required')
          for row in q("""
              select to_char(race_date,'YYYY-MM') as month, count(*)::int as n
              from v2_races
              where race_date >= %s and race_date < %s
              group by 1 order by 1
          """, (START, END)):
              months[row['month']] = {'races': int(row['n'])}

          def add_race_complete(key, table, having_sql, required):
              if not has(table, *required):
                  skipped.append(f"{key}: missing {table} columns")
                  return
              sql = f"""
                  select substr(race_id,1,4)||'-'||substr(race_id,5,2) as month,
                         count(*)::int as n
                  from (
                    select race_id
                    from {table}
                    where race_id >= %s and race_id < %s
                    group by race_id
                    having {having_sql}
                  ) x
                  group by 1 order by 1
              """
              for row in try_rows(key, sql, (RID_START, RID_END)):
                  months.setdefault(row['month'], {})[key] = int(row['n'])

          add_race_complete(
              'entries6', 'v2_race_entries',
              'count(distinct lane)=6',
              ('race_id', 'lane'),
          )
          add_race_complete(
              'result_entries6', 'v2_result_entries',
              'count(distinct lane)=6',
              ('race_id', 'lane'),
          )
          add_race_complete(
              'odds120', 'v2_odds_trifecta',
              'count(distinct ticket) filter (where odds is not null and odds > 0)=120',
              ('race_id', 'ticket', 'odds'),
          )
          add_race_complete(
              'hist_exh6', 'v2_realtime_exhibition_snapshots',
              "count(distinct lane) filter (where snapshot_label='historical' and exhibition_time is not null)=6",
              ('race_id', 'lane', 'snapshot_label', 'exhibition_time'),
          )
          add_race_complete(
              'hist_racer6', 'v2_realtime_racer_condition_snapshots',
              "count(distinct lane) filter (where snapshot_label='historical')=6",
              ('race_id', 'lane', 'snapshot_label'),
          )

          def add_distinct_races(key, table, historical=False):
              required = ['race_id']
              where_extra = ''
              if historical:
                  required.append('snapshot_label')
                  where_extra = " and snapshot_label='historical'"
              if not has(table, *required):
                  skipped.append(f"{key}: missing {table} columns")
                  return
              sql = f"""
                  select substr(race_id,1,4)||'-'||substr(race_id,5,2) as month,
                         count(distinct race_id)::int as n
                  from {table}
                  where race_id >= %s and race_id < %s {where_extra}
                  group by 1 order by 1
              """
              for row in try_rows(key, sql, (RID_START, RID_END)):
                  months.setdefault(row['month'], {})[key] = int(row['n'])

          add_distinct_races('results', 'v2_results')
          add_distinct_races('hist_weather', 'v2_realtime_weather_snapshots', True)
          add_distinct_races('hist_race_cond', 'v2_realtime_race_condition_snapshots', True)

          def add_fill_pct(key, table, value_expr, required, historical=False):
              req = ['race_id', *required]
              where_extra = ''
              if historical:
                  req.append('snapshot_label')
                  where_extra = " and snapshot_label='historical'"
              if not has(table, *req):
                  skipped.append(f"{key}: missing {table} columns")
                  return
              sql = f"""
                  select substr(race_id,1,4)||'-'||substr(race_id,5,2) as month,
                         100.0 * count(*) filter (where {value_expr})
                         / nullif(count(*),0) as pct
                  from {table}
                  where race_id >= %s and race_id < %s {where_extra}
                  group by 1 order by 1
              """
              for row in try_rows(key, sql, (RID_START, RID_END)):
                  months.setdefault(row['month'], {})[key] = float(row['pct'] or 0)

          add_fill_pct(
              'name_pct', 'v2_race_entries',
              "nullif(trim(racer_name),'') is not null",
              ('racer_name',),
          )
          add_fill_pct(
              'temp_pct', 'v2_realtime_weather_snapshots',
              'temperature_c is not null',
              ('temperature_c',),
              True,
          )
          add_fill_pct(
              'water_temp_pct', 'v2_realtime_weather_snapshots',
              'water_temperature_c is not null',
              ('water_temperature_c',),
              True,
          )
          add_fill_pct(
              'winddir_pct', 'v2_realtime_weather_snapshots',
              "nullif(trim(wind_direction),'') is not null",
              ('wind_direction',),
              True,
          )
          add_fill_pct(
              'tilt_pct', 'v2_realtime_exhibition_snapshots',
              'tilt is not null',
              ('tilt',),
              True,
          )
          add_fill_pct(
              'prev_st_pct', 'v2_realtime_racer_condition_snapshots',
              'previous_st is not null',
              ('previous_st',),
              True,
          )
          add_fill_pct(
              'prev_finish_pct', 'v2_realtime_racer_condition_snapshots',
              'previous_finish is not null',
              ('previous_finish',),
              True,
          )

          if has('v2_race_entries', 'race_id', 'recent_form'):
              typ = udt.get(('v2_race_entries', 'recent_form'), '')
              if typ == 'jsonb':
                  recent_expr = (
                      "jsonb_typeof(recent_form)='array' "
                      "and jsonb_array_length(recent_form)>0"
                  )
              elif typ == 'json':
                  recent_expr = (
                      "json_typeof(recent_form)='array' "
                      "and json_array_length(recent_form)>0"
                  )
              else:
                  recent_expr = (
                      "nullif(trim(recent_form::text),'') is not null "
                      "and trim(recent_form::text) not in ('[]','{}','null')"
                  )
              add_fill_pct(
                  'recent_pct', 'v2_race_entries',
                  recent_expr, ('recent_form',),
              )
          else:
              skipped.append('recent_pct: recent_form column missing')

          def pct(n, d):
              return 100.0 * n / d if d else 0.0

          lines = [
              '## Railway historical monthly coverage',
              '',
              'Read-only audit. Period: **2025-07-01 .. 2026-08-22**.',
              '',
              '| Month | Races | Entries6 | Results | Result rows6 | Odds120 | Hist weather | Hist exh6 | Hist race cond | Hist racer6 | Name% | Temp% | WaterTemp% | WindDir% | Tilt% | PrevST% | PrevFinish% | RecentForm(non-empty)% |',
              '|---|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|---:|',
          ]
          for month in sorted(months):
              x = months[month]
              base = x.get('races', 0)

              def f(key):
                  value = x.get(key, 0)
                  return f"{value}/{base} ({pct(value, base):.1f}%)"

              lines.append(
                  f"| {month} | {base} | {f('entries6')} | {f('results')} | "
                  f"{f('result_entries6')} | {f('odds120')} | {f('hist_weather')} | "
                  f"{f('hist_exh6')} | {f('hist_race_cond')} | {f('hist_racer6')} | "
                  f"{x.get('name_pct',0):.1f}% | {x.get('temp_pct',0):.1f}% | "
                  f"{x.get('water_temp_pct',0):.1f}% | {x.get('winddir_pct',0):.1f}% | "
                  f"{x.get('tilt_pct',0):.1f}% | {x.get('prev_st_pct',0):.1f}% | "
                  f"{x.get('prev_finish_pct',0):.1f}% | {x.get('recent_pct',0):.1f}% |"
              )

          if skipped:
              lines += [
                  '',
                  'Schema-safe skips (audit continued):',
                  *[f"- `{item}`" for item in sorted(set(skipped))[:30]],
              ]
          lines += [
              '',
              'No rows, schema, Variables, deployments, prediction logic, or LINE behavior were changed.',
          ]
          Path('diagnostic-summary.md').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          conn.close()
          PY

      - name: Historical official-beforeinfo parser probe
        if: ${{ steps.op.outputs.operation == 'probe' }}
        shell: bash
        run: |
          set -euo pipefail
          : > probe-output.txt
          for d in 2025-07-01 2025-12-15 2026-04-15 2026-08-20; do
            echo "===== DATE $d =====" >> probe-output.txt
            HIST_PROBE_DATE="$d" HIST_PROBE_MAX_VENUES=2 HIST_PROBE_RACE_NOS="1,6,12" \
              python -u probe_historical_beforeinfo_availability_pg.py >> probe-output.txt 2>&1 || true
          done
          python - <<'PY'
          from pathlib import Path
          text = Path('probe-output.txt').read_text(
              encoding='utf-8',
              errors='replace',
          )
          keep = []
          for line in text.splitlines():
              if (
                  line.startswith('===== DATE ')
                  or line.startswith('HIST_PROBE_DATE=')
                  or line.startswith('2025')
                  or line.startswith('2026')
                  or line.startswith('  weather=')
                  or line.startswith('samples=')
                  or line.startswith('http_ok=')
                  or line.startswith('weather_')
                  or line.startswith('exhibition_')
                  or line.startswith('racer_condition_')
                  or line.startswith('HISTORICAL_BACKFILL_READY=')
              ):
                  keep.append(line[:500])
          lines = [
              '## Railway historical parser probe',
              '',
              'Read-only samples from official historical `beforeinfo` pages.',
              'Dates: 2025-07-01, 2025-12-15, 2026-04-15, 2026-08-20.',
              '',
              '```text',
              *keep[:250],
              '```',
              '',
              'No database writes, Railway setting changes, deployments, prediction changes, or LINE sends were performed.',
          ]
          Path('diagnostic-summary.md').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          PY

      - name: Historical parser v3 live-page probe
        if: ${{ steps.op.outputs.operation == 'probe_v3' }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          import requests

          from historical_beforeinfo_parser_v3 import parse_exhibition, VERSION

          cases = [
              ('2025-07-01', '05', 1, None),
              ('2025-12-15', '01', 6, None),
              ('2026-02-23', '04', 2, [2, 1, 3, 4, 5, 6]),
              ('2026-04-15', '01', 1, None),
          ]

          session = requests.Session()
          session.headers.update({
              'User-Agent': 'Mozilla/5.0 (compatible; boat-ai-v2-parser-probe/1.0)'
          })

          rows_out = []
          failures = []
          for date_str, venue, race_no, expected_course_order in cases:
              hd = date_str.replace('-', '')
              url = (
                  'https://www.boatrace.jp/owpc/pc/race/beforeinfo'
                  f'?rno={race_no}&jcd={venue}&hd={hd}'
              )
              response = session.get(url, timeout=35)
              response.raise_for_status()
              response.encoding = response.apparent_encoding or 'utf-8'
              parsed = parse_exhibition(response.text)

              count = len(parsed)
              tilt_count = sum(x.get('tilt') is not None for x in parsed)
              st_count = sum(x.get('start_timing') is not None for x in parsed)
              course_order = [
                  int(x['lane'])
                  for x in sorted(
                      parsed,
                      key=lambda x: int(x.get('exhibition_course') or 99),
                  )
              ]
              changed = any(
                  int(x.get('exhibition_course') or x['lane']) != int(x['lane'])
                  for x in parsed
              )
              status = 'PASS'
              reasons = []
              if count != 6:
                  status = 'FAIL'
                  reasons.append(f'rows={count}/6')
              if tilt_count != 6:
                  status = 'FAIL'
                  reasons.append(f'tilt={tilt_count}/6')
              if expected_course_order is not None and course_order != expected_course_order:
                  status = 'FAIL'
                  reasons.append(
                      f'course_order={course_order} expected={expected_course_order}'
                  )
              if expected_course_order is not None and not changed:
                  status = 'FAIL'
                  reasons.append('course-change-not-detected')
              if status == 'FAIL':
                  failures.append(f'{date_str}_{venue}_{race_no:02d}: ' + ', '.join(reasons))

              rows_out.append(
                  f"{date_str} venue={venue} race={race_no}R "
                  f"rows={count}/6 tilt={tilt_count}/6 st={st_count}/6 "
                  f"course_order={course_order} changed={changed} status={status}"
              )

          lines = [
              '## Historical beforeinfo parser v3 live-page probe',
              '',
              f'Parser: `{VERSION}`',
              '',
              'Read-only HTTP GET validation against BOAT RACE official historical beforeinfo pages.',
              'The 2026-02-23 平和島2R case is a positive control for reordered start exhibition.',
              '',
              '```text',
              *rows_out,
              '```',
              '',
          ]
          if failures:
              lines += [
                  'Result: **FAIL**',
                  '',
                  *[f'- {x}' for x in failures],
              ]
          else:
              lines += ['Result: **PASS**']
          lines += [
              '',
              'No database, Railway setting, Production parser, prediction, or LINE changes were made.',
          ]
          Path('diagnostic-summary.md').write_text(
              '\n'.join(lines) + '\n',
              encoding='utf-8',
          )
          if failures:
              raise SystemExit(1)
          PY

      - name: Build failure summary
        if: failure() && steps.op.outputs.operation != 'probe_v3'
        shell: bash
        run: |
          {
            echo '## Railway historical data diagnostics'
            echo
            echo '❌ Read-only diagnostic failed.'
            echo
            echo 'No database writes or Railway setting changes were performed.'
            echo 'Raw stderr and connection values were not published.'
          } > diagnostic-summary.md

      - name: Remove raw/sensitive temporary files
        if: always()
        shell: bash
        run: |
          rm -f railway-vars.json railway-vars-error.txt probe-output.txt

      - name: Post result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f diagnostic-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file diagnostic-summary.md
          fi
