name: Opponent ephemeral reconstruct candidate-v4

on:
  pull_request:
    paths:
      - "research/historical_opponent_ephemeral_reconstruct_pg.py"
      - "tests/test_historical_opponent_ephemeral_reconstruct_pg.py"
      - ".github/workflows/research-opponent-ephemeral-reconstruct-candidate-v4.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  reconstruct:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest

      - name: Static safety tests
        run: |
          set -euo pipefail
          pytest -q tests/test_historical_opponent_ephemeral_reconstruct_pg.py
          python -m py_compile research/historical_opponent_ephemeral_reconstruct_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/historical_opponent_ephemeral_reconstruct_pg.py").read_text(encoding="utf-8").lower()
          for token in ("insert into","update v2_","delete from","create table","alter table","drop table","commit()"):
              assert token not in p, token
          w=Path(".github/workflows/research-opponent-ephemeral-reconstruct-candidate-v4.yml").read_text(encoding="utf-8").lower()
          assert "postgres-hobby-fullhistory-candidate-v4" in w
          assert "".join(("railway"," variable"," list")) not in w
          assert "".join(("list","_variables")) not in w
          assert "".join(("schedule", ":")) not in w
          print("OPP_EPHEMERAL_STATIC=PASS")
          PY

      - run: npm install --global @railway/cli

      - name: Reconstruct 2026-09-01 through 2026-09-10 read-only
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c max_parallel_workers_per_gather=0"; export PYTHONPATH=.; exec python -u research/historical_opponent_ephemeral_reconstruct_pg.py --start-date 2026-09-01 --end-date 2026-09-10 --expect-races 1488 --output historical-opponent-ephemeral-20260901-0910.json' \
            2>&1 | tee historical-opponent-ephemeral-20260901-0910.txt
          grep -q '^OPP_EPHEMERAL_DB_WRITE=0$' historical-opponent-ephemeral-20260901-0910.txt
          grep -q '^OPP_EPHEMERAL_EXISTING_ROWS_CHANGED=0$' historical-opponent-ephemeral-20260901-0910.txt
          grep -q '^OPP_EPHEMERAL_TARGET_OUTCOME_READ=0$' historical-opponent-ephemeral-20260901-0910.txt
          grep -q '^OPP_EPHEMERAL_RECONSTRUCTED=1488$' historical-opponent-ephemeral-20260901-0910.txt
          grep -q '^OPP_EPHEMERAL_RESULT=PASS_READ_ONLY_ARTIFACT$' historical-opponent-ephemeral-20260901-0910.txt

      - name: Validate artifact contract
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path

          p=Path("historical-opponent-ephemeral-20260901-0910.json")
          x=json.loads(p.read_text(encoding="utf-8"))
          assert x["contract"] == "HISTORICAL_OPPONENT_EPHEMERAL_RECONSTRUCT_V1"
          assert x["period"] == ["2026-09-01","2026-09-10"]
          assert x["target_outcome_read"] is False
          assert x["database_write"] is False
          assert x["existing_rows_changed"] is False
          assert x["production_change"] is False
          assert len(x["rows"]) == 1488
          assert len({r["race_id"] for r in x["rows"]}) == 1488
          assert all(r["provenance"] == "ephemeral_historical102_strict_prior_only" for r in x["rows"])
          digest=hashlib.sha256(p.read_bytes()).hexdigest()
          Path("historical-opponent-ephemeral-20260901-0910.sha256").write_text(
              f"{digest}  {p.name}\n", encoding="utf-8"
          )
          print("OPP_EPHEMERAL_ARTIFACT_VALID=1")
          print("OPP_EPHEMERAL_SHA256="+digest)
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: opponent-ephemeral-20260901-0910-${{ github.run_id }}
          path: |
            historical-opponent-ephemeral-20260901-0910.json
            historical-opponent-ephemeral-20260901-0910.sha256
            historical-opponent-ephemeral-20260901-0910.txt
          retention-days: 14
          if-no-files-found: error
