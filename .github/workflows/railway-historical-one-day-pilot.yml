name: Railway historical one-day pilot

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/railway-historical-one-day-pilot.yml"
      - ".github/scripts/historical_weather_one_day_pilot.py"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/railway-historical-one-day-pilot.yml"
      - ".github/scripts/historical_weather_one_day_pilot.py"
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  pilot:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        (
          github.event.comment.body == '/railway historical-pilot-audit' ||
          github.event.comment.body == '/railway historical-pilot-write' ||
          github.event.comment.body == '/railway historical-pilot-audit-dec15' ||
          github.event.comment.body == '/railway historical-pilot-write-dec15'
        )
      )
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Resolve allowlisted pilot mode and date
        id: mode
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          mode='audit'
          pilot_date='2025-12-15'

          if [ "$EVENT_NAME" = "push" ] || [ "$EVENT_NAME" = "pull_request" ]; then
            mode='audit'
            pilot_date='2025-12-15'
          else
            case "$COMMENT_BODY" in
              '/railway historical-pilot-audit')
                mode='audit'
                pilot_date='2025-07-01'
                ;;
              '/railway historical-pilot-write')
                mode='write'
                pilot_date='2025-07-01'
                ;;
              '/railway historical-pilot-audit-dec15')
                mode='audit'
                pilot_date='2025-12-15'
                ;;
              '/railway historical-pilot-write-dec15')
                mode='write'
                pilot_date='2025-12-15'
                ;;
              *) exit 2 ;;
            esac
          fi

          echo "mode=$mode" >> "$GITHUB_OUTPUT"
          echo "date=$pilot_date" >> "$GITHUB_OUTPUT"

      - name: Load public database URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (
                      item.get('name') == 'DATABASE_PUBLIC_URL'
                      or item.get('key') == 'DATABASE_PUBLIC_URL'
                  ):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run allowlisted historical weather pilot
        id: run_pilot
        shell: bash
        env:
          HISTORICAL_PILOT_DATE: ${{ steps.mode.outputs.date }}
          HISTORICAL_PILOT_MODE: ${{ steps.mode.outputs.mode }}
          CONFIRM_HISTORICAL_PILOT: ${{ steps.mode.outputs.mode == 'write' && 'YES' || 'NO' }}
        run: |
          set +e
          python -u .github/scripts/historical_weather_one_day_pilot.py > pilot-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized pilot summary
        if: always()
        shell: bash
        env:
          MODE: ${{ steps.mode.outputs.mode }}
          PILOT_DATE: ${{ steps.mode.outputs.date }}
          EXIT_CODE: ${{ steps.run_pilot.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          src = Path('pilot-output.txt')
          text = src.read_text(encoding='utf-8', errors='replace') if src.exists() else ''
          prefixes = (
              'PILOT_', 'PARSE_', 'PRE_', 'WRITE_', 'POST_', 'RESULT=',
          )
          keep = [
              line[:800]
              for line in text.splitlines()
              if line.startswith(prefixes)
          ]
          mode = os.environ.get('MODE', '?')
          target_date = os.environ.get('PILOT_DATE', '?')
          code = os.environ.get('EXIT_CODE', '?')
          title = (
              '## Historical weather one-day pilot audit'
              if mode == 'audit'
              else '## Historical weather one-day pilot write'
          )
          lines = [
              title,
              '',
              f'**Fixed target: {target_date} / snapshot_label=historical**',
              '',
              '```text',
              *keep[:120],
              '```',
              '',
              f'Process exit code: `{code}`',
              '',
          ]
          if mode == 'audit':
              lines.append(
                  'Read-only: database SELECT + stored historical raw-text parse only. '
                  'No rows were changed.'
              )
          else:
              lines.append(
                  'Write scope is restricted to existing historical temperature and water-temperature '
                  'fields for the fixed target date. Exhibition/course/ST/tilt, Production labels, '
                  'prediction tables and LINE are not touched.'
              )
          Path('pilot-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Remove raw temporary files
        if: always()
        shell: bash
        run: |
          rm -f railway-vars.json railway-vars-error.txt pilot-output.txt

      - name: Post sanitized result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file pilot-summary.md

      - name: Fail workflow if pilot failed
        if: ${{ steps.run_pilot.outputs.exit_code != '0' }}
        shell: bash
        run: exit 1
