name: Railway opponent composition readiness

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - ".github/scripts/opponent_composition_readiness_audit.py"
      - ".github/workflows/railway-opponent-composition-readiness.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway opponent-composition-readiness'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run read-only readiness audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/opponent_composition_readiness_audit.py > opponent-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Build sanitized summary
        if: always()
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path
          text=Path('opponent-output.txt').read_text(encoding='utf-8',errors='replace') if Path('opponent-output.txt').exists() else ''
          prefixes=('OPPONENT_','OPPONENT_AUDIT_')
          keep=[x[:700] for x in text.splitlines() if x.startswith(prefixes)]
          body=['## Opponent composition readiness audit','','**Read-only / no coefficients / no DB writes**','','```text',*keep[:120],'```','',f'Audit exit code: `{os.environ.get("AUDIT_EXIT_CODE","?")}`']
          Path('opponent-summary.md').write_text('\n'.join(body)+'\n',encoding='utf-8')
          PY
      - name: Remove temporary files
        if: always()
        run: rm -f railway-vars.json opponent-output.txt
      - name: Post result to control issue
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file opponent-summary.md
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
