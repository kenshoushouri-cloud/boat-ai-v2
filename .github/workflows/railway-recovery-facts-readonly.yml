name: Railway recovery facts read-only

on:
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  inspect:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway recovery-facts-readonly'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 12

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Require Railway token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"

      - name: Collect read-only CLI metadata fallback
        shell: bash
        run: |
          set -euo pipefail
          railway status --json > railway-status.json 2>/dev/null || true
          railway volume list --json > railway-volumes.json 2>/dev/null || true

      - name: Query safe Railway recovery facts read-only
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.request
          from pathlib import Path

          ENDPOINT = "https://backboard.railway.com/graphql/v2"
          TOKEN = os.environ["RAILWAY_TOKEN"]
          TARGET_SERVICE = "postgres"
          TARGET_VOLUME = "postgres-volume"
          PAGE_SIZE = 100
          MAX_PAGES = 20

          def gql(query, variables=None):
              req = urllib.request.Request(
                  ENDPOINT,
                  data=json.dumps({
                      "query": query,
                      "variables": variables or {},
                  }).encode("utf-8"),
                  method="POST",
                  headers={
                      "Project-Access-Token": TOKEN,
                      "Content-Type": "application/json",
                      "User-Agent": "boat-ai-v2-readonly-recovery-facts-v2",
                  },
              )
              try:
                  with urllib.request.urlopen(req, timeout=30) as resp:
                      payload = json.loads(resp.read().decode("utf-8"))
              except Exception:
                  return None, "request_failed"
              if payload.get("errors"):
                  return payload.get("data"), "graphql_error"
              return payload.get("data"), None

          def load_json(path):
              p = Path(path)
              if not p.exists():
                  return None
              try:
                  return json.loads(p.read_text(encoding="utf-8"))
              except Exception:
                  return None

          def walk(obj):
              if isinstance(obj, dict):
                  yield obj
                  for value in obj.values():
                      yield from walk(value)
              elif isinstance(obj, list):
                  for value in obj:
                      yield from walk(value)

          def conn_nodes(conn):
              if not isinstance(conn, dict):
                  return []
              out = []
              for edge in conn.get("edges") or []:
                  if isinstance(edge, dict) and isinstance(edge.get("node"), dict):
                      out.append(edge["node"])
              return out

          def page_state(conn):
              if not isinstance(conn, dict):
                  return False, None
              pi = conn.get("pageInfo") or {}
              return bool(pi.get("hasNextPage")), pi.get("endCursor")

          def safe_scalar(v, default="-"):
              if v is None or v == "":
                  return default
              return str(v).replace("|", "\\|").replace("\n", " ")

          def recursive_contains(obj, needle):
              needle = needle.lower()
              if isinstance(obj, dict):
                  for k, v in obj.items():
                      if needle in str(k).lower():
                          return True
                      if recursive_contains(v, needle):
                          return True
                  return False
              if isinstance(obj, list):
                  return any(recursive_contains(v, needle) for v in obj)
              if isinstance(obj, str):
                  return needle in obj.lower()
              return False

          def mentions_named_object(obj, target):
              if not isinstance(obj, dict):
                  return False
              for key in ("name", "volumeName", "serviceName", "displayName"):
                  if obj.get(key) == target:
                      return True
              return False

          token_query = """
          query RecoveryTokenContext {
            projectToken {
              projectId
              environmentId
              project {
                workspaceId
                services(first: 100) {
                  edges {
                    node {
                      name
                      createdAt
                      updatedAt
                      deletedAt
                    }
                  }
                }
                volumes(first: 100) {
                  edges {
                    node {
                      name
                      createdAt
                      volumeInstances(first: 100) {
                        edges {
                          node {
                            id
                            createdAt
                            deletedAt
                            currentSizeMB
                            sizeMB
                            mountPath
                            region
                            state
                            isPendingDeletion
                            serviceId
                          }
                        }
                      }
                    }
                  }
                }
              }
            }
          }
          """
          token_data, token_err = gql(token_query)
          token_obj = (token_data or {}).get("projectToken") or {}
          project_id = token_obj.get("projectId")
          environment_id = token_obj.get("environmentId")
          project_obj = token_obj.get("project") or {}
          workspace_id = project_obj.get("workspaceId")

          if not project_id or not environment_id:
              Path("railway-result-summary.md").write_text(
                  "## Railway recovery facts read-only\n\n"
                  "❌ Could not resolve project/environment context from the project token.\n\n"
                  "No Railway setting or data was modified. IDs and raw errors were not published.\n",
                  encoding="utf-8",
              )
              raise SystemExit(0)

          services = conn_nodes(project_obj.get("services"))
          current_postgres = [s for s in services if s.get("name") == TARGET_SERVICE]

          volume = None
          volume_instance = None
          for v in conn_nodes(project_obj.get("volumes")):
              if v.get("name") == TARGET_VOLUME:
                  volume = v
                  instances = conn_nodes(v.get("volumeInstances"))
                  if instances:
                      volume_instance = sorted(
                          instances,
                          key=lambda x: x.get("createdAt") or "",
                          reverse=True,
                      )[0]
                  break

          cli_status = load_json("railway-status.json")
          cli_volumes = load_json("railway-volumes.json")
          cli_volume_visible = False
          candidate_ids = []

          for source in (cli_status, cli_volumes):
              if source is None:
                  continue
              for obj in walk(source):
                  if not mentions_named_object(obj, TARGET_VOLUME):
                      continue
                  cli_volume_visible = True
                  for key in (
                      "volumeInstanceId",
                      "volume_instance_id",
                      "instanceId",
                      "id",
                  ):
                      value = obj.get(key)
                      if isinstance(value, str) and value and value not in candidate_ids:
                          candidate_ids.append(value)
                  for nested in walk(obj):
                      if not isinstance(nested, dict):
                          continue
                      for key in (
                          "volumeInstanceId",
                          "volume_instance_id",
                          "instanceId",
                          "id",
                      ):
                          value = nested.get(key)
                          if isinstance(value, str) and value and value not in candidate_ids:
                              candidate_ids.append(value)

          volume_probe_query = """
          query RecoveryVolumeInstance($id: String!) {
            volumeInstance(id: $id) {
              id
              createdAt
              deletedAt
              currentSizeMB
              sizeMB
              mountPath
              region
              state
              isPendingDeletion
              serviceId
              volume {
                name
              }
            }
          }
          """

          if volume_instance is None:
              for candidate in candidate_ids[:20]:
                  probe_data, probe_err = gql(
                      volume_probe_query,
                      {"id": candidate},
                  )
                  if probe_err:
                      continue
                  probe = (probe_data or {}).get("volumeInstance")
                  if (
                      isinstance(probe, dict)
                      and ((probe.get("volume") or {}).get("name") == TARGET_VOLUME)
                  ):
                      volume_instance = probe
                      volume = {"name": TARGET_VOLUME}
                      break

          backup_data = None
          backup_err = "not_attempted"
          schedule_data = None
          schedule_err = "not_attempted"

          if volume_instance and volume_instance.get("id"):
              backup_query = """
              query RecoveryBackups($volumeInstanceId: String!) {
                volumeInstanceBackupList(volumeInstanceId: $volumeInstanceId) {
                  createdAt
                  expiresAt
                  name
                  referencedMB
                  usedMB
                  volumeInstanceSizeMB
                }
              }
              """
              backup_data, backup_err = gql(
                  backup_query,
                  {"volumeInstanceId": volume_instance["id"]},
              )

              schedule_query = """
              query RecoveryBackupSchedules($volumeInstanceId: String!) {
                volumeInstanceBackupScheduleList(volumeInstanceId: $volumeInstanceId) {
                  createdAt
                  cron
                  kind
                  name
                  retentionSeconds
                }
              }
              """
              schedule_data, schedule_err = gql(
                  schedule_query,
                  {"volumeInstanceId": volume_instance["id"]},
              )

          deployments_query = """
          query RecoveryDeployments(
            $projectId: String!,
            $environmentId: String!,
            $after: String
          ) {
            deployments(
              first: 100,
              after: $after,
              input: {
                projectId: $projectId,
                environmentId: $environmentId,
                includeDeleted: true
              }
            ) {
              pageInfo {
                hasNextPage
                endCursor
              }
              edges {
                node {
                  createdAt
                  updatedAt
                  status
                  service {
                    name
                    createdAt
                    updatedAt
                    deletedAt
                  }
                }
              }
            }
          }
          """

          deployments = []
          deployments_pages = 0
          deployments_err = None
          after = None
          for _ in range(MAX_PAGES):
              page_data, page_err = gql(
                  deployments_query,
                  {
                      "projectId": project_id,
                      "environmentId": environment_id,
                      "after": after,
                  },
              )
              if page_err:
                  deployments_err = page_err
                  break
              conn = (page_data or {}).get("deployments") or {}
              deployments.extend(conn_nodes(conn))
              deployments_pages += 1
              has_next, end_cursor = page_state(conn)
              if not has_next or not end_cursor:
                  break
              after = end_cursor

          postgres_deployments = [
              d for d in deployments
              if ((d.get("service") or {}).get("name") == TARGET_SERVICE)
          ]
          postgres_deployments.sort(
              key=lambda x: x.get("createdAt") or "",
              reverse=True,
          )

          events_query = """
          query RecoveryEvents(
            $projectId: String!,
            $environmentId: String!,
            $after: String
          ) {
            events(
              first: 100,
              after: $after,
              projectId: $projectId,
              environmentId: $environmentId
            ) {
              pageInfo {
                hasNextPage
                endCursor
              }
              edges {
                node {
                  createdAt
                  action
                  object
                  severity
                  payload
                  activityPayload
                }
              }
            }
          }
          """

          events = []
          events_pages = 0
          events_err = None
          after = None
          for _ in range(MAX_PAGES):
              page_data, page_err = gql(
                  events_query,
                  {
                      "projectId": project_id,
                      "environmentId": environment_id,
                      "after": after,
                  },
              )
              if page_err:
                  events_err = page_err
                  break
              conn = (page_data or {}).get("events") or {}
              events.extend(conn_nodes(conn))
              events_pages += 1
              has_next, end_cursor = page_state(conn)
              if not has_next or not end_cursor:
                  break
              after = end_cursor

          candidate_events = []
          for e in events:
              action = str(e.get("action") or "")
              obj = str(e.get("object") or "")
              payload = e.get("payload")
              activity = e.get("activityPayload")
              target_match = (
                  recursive_contains(payload, TARGET_SERVICE)
                  or recursive_contains(payload, TARGET_VOLUME)
                  or recursive_contains(activity, TARGET_SERVICE)
                  or recursive_contains(activity, TARGET_VOLUME)
              )
              structural_delete = (
                  any(x in action.lower() for x in ("delete", "remove", "detach"))
                  and any(x in obj.lower() for x in ("service", "volume"))
              )
              if target_match or structural_delete:
                  candidate_events.append({
                      "createdAt": e.get("createdAt"),
                      "action": action,
                      "object": obj,
                      "severity": e.get("severity"),
                      "target_match": target_match,
                  })
          candidate_events.sort(
              key=lambda x: x.get("createdAt") or "",
              reverse=True,
          )

          audit_rows = []
          audit_pages = 0
          audit_err = "not_attempted"
          if workspace_id:
              audit_query = """
              query RecoveryAudit(
                $workspaceId: String!,
                $projectId: String!,
                $environmentId: String!,
                $after: String
              ) {
                auditLogs(
                  first: 100,
                  after: $after,
                  workspaceId: $workspaceId,
                  filter: {
                    projectId: $projectId,
                    environmentId: $environmentId,
                    startDate: "2026-08-27T00:00:00Z",
                    endDate: "2026-08-31T00:00:00Z"
                  }
                ) {
                  pageInfo {
                    hasNextPage
                    endCursor
                  }
                  edges {
                    node {
                      createdAt
                      eventType
                      payload
                      context
                    }
                  }
                }
              }
              """
              audit_err = None
              after = None
              for _ in range(MAX_PAGES):
                  page_data, page_err = gql(
                      audit_query,
                      {
                          "workspaceId": workspace_id,
                          "projectId": project_id,
                          "environmentId": environment_id,
                          "after": after,
                      },
                  )
                  if page_err:
                      audit_err = page_err
                      break
                  conn = (page_data or {}).get("auditLogs") or {}
                  audit_pages += 1
                  for a in conn_nodes(conn):
                      event_type = str(a.get("eventType") or "")
                      payload = a.get("payload")
                      context = a.get("context")
                      target_match = (
                          recursive_contains(payload, TARGET_SERVICE)
                          or recursive_contains(payload, TARGET_VOLUME)
                          or recursive_contains(context, TARGET_SERVICE)
                          or recursive_contains(context, TARGET_VOLUME)
                      )
                      structural = any(
                          x in event_type.lower()
                          for x in ("delete", "remove", "detach", "volume", "service")
                      )
                      if target_match or structural:
                          audit_rows.append({
                              "createdAt": a.get("createdAt"),
                              "eventType": event_type,
                              "target_match": target_match,
                          })
                  has_next, end_cursor = page_state(conn)
                  if not has_next or not end_cursor:
                      break
                  after = end_cursor

          audit_rows.sort(
              key=lambda x: x.get("createdAt") or "",
              reverse=True,
          )

          lines = [
              "## Railway recovery facts read-only",
              "",
              "No Railway setting, Variable, service, volume, backup, database, deployment, or file was modified.",
              "No token, ID, URL, credential, host, username, password, Variable value, raw CLI payload, raw event payload, or raw audit payload is published.",
              "",
              "### Current service / volume state",
              "",
              f"Project token nested query: {'OK' if not token_err else 'FAILED'}",
              f"Current named service \`postgres\` in project services: {'YES' if current_postgres else 'NO'}",
              f"Volume \`postgres-volume\` found via GraphQL/fallback: {'YES' if volume else 'NO'}",
              f"CLI metadata sees \`postgres-volume\`: {'YES' if cli_volume_visible else 'NO'}",
          ]

          if volume_instance:
              lines += [
                  f"Volume instance createdAt: {safe_scalar(volume_instance.get('createdAt'))}",
                  f"Volume instance deletedAt: {safe_scalar(volume_instance.get('deletedAt'))}",
                  f"Volume state: {safe_scalar(volume_instance.get('state'))}",
                  f"Volume pending deletion: {safe_scalar(volume_instance.get('isPendingDeletion'))}",
                  f"Volume region: {safe_scalar(volume_instance.get('region'))}",
                  f"Volume mount path: \`{safe_scalar(volume_instance.get('mountPath'))}\`",
                  f"Volume current size MB: {safe_scalar(volume_instance.get('currentSizeMB'))}",
                  f"Volume configured size MB: {safe_scalar(volume_instance.get('sizeMB'))}",
                  f"Volume serviceId present: {'YES' if volume_instance.get('serviceId') else 'NO'}",
              ]
          else:
              lines.append("Volume instance metadata: NOT RESOLVED")

          lines += [
              "",
              "### Backup metadata",
              "",
              f"Backup query: {'OK' if backup_err is None and backup_data is not None else 'FAILED'}",
          ]

          backups = []
          if isinstance(backup_data, dict):
              backups = backup_data.get("volumeInstanceBackupList") or []
          if backups:
              lines += [
                  "| Created | Name | Used MB | Referenced MB | Volume size MB | Expires |",
                  "|---|---|---:|---:|---:|---|",
              ]
              for b in sorted(
                  [x for x in backups if isinstance(x, dict)],
                  key=lambda x: x.get("createdAt") or "",
                  reverse=True,
              ):
                  lines.append(
                      "| "
                      + " | ".join([
                          safe_scalar(b.get("createdAt")),
                          safe_scalar(b.get("name")),
                          safe_scalar(b.get("usedMB")),
                          safe_scalar(b.get("referencedMB")),
                          safe_scalar(b.get("volumeInstanceSizeMB")),
                          safe_scalar(b.get("expiresAt")),
                      ])
                      + " |"
                  )
          else:
              lines.append("No backup rows returned.")

          schedules = []
          if isinstance(schedule_data, dict):
              schedules = schedule_data.get("volumeInstanceBackupScheduleList") or []
          lines += [
              "",
              f"Backup schedule query: {'OK' if schedule_err is None and schedule_data is not None else 'FAILED'}",
          ]
          if schedules:
              for s in schedules:
                  if not isinstance(s, dict):
                      continue
                  lines.append(
                      "- "
                      f"{safe_scalar(s.get('name'))}: "
                      f"kind={safe_scalar(s.get('kind'))}, "
                      f"cron=\`{safe_scalar(s.get('cron'))}\`, "
                      f"retentionSeconds={safe_scalar(s.get('retentionSeconds'))}, "
                      f"createdAt={safe_scalar(s.get('createdAt'))}"
                  )
          else:
              lines.append("No backup schedule rows returned.")

          lines += [
              "",
              "### Deleted-service / deployment evidence",
              "",
              f"Deployments paged query: {'OK' if not deployments_err else 'FAILED'}",
              f"Deployment pages scanned: {deployments_pages}",
              f"Deployments scanned: {len(deployments)}",
              f"Deployments resolved for service name \`postgres\`: {len(postgres_deployments)}",
          ]

          if postgres_deployments:
              lines += [
                  "| Deployment created | Updated | Status | Service created | Service deleted |",
                  "|---|---|---|---|---|",
              ]
              for d in postgres_deployments[:20]:
                  s = d.get("service") or {}
                  lines.append(
                      "| "
                      + " | ".join([
                          safe_scalar(d.get("createdAt")),
                          safe_scalar(d.get("updatedAt")),
                          safe_scalar(d.get("status")),
                          safe_scalar(s.get("createdAt")),
                          safe_scalar(s.get("deletedAt")),
                      ])
                      + " |"
                  )

          lines += [
              "",
              "### Target event evidence",
              "",
              f"Events paged query: {'OK' if not events_err else 'FAILED'}",
              f"Event pages scanned: {events_pages}",
              f"Events scanned: {len(events)}",
              f"Candidate service/volume events: {len(candidate_events)}",
          ]

          if candidate_events:
              lines += [
                  "| Created | Action | Object | Severity | Payload mentions postgres target |",
                  "|---|---|---|---|---|",
              ]
              for e in candidate_events[:30]:
                  lines.append(
                      "| "
                      + " | ".join([
                          safe_scalar(e.get("createdAt")),
                          safe_scalar(e.get("action")),
                          safe_scalar(e.get("object")),
                          safe_scalar(e.get("severity")),
                          "YES" if e.get("target_match") else "NO",
                      ])
                      + " |"
                  )

          lines += [
              "",
              "### Audit-log evidence",
              "",
              f"Audit query: {'OK' if audit_err is None else 'FAILED'}",
              f"Audit pages scanned: {audit_pages}",
              f"Candidate audit rows: {len(audit_rows)}",
          ]

          if audit_rows:
              lines += [
                  "| Created | Event type | Payload/context mentions postgres target |",
                  "|---|---|---|",
              ]
              for a in audit_rows[:30]:
                  lines.append(
                      "| "
                      + " | ".join([
                          safe_scalar(a.get("createdAt")),
                          safe_scalar(a.get("eventType")),
                          "YES" if a.get("target_match") else "NO",
                      ])
                      + " |"
                  )

          lines += [
              "",
              "Interpretation guard:",
              "- Empty event/audit results do not prove that no deletion occurred.",
              "- CLI metadata is used only as a read-only fallback to resolve the existing volume instance; raw IDs are never published.",
              "- This diagnostic does not mount, restore, recreate, delete, redeploy, or alter anything.",
              "- Postgres image/version is not inferred from these fields.",
          ]

          Path("railway-result-summary.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Print safe summary
        if: always()
        shell: bash
        run: |
          if [ -f railway-result-summary.md ]; then
            cat railway-result-summary.md
          fi

      - name: Remove raw metadata
        if: always()
        shell: bash
        run: |
          rm -f railway-status.json railway-volumes.json

      - name: Post result to control issue
        if: always() && github.event_name == 'issue_comment'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f railway-result-summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file railway-result-summary.md
          fi
