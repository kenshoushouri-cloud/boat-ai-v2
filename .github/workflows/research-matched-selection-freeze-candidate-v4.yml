name: Matched selection freeze candidate-v4

on:
  pull_request:
    paths:
      - "research/matched_contract_selection_freeze_pg.py"
      - "tests/test_matched_contract_selection_freeze_pg.py"
      - ".github/workflows/research-matched-selection-freeze-candidate-v4.yml"

permissions:
  contents: read
  actions: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
  REFERENCE_RUN_ID: "37182477262"
  REFERENCE_ARTIFACT: "opponent-ephemeral-20260901-0910-37182477262"
  REFERENCE_SHA256: "7c050718beede6f0efbb845bd5d2a7d22ce15d0eaf63e7e304f69b6c7a183bfd"

jobs:
  freeze:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest

      - name: Static safety tests
        run: |
          set -euo pipefail
          pytest -q tests/test_matched_contract_selection_freeze_pg.py
          python -m py_compile research/matched_contract_selection_freeze_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path(".github/workflows/research-matched-selection-freeze-candidate-v4.yml").read_text(encoding="utf-8").lower()
          assert "postgres-hobby-fullhistory-candidate-v4" in w
          assert "".join(("railway"," variable"," list")) not in w
          assert "".join(("list","_variables")) not in w
          assert "".join(("schedule", ":")) not in w
          print("MATCHED_SELECTION_STATIC=PASS")
          PY

      - name: Download frozen Opponent overlay
        uses: actions/download-artifact@v4
        with:
          name: ${{ env.REFERENCE_ARTIFACT }}
          path: opponent-artifact
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.REFERENCE_RUN_ID }}

      - name: Verify frozen Opponent artifact
        run: |
          set -euo pipefail
          f="opponent-artifact/historical-opponent-ephemeral-20260901-0910.json"
          actual="$(sha256sum "$f" | awk '{print $1}')"
          test "$actual" = "$REFERENCE_SHA256"
          echo "MATCHED_SELECTION_OPP_SHA256=$actual"

      - run: npm install --global @railway/cli

      - name: Freeze matched selection before outcomes
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on -c max_parallel_workers_per_gather=0"; export PYTHONPATH=.; exec python -u research/matched_contract_selection_freeze_pg.py --start-date 2025-07-01 --end-date 2026-09-30 --opponent-artifact opponent-artifact/historical-opponent-ephemeral-20260901-0910.json --output matched-contract-selection-freeze.json' \
            2>&1 | tee matched-contract-selection-freeze.txt
          grep -q '^MATCHED_SELECTION_OUTCOME_READ=0$' matched-contract-selection-freeze.txt
          grep -q '^MATCHED_SELECTION_ODDS_READ=0$' matched-contract-selection-freeze.txt
          grep -q '^MATCHED_SELECTION_DB_WRITE=0$' matched-contract-selection-freeze.txt
          grep -q '^MATCHED_SELECTION_RESULT=PASS_FROZEN_PRE_OUTCOME$' matched-contract-selection-freeze.txt

      - name: Upload frozen selection
        uses: actions/upload-artifact@v4
        with:
          name: matched-selection-freeze-${{ github.run_id }}
          path: |
            matched-contract-selection-freeze.json
            matched-contract-selection-freeze.txt
          retention-days: 14
          if-no-files-found: error
