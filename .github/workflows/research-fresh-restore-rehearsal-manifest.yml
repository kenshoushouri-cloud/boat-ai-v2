name: Research fresh restore rehearsal manifest contract

on:
  pull_request:
    paths:
      - 'research/fresh_restore_rehearsal_manifest.py'
      - 'tests/test_fresh_restore_rehearsal_manifest.py'
      - 'docs/V4_FRESH_RESTORE_REHEARSAL_MANIFEST_CONTRACT_20260921.md'
      - '.github/workflows/research-fresh-restore-rehearsal-manifest.yml'

permissions:
  contents: read

jobs:
  pure-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Compile and test pure rehearsal gate
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile research/fresh_restore_rehearsal_manifest.py tests/test_fresh_restore_rehearsal_manifest.py
          pytest -q tests/test_fresh_restore_rehearsal_manifest.py
