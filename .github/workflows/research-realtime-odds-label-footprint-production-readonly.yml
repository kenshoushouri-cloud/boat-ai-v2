name: Research realtime odds label footprint production read-only

on:
  pull_request:
    paths:
      - 'research_realtime_odds_label_footprint_pg.py'
      - '.github/workflows/research-realtime-odds-label-footprint-production-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-readonly-label-footprint:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000 -c temp_file_limit=65536 -c timezone=UTC
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only audit dependencies
        run: |
          python -m pip install --disable-pip-version-check -q psycopg[binary]
          npm install -g @railway/cli >/dev/null 2>&1

      - name: Resolve Production public database URL without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          railway variable list \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), dict):
                  value = data['variables'].get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), list):
                  for item in data['variables']:
                      if isinstance(item, dict) and item.get('name') == 'DATABASE_PUBLIC_URL':
                          value = item.get('value')
                          break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL unavailable')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
          rm -f railway-vars.json

      - name: Audit realtime odds labels only
        shell: bash
        run: |
          set -euo pipefail
          python -u research_realtime_odds_label_footprint_pg.py > realtime-odds-label-footprint.txt
          grep -E '^(REALTIME_ODDS_LABEL_FOOTPRINT=|label=|REALTIME_ODDS_TOTAL)' realtime-odds-label-footprint.txt > realtime-odds-label-footprint-sanitized.txt
          test -s realtime-odds-label-footprint-sanitized.txt
          cat realtime-odds-label-footprint-sanitized.txt
          {
            echo '## Realtime odds label footprint — Production read-only'
            echo
            echo '```text'
            cat realtime-odds-label-footprint-sanitized.txt
            echo '```'
            echo
            echo 'No row export, DB mutation, or retention change was performed.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove local audit outputs
        if: always()
        shell: bash
        run: |
          rm -f railway-vars.json realtime-odds-label-footprint.txt realtime-odds-label-footprint-sanitized.txt
