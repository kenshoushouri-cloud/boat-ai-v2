name: Value Bao Post-Exhibition Count Only

on:
  pull_request:
    paths:
      - '.github/workflows/value-bao-post-exhibition-count-only.yml'
      - '.github/scripts/value_bao_post_exhibition_count_only_pg.py'
      - '.github/scripts/value_bao_post_exhibition_market_residual_pg.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate outcome-blind read-only audit
        run: |
          python -m py_compile .github/scripts/value_bao_post_exhibition_count_only_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('.github/scripts/value_bao_post_exhibition_count_only_pg.py').read_text(encoding='utf-8').lower()
          assert 'set transaction read only' in p
          assert 'v2_results' not in p
          assert 'trifecta_payout' not in p
          assert 'return_yen' not in p
          for token in ('delete from','insert into','update v2_','alter table','drop table','truncate ','vacuum ','create table','create index'):
              assert token not in p, token
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run outcome-blind Bao density audit
        run: |
          python -u .github/scripts/value_bao_post_exhibition_count_only_pg.py | tee value-bao-post-exhibition-count-only.txt
          grep -q '^VALUE_BAO_COUNT_RESULTS_READ=0$' value-bao-post-exhibition-count-only.txt
          grep -q '^VALUE_BAO_COUNT_RESULT=PASS_READ_ONLY$' value-bao-post-exhibition-count-only.txt
      - name: Upload research artifact
        uses: actions/upload-artifact@v4
        with:
          name: value-bao-post-exhibition-count-only-${{ github.run_id }}
          path: |
            value-bao-post-exhibition-count-only.json
            value-bao-post-exhibition-count-only.txt
          retention-days: 30
          if-no-files-found: error
