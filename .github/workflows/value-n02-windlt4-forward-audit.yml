name: Value N02 WindLT4 Forward Audit

on:
  pull_request:
    paths:
      - '.github/workflows/value-n02-windlt4-forward-audit.yml'
      - 'report_n02_windlt4_variants_forward_pg.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=120000
  N02_VARIANT_FORWARD_START_DATE: '2026-08-19'
  TARGET_DATE: '2026-09-12'

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only report
        run: |
          python -m py_compile report_n02_windlt4_variants_forward_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('report_n02_windlt4_variants_forward_pg.py').read_text(encoding='utf-8').lower()
          assert 'from db_pg import fetch_all' in p
          for token in ('execute(', 'upsert', 'insert into', 'delete from', 'update v2_', 'alter table', 'drop table', 'truncate ', 'vacuum ', 'send_line'):
              assert token not in p, token
          PY
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load database URL
        run: |
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text())
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a') as fh: fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run existing Forward comparison
        run: |
          python -u report_n02_windlt4_variants_forward_pg.py | tee n02-windlt4-forward.txt
          grep -q '^RESULT=PASS$' n02-windlt4-forward.txt
      - name: Upload aggregate report
        uses: actions/upload-artifact@v4
        with:
          name: n02-windlt4-forward-${{ github.run_id }}
          path: n02-windlt4-forward.txt
          retention-days: 30
          if-no-files-found: error
