name: Railway historical weather month audit

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/railway-historical-weather-month-audit.yml"
      - ".github/scripts/historical_weather_month_audit.py"
      - ".github/scripts/historical_weather_july_gap_http_probe.py"
      - ".github/scripts/historical_weather_july_month_repair.py"
      - ".github/scripts/historical_weather_one_day_pilot.py"
  pull_request:
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - ".github/workflows/railway-historical-weather-month-audit.yml"
      - ".github/scripts/historical_weather_month_audit.py"
      - ".github/scripts/historical_weather_july_gap_http_probe.py"
      - ".github/scripts/historical_weather_july_month_repair.py"
      - ".github/scripts/historical_weather_one_day_pilot.py"
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  month-audit:
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'pull_request' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway historical-weather-month-audit-jul25'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load public database URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (
                      item.get('name') == 'DATABASE_PUBLIC_URL'
                      or item.get('key') == 'DATABASE_PUBLIC_URL'
                  ):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Run fixed July 2025 stored-raw month audit
        id: audit
        shell: bash
        run: |
          set +e
          python -u .github/scripts/historical_weather_month_audit.py > month-audit-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Audit guarded partial-month repair projection
        id: repair_audit
        shell: bash
        env:
          HISTORICAL_MONTH_MODE: audit
        run: |
          set +e
          python -u .github/scripts/historical_weather_july_month_repair.py > repair-audit-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized month audit summary
        if: always()
        shell: bash
        env:
          AUDIT_EXIT_CODE: ${{ steps.audit.outputs.exit_code }}
          REPAIR_AUDIT_EXIT_CODE: ${{ steps.repair_audit.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          texts = []
          for name in ('month-audit-output.txt', 'repair-audit-output.txt'):
              path = Path(name)
              if path.exists():
                  texts.append(path.read_text(encoding='utf-8', errors='replace'))
          text = '\n'.join(texts)
          prefixes = (
              'MONTH_AUDIT_', 'MONTH_REPAIR_', 'EXPECTED_', 'HIST_', 'RAW_', 'PARSE_',
              'PRE_', 'REPARSED_', 'FAILED_', 'SOURCE_', 'AMBIGUOUS_', 'SANITY_',
              'REPAIR_', 'EXISTING_', 'PROJECTED_', 'RESULT=',
          )
          keep = [line[:800] for line in text.splitlines() if line.startswith(prefixes)]
          audit_code = os.environ.get('AUDIT_EXIT_CODE', '?')
          repair_code = os.environ.get('REPAIR_AUDIT_EXIT_CODE', '?')
          lines = [
              '## Historical weather July 2025 full-month audit',
              '',
              '**Fixed target: 2025-07 / snapshot_label=historical**',
              '',
              '```text',
              *keep[:220],
              '```',
              '',
              f'Stored-raw audit exit code: `{audit_code}`',
              f'Partial-month repair projection exit code: `{repair_code}`',
              '',
              'Read-only: database SELECT + stored historical raw-text parse only. The repair '
              'projection does not write. Confirmed source gaps are rechecked against official '
              'historical pages immediately before any explicit month write, not during normal PR '
              'CI. No database rows, Railway settings, predictions, or LINE behavior were changed.',
          ]
          Path('month-audit-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Remove raw temporary files
        if: always()
        shell: bash
        run: |
          rm -f railway-vars.json railway-vars-error.txt month-audit-output.txt repair-audit-output.txt

      - name: Post sanitized result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file month-audit-summary.md

      - name: Fail workflow if an audit gate failed
        if: >-
          steps.audit.outputs.exit_code != '0' ||
          steps.repair_audit.outputs.exit_code != '0'
        shell: bash
        run: exit 1

  month-repair-write:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-weather-month-write-jul25'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout main only
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli

      - name: Load public database URL without publishing it
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${RAILWAY_TOKEN:-}" ]; then
            echo "RAILWAY_TOKEN is not configured."
            exit 1
          fi
          railway variable list --service postgres --environment production --json > railway-vars.json 2> railway-vars-error.txt
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
          elif isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (
                      item.get('name') == 'DATABASE_PUBLIC_URL'
                      or item.get('key') == 'DATABASE_PUBLIC_URL'
                  ):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL was not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY

      - name: Revalidate stored-raw repair projection immediately before write
        id: preaudit
        shell: bash
        env:
          HISTORICAL_MONTH_MODE: audit
        run: |
          set +e
          python -u .github/scripts/historical_weather_july_month_repair.py > prewrite-audit-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Recheck confirmed source gaps against official historical pages
        id: gap_probe
        if: steps.preaudit.outputs.exit_code == '0'
        shell: bash
        run: |
          set +e
          python -u .github/scripts/historical_weather_july_gap_http_probe.py > gap-probe-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Write only safe historical NULL weather cells
        id: write
        if: >-
          steps.preaudit.outputs.exit_code == '0' &&
          steps.gap_probe.outputs.exit_code == '0'
        shell: bash
        env:
          HISTORICAL_MONTH_MODE: write
          CONFIRM_HISTORICAL_MONTH_WRITE: WRITE_2025_07_HISTORICAL_WEATHER_NULLS_ONLY
        run: |
          set +e
          python -u .github/scripts/historical_weather_july_month_repair.py > month-write-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Build sanitized write summary
        if: always()
        shell: bash
        env:
          PREAUDIT_EXIT_CODE: ${{ steps.preaudit.outputs.exit_code }}
          GAP_EXIT_CODE: ${{ steps.gap_probe.outputs.exit_code }}
          WRITE_EXIT_CODE: ${{ steps.write.outputs.exit_code }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          texts = []
          for name in ('prewrite-audit-output.txt', 'gap-probe-output.txt', 'month-write-output.txt'):
              path = Path(name)
              if path.exists():
                  texts.append(path.read_text(encoding='utf-8', errors='replace'))
          text = '\n'.join(texts)
          prefixes = (
              'MONTH_REPAIR_', 'EXPECTED_', 'PRE_', 'PARSE_', 'SOURCE_', 'GAP_',
              'AMBIGUOUS_', 'SANITY_', 'REPAIR_', 'EXISTING_', 'PROJECTED_',
              'WRITE_', 'POST_', 'RESULT=',
          )
          keep = [line[:800] for line in text.splitlines() if line.startswith(prefixes)]
          lines = [
              '## Historical weather July 2025 guarded partial-month repair',
              '',
              '**Fixed target: 2025-07 / snapshot_label=historical**',
              '',
              '```text',
              *keep[:220],
              '```',
              '',
              f'Prewrite audit exit code: `{os.environ.get("PREAUDIT_EXIT_CODE", "?")}`',
              f'Official source-gap recheck exit code: `{os.environ.get("GAP_EXIT_CODE", "?")}`',
              f'Write exit code: `{os.environ.get("WRITE_EXIT_CODE", "?")}`',
              '',
              'Write scope: existing historical rows only; temperature_c and '
              'water_temperature_c NULL cells only; values come only from stored official raw '
              'text. Confirmed source-gap races remain NULL. Exhibition/course/ST/tilt, '
              'nonhistorical snapshots, Production/Shadow decisions, Railway settings and LINE '
              'are not touched.',
          ]
          Path('month-write-summary.md').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Remove raw temporary files
        if: always()
        shell: bash
        run: |
          rm -f railway-vars.json railway-vars-error.txt prewrite-audit-output.txt gap-probe-output.txt month-write-output.txt

      - name: Post sanitized result to control issue
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment "$RAILWAY_BRIDGE_ISSUE" --body-file month-write-summary.md

      - name: Fail workflow if any write gate failed
        if: >-
          steps.preaudit.outputs.exit_code != '0' ||
          steps.gap_probe.outputs.exit_code != '0' ||
          steps.write.outputs.exit_code != '0'
        shell: bash
        run: exit 1
