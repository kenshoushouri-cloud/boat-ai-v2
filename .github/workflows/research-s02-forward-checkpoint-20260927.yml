name: Research S02 Frozen Forward Checkpoint 20260927
on:
  pull_request:
    paths:
      - '.github/scripts/value_s02_forward_timing_safe_checkpoint_pg.py'
      - '.github/workflows/research-s02-forward-checkpoint-20260927.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Verify read-only
        run: |
          set -euo pipefail
          grep -q 'set transaction read only' .github/scripts/value_s02_forward_timing_safe_checkpoint_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-s02-forward-checkpoint-20260927.yml').read_text(encoding='utf-8').lower()
          assert ''.join(('railway',' variable',' list')) not in w
          assert 'railway run' in w
          PY
      - run: npm install --global @railway/cli
      - name: Run strict S02 Forward checkpoint
        run: |
          set -euo pipefail
          railway run --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u .github/scripts/value_s02_forward_timing_safe_checkpoint_pg.py' \
            2>&1 | tee s02-forward-checkpoint.txt
          grep -q '^S02_FORWARD_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0$' s02-forward-checkpoint.txt
          grep -q '^S02_FORWARD_PROMOTION_ALLOWED=0$' s02-forward-checkpoint.txt
          grep -q '^S02_FORWARD_RESULT=PASS_READ_ONLY$' s02-forward-checkpoint.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s02-forward-checkpoint-${{ github.run_id }}
          path: |
            s02-forward-timing-safe-checkpoint.json
            s02-forward-checkpoint.txt
          retention-days: 90
          if-no-files-found: error
