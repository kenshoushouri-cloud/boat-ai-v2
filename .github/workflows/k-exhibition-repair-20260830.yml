name: Fixed K exhibition repair 2026-08-30

on:
  pull_request:
    paths:
      - '.github/workflows/k-exhibition-repair-20260830.yml'
      - 'repair_k_exhibition_20260830_pg.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed repair gates
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          wf=Path('.github/workflows/k-exhibition-repair-20260830.yml').read_text(encoding='utf-8')
          py=Path('repair_k_exhibition_20260830_pg.py').read_text(encoding='utf-8')
          assert "/railway outage-k-exhibition-repair-20260830 CONFIRM" in wf
          assert "github.actor == github.repository_owner" in wf
          assert "github.event.issue.number == 42" in wf
          assert "TARGET_DATE = \"2026-08-30\"" in py
          for rid in ("20260830_05_08","20260830_05_10","20260830_19_10","20260830_23_11"):
              assert rid in py
          assert "EXPECTED_RECOVERABLE_ROWS = 20" in py
          trigger=wf.split('permissions:',1)[0]
          assert 'schedule:' not in trigger
          assert 'workflow_dispatch:' not in trigger
          low=py.lower()
          for forbidden in ("v2_odds_trifecta", "line_notifier", "run_final_pg", "run_pre_window"):
              assert forbidden not in low, forbidden
          print("K_EXH_REPAIR_VALIDATE=PASS")
          PY
      - name: Python syntax
        run: python -m py_compile repair_k_exhibition_20260830_pg.py

  pr_plan:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load DB URL
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run read-only repair plan
        run: K_EXH_REPAIR_MODE=plan python -u repair_k_exhibition_20260830_pg.py | tee output.txt
      - name: Compact plan
        run: grep '^K_EXH_REPAIR_' output.txt | tail -100 || true
      - name: Cleanup
        if: always()
        run: rm -f railway-vars.json output.txt

  repair:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway outage-k-exhibition-repair-20260830 CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load DB URL
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run fixed K-source repair
        id: run
        shell: bash
        run: |
          set +e
          K_EXH_REPAIR_MODE=repair python -u repair_k_exhibition_20260830_pg.py > output.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarize
        if: always()
        run: |
          {
            echo "## Fixed K exhibition repair 2026-08-30"
            echo
            echo "Historical exhibition only; four fixed K0 races. No odds/LINE/model/Shadow/Forward changes."
            echo
            echo '~~~text'
            grep '^K_EXH_REPAIR_' output.txt | tail -100 || true
            echo '~~~'
          } > summary.md
      - name: Cleanup
        if: always()
        run: rm -f railway-vars.json output.txt
      - name: Post
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Fail if repair failed
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
