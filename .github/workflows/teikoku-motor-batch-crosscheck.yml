name: Teikoku motor batch cross-check

on:
  pull_request:
    paths:
      - "research/teikoku_motor_batch_crosscheck_pg.py"
      - "tests/test_teikoku_motor_batch_crosscheck_pg.py"
      - ".github/workflows/teikoku-motor-batch-crosscheck.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-recovery"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - name: Pure tests and static safety
        run: |
          pytest -q tests/test_teikoku_motor_batch_crosscheck_pg.py
          python -m py_compile research/teikoku_motor_batch_crosscheck_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path("research/teikoku_motor_batch_crosscheck_pg.py").read_text(encoding="utf-8").lower()
          assert "set transaction read only" in p
          assert "min_access_interval_sec = 3.1" in p
          assert "stadium/mdetail/" in p
          assert '"db_write": false' in p
          assert '"future_rows_used": false' in p
          assert '"present_aggregate_used_as_historical_value": false' in p
          assert "insert into" not in p
          assert "update v2_" not in p
          assert "delete from" not in p
          print("PASS Teikoku batch safety")
          PY

  batch:
    concurrency:
      group: teikoku-read-only-crosscheck
      cancel-in-progress: false
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway teikoku-motor-batch ')
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Parse command
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          import os
          from datetime import date
          p=os.environ["COMMENT_BODY"].strip().split()
          if len(p) not in (3,4) or p[1]!="teikoku-motor-batch":
              raise SystemExit("command: /railway teikoku-motor-batch YYYY-MM-DD [1..24]")
          d=date.fromisoformat(p[2])
          if d < date(2025,7,1):
              raise SystemExit("approved historical start is 2025-07-01")
          limit=int(p[3]) if len(p)==4 else 12
          if not 1 <= limit <= 24:
              raise SystemExit("limit must be 1..24")
          print("TARGET_DATE="+d.isoformat())
          print("MOTOR_LIMIT="+str(limit))
          PY

      - name: Run read-only supplemental cross-check
        id: live_batch
        continue-on-error: true
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; exec python -u research/teikoku_motor_batch_crosscheck_pg.py --target-date "${TARGET_DATE}" --limit "${MOTOR_LIMIT}"' \
            2>&1 | tee teikoku-motor-batch-crosscheck.txt

      - name: Require successful batch contract
        if: always()
        run: |
          set -euo pipefail
          echo "TEIKOKU_LIVE_BATCH_OUTCOME=${{ steps.live_batch.outcome }}"
          test -f teikoku-motor-batch-crosscheck.txt
          grep -q '^TEIKOKU_MOTOR_BATCH_DB_WRITE=0 PROD_CHANGE=0 PURCHASE=0$' teikoku-motor-batch-crosscheck.txt
          grep -q '^TEIKOKU_MOTOR_BATCH_RESULT=PASS_READ_ONLY_CROSSCHECK$' teikoku-motor-batch-crosscheck.txt
          test "${{ steps.live_batch.outcome }}" = "success"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: teikoku-motor-batch-crosscheck-${{ github.run_id }}
          path: |
            teikoku-motor-batch-crosscheck.json
            teikoku-motor-batch-crosscheck.txt
          retention-days: 30
          if-no-files-found: warn

      - name: Comment sanitized summary
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "艇国 motor batch cross-check: ${TARGET_DATE}"
            echo
            if [ -f teikoku-motor-batch-crosscheck.txt ]; then
              grep -E '^(TEIKOKU_MOTOR_BATCH_SUMMARY=|TEIKOKU_MOTOR_BATCH_DB_WRITE=|TEIKOKU_MOTOR_BATCH_RESULT=)' teikoku-motor-batch-crosscheck.txt || true
              if ! grep -q '^TEIKOKU_MOTOR_BATCH_RESULT=' teikoku-motor-batch-crosscheck.txt; then
                echo "Diagnostic tail:"
                tail -n 20 teikoku-motor-batch-crosscheck.txt || true
              fi
            else
              echo "Diagnostic log missing."
            fi
            echo
            echo "READ ONLY; supplemental; >=3s access interval; present aggregate is not used as a historical value."
          } > reply.txt
          gh issue comment 42 --repo "${GITHUB_REPOSITORY}" --body-file reply.txt
