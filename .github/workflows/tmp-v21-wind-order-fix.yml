name: Temporary v21 wind order fix

on:
  push:
    branches:
      - fix/v21-wind-direction-order-20260821

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch
        uses: actions/checkout@v4
        with:
          ref: fix/v21-wind-direction-order-20260821
          fetch-depth: 0

      - name: Reorder wind direction alternatives
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('v21_realtime_collector_pg.py')
          text = path.read_text(encoding='utf-8')
          old = 'm=re.search(r"(北|北東|東|南東|南|南西|西|北西|向い風|追い風|右横風|左横風)",text)'
          new = 'm=re.search(r"(北東|南東|南西|北西|向い風|追い風|右横風|左横風|北|東|南|西)",text)'
          if old not in text:
              raise SystemExit('Expected wind regex not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Compile v21
        run: python -m py_compile v21_realtime_collector_pg.py

      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- v21_realtime_collector_pg.py
          git commit -m "fix: prefer compound wind directions"
          git push origin HEAD:fix/v21-wind-direction-order-20260821
