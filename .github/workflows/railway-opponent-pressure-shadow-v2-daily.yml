name: Opponent pressure Shadow v2 validation

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/workflows/railway-opponent-pressure-shadow-v2-daily.yml'
      - '.github/scripts/opponent_pressure_shadow_v2_compact.py'
      - '.github/scripts/test_opponent_pressure_timing_guard.py'

permissions:
  contents: read

concurrency:
  group: opponent-pressure-v2-validation
  cancel-in-progress: true

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Timing guard unit tests
        run: python .github/scripts/test_opponent_pressure_timing_guard.py -v
      - name: Resolve fixed validation date
        run: |
          echo 'TARGET_DATE=2026-08-22' >> "$GITHUB_ENV"
          echo 'OPP_PRESSURE_DAILY_TARGET_DATE=2026-08-22'
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Preflight complete race cards
        run: |
          python - <<'PY'
          import os, psycopg
          from psycopg.rows import dict_row
          target=os.environ['TARGET_DATE']
          with psycopg.connect(os.environ['DATABASE_URL'],row_factory=dict_row) as conn:
              with conn.cursor() as cur:
                  cur.execute("""
                    with cards as (
                      select r.race_id,
                             count(e.*) filter(where e.lane between 1 and 6 and e.racer_class between 1 and 4) valid_entries,
                             count(distinct e.lane) filter(where e.lane between 1 and 6 and e.racer_class between 1 and 4) valid_lanes
                      from v2_races r
                      left join v2_race_entries e on e.race_id=r.race_id
                      where r.race_date=%s
                      group by r.race_id
                    )
                    select count(*) total_races,
                           count(*) filter(where valid_entries=6 and valid_lanes=6) complete_races,
                           coalesce(sum(valid_entries),0) valid_entries
                    from cards
                  """,(target,))
                  r=cur.fetchone()
          total=int(r['total_races'] or 0); complete=int(r['complete_races'] or 0); entries=int(r['valid_entries'] or 0)
          print(f'OPP_PRESSURE_DAILY_PREFLIGHT=total:{total} complete:{complete} entries:{entries}')
          if total <= 0 or complete != total or entries != total*6:
              raise SystemExit('target race cards are not complete')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'EXPECTED_RACES={total}\n')
          PY
      - name: Read-only score preflight
        id: preflight
        env:
          OPPONENT_PRESSURE_V2_ENABLED: '1'
          OPPONENT_PRESSURE_V2_DRY_RUN: '1'
        run: |
          set +e
          python -u .github/scripts/opponent_pressure_shadow_v2_compact.py > pressure-v2-preflight.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Validate score preflight
        run: |
          python - <<'PY'
          import os,re
          from pathlib import Path
          text=Path('pressure-v2-preflight.txt').read_text(encoding='utf-8',errors='replace') if Path('pressure-v2-preflight.txt').exists() else ''
          for line in text.splitlines():
              if line.startswith('OPP_PRESSURE_V2_'):
                  print(line[:1000])
          if '${{ steps.preflight.outputs.exit_code }}' != '0':
              raise SystemExit('score preflight failed')
          m=re.search(r'OPP_PRESSURE_V2_EFFECT_CELLS=(\d+) TARGET_RACES=(\d+) PAYLOADS=(\d+) COMPLETE=(\d+)',text)
          if not m:
              raise SystemExit('score preflight summary missing')
          _,target,payloads,complete=map(int,m.groups())
          expected=int(os.environ['EXPECTED_RACES'])
          if target != expected or payloads != expected or complete != expected:
              raise SystemExit(f'incomplete score preflight target={target} payloads={payloads} complete={complete} expected={expected}')
          if 'OPP_PRESSURE_V2_RESULT=PASS_DRY_RUN' not in text:
              raise SystemExit('dry-run PASS marker missing')
          print('OPP_PRESSURE_DAILY_RESULT=PASS_READ_ONLY_PR')
          PY
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json pressure-v2-preflight.txt
