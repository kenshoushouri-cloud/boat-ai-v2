name: Railway Postgres recovery Stage 2

on:
  pull_request:
    paths:
      - '.github/workflows/railway-postgres-recovery-stage2.yml'
      - '.github/scripts/postgres_recovery_stage2.py'
      - '.github/scripts/postgres_recovery_stage1.py'
  push:
    branches:
      - main
    paths:
      - '.github/workflows/railway-postgres-recovery-stage2.yml'
      - '.github/scripts/postgres_recovery_stage2.py'
      - '.github/scripts/postgres_recovery_stage1.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  validate:
    if: github.event_name == 'pull_request' || github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Stage 2 safety gates
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/postgres_recovery_stage2.py
          python - <<'PY'
          from pathlib import Path

          workflow = Path('.github/workflows/railway-postgres-recovery-stage2.yml').read_text(encoding='utf-8')
          script = Path('.github/scripts/postgres_recovery_stage2.py').read_text(encoding='utf-8')

          assert "/railway postgres-recovery-stage2 CONFIRM" in workflow
          assert "github.actor == github.repository_owner" in workflow
          assert "github.event.issue.number == 42" in workflow

          trigger = workflow.split("permissions:", 1)[0]
          assert "schedule:" not in trigger
          assert "workflow_dispatch:" not in trigger

          assert 'STAGING_SERVICE = "postgres-recovery"' in script
          assert 'TARGET_SERVICE = "postgres"' in script
          assert "serviceUpdate" in script
          assert '{"name": TARGET_SERVICE}' in script
          assert "tcpProxyCreate" in script
          assert '"name": "DATABASE_PUBLIC_URL"' in script
          assert '"skipDeploys": True' in script
          assert "run_db_integrity_audit" in script

          for forbidden in (
              "volumeInstanceUpdate",
              "volumeDelete",
              "serviceDelete",
              "volumeInstanceBackupCreate",
              "volumeInstanceBackupRestore",
              "volumeInstancePITRRestore",
              "serviceInstanceRedeploy",
          ):
              assert forbidden not in script

          main = script.split("def main() -> int:", 1)[1]
          assert main.index("run_db_integrity_audit") < main.index("rename_service(")
          assert "if proxy_id and not renamed" in main
          print("POSTGRES_RECOVERY_STAGE2_VALIDATE=PASS")
          PY

  promote:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway postgres-recovery-stage2 CONFIRM'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Postgres client dependency
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check psycopg2-binary

      - name: Require Railway token
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"

      - name: Execute guarded Stage 2 promotion
        id: promotion
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python -u .github/scripts/postgres_recovery_stage2.py

      - name: Post sanitized Stage 2 result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f stage2-result.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file stage2-result.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "## Railway Postgres recovery Stage 2

STAGE2_BLOCK_MANUAL_REVIEW_REQUIRED

No sanitized result file was produced."
          fi

      - name: Fail workflow when Stage 2 failed
        if: steps.promotion.outcome != 'success'
        shell: bash
        run: exit 1
