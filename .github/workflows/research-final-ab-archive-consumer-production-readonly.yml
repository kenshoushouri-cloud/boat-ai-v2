name: Research final_ab archive consumer production read-only

on:
  pull_request:
    paths:
      - 'analyze_final_ab_features_pg.py'
      - 'research_archive_export_pg.py'
      - 'research_archive_readthrough.py'
      - '.github/workflows/research-final-ab-archive-consumer-production-readonly.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  july-final-ab-archive-consumer:
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      PGOPTIONS: -c default_transaction_read_only=on -c statement_timeout=180000 -c temp_file_limit=131072 -c timezone=UTC
      ARCHIVE_TABLE: v2_realtime_odds_snapshots
      ARCHIVE_START_DATE: '2026-07-01'
      ARCHIVE_END_DATE: '2026-07-31'
      ARCHIVE_LABEL: final_ab
      ARCHIVE_MIN_AGE_DAYS: '30'
      ARCHIVE_MAX_DAYS: '31'
      ARCHIVE_OUTPUT_DIR: /tmp/boat-final-ab-archive-pilot
      ANALYZE_START_DATE: '2026-07-01'
      ANALYZE_END_DATE: '2026-07-31'
      SNAPSHOT_LABEL: final_ab
      ANALYZE_ODDS_ARCHIVE_COMPARE_ONLINE: '1'
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install read-only pilot dependencies
        run: |
          python -m pip install --disable-pip-version-check -q psycopg[binary]
          npm install -g @railway/cli >/dev/null 2>&1

      - name: Resolve Production public database URL without publishing secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RAILWAY_TOKEN:-}"
          railway variable list \
            --project 268a5b17-0712-440a-884d-27f7fa887a2d \
            --service postgres-recovery \
            --environment production \
            --json > railway-vars.json
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = None
          if isinstance(data, dict):
              value = data.get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), dict):
                  value = data['variables'].get('DATABASE_PUBLIC_URL')
              if value is None and isinstance(data.get('variables'), list):
                  for item in data['variables']:
                      if isinstance(item, dict) and item.get('name') == 'DATABASE_PUBLIC_URL':
                          value = item.get('value')
                          break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL unavailable')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
          rm -f railway-vars.json

      - name: Export July final_ab odds ephemerally and run archived consumer
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$ARCHIVE_OUTPUT_DIR"
          mkdir -p "$ARCHIVE_OUTPUT_DIR"
          python -u research_archive_export_pg.py > archive-export.log
          grep -q '^RESEARCH_ARCHIVE_EXPORT=PASS_READ_ONLY$' archive-export.log
          manifest="$(find "$ARCHIVE_OUTPUT_DIR" -maxdepth 1 -type f -name '*.manifest.json' -print -quit)"
          test -n "$manifest"
          export ANALYZE_ODDS_ARCHIVE_MANIFEST="$manifest"
          python -u analyze_final_ab_features_pg.py > final-ab-archive-analysis.log
          grep -q '^odds_source=archive ' final-ab-archive-analysis.log
          grep -q '^odds_archive_equivalence=PASS ' final-ab-archive-analysis.log
          grep -q '^=== final_ab feature analysis finished ===$' final-ab-archive-analysis.log
          python - "$manifest" <<'PY'
          import json, sys
          from pathlib import Path
          m=json.loads(Path(sys.argv[1]).read_text(encoding='utf-8'))
          assert m['table']=='v2_realtime_odds_snapshots'
          assert m['label']=='final_ab'
          assert m['start_date']=='2026-07-01' and m['end_date']=='2026-07-31'
          assert m['source_mode']=='postgresql_read_only'
          assert m['source_rows_deleted'] is False and m['readback_verified'] is True
          assert m['logical_key_duplicate_count']==0
          print(f"FINAL_AB_ARCHIVE_ROWS={m['row_count']}")
          print(f"FINAL_AB_ARCHIVE_FILE_BYTES={m['archive_file_bytes']}")
          print(f"FINAL_AB_ARCHIVE_PAYLOAD_SHA256={m['canonical_payload_sha256']}")
          print(f"FINAL_AB_ARCHIVE_FILE_SHA256={m['archive_file_sha256']}")
          PY
          grep -E '^(odds_source=archive |odds_archive_equivalence=PASS |loaded results=|joined_base_races=|full_6_lane_exhibition=|=== final_ab feature analysis finished ===$)' final-ab-archive-analysis.log > final-ab-sanitized.txt
          {
            echo '## July final_ab archive-backed consumer — Production read-only'
            echo
            echo '```text'
            cat final-ab-sanitized.txt
            echo '```'
            echo
            echo 'Archive files were ephemeral and were not uploaded as artifacts. No source rows were changed or deleted.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove all local Production-derived pilot files
        if: always()
        shell: bash
        run: |
          rm -rf /tmp/boat-final-ab-archive-pilot
          rm -f railway-vars.json archive-export.log final-ab-archive-analysis.log final-ab-sanitized.txt
