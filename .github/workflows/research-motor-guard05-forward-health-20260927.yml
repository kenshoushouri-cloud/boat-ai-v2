name: Research Motor Guard05 Forward Health 20260927
on:
  pull_request:
    paths:
      - '.github/workflows/research-motor-guard05-forward-health-20260927.yml'
permissions:
  contents: read
jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      TARGET_DATE: '2026-09-27'
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install -r requirements.txt
      - name: Verify report has no mutation surface
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          t=Path('report_motor_guard05_forward_health_pg.py').read_text(encoding='utf-8').lower()
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line'):
              assert token not in t, token
          w=Path('.github/workflows/research-motor-guard05-forward-health-20260927.yml').read_text(encoding='utf-8').lower()
          assert ''.join(('railway',' variable',' list')) not in w
          assert 'railway run' in w
          PY
      - run: npm install --global @railway/cli
      - name: Run Guard05 read-only health
        run: |
          set -euo pipefail
          railway run --project "${RAILWAY_PROJECT_ID}" --environment "${RAILWAY_ENVIRONMENT}" --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; exec python -u report_motor_guard05_forward_health_pg.py' \
            2>&1 | tee motor-guard05-forward-health-20260927.txt
          grep -q '^MOTOR_GUARD_FORWARD_HEALTH_RESULT=PASS_READ_ONLY$' motor-guard05-forward-health-20260927.txt
          grep -q '^MOTOR_GUARD_FORWARD_HEALTH_PROMOTION=BLOCK_MANUAL_REVIEW_ONLY$' motor-guard05-forward-health-20260927.txt
      - name: Upload
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: motor-guard05-forward-health-20260927-${{ github.run_id }}
          path: motor-guard05-forward-health-20260927.txt
          retention-days: 90
          if-no-files-found: error
