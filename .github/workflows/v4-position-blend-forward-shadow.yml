name: V4 position-blend prospective shadow contract

on:
  pull_request:
    paths:
      - 'research/v4_position_blend_forward_shadow.py'
      - 'tests/test_v4_position_blend_forward_shadow.py'
      - 'docs/V4_POSITION_BLEND_FORWARD_SHADOW_20260923.md'
      - '.github/workflows/v4-position-blend-forward-shadow.yml'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependency
        run: python -m pip install pytest
      - name: Validate pure prospective shadow contract
        env:
          PYTHONPATH: .
        run: |
          set -euo pipefail
          python -m py_compile research/v4_position_blend_forward_shadow.py tests/test_v4_position_blend_forward_shadow.py
          pytest -q tests/test_v4_position_blend_forward_shadow.py
          python - <<'PY'
          from pathlib import Path
          src=Path('research/v4_position_blend_forward_shadow.py').read_text(encoding='utf-8').lower()
          for forbidden in (
              'psycopg',
              'requests',
              'urllib',
              'railway ',
              'database_url',
              'insert into',
              'update v2_',
              'delete from',
              'vacuum ',
              'purchase_action=true',
          ):
              assert forbidden not in src, forbidden
          assert 'forward_start_date = date(2026, 9, 24)' in src
          assert 'alpha = 0.25' in src
          print('V4_POSBLEND_FORWARD_SHADOW_VALIDATE=PASS')
          PY
