name: Aug03 Exhibition Time plan-only

on:
  pull_request:
    paths:
      - ".github/workflows/aug03-exhibition-time-plan-only.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - run: |
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path(".github/workflows/aug03-exhibition-time-plan-only.yml")
          text=p.read_text(encoding="utf-8")
          assert isinstance(yaml.safe_load(text), dict)
          assert "--plan-only" in text
          assert "2026-08-03" in text
          assert "default_transaction_read_only=on" in text
          print("PASS Aug03 plan-only workflow")
          PY

  plan:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-plan-only-aug03'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli
      - name: Aug03 plan-only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; unset CONFIRM_HISTORICAL_BEFOREINFO_DB_WRITE; exec python -u research/historical_beforeinfo_backfill_pg.py --start-date 2026-08-03 --end-date 2026-08-03 --mode exhibition-time-only --plan-only --output aug03-plan.json' \
            | tee aug03-plan.txt
          grep -q '^HIST_BEFOREINFO_WRITE_ENABLED=0$' aug03-plan.txt
          grep -q '^HIST_BEFOREINFO_PLAN_ONLY=1$' aug03-plan.txt
          grep -q '^HIST_BEFOREINFO_RESULT=PASS$' aug03-plan.txt
          grep -q '^HIST_BEFOREINFO_RESULT_ODDS_PAYOUT_READ=0$' aug03-plan.txt
      - name: Post result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo "## Aug03 Exhibition Time plan-only"
            echo
            if [ -f aug03-plan.txt ]; then
              grep -E '^(HIST_BEFOREINFO_DAY=|HIST_BEFOREINFO_TOTALS=|HIST_BEFOREINFO_PARSE_QUALITY=|HIST_BEFOREINFO_RESULT=)' aug03-plan.txt || true
            fi
            echo
            echo "HTTP=0 / DB write=0 / result-odds-payout read=0."
          } > reply.txt
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file reply.txt
