name: Historical Exhibition Time minimal HTTP classification

on:
  pull_request:
    paths:
      - ".github/workflows/historical-exhibition-time-min-http-classify.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"
  RAILWAY_ENVIRONMENT: "production"
  TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install pyyaml
      - name: Validate read-only contract
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import yaml
          p=Path('.github/workflows/historical-exhibition-time-min-http-classify.yml')
          text=p.read_text(encoding='utf-8')
          parsed=yaml.safe_load(text)
          assert isinstance(parsed, dict) and 'jobs' in parsed
          assert 'postgres-hobby-fullhistory-candidate-v4' in text
          assert 'default_transaction_read_only' in text
          assert 'LIMIT 47' in text
          assert 'historical-exhibition-classify-remaining-july' in text
          assert 'historical-exhibition-verify-official-absent-3' in text
          assert 'historical-exhibition-verify-official-absent-11' in text
          assert 'railway ' + 'variable list' not in text
          assert 'list_' + 'variables' not in text
          assert 'CONFIRM_HISTORICAL_' + 'BEFOREINFO_DB_WRITE' not in text
          print('PASS minimal HTTP classification safety')
          PY

  classify:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-classify-remaining-july'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - run: npm install --global @railway/cli

      - name: Select remaining 47 July missing races read-only
        shell: bash
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          cat > samples.sql <<'SQL'
          \set ON_ERROR_STOP on
          SET default_transaction_read_only = on;
          SET statement_timeout = '30s';
          \pset tuples_only on
          \pset format unaligned
          WITH ex AS (
            SELECT race_id,
                   count(*) FILTER (
                     WHERE snapshot_label='historical'
                       AND exhibition_time IS NOT NULL
                   ) AS time_count
              FROM v2_realtime_exhibition_snapshots
             GROUP BY race_id
          ),
          candidates AS (
            SELECT r.race_id,
                   r.race_date,
                   lpad(coalesce(r.venue_id,r.venue_code)::text,2,'0') AS venue,
                   r.race_no
              FROM v2_races r
              LEFT JOIN ex USING(race_id)
             WHERE r.race_date >= DATE '2026-07-01'
               AND r.race_date <= DATE '2026-07-31'
               AND coalesce(ex.time_count,0) < 6
               AND r.race_id NOT IN (
                 '20260701_10_08',
                 '20260701_11_10',
                 '20260703_23_10',
                 '20260704_19_08',
                 '20260706_05_06',
                 '20260707_05_12'
               )
          )
          SELECT race_id || '|' || race_date::text || '|' || venue || '|' || race_no::text
            FROM candidates
           ORDER BY race_date, race_id
           LIMIT 47;
          SQL
          railway connect "$TARGET_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh < samples.sql > samples.out
          grep -E '^[^|]+\|2026-07-[0-9]{2}\|[0-9]{2}\|[0-9]+$' samples.out > samples.clean
          test "$(wc -l < samples.clean)" -eq 47

      - name: Classify remaining 47 official pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import requests
          import historical_beforeinfo_parser_v3 as hp
          import v21_realtime_collector_pg as rt

          samples=[]
          for line in Path('samples.clean').read_text(encoding='utf-8').splitlines():
              race_id, race_date, venue, race_no = line.split('|')
              samples.append((race_id, race_date, venue, int(race_no)))

          session=requests.Session()
          session.headers.update({
              'User-Agent':'Mozilla/5.0 (compatible; boat-ai-v2-july-remaining-classifier/1.0)'
          })
          counts=Counter()
          rows=[]
          for race_id, race_date, venue, race_no in samples:
              hd=race_date.replace('-','')
              url=(
                  'https://www.boatrace.jp/owpc/pc/race/beforeinfo'
                  f'?rno={race_no}&jcd={venue}&hd={hd}'
              )
              response=session.get(url,timeout=35)
              response.raise_for_status()
              response.encoding=response.apparent_encoding or 'utf-8'
              html=response.text
              if rt._looks_no_data(html):
                  status='official_no_data'
                  valid=0
              else:
                  inspection=hp.inspect_exhibition_time_page(html)
                  status=str(inspection.get('status') or 'parser_failure')
                  valid=int(inspection.get('valid_time_count') or 0)
              counts[status]+=1
              rows.append(
                  f'{race_id} {race_date} venue={venue} race={race_no}R '
                  f'status={status} valid_times={valid}'
              )

          lines=[
              '## Historical Exhibition Time remaining July classification',
              '',
              'Read-only classification: remaining 47 July missing races; six known samples excluded.',
              '',
              '```text',
              *rows,
              '```',
              '',
              'Summary:',
              f"- complete={counts['complete']}",
              f"- official_partial={counts['official_partial']}",
              f"- parser_failure={counts['parser_failure']}",
              f"- official_no_data={counts['official_no_data']}",
              '- http_requests=47',
              '- db_write=0',
              '',
              'No result/odds/payout read, Railway setting change, Production/LINE/purchase change, or Aug/Sep execution.',
          ]
          Path('summary.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          PY

      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Remaining July classification failed before summary generation. No DB write or Railway setting change was requested."
          fi


  verify-official-absent-3:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-verify-official-absent-3'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify three zero-value official pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import requests
          import historical_beforeinfo_parser_v3 as hp
          import v21_realtime_collector_pg as rt
          samples = [
              ("20260717_01_12", "2026-07-17", "01", 12),
              ("20260728_09_12", "2026-07-28", "09", 12),
              ("20260729_09_01", "2026-07-29", "09", 1),
          ]
          s = requests.Session()
          s.headers.update({"User-Agent":"Mozilla/5.0 (compatible; boat-ai-v2-official-absent-check/1.0)"})
          counts = Counter()
          rows = []
          for race_id, race_date, venue, race_no in samples:
              hd = race_date.replace("-", "")
              url = ("https://www.boatrace.jp/owpc/pc/race/beforeinfo"
                     f"?rno={race_no}&jcd={venue}&hd={hd}")
              r = s.get(url, timeout=35)
              r.raise_for_status()
              r.encoding = r.apparent_encoding or "utf-8"
              html = r.text
              if rt._looks_no_data(html):
                  status, valid = "official_no_data", 0
              else:
                  inspection = hp.inspect_exhibition_time_page(html)
                  status = str(inspection.get("status") or "parser_failure")
                  valid = int(inspection.get("valid_time_count") or 0)
              counts[status] += 1
              rows.append(f"{race_id} status={status} valid_times={valid}")
          lines = [
              "## Official-absent 3-sample verification","",
              "~~~text",*rows,"~~~","",
              "Summary:",
              f"- official_absent={counts['official_absent']}",
              f"- official_partial={counts['official_partial']}",
              f"- parser_failure={counts['parser_failure']}",
              f"- official_no_data={counts['official_no_data']}",
              "- http_requests=3","- db_write=0","",
              "No DB access/write, Railway setting change, result/odds/payout read, Production/LINE/purchase change, or Aug/Sep execution.",
          ]
          Path("summary.md").write_text("\n".join(lines) + "\n", encoding="utf-8")
          PY
      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Official-absent verification failed before summary generation. No DB write or Railway setting change was requested."
          fi


  verify-official-absent-11:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway historical-exhibition-verify-official-absent-11'
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Verify remaining eleven zero-value official pages
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import requests
          import historical_beforeinfo_parser_v3 as hp
          import v21_realtime_collector_pg as rt

          samples=[
              (f"20260729_09_{race_no:02d}", "2026-07-29", "09", race_no)
              for race_no in range(2, 13)
          ]
          s=requests.Session()
          s.headers.update({
              "User-Agent":"Mozilla/5.0 (compatible; boat-ai-v2-official-absent-remaining/1.0)"
          })
          counts=Counter()
          rows=[]
          for race_id,race_date,venue,race_no in samples:
              url=("https://www.boatrace.jp/owpc/pc/race/beforeinfo"
                   f"?rno={race_no}&jcd={venue}&hd=20260729")
              r=s.get(url,timeout=35)
              r.raise_for_status()
              r.encoding=r.apparent_encoding or "utf-8"
              html=r.text
              if rt._looks_no_data(html):
                  status,valid="official_no_data",0
              else:
                  inspection=hp.inspect_exhibition_time_page(html)
                  status=str(inspection.get("status") or "parser_failure")
                  valid=int(inspection.get("valid_time_count") or 0)
              counts[status]+=1
              rows.append(f"{race_id} status={status} valid_times={valid}")

          lines=[
              "## Official-absent remaining 11 verification","",
              "~~~text",*rows,"~~~","",
              "Summary:",
              f"- official_absent={counts['official_absent']}",
              f"- official_partial={counts['official_partial']}",
              f"- parser_failure={counts['parser_failure']}",
              f"- official_no_data={counts['official_no_data']}",
              "- http_requests=11",
              "- db_write=0","",
              "No DB access/write, Railway setting change, result/odds/payout read, Production/LINE/purchase change, or Aug/Sep execution.",
          ]
          Path("summary.md").write_text("\n".join(lines)+"\n",encoding="utf-8")
          PY
      - name: Post sanitized result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f summary.md ]; then
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
          else
            gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body "Remaining official-absent verification failed before summary generation. No DB write or Railway setting change was requested."
          fi
