name: Research S03 M2 Historical Robustness 20260927

on:
  pull_request:
    paths:
      - '.github/scripts/value_s03_m2_historical_robustness_pg.py'
      - '.github/workflows/research-s03-m2-historical-robustness-20260927.yml'
      - 'docs/S03_M2_HISTORICAL_ROBUSTNESS_20260927.md'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
      RAILWAY_PROJECT_ID: '268a5b17-0712-440a-884d-27f7fa887a2d'
      RAILWAY_ENVIRONMENT: 'production'
      RAILWAY_DB_SERVICE: 'postgres-recovery'
      VALUE_S03_M2_HIST_OUTPUT: 'value-s03-m2-historical-robustness.json'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Verify fixed read-only contract
        run: |
          set -euo pipefail
          grep -q 'CONTRACT = "S03_M2_POSITIVE_V1"' .github/scripts/value_s03_m2_historical_robustness_pg.py
          grep -q 'set transaction read only' .github/scripts/value_s03_m2_historical_robustness_pg.py
          grep -q 'ALL_AVAILABLE_PRE_FREEZE_S03_NO_RETUNE' .github/scripts/value_s03_m2_historical_robustness_pg.py
          python - <<'PY'
          from pathlib import Path
          w=Path('.github/workflows/research-s03-m2-historical-robustness-20260927.yml').read_text(encoding='utf-8').lower()
          forbidden=(
              ''.join(('railway',' variable',' list')),
              ''.join(('print','env')),
              ''.join(('env',' |')),
          )
          for x in forbidden:
              assert x not in w, x
          assert 'railway run' in w
          PY
      - name: Install Railway CLI
        run: npm install --global @railway/cli
      - name: Run frozen historical robustness audit
        run: |
          set -euo pipefail
          railway run \
            --project "${RAILWAY_PROJECT_ID}" \
            --environment "${RAILWAY_ENVIRONMENT}" \
            --service "${RAILWAY_DB_SERVICE}" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; exec python -u .github/scripts/value_s03_m2_historical_robustness_pg.py' \
            2>&1 | tee value-s03-m2-historical-robustness.txt
          grep -q '^S03_M2_HIST_DB_WRITE=0 LINE=0 BUY=0 PROD_CHANGE=0 PROMOTION=0$' value-s03-m2-historical-robustness.txt
          grep -q '^S03_M2_HIST_PROMOTION_ALLOWED=0$' value-s03-m2-historical-robustness.txt
          grep -q '^S03_M2_HIST_RESULT=PASS_READ_ONLY$' value-s03-m2-historical-robustness.txt
      - name: Upload immutable robustness evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s03-m2-historical-robustness-${{ github.run_id }}
          path: |
            value-s03-m2-historical-robustness.json
            value-s03-m2-historical-robustness.txt
          retention-days: 90
          if-no-files-found: error
