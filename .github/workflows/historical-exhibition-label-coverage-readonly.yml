name: Historical exhibition label coverage read-only

on:
  pull_request:
    paths:
      - ".github/workflows/historical-exhibition-label-coverage-readonly.yml"
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-hobby-fullhistory-candidate-v4"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Static safety
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          p=Path(".github/workflows/historical-exhibition-label-coverage-readonly.yml").read_text(encoding="utf-8").lower()
          assert "postgres-hobby-fullhistory-candidate-v4" in p
          assert "default_transaction_read_only=on" in p
          assert "set transaction read only" in p
          forbidden=(
              "insert"+" into",
              "up"+"date ",
              "delete"+" from",
              "requests"+".",
              "http"+"://",
              "https"+"://",
              "v2_"+"results",
              "v2_"+"odds",
          )
          for token in forbidden:
              assert token not in p, token
          print("LABEL_COVERAGE_STATIC_SAFETY=PASS")
          PY

  audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway historical-exhibition-label-coverage ')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install "psycopg[binary]>=3.2,<3.4"
      - run: npm install --global @railway/cli

      - name: Parse range
        id: range
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          python - <<'PY'
          import os,re
          from datetime import date
          body=os.environ["BODY"].strip()
          m=re.fullmatch(r"/railway historical-exhibition-label-coverage (\d{4}-\d{2}-\d{2}) (\d{4}-\d{2}-\d{2})",body)
          if not m: raise SystemExit("invalid command")
          a=date.fromisoformat(m.group(1)); b=date.fromisoformat(m.group(2))
          if b<a or (b-a).days>31: raise SystemExit("range must be 1..32 days")
          if a<date(2025,7,1): raise SystemExit("before formal backtest period")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as f:
              f.write(f"start={a.isoformat()}\n")
              f.write(f"end={b.isoformat()}\n")
          PY

      - name: Run candidate-v4 read-only label coverage
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          START_DATE: ${{ steps.range.outputs.start }}
          END_DATE: ${{ steps.range.outputs.end }}
        run: |
          set -euo pipefail
          cat > /tmp/label_coverage.py <<'PY'
          import json,os
          import psycopg
          from psycopg.rows import dict_row

          start=os.environ["START_DATE"]; end=os.environ["END_DATE"]
          sql=r"""
          with base as (
            select race_id,race_date
              from v2_races
             where race_date between %s and %s
          ),
          ex as (
            select e.race_id,
                   count(distinct e.lane) filter (
                     where e.snapshot_label='historical'
                       and e.exhibition_time is not null
                   ) as hist_lanes,
                   count(distinct e.lane) filter (
                     where e.snapshot_label='learning_all'
                       and e.exhibition_time is not null
                   ) as learning_lanes,
                   count(distinct e.lane) filter (
                     where e.snapshot_label='final_ab'
                       and e.exhibition_time is not null
                   ) as final_lanes,
                   count(distinct e.lane) filter (
                     where e.snapshot_label in ('learning_all','final_ab')
                       and e.exhibition_time is not null
                   ) as daily_lanes
              from v2_realtime_exhibition_snapshots e
              join base b on b.race_id=e.race_id
             group by e.race_id
          ),
          per_race as (
            select b.race_date,b.race_id,
                   coalesce(ex.hist_lanes,0) hist_lanes,
                   coalesce(ex.learning_lanes,0) learning_lanes,
                   coalesce(ex.final_lanes,0) final_lanes,
                   coalesce(ex.daily_lanes,0) daily_lanes
              from base b
              left join ex using(race_id)
          )
          select race_date,
                 count(*)::int races,
                 count(*) filter(where hist_lanes=6)::int historical_complete,
                 count(*) filter(where learning_lanes=6)::int learning_all_complete,
                 count(*) filter(where final_lanes=6)::int final_ab_complete,
                 count(*) filter(where daily_lanes=6)::int daily_union_complete,
                 count(*) filter(where daily_lanes between 1 and 5)::int daily_partial,
                 count(*) filter(where daily_lanes=0)::int daily_none
            from per_race
           group by race_date
           order by race_date
          """
          with psycopg.connect(os.environ["DATABASE_URL"],row_factory=dict_row) as conn:
              conn.execute("SET TRANSACTION READ ONLY")
              rows=[dict(r) for r in conn.execute(sql,(start,end)).fetchall()]
              conn.rollback()

          totals={k:0 for k in (
              "races","historical_complete","learning_all_complete","final_ab_complete",
              "daily_union_complete","daily_partial","daily_none"
          )}
          for r in rows:
              r["date"]=r.pop("race_date").isoformat()
              for k in totals: totals[k]+=int(r[k])
              print(
                "LABEL_COVERAGE_DAY="
                + " ".join([
                  f"date:{r['date']}",f"races:{r['races']}",
                  f"hist6:{r['historical_complete']}",
                  f"learn6:{r['learning_all_complete']}",
                  f"final6:{r['final_ab_complete']}",
                  f"daily6:{r['daily_union_complete']}",
                  f"partial:{r['daily_partial']}",
                  f"none:{r['daily_none']}"
                ])
              )
          print("LABEL_COVERAGE_TOTAL="+json.dumps(totals,separators=(",",":"),sort_keys=True))

          conflict_sql=r"""
          with base as (
            select race_id from v2_races where race_date between %s and %s
          ),
          paired as (
            select e.race_id,e.lane,
                   max(e.exhibition_time) filter(where e.snapshot_label='learning_all') as learning_time,
                   max(e.exhibition_time) filter(where e.snapshot_label='final_ab') as final_time
              from v2_realtime_exhibition_snapshots e
              join base b on b.race_id=e.race_id
             where e.snapshot_label in ('learning_all','final_ab')
               and e.exhibition_time is not null
             group by e.race_id,e.lane
          )
          select count(*)::int as conflicting_lanes,
                 count(distinct race_id)::int as conflicting_races
            from paired
           where learning_time is not null
             and final_time is not null
             and abs(learning_time-final_time) > 0.000001
          """
          with psycopg.connect(os.environ["DATABASE_URL"],row_factory=dict_row) as conn:
              conn.execute("SET TRANSACTION READ ONLY")
              conflict=dict(conn.execute(conflict_sql,(start,end)).fetchone())
              conn.rollback()
          print("LABEL_COVERAGE_CONFLICTS="+json.dumps(conflict,separators=(",",":"),sort_keys=True))
          print("LABEL_COVERAGE_RESULT=PASS_READ_ONLY")
          print("HTTP_REQUESTS=0 DB_WRITE=0 RESULT_ODDS_PAYOUT_READ=0")
          PY

          railway run \
            --project "$RAILWAY_PROJECT_ID" \
            --environment "$RAILWAY_ENVIRONMENT" \
            --service "$RAILWAY_DB_SERVICE" \
            bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export START_DATE="'"$START_DATE"'"; export END_DATE="'"$END_DATE"'"; exec python /tmp/label_coverage.py' \
            | tee label-coverage.txt

          grep -q '^LABEL_COVERAGE_RESULT=PASS_READ_ONLY$' label-coverage.txt

      - name: Post compact result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          START_DATE: ${{ steps.range.outputs.start }}
          END_DATE: ${{ steps.range.outputs.end }}
        run: |
          {
            echo "## Historical exhibition label coverage"
            echo
            echo "Range: ${START_DATE:-?} .. ${END_DATE:-?}"
            echo
            if [ -f label-coverage.txt ]; then
              grep -E '^(LABEL_COVERAGE_DAY=|LABEL_COVERAGE_TOTAL=|LABEL_COVERAGE_CONFLICTS=|LABEL_COVERAGE_RESULT=|HTTP_REQUESTS=)' label-coverage.txt || true
            fi
            echo
            echo "candidate-v4 read-only; labels historical/learning_all/final_ab; no HTTP; no DB writes."
          } > reply.txt
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file reply.txt

  production-candidate-v4-date-sync-plan:
    if: >-
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      startsWith(github.event.comment.body, '/railway production-candidate-v4-date-sync-plan ')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DATE_SYNC_SOURCE_SERVICE: "Postgres-EKp2"
      DATE_SYNC_TARGET_SERVICE: "postgres-hobby-fullhistory-candidate-v4"
      RAILWAY_ENVIRONMENT: "production"

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Parse target date
        id: target
        shell: bash
        env:
          BODY: ${{ github.event.comment.body }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os,re
          from datetime import date
          body=os.environ["BODY"].strip()
          m=re.fullmatch(r"/railway production-candidate-v4-date-sync-plan (\d{4}-\d{2}-\d{2})", body)
          if not m:
              raise SystemExit("invalid_command")
          d=date.fromisoformat(m.group(1))
          if d < date(2025,7,1):
              raise SystemExit("before_formal_backtest_period")
          with open(os.environ["GITHUB_OUTPUT"],"a",encoding="utf-8") as fh:
              fh.write("date="+d.isoformat()+"\n")
          PY

      - name: Install Railway CLI
        run: npm install --global @railway/cli

      - name: Build read-only probe
        shell: bash
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          from pathlib import Path
          d=os.environ["TARGET_DATE"]
          sql=f"""\\pset tuples_only on
\\pset format unaligned
SET default_transaction_read_only = on;
SET statement_timeout = '120s';
SELECT 'RACES|' || count(*)::text FROM public.v2_races WHERE race_date=DATE '{d}';
SELECT 'EX_ROWS|' || count(*)::text
FROM public.v2_realtime_exhibition_snapshots e
JOIN public.v2_races r USING(race_id)
WHERE r.race_date=DATE '{d}' AND e.snapshot_label IN ('learning_all','final_ab');
WITH base AS (
 SELECT race_id FROM public.v2_races WHERE race_date=DATE '{d}'
), per AS (
 SELECT e.race_id,e.snapshot_label,
        count(distinct e.lane) FILTER (
          WHERE e.exhibition_time IS NOT NULL
            AND e.exhibition_time_rank IS NOT NULL
            AND e.exhibition_time_diff IS NOT NULL
        ) complete_lanes
 FROM public.v2_realtime_exhibition_snapshots e
 JOIN base b USING(race_id)
 WHERE e.snapshot_label IN ('learning_all','final_ab')
 GROUP BY e.race_id,e.snapshot_label
), agg AS (
 SELECT b.race_id,
        max((p.snapshot_label='learning_all' AND p.complete_lanes=6)::int) learning6,
        max((p.snapshot_label='final_ab' AND p.complete_lanes=6)::int) final6
 FROM base b LEFT JOIN per p USING(race_id)
 GROUP BY b.race_id
)
SELECT 'EX_COMPLETE|learning_all|' || coalesce(sum(learning6),0)::text FROM agg;
WITH base AS (
 SELECT race_id FROM public.v2_races WHERE race_date=DATE '{d}'
), per AS (
 SELECT e.race_id,e.snapshot_label,
        count(distinct e.lane) FILTER (
          WHERE e.exhibition_time IS NOT NULL
            AND e.exhibition_time_rank IS NOT NULL
            AND e.exhibition_time_diff IS NOT NULL
        ) complete_lanes
 FROM public.v2_realtime_exhibition_snapshots e
 JOIN base b USING(race_id)
 WHERE e.snapshot_label IN ('learning_all','final_ab')
 GROUP BY e.race_id,e.snapshot_label
), agg AS (
 SELECT b.race_id,
        max((p.snapshot_label='learning_all' AND p.complete_lanes=6)::int) learning6,
        max((p.snapshot_label='final_ab' AND p.complete_lanes=6)::int) final6
 FROM base b LEFT JOIN per p USING(race_id)
 GROUP BY b.race_id
)
SELECT 'EX_COMPLETE|final_ab|' || coalesce(sum(final6),0)::text FROM agg;
WITH base AS (
 SELECT race_id FROM public.v2_races WHERE race_date=DATE '{d}'
), per AS (
 SELECT e.race_id,e.snapshot_label,
        count(distinct e.lane) FILTER (
          WHERE e.exhibition_time IS NOT NULL
            AND e.exhibition_time_rank IS NOT NULL
            AND e.exhibition_time_diff IS NOT NULL
        ) complete_lanes
 FROM public.v2_realtime_exhibition_snapshots e
 JOIN base b USING(race_id)
 WHERE e.snapshot_label IN ('learning_all','final_ab')
 GROUP BY e.race_id,e.snapshot_label
), agg AS (
 SELECT b.race_id,
        max((p.snapshot_label='learning_all' AND p.complete_lanes=6)::int) learning6,
        max((p.snapshot_label='final_ab' AND p.complete_lanes=6)::int) final6
 FROM base b LEFT JOIN per p USING(race_id)
 GROUP BY b.race_id
)
SELECT 'EX_COMPLETE|daily_union|' || count(*) FILTER (WHERE learning6=1 OR final6=1)::text FROM agg;
SELECT 'SCHEMA|v2_races|' ||
       md5(string_agg(column_name || ':' || udt_name || ':' || is_nullable, ',' ORDER BY ordinal_position))
FROM information_schema.columns
WHERE table_schema='public' AND table_name='v2_races';
SELECT 'SCHEMA|v2_realtime_exhibition_snapshots|' ||
       md5(string_agg(column_name || ':' || udt_name || ':' || is_nullable, ',' ORDER BY ordinal_position))
FROM information_schema.columns
WHERE table_schema='public' AND table_name='v2_realtime_exhibition_snapshots';
"""
          Path("date-sync-plan.sql").write_text(sql,encoding="utf-8")
          PY

      - name: Capture source read-only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          railway connect "$DATE_SYNC_SOURCE_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh < date-sync-plan.sql > source.raw
          grep -E '^(RACES|EX_ROWS|EX_COMPLETE|SCHEMA)\\|' source.raw > source.clean
          test "$(wc -l < source.clean)" -eq 7

      - name: Capture target read-only
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          railway connect "$DATE_SYNC_TARGET_SERVICE" --environment "$RAILWAY_ENVIRONMENT" --no-ssh < date-sync-plan.sql > target.raw
          grep -E '^(RACES|EX_ROWS|EX_COMPLETE|SCHEMA)\\|' target.raw > target.clean
          test "$(wc -l < target.clean)" -eq 7

      - name: Compare and post result
        env:
          TARGET_DATE: ${{ steps.target.outputs.date }}
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' > plan.sanitized
          import os
          from pathlib import Path
          def load(path):
              out={}
              for line in Path(path).read_text().splitlines():
                  p=line.split("|")
                  if p[0]=="RACES": out["races"]=int(p[1])
                  elif p[0]=="EX_ROWS": out["ex_rows"]=int(p[1])
                  elif p[0]=="EX_COMPLETE": out["complete_"+p[1]]=int(p[2])
                  elif p[0]=="SCHEMA": out["schema_"+p[1]]=p[2]
              return out
          s,t=load("source.clean"),load("target.clean")
          schema_ok=(
              s.get("schema_v2_races")==t.get("schema_v2_races")
              and s.get("schema_v2_realtime_exhibition_snapshots")==t.get("schema_v2_realtime_exhibition_snapshots")
          )
          ready=schema_ok and s.get("races",0)>0 and t.get("races",0)==0
          print("DATE_SYNC_PLAN_DATE="+os.environ["TARGET_DATE"])
          print("SOURCE_RACES="+str(s.get("races",0)))
          print("SOURCE_EX_ROWS="+str(s.get("ex_rows",0)))
          print("SOURCE_LEARNING_COMPLETE="+str(s.get("complete_learning_all",0)))
          print("SOURCE_FINAL_COMPLETE="+str(s.get("complete_final_ab",0)))
          print("SOURCE_DAILY_UNION_COMPLETE="+str(s.get("complete_daily_union",0)))
          print("TARGET_RACES="+str(t.get("races",0)))
          print("TARGET_EX_ROWS="+str(t.get("ex_rows",0)))
          print("SCHEMA_MATCH="+("true" if schema_ok else "false"))
          print("HTTP_REQUESTS=0 SOURCE_WRITE=0 CANDIDATE_WRITE=0 RESULT_ODDS_PAYOUT_READ=0")
          print("PROD_MODEL_CHANGE=0 LINE=0 BUY=0")
          print("DATE_SYNC_PLAN_RESULT="+("READY" if ready else "BLOCKED"))
          PY
          {
            echo '## Production → candidate-v4 date sync plan'
            echo
            echo '~~~text'
            cat plan.sanitized
            echo '~~~'
            echo
            echo 'Read-only only; no HTTP; no DB writes.'
          } > summary.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file summary.md
