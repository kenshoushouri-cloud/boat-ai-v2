name: Motor maturity shrinkage stability read-only

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - 'backtest_prob_motor_maturity_shrinkage_stability_pg.py'
      - '.github/workflows/motor-maturity-shrinkage-stability-readonly.yml'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    if: >-
      github.event_name == 'pull_request' ||
      (github.event_name == 'issue_comment' &&
       github.event.issue.number == 42 &&
       github.actor == github.repository_owner &&
       github.event.comment.body == '/railway motor-maturity-shrinkage-stability')
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'issue_comment' && 'main' || '' }}
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only shrinkage audit
        run: |
          set -euo pipefail
          python -m py_compile backtest_prob_motor_maturity_shrinkage_stability_pg.py
          python - <<'PY'
          from pathlib import Path
          low=Path('backtest_prob_motor_maturity_shrinkage_stability_pg.py').read_text(encoding='utf-8').lower()
          assert 'motor_shrink_mode=read_only' in low
          assert 'db_first_seen_forbidden' in low
          assert 'strict_prior_counts' in low
          assert 'k03' in low and 'k06' in low and 'k12' in low and 'k24' in low
          assert 'historical_stability_screen_only' in low
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line'):
              assert token not in low, token
          print('MOTOR_SHRINK_VALIDATE=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run shrinkage stability audit
        id: audit
        run: |
          set +e
          python -u backtest_prob_motor_maturity_shrinkage_stability_pg.py > motor-shrink-output.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized results
        if: always()
        run: grep '^MOTOR_SHRINK_' motor-shrink-output.txt 2>/dev/null || true
      - name: Reply to bridge command
        if: github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          {
            echo '## Motor maturity shrinkage stability read-only report'
            echo
            echo '```text'
            grep '^MOTOR_SHRINK_' motor-shrink-output.txt 2>/dev/null || echo 'MOTOR_SHRINK_DIAGNOSTIC=no_output'
            echo '```'
            echo
            echo 'Historical stability screen on previously verified official motor-generation starts. Predeclared K family only; no automatic selection, DB write, Production/LINE, Railway setting, coefficient/threshold, or promotion change.'
          } > motor-shrink-comment.md
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file motor-shrink-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json motor-shrink-output.txt motor-shrink-comment.md
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
