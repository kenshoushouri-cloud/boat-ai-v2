name: Racer course partial parser tests

on:
  pull_request:
    paths:
      - 'collect_racer_course_stats_pg.py'
      - 'tests/test_racer_course_partial_parser.py'
      - '.github/workflows/racer-course-partial-parser-tests.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Compile collector and regression test
        run: python -m py_compile collect_racer_course_stats_pg.py tests/test_racer_course_partial_parser.py
      - name: Run partial parser regressions
        env:
          DATABASE_URL: ''
        run: python -m unittest tests.test_racer_course_partial_parser -v
