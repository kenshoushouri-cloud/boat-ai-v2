name: Opponent pressure trifecta Forward over v24 read-only

on:
  pull_request:
    paths:
      - '.github/scripts/opponent_pressure_v24_trifecta_forward.py'
      - '.github/workflows/opponent-pressure-v24-trifecta-forward-readonly.yml'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only script
        run: |
          set -euo pipefail
          python -m py_compile .github/scripts/opponent_pressure_v24_trifecta_forward.py
          python - <<'PY'
          from pathlib import Path
          low=Path('.github/scripts/opponent_pressure_v24_trifecta_forward.py').read_text(encoding='utf-8').lower()
          assert 'opp_v24_tri_mode=read_only' in low
          assert 'unit_pressure_coef = 1.0' in low
          assert 'pl_trifecta' in low and '_lane_raw_strength' in low
          assert 'first_lane' in low and 'second_lane' in low and 'third_lane' in low
          assert 'v2_opponent_pressure_shadow_v2' in low and 'v2_results' in low
          for token in ('insert into','update v2_','delete from','create table','alter table','drop table','upsert_rows','send_line'):
              assert token not in low, token
          print('OPP_V24_TRI_VALIDATE=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Resolve JST end date
        run: |
          python - <<'PY'
          import os
          from datetime import datetime,timezone,timedelta
          target=datetime.now(timezone(timedelta(hours=9))).strftime('%Y-%m-%d')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'OPP_V24_TRI_END={target}\n')
          print(f'OPP_V24_TRI_TARGET={target}')
          PY
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run trifecta Forward audit
        id: audit
        run: |
          set +e
          python -u .github/scripts/opponent_pressure_v24_trifecta_forward.py > opp-v24-tri.txt 2>&1
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Print sanitized results
        if: always()
        run: grep '^OPP_V24_TRI_' opp-v24-tri.txt 2>/dev/null || true
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json opp-v24-tri.txt
      - name: Fail if audit failed
        if: steps.audit.outputs.exit_code != '0'
        run: exit 1
