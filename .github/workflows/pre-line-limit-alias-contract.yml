name: PRE LINE Limit Alias Contract

on:
  pull_request:
    paths:
      - 'research/pre_line_limit_alias_contract.py'
      - 'research/test_pre_line_limit_alias_contract.py'
      - 'docs/PRE_LINE_LIMIT_ALIAS_REVIEW_20260912.md'
      - '.github/workflows/pre-line-limit-alias-contract.yml'

permissions:
  contents: read

jobs:
  pure-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile research/pre_line_limit_alias_contract.py research/test_pre_line_limit_alias_contract.py
      - name: Synthetic contract tests
        run: python -m unittest research.test_pre_line_limit_alias_contract -v
      - name: Confirm research-only isolation
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path=Path('research/pre_line_limit_alias_contract.py')
          source=path.read_text(encoding='utf-8')
          tree=ast.parse(source)
          imports=set()
          for node in ast.walk(tree):
              if isinstance(node,ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node,ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
          forbidden={'psycopg','requests','urllib','sqlalchemy'}
          assert not (imports & forbidden), imports & forbidden
          lower=source.lower()
          for marker in ('database_url','line_channel_access_token','insert into','update ','delete from','create table'):
              assert marker not in lower, marker
          print('PRE_LINE_LIMIT_ALIAS_CONTRACT=PASS')
          PY
