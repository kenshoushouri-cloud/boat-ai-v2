name: Outage residual audit 2026-08-30

on:
  pull_request:
    paths:
      - '.github/workflows/outage-residual-audit-20260830.yml'
      - 'audit_outage_residual_20260830_pg.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed read-only residual audit
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/outage-residual-audit-20260830.yml').read_text(encoding='utf-8')
          py = Path('audit_outage_residual_20260830_pg.py').read_text(encoding='utf-8')
          assert "/railway outage-residual-audit" in wf
          assert "github.actor == github.repository_owner" in wf
          assert "github.event.issue.number == 42" in wf
          assert "github.event.pull_request.head.repo.full_name == github.repository" in wf
          trigger = wf.split('permissions:', 1)[0]
          assert 'schedule:' not in trigger
          assert 'workflow_dispatch:' not in trigger
          assert 'TARGET_DATE = "2026-08-30"' in py
          low = py.lower()
          for forbidden in (
              'upsert_rows',
              'insert into ',
              'update v2_',
              'delete from ',
              'line_notifier',
              'run_final_pg',
              'run_pre_window',
          ):
              assert forbidden not in low, forbidden
          print('OUTAGE_RESIDUAL_VALIDATE=PASS')
          PY
      - name: Python syntax
        run: python -m py_compile audit_outage_residual_20260830_pg.py

  pr_audit:
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load DB URL
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = data.get('DATABASE_PUBLIC_URL') if isinstance(data, dict) else None
          if isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run fixed read-only residual audit on PR
        shell: bash
        run: |
          set -euo pipefail
          python -u audit_outage_residual_20260830_pg.py | tee output.txt
      - name: Show compact residual result
        shell: bash
        run: grep '^OUTAGE_RESIDUAL_' output.txt | tail -200 || true
      - name: Cleanup
        if: always()
        run: rm -f railway-vars.json output.txt

  audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway outage-residual-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load DB URL
        shell: bash
        run: |
          set -euo pipefail
          railway variable list --service postgres-recovery --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data = json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value = data.get('DATABASE_PUBLIC_URL') if isinstance(data, dict) else None
          if isinstance(data, list):
              for item in data:
                  if isinstance(item, dict) and (item.get('name') == 'DATABASE_PUBLIC_URL' or item.get('key') == 'DATABASE_PUBLIC_URL'):
                      value = item.get('value')
                      break
          if not value:
              raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run fixed read-only residual audit
        id: run
        shell: bash
        run: |
          set +e
          python -u audit_outage_residual_20260830_pg.py > output.txt 2>&1
          rc=$?
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## Outage residual audit 2026-08-30"
            echo
            echo "Read-only DB inspection plus official beforeinfo HTTP GET. No DB writes, LINE, model, Shadow or Forward execution."
            echo
            echo '~~~text'
            grep '^OUTAGE_RESIDUAL_' output.txt | tail -200 || true
            echo '~~~'
          } > summary.md
      - name: Cleanup
        if: always()
        run: rm -f railway-vars.json output.txt
      - name: Post
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Fail if audit failed
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
