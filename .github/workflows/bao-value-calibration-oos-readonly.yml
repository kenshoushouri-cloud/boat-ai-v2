name: Bao value calibration OOS policy validation

on:
  pull_request:
    paths:
      - '.github/workflows/bao-value-calibration-oos-readonly.yml'
      - 'backtest_prob_calibration_pg.py'
      - 'v24_pre_candidate_notifier_pg.py'
      - 'collect_candidate_filter_shadow_pg.py'
      - 'research_prob_calibration_archive_consumer.py'
      - 'research_archive_readthrough.py'

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bao calibration research policy
        run: |
          set -euo pipefail
          python -m py_compile backtest_prob_calibration_pg.py research_prob_calibration_archive_consumer.py research_archive_readthrough.py
          python - <<'PY'
          from pathlib import Path
          p=Path('backtest_prob_calibration_pg.py').read_text(encoding='utf-8')
          w=Path('.github/workflows/bao-value-calibration-oos-readonly.yml').read_text(encoding='utf-8')
          assert 'from db_pg import fetch_all' in p
          assert '=== VALUE RATIO: model_prob * odds ===' in p
          assert '=== MODEL - NORMALIZED MARKET PROB EDGE ===' in p
          assert '=== N02 CALIBRATION ===' in p
          assert 'execute(' not in p
          assert 'upsert' not in p.lower()
          assert 'send_line' not in p.lower()
          forbidden = [
              'workflow_' + 'dispatch:',
              'issue_' + 'comment:',
              'RAILWAY' + '_TOKEN',
              'DATABASE_' + 'PUBLIC_URL',
              'railway variable ' + 'list',
          ]
          for token in forbidden:
              assert token not in w, token
          print('BAO_VALUE_CALIBRATION_OOS_VALIDATE=PASS')
          print('BAO_ONLINE_HISTORY_MANUAL_WORKFLOW_RETIRED=PASS')
          PY
      - name: Record archive migration boundary
        run: |
          cat <<'EOF'
          The historical Bao calibration analysis source remains retained for reproducibility.
          The former manual workflow dispatch / owner issue-comment path that queried Production
          historical odds online is intentionally retired in this Draft migration state.
          Future historical reruns must use the verified archive/read-through path or a restored
          research database after a permanent archive source is approved.
          No Production DB, Railway, LINE, model, threshold, or purchase behavior is changed here.
          EOF
