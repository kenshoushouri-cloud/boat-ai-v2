name: Bao value calibration OOS read-only report

on:
  pull_request:
    paths:
      - '.github/workflows/bao-value-calibration-oos-readonly.yml'
      - 'backtest_prob_calibration_pg.py'
      - 'v24_pre_candidate_notifier_pg.py'
      - 'collect_candidate_filter_shadow_pg.py'
  workflow_dispatch:
  issue_comment:
    types:
      - created

permissions:
  contents: read
  issues: write

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Bao value calibration read-only policy
        run: |
          set -euo pipefail
          python -m py_compile backtest_prob_calibration_pg.py
          python - <<'PY'
          from pathlib import Path
          p=Path('backtest_prob_calibration_pg.py').read_text(encoding='utf-8')
          assert 'from db_pg import fetch_all' in p
          assert '=== VALUE RATIO: model_prob * odds ===' in p
          assert '=== MODEL - NORMALIZED MARKET PROB EDGE ===' in p
          assert '=== N02 CALIBRATION ===' in p
          assert 'execute(' not in p
          assert 'upsert' not in p.lower()
          assert 'send_line' not in p.lower()
          print('BAO_VALUE_CALIBRATION_OOS_VALIDATE=PASS')
          PY

  report:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'issue_comment' &&
        github.event.issue.number == 42 &&
        github.actor == github.repository_owner &&
        github.event.comment.body == '/railway bao-value-calibration-oos'
      )
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run fixed OOS probability/value calibration
        env:
          PYTHONPATH: ${{ github.workspace }}
          BACKTEST_START_DATE: '2026-07-01'
          BACKTEST_END_DATE: '2026-08-15'
          BACKTEST_UNIT_YEN: '100'
          BACKTEST_PROGRESS_EVERY_DAYS: '46'
        run: |
          set -euo pipefail
          python -u backtest_prob_calibration_pg.py 2>&1 | tee bao-value-calibration-output.txt
      - name: Reply with sanitized OOS report
        if: always() && github.event_name == 'issue_comment'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          src=Path('bao-value-calibration-output.txt')
          lines=src.read_text(encoding='utf-8', errors='replace').splitlines() if src.exists() else []
          keep=[]
          active=False
          wanted={
              '=== AUDIT SUMMARY ===',
              '=== MODEL QUALITY ===',
              '=== VALUE RATIO: model_prob * odds ===',
              '=== MODEL - NORMALIZED MARKET PROB EDGE ===',
              '=== N02 CALIBRATION ===',
              '=== N02 x MONTH ===',
              '=== N02 x MODEL PROB BUCKET ===',
              '=== N02 x VALUE RATIO ===',
          }
          for line in lines:
              if line.startswith('✅ backtest_prob_calibration_pg.py') or line.startswith('PERIOD='):
                  keep.append(line); continue
              if line.startswith('=== '):
                  active=line in wanted
                  if active: keep.append(line)
                  continue
              if active and line and not line.startswith('各ticketを'):
                  keep.append(line)
          if not keep:
              keep=['BAO_VALUE_CALIBRATION_OOS_DIAGNOSTIC=no_report_output']
          body='## Bao value calibration OOS read-only report\n\n```text\n'+'\n'.join(keep)+'\n```\n\n'
          body += ('Historical base-odds reference only: v2_odds_trifecta is not guaranteed to be frozen exact PRE-time odds. '
                   'This is calibration/value research evidence, not a purchase strategy or activation decision. '
                   'No DB update, LINE, Production decision, Railway setting, N01/N02 activation, threshold, model coefficient, Bao promotion, or PR #169 state was changed.\n')
          Path('bao-value-calibration-comment.md').write_text(body, encoding='utf-8')
          PY
          gh issue comment 42 --repo "$GITHUB_REPOSITORY" --body-file bao-value-calibration-comment.md
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json bao-value-calibration-output.txt bao-value-calibration-comment.md
