name: Outage official-source audit 2026-08-28 to 2026-08-30

on:
  pull_request:
    paths:
      - '.github/workflows/outage-source-audit-20260828-30.yml'
      - 'audit_k_day_all_pg.py'
  issue_comment:
    types: [created]

permissions:
  contents: read
  issues: write

env:
  RAILWAY_BRIDGE_ISSUE: "42"

jobs:
  validate:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate fixed read-only gate
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/outage-source-audit-20260828-30.yml').read_text(encoding='utf-8')
          for date in ('2026-08-28', '2026-08-29', '2026-08-30'):
              assert date in wf
          assert "/railway outage-source-audit" in wf
          assert "github.actor == github.repository_owner" in wf
          assert "github.event.issue.number == 42" in wf
          trigger = wf.split('permissions:', 1)[0]
          assert 'schedule:' not in trigger
          assert 'workflow_dispatch:' not in trigger
          assert 'DATABASE_URL' not in wf
          print('OUTAGE_SOURCE_VALIDATE=PASS')
          PY
      - name: Python syntax
        run: python -m py_compile audit_k_day_all_pg.py

  audit:
    if: >-
      github.event_name == 'issue_comment' &&
      github.event.issue.number == 42 &&
      github.actor == github.repository_owner &&
      github.event.comment.body == '/railway outage-source-audit'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Audit official K source for fixed outage dates
        id: run
        shell: bash
        run: |
          set +e
          rc=0
          : > output.txt
          for d in 2026-08-28 2026-08-29 2026-08-30; do
            echo "OUTAGE_SOURCE_DATE_START=$d" >> output.txt
            TARGET_DATE="$d" python -u audit_k_day_all_pg.py >> output.txt 2>&1
            one_rc=$?
            echo "OUTAGE_SOURCE_DATE_END=$d returncode=$one_rc" >> output.txt
            if [ "$one_rc" -ne 0 ]; then rc="$one_rc"; fi
          done
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Summarize
        if: always()
        shell: bash
        run: |
          {
            echo "## Outage official-source audit 2026-08-28..2026-08-30"
            echo
            echo "Read-only official BOAT RACE K-source validation. No DB writes, Railway changes, LINE, model, Shadow or Forward execution."
            echo
            echo '~~~text'
            grep -E '^(OUTAGE_SOURCE_|TARGET_DATE=|venue_sections=|[0-9]{2}:|races=|entry_rows=|entries_complete6=|trifecta_complete=|weather_complete=|exhibition_rows=|accident_rows=|parser_failed_candidate_lines=|duplicate_race_ids=|RESULT=)' output.txt | tail -240 || true
            echo '~~~'
          } > summary.md
      - name: Cleanup
        if: always()
        run: rm -f output.txt
      - name: Post
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue comment "$RAILWAY_BRIDGE_ISSUE" --repo "$GITHUB_REPOSITORY" --body-file summary.md
      - name: Fail if source audit failed
        if: steps.run.outputs.exit_code != '0'
        run: exit 1
