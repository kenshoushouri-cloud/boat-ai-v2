name: Temporary project handoff updater 20260824

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - '.github/scripts/_temporary_append_handoff_20260824.py'
      - '.github/workflows/_temporary-docs-handoff-update-20260824.yml'

permissions:
  contents: write

jobs:
  update-docs:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Append permanent handoff milestone
        run: python -u .github/scripts/_temporary_append_handoff_20260824.py
      - name: Commit updated permanent docs
        run: |
          set -euo pipefail
          if git diff --quiet -- docs/PROJECT_HANDOFF.md docs/PROJECT_HISTORY.md; then
            echo 'HANDOFF_DOCS_CHANGE=none'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add docs/PROJECT_HANDOFF.md docs/PROJECT_HISTORY.md
          git commit -m 'docs: record opponent pressure and motor maturity milestone'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
          echo 'HANDOFF_DOCS_CHANGE=committed'
