name: Official raw B-file parser parity

on:
  pull_request:
    paths:
      - "research/official_bfile_raw_parser.py"
      - "research/official_bfile_raw_parity_pg.py"
      - "tests/test_official_bfile_raw_parser.py"
      - ".github/workflows/official-bfile-raw-parser-parity.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
  RAILWAY_PROJECT_ID: "268a5b17-0712-440a-884d-27f7fa887a2d"
  RAILWAY_ENVIRONMENT: "production"
  RAILWAY_DB_SERVICE: "postgres-recovery"

jobs:
  parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full
      - run: npm install --global @railway/cli

      - name: Pure parser tests
        run: pytest -q tests/test_official_bfile_raw_parser.py

      - name: Static safety
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/official_bfile_raw_parity_pg.py").read_text(encoding="utf-8").lower()
          assert "set transaction read only" in p
          assert "from v2_race_entries" in p
          assert "v2_results" not in p
          assert "v2_odds" not in p
          assert "insert into" not in p
          assert "update v2_" not in p
          assert "delete from" not in p
          print("PASS raw B parity safety")
          PY

      - name: Compare 2025-07-01 B file with existing official-racelist rows
        run: |
          set -euo pipefail
          railway run             --project "${RAILWAY_PROJECT_ID}"             --environment "${RAILWAY_ENVIRONMENT}"             --service "${RAILWAY_DB_SERVICE}"             bash -lc 'test -n "${DATABASE_PUBLIC_URL:-}"; export DATABASE_URL="$DATABASE_PUBLIC_URL"; export PGOPTIONS="-c default_transaction_read_only=on"; export PYTHONPATH=.; exec python -u research/official_bfile_raw_parity_pg.py --date 2025-07-01'             | tee official-bfile-raw-parity.txt
          grep -q '^OFFICIAL_BFILE_RAW_PARITY_RESULT=PASS_DIAGNOSTIC_ONLY$' official-bfile-raw-parity.txt

      - uses: actions/upload-artifact@v4
        with:
          name: official-bfile-raw-parity-${{ github.run_id }}
          path: |
            official-bfile-raw-layout-parity.json
            official-bfile-raw-parity.txt
          retention-days: 30
          if-no-files-found: error
