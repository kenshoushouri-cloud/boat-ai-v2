name: Official raw B-file parser parity

on:
  pull_request:
    paths:
      - "research/official_bfile_raw_parser.py"
      - "research/official_bfile_raw_parity_pg.py"
      - "tests/test_official_bfile_raw_parser.py"
      - "research/historical_entry_bfile_backfill_pg.py"
      - "tests/test_historical_entry_bfile_backfill_pg.py"
      - ".github/workflows/official-bfile-raw-parser-parity.yml"

permissions:
  contents: read

env:
  PYTHONPATH: .

jobs:
  parity:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt pytest
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq p7zip-full

      - name: Pure parser/backfill policy tests
        run: |
          pytest -q \
            tests/test_official_bfile_raw_parser.py \
            tests/test_historical_entry_bfile_backfill_pg.py

      - name: Static safety
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path("research/official_bfile_raw_parity_pg.py").read_text(encoding="utf-8").lower()
          importer=Path("research/historical_entry_bfile_backfill_pg.py").read_text(encoding="utf-8").lower()
          assert '"db_read": false' in p
          assert '"db_write": false' in p
          assert "repair_month_all_pg" in p
          assert "v2_results" not in p
          assert "v2_odds" not in p
          assert "insert into" not in p
          assert "update v2_" not in p
          assert "delete from" not in p
          assert "confirm_historical_bfile_db_write" in importer
          assert "fill_missing_only" in importer
          assert "result_odds_payout_read" in importer
          assert "insert into" not in importer
          assert "v2_results" not in importer
          assert "v2_odds" not in importer
          print("PASS raw B parity/backfill safety")
          PY

      - name: Compare 2025-07-01 B file with official archived racelists
        run: |
          set -euo pipefail
          python -u research/official_bfile_raw_parity_pg.py --date 2025-07-01 \
            | tee official-bfile-raw-parity.txt
          grep -q '^OFFICIAL_BFILE_RAW_PARITY_RESULT=PASS_EXACT_OFFICIAL_TO_OFFICIAL$' official-bfile-raw-parity.txt

      - uses: actions/upload-artifact@v4
        with:
          name: official-bfile-raw-parity-${{ github.run_id }}
          path: |
            official-bfile-raw-layout-parity.json
            official-bfile-raw-parity.txt
          retention-days: 30
          if-no-files-found: error
