name: Forward health bundle read-only

on:
  pull_request:
    paths:
      - '.github/workflows/forward-health-bundle-readonly.yml'
      - 'research_racer_course_top3_venue_health_pg.py'
      - 'research_racer_course_top3_bootstrap_pg.py'
      - 'research_racer_course_top3_production_readiness_pg.py'
      - 'research_racer_course_partial_coverage_pg.py'

permissions:
  contents: read

env:
  RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}

jobs:
  audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate read-only health scripts
        run: |
          set -euo pipefail
          python -m py_compile \
            report_racer_course_top3_forward_health_pg.py \
            report_exhibition_st_forward_health_pg.py \
            report_motor_guard05_forward_health_pg.py \
            research_racer_course_top3_venue_health_pg.py \
            research_racer_course_top3_bootstrap_pg.py \
            research_racer_course_top3_production_readiness_pg.py \
            research_racer_course_partial_coverage_pg.py
          python - <<'PY'
          from pathlib import Path
          paths = [
              'report_racer_course_top3_forward_health_pg.py',
              'report_exhibition_st_forward_health_pg.py',
              'report_motor_guard05_forward_health_pg.py',
              'research_racer_course_top3_venue_health_pg.py',
              'research_racer_course_top3_bootstrap_pg.py',
              'research_racer_course_top3_production_readiness_pg.py',
              'research_racer_course_partial_coverage_pg.py',
          ]
          forbidden = ('insert into','update v2_','delete from','create table','alter table','drop table','send_line','upsert_rows')
          for path in paths:
              low = Path(path).read_text(encoding='utf-8').lower()
              for token in forbidden:
                  assert token not in low, f'{path}:{token}'
          readiness = Path('research_racer_course_top3_production_readiness_pg.py').read_text(encoding='utf-8').lower()
          partial = Path('research_racer_course_partial_coverage_pg.py').read_text(encoding='utf-8').lower()
          assert 'v2_results' not in readiness and 'v2_odds' not in readiness
          assert 'v2_results' not in partial and 'v2_odds' not in partial
          assert 'not_frozen_source' in partial
          print('FORWARD_HEALTH_BUNDLE_VALIDATE=PASS')
          PY
      - name: Install dependencies
        run: |
          set -euo pipefail
          pip install -r requirements.txt
          npm install --global @railway/cli
      - name: Load public database URL without publishing it
        run: |
          set -euo pipefail
          railway variable list --service postgres --environment production --json > railway-vars.json 2>/dev/null
          python - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('railway-vars.json').read_text(encoding='utf-8'))
          value=data.get('DATABASE_PUBLIC_URL') if isinstance(data,dict) else None
          if isinstance(data,list):
              for item in data:
                  if isinstance(item,dict) and (item.get('name')=='DATABASE_PUBLIC_URL' or item.get('key')=='DATABASE_PUBLIC_URL'):
                      value=item.get('value'); break
          if not value: raise SystemExit('DATABASE_PUBLIC_URL not found')
          print(f'::add-mask::{value}')
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as fh:
              fh.write(f'DATABASE_URL={value}\n')
          PY
      - name: Run current read-only health reports
        run: |
          set -euo pipefail
          python -u report_racer_course_top3_forward_health_pg.py > racer.txt 2>&1
          python -u research_racer_course_top3_venue_health_pg.py > racer-venue.txt 2>&1
          python -u research_racer_course_top3_bootstrap_pg.py > racer-bootstrap.txt 2>&1
          python -u research_racer_course_top3_production_readiness_pg.py > racer-prod-ready.txt 2>&1
          python -u research_racer_course_partial_coverage_pg.py > racer-partial.txt 2>&1
          python -u report_exhibition_st_forward_health_pg.py > exhibition.txt 2>&1
          python -u report_motor_guard05_forward_health_pg.py > guard.txt 2>&1
      - name: Print sanitized results
        if: always()
        run: |
          grep '^RACER_COURSE_FORWARD_HEALTH_' racer.txt 2>/dev/null || true
          grep '^RACER_COURSE_VENUE_HEALTH_' racer-venue.txt 2>/dev/null || true
          grep '^RACER_COURSE_BOOTSTRAP_' racer-bootstrap.txt 2>/dev/null || true
          grep '^RACER_COURSE_PROD_READY_' racer-prod-ready.txt 2>/dev/null || true
          grep '^RACER_COURSE_PARTIAL_' racer-partial.txt 2>/dev/null || true
          grep '^EXH_ST_FORWARD_HEALTH_' exhibition.txt 2>/dev/null || true
          grep '^MOTOR_GUARD_FORWARD_HEALTH_' guard.txt 2>/dev/null || true
      - name: Clean temporary files
        if: always()
        run: rm -f railway-vars.json racer.txt racer-venue.txt racer-bootstrap.txt racer-prod-ready.txt racer-partial.txt exhibition.txt guard.txt
