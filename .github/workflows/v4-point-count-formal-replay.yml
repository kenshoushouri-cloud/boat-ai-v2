name: V4 top-five formal replay

on:
  pull_request:
    paths:
      - 'research/v4_point_count_formal_replay.py'
      - 'research/v4_point_count_marginal_revenue.py'
      - 'tests/test_v4_point_count_formal_replay.py'
      - 'docs/V4_POINT_COUNT_FORMAL_REPLAY_20260923.md'
      - '.github/workflows/v4-point-count-formal-replay.yml'

permissions:
  contents: read

jobs:
  formal-replay:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest only
        run: python -m pip install pytest
      - name: Compile and test immutable top-five replay
        env:
          PYTHONPATH: .
        run: |
          python -m py_compile \
            research/v4_point_count_formal_replay.py \
            research/v4_point_count_marginal_revenue.py \
            tests/test_v4_point_count_formal_replay.py
          pytest -q tests/test_v4_point_count_formal_replay.py
          python - <<'PY'
          from pathlib import Path

          source = Path('research/v4_point_count_formal_replay.py').read_text(encoding='utf-8')
          assert 'research_ranked_tickets' in source
          assert 'research top two do not match formal core tickets' in source
          assert 'outcomes must equal the exact six formal core race IDs' in source
          assert 'purchase_action=true' not in source.lower()
          PY
